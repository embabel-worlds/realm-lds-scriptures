    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Revelation 22:13
    kjvAllusionOsis:
    - Rev.22.13
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.19
- type: DcVerse
