    scripture: doctrine-and-covenants
    name: D&C 18:37
    chapter: 18
    verse: 37
    ordinal: 354
    text: And now, behold, I give unto you, Oliver Cowdery, and also unto David Whitmer, that you shall search out the Twelve, who shall have the desires of which I have spoken;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.18
- type: DcVerse
  data:
    ref: dc.18.38
    scripture: doctrine-and-covenants
    name: D&C 18:38
    chapter: 18
    verse: 38
    ordinal: 355
    text: And by their desires and their works you shall know them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.18
- type: DcVerse
  data:
    ref: dc.18.39
    scripture: doctrine-and-covenants
    name: D&C 18:39
    chapter: 18
    verse: 39
    ordinal: 356
    text: And when you have found them you shall show these things unto them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.18
- type: DcVerse
  data:
    ref: dc.18.40
    scripture: doctrine-and-covenants
    name: D&C 18:40
    chapter: 18
    verse: 40
    ordinal: 357
