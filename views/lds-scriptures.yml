# The realm's answer surface.
#
# References are as a reader writes them — `D&C 76:22`, `Moses 1:39` — matched against `name`. A
# reader who writes `Doctrine and Covenants 76:22`, or `Joseph Smith-Matthew` with a hyphen where the
# printed text has an em dash, is met halfway: each read view normalises the one spelling it expects.
# Views that cross scriptures are not here: they read only the vocabulary's parent labels, so they live
# in realm-scripture-vocabulary and answer from whatever is installed. The ones that read the King
# James beside these scriptures are here, because only this realm knows which verse draws on which.

- name: ReadDcVerse
  description: >-
    One Doctrine and Covenants verse by reference, with the King James it draws on. Only the one
    verse, matched exactly by its reference; the King James verses are named, not quoted — use
    LdsBesideKingJames for their text.
  params:
    ref:
      type: string
      default: "D&C 76:22"
      description: "The verse, e.g. `D&C 76:22`, `D&C 121:7`; `Doctrine and Covenants 76:22` is read the same."
  cypher: |
    MATCH (v:DcVerse)
    WHERE v.name = replace($ref, 'Doctrine and Covenants ', 'D&C ')
    RETURN v.name AS reference, v.text AS text, v.kjvRefs AS quotes, v.kjvAllusions AS echoes

- name: ReadDcSection
  description: >-
    A whole Doctrine and Covenants section, verse by verse, with what each draws on. One section
    only, by number; the King James verses are named, not quoted. No section headings, which are
    not part of the public-domain text.
  params:
    section:
      type: int
      default: 76
      description: "The section number, 1 to 138, e.g. `76` (the vision of the degrees of glory), `89` (the Word of Wisdom), `138` (the redemption of the dead)."
  cypher: |
    MATCH (s:DcSection {chapter: $section})<-[:IN]-(v:DcVerse)
    RETURN s.name AS section, v.verse AS verse, v.text AS text, v.kjvRefs AS quotes, v.kjvAllusions AS echoes
    ORDER BY verse

- name: DcSections
  description: >-
    Every Doctrine and Covenants section, with its length and King James sources. One row
    per section, 1 to 138, in order; the Official Declarations are not included.
  params:
    drawingOnly:
      type: boolean
      default: false
      description: "true: only the sections whose verses quote or echo the King James; false: all 138."
  cypher: |
    MATCH (s:DcSection)
    WHERE NOT $drawingOnly OR s.drawsOn IS NOT NULL
    RETURN s.chapter AS section, s.verseCount AS verses, s.drawsOn AS drawsOn
    ORDER BY section

- name: SearchDoctrineAndCovenants
  description: >-
    Doctrine and Covenants verses containing a word or phrase, in reading order. Partial and
    case-insensitive: it matches inside words, so `priest` also finds `priesthood`. At most `limit`
    verses; the Pearl of Great Price is searched by SearchPearlOfGreatPrice, every scripture at once
    by SearchScriptures.
  params:
    term:
      type: string
      default: "priesthood"
      description: "The word or phrase to find. A partial match, ignoring case: any verse whose text contains it."
    limit:
      type: int
      default: 100
      description: "At most this many verses, in reading order."
  cypher: |
    MATCH (v:DcVerse)
    WHERE toLower(v.text) CONTAINS toLower($term)
    RETURN v.name AS reference, v.text AS text
    ORDER BY v.ordinal
    LIMIT $limit

- name: ReadPgpVerse
  description: >-
    One Pearl of Great Price verse by reference, with the King James it draws on. Only the one
    verse, matched exactly by its reference; the King James verses are named, not quoted — use
    LdsBesideKingJames for their text.
  params:
    ref:
      type: string
      default: "Moses 1:39"
      description: "The verse, e.g. `Moses 1:39`, `Abraham 3:22`, `Joseph Smith—History 1:17`; a hyphen in place of the em dash is read the same."
  cypher: |
    MATCH (v:PgpVerse)
    WHERE v.name = replace(replace($ref, ' - ', '—'), '-', '—')
    RETURN v.name AS reference, v.text AS text, v.kjvRefs AS quotes, v.kjvAllusions AS echoes

- name: ReadPgpChapter
  description: >-
    A whole Pearl of Great Price chapter, verse by verse, with what each draws on. One chapter
    only, named exactly; gives the King James chapters it parallels and names the verse each of its
    verses quotes or echoes, without quoting them.
  params:
    chapter:
      type: string
      default: "Moses 1"
      description: "The chapter, e.g. `Moses 7`, `Abraham 3`, `Joseph Smith—Matthew 1`, `Articles of Faith 1`; a hyphen in place of the em dash is read the same."
  cypher: |
    MATCH (c:PgpChapter)<-[:IN]-(v:PgpVerse)
    WHERE c.name = replace(replace($chapter, ' - ', '—'), '-', '—')
    RETURN c.parallelsChapters AS retells, v.verse AS verse, v.text AS text, v.kjvRefs AS quotes, v.kjvAllusions AS echoes
    ORDER BY verse

- name: PgpBooks
  description: >-
    The Pearl of Great Price's five books: titles, sizes and King James parallels. One row
    per book, in printed order; no introductions or chapter headings, which are not part of the
    public-domain text.
  cypher: |
    MATCH (b:PgpBook)<-[:IN]-(c:PgpChapter)
    WITH b, collect(c.parallelsChapters) AS retold
    RETURN b.bookOrder AS order, b.name AS book, b.fullTitle AS fullTitle, b.subtitle AS subtitle,
           b.chapterCount AS chapters, b.verseCount AS verses,
           reduce(acc = [], cs IN retold | acc + [c IN cs WHERE NOT c IN acc]) AS retells
    ORDER BY order

- name: SearchPearlOfGreatPrice
  description: >-
    Pearl of Great Price verses containing a word or phrase, in reading order. Partial and
    case-insensitive: it matches inside words, so `create` also finds `created`. At most `limit`
    verses; the Doctrine and Covenants is searched by SearchDoctrineAndCovenants.
  params:
    term:
      type: string
      default: "Enoch"
      description: "The word or phrase to find. A partial match, ignoring case: any verse whose text contains it."
    limit:
      type: int
      default: 100
      description: "At most this many verses, in reading order."
  cypher: |
    MATCH (v:PgpVerse)
    WHERE toLower(v.text) CONTAINS toLower($term)
    RETURN v.name AS reference, v.text AS text
    ORDER BY v.ordinal
    LIMIT $limit

- name: LdsBesideKingJames
  description: >-
    A D&C section or Pearl of Great Price chapter beside the King James it draws on. Verse by
    verse, through CORRESPONDS_TO, with both texts, so where it differs from its source the two show
    it. Needs realm-bible: without it the King James columns are empty. One section or chapter only.
  params:
    chapter:
      type: string
      default: "Moses 2"
      description: "A section or chapter, e.g. `Moses 2` (Genesis 1), `Joseph Smith—Matthew 1` (Matthew 24), `D&C 138` (1 Peter 3–4), `Abraham 4`."
  cypher: |
    MATCH (c:ScriptureChapter)<-[:IN]-(m:Verse)
    WHERE c.scripture IN ['doctrine-and-covenants', 'pearl-of-great-price']
      AND c.name = replace(replace(replace($chapter, 'Doctrine and Covenants ', 'D&C '), ' - ', '—'), '-', '—')
    OPTIONAL MATCH (m)-[r:CORRESPONDS_TO]->(k:BibleVerse)
    RETURN m.verse AS verse, m.text AS text, k.name AS kingJames, k.text AS kjv, r.kind AS kind
    ORDER BY verse

- name: LdsVersesDrawingOn
  description: >-
    D&C and Pearl of Great Price verses quoting or echoing one King James book. In reading
    order, at most `limit` — where Isaiah, Malachi or Revelation are taken up. Needs realm-bible:
    without it there are no rows. Not the Book of Mormon, which realm-book-of-mormon answers.
  params:
    book:
      type: string
      default: "Malachi"
      description: "A King James book as printed, e.g. `Isaiah`, `1 Peter`, `Revelation`. Matched as the prefix of each verse's reference, whole book name only: `John` does not match `1 John`."
    limit:
      type: int
      default: 100
      description: "At most this many verses."
  cypher: |
    MATCH (m:Verse)-[r:CORRESPONDS_TO]->(k:BibleVerse)
    WHERE m.scripture IN ['doctrine-and-covenants', 'pearl-of-great-price'] AND k.name STARTS WITH $book + ' '
    RETURN m.scripture AS scripture, m.name AS reference, r.kind AS kind, k.name AS kingJames, m.text AS text, k.text AS kjv
    ORDER BY scripture, m.ordinal
    LIMIT $limit
