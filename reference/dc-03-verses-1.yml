    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.18
- type: DcVerse
  data:
    ref: dc.18.43
    scripture: doctrine-and-covenants
    name: D&C 18:43
    chapter: 18
    verse: 43
    ordinal: 360
