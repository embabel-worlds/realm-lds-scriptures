    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.18
- type: DcVerse
  data:
    ref: dc.18.25
    scripture: doctrine-and-covenants
    name: D&C 18:25
    chapter: 18
    verse: 25
    ordinal: 342
    text: Wherefore, if they know not the name by which they are called, they cannot have place in the kingdom of my Father.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.18
- type: DcVerse
  data:
    ref: dc.18.26
    scripture: doctrine-and-covenants
    name: D&C 18:26
    chapter: 18
    verse: 26
    ordinal: 343
    text: And now, behold, there are others who are called to declare my gospel, both unto Gentile and unto Jew;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.18
- type: DcVerse
