    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.18
- type: DcVerse
  data:
    ref: dc.18.41
    scripture: doctrine-and-covenants
    name: D&C 18:41
    chapter: 18
    verse: 41
    ordinal: 358
