    name: D&C 78:1
    chapter: 78
    verse: 1
    ordinal: 1839
    text: 'The Lord spake unto Joseph Smith, Jun., saying: Hearken unto me, saith the Lord your God, who are ordained unto the high priesthood of my church, who have assembled yourselves together;'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.78
- type: DcVerse
  data:
    ref: dc.78.2
    scripture: doctrine-and-covenants
    name: D&C 78:2
    chapter: 78
    verse: 2
    ordinal: 1840
    text: And listen to the counsel of him who has ordained you from on high, who shall speak in your ears the words of wisdom, that salvation may be unto you in that thing which you have presented before me, saith the Lord God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.78
- type: DcVerse
  data:
    ref: dc.78.3
    scripture: doctrine-and-covenants
    name: D&C 78:3
    chapter: 78
    verse: 3
    ordinal: 1841
    text: For verily I say unto you, the time has come, and is now at hand; and behold, and lo, it must needs be that there be an organization of my people, in regulating and establishing the affairs of the storehouse for the poor of my people, both in this place and in the land of Zion—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.78
- type: DcVerse
  data:
    ref: dc.78.4
    scripture: doctrine-and-covenants
    name: D&C 78:4
    chapter: 78
    verse: 4
    ordinal: 1842
    text: For a permanent and everlasting establishment and order unto my church, to advance the cause, which ye have espoused, to the salvation of man, and to the glory of your Father who is in heaven;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.78
- type: DcVerse
  data:
    ref: dc.78.5
    scripture: doctrine-and-covenants
    name: D&C 78:5
    chapter: 78
    verse: 5
    ordinal: 1843
    text: That you may be equal in the bonds of heavenly things, yea, and earthly things also, for the obtaining of heavenly things.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.78
- type: DcVerse
  data:
    ref: dc.78.6
    scripture: doctrine-and-covenants
    name: D&C 78:6
    chapter: 78
    verse: 6
    ordinal: 1844
    text: For if ye are not equal in earthly things ye cannot be equal in obtaining heavenly things;
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - John 3:12
    kjvAllusionOsis:
    - John.3.12
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.78
- type: DcVerse
  data:
    ref: dc.78.7
    scripture: doctrine-and-covenants
    name: D&C 78:7
    chapter: 78
    verse: 7
    ordinal: 1845
    text: For if you will that I give unto you a place in the celestial world, you must prepare yourselves by doing the things which I have commanded you and required of you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.78
- type: DcVerse
  data:
    ref: dc.78.8
    scripture: doctrine-and-covenants
    name: D&C 78:8
    chapter: 78
    verse: 8
    ordinal: 1846
    text: And now, verily thus saith the Lord, it is expedient that all things be done unto my glory, by you who are joined together in this order;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.78
- type: DcVerse
  data:
    ref: dc.78.9
    scripture: doctrine-and-covenants
    name: D&C 78:9
    chapter: 78
    verse: 9
    ordinal: 1847
    text: Or, in other words, let my servant Newel K. Whitney and my servant Joseph Smith, Jun., and my servant Sidney Rigdon sit in council with the saints which are in Zion;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.78
- type: DcVerse
  data:
    ref: dc.78.10
    scripture: doctrine-and-covenants
    name: D&C 78:10
    chapter: 78
    verse: 10
    ordinal: 1848
    text: Otherwise Satan seeketh to turn their hearts away from the truth, that they become blinded and understand not the things which are prepared for them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.78
- type: DcVerse
  data:
    ref: dc.78.11
    scripture: doctrine-and-covenants
    name: D&C 78:11
    chapter: 78
    verse: 11
    ordinal: 1849
    text: Wherefore, a commandment I give unto you, to prepare and organize yourselves by a bond or everlasting covenant that cannot be broken.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.78
- type: DcVerse
  data:
    ref: dc.78.12
    scripture: doctrine-and-covenants
    name: D&C 78:12
    chapter: 78
    verse: 12
    ordinal: 1850
    text: And he who breaketh it shall lose his office and standing in the church, and shall be delivered over to the buffetings of Satan until the day of redemption.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.78
- type: DcVerse
  data:
    ref: dc.78.13
    scripture: doctrine-and-covenants
    name: D&C 78:13
    chapter: 78
    verse: 13
    ordinal: 1851
    text: Behold, this is the preparation wherewith I prepare you, and the foundation, and the ensample which I give unto you, whereby you may accomplish the commandments which are given you;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.78
- type: DcVerse
  data:
    ref: dc.78.14
    scripture: doctrine-and-covenants
    name: D&C 78:14
    chapter: 78
    verse: 14
    ordinal: 1852
    text: That through my providence, notwithstanding the tribulation which shall descend upon you, that the church may stand independent above all other creatures beneath the celestial world;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.78
- type: DcVerse
  data:
    ref: dc.78.15
    scripture: doctrine-and-covenants
    name: D&C 78:15
    chapter: 78
    verse: 15
    ordinal: 1853
    text: That you may come up unto the crown prepared for you, and be made rulers over many kingdoms, saith the Lord God, the Holy One of Zion, who hath established the foundations of Adam-ondi-Ahman;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.78
- type: DcVerse
  data:
    ref: dc.78.16
    scripture: doctrine-and-covenants
    name: D&C 78:16
    chapter: 78
    verse: 16
    ordinal: 1854
    text: Who hath appointed Michael your prince, and established his feet, and set him upon high, and given unto him the keys of salvation under the counsel and direction of the Holy One, who is without beginning of days or end of life.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.78
- type: DcVerse
  data:
    ref: dc.78.17
    scripture: doctrine-and-covenants
    name: D&C 78:17
    chapter: 78
    verse: 17
    ordinal: 1855
    text: Verily, verily, I say unto you, ye are little children, and ye have not as yet understood how great blessings the Father hath in his own hands and prepared for you;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.78
- type: DcVerse
  data:
    ref: dc.78.18
    scripture: doctrine-and-covenants
    name: D&C 78:18
    chapter: 78
    verse: 18
    ordinal: 1856
    text: And ye cannot bear all things now; nevertheless, be of good cheer, for I will lead you along. The kingdom is yours and the blessings thereof are yours, and the riches of eternity are yours.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.78
- type: DcVerse
  data:
    ref: dc.78.19
    scripture: doctrine-and-covenants
    name: D&C 78:19
    chapter: 78
    verse: 19
    ordinal: 1857
    text: And he who receiveth all things with thankfulness shall be made glorious; and the things of this earth shall be added unto him, even an hundred fold, yea, more.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.78
- type: DcVerse
  data:
    ref: dc.78.20
    scripture: doctrine-and-covenants
    name: D&C 78:20
    chapter: 78
    verse: 20
    ordinal: 1858
    text: Wherefore, do the things which I have commanded you, saith your Redeemer, even the Son Ahman, who prepareth all things before he taketh you;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.78
- type: DcVerse
  data:
    ref: dc.78.21
    scripture: doctrine-and-covenants
    name: D&C 78:21
    chapter: 78
    verse: 21
    ordinal: 1859
    text: For ye are the church of the Firstborn, and he will take you up in a cloud, and appoint every man his portion.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.78
- type: DcVerse
  data:
    ref: dc.78.22
    scripture: doctrine-and-covenants
    name: D&C 78:22
    chapter: 78
    verse: 22
    ordinal: 1860
    text: And he that is a faithful and wise steward shall inherit all things. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.78
- type: DcVerse
  data:
    ref: dc.79.1
    scripture: doctrine-and-covenants
    name: D&C 79:1
    chapter: 79
    verse: 1
    ordinal: 1861
    text: Verily I say unto you, that it is my will that my servant Jared Carter should go again into the eastern countries, from place to place, and from city to city, in the power of the ordination wherewith he has been ordained, proclaiming glad tidings of great joy, even the everlasting gospel.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.79
- type: DcVerse
  data:
    ref: dc.79.2
    scripture: doctrine-and-covenants
    name: D&C 79:2
    chapter: 79
    verse: 2
    ordinal: 1862
    text: And I will send upon him the Comforter, which shall teach him the truth and the way whither he shall go;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.79
- type: DcVerse
  data:
    ref: dc.79.3
    scripture: doctrine-and-covenants
    name: D&C 79:3
    chapter: 79
    verse: 3
    ordinal: 1863
    text: And inasmuch as he is faithful, I will crown him again with sheaves.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.79
- type: DcVerse
  data:
    ref: dc.79.4
    scripture: doctrine-and-covenants
    name: D&C 79:4
    chapter: 79
    verse: 4
    ordinal: 1864
    text: Wherefore, let your heart be glad, my servant Jared Carter, and fear not, saith your Lord, even Jesus Christ. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.79
- type: DcVerse
  data:
    ref: dc.80.1
    scripture: doctrine-and-covenants
    name: D&C 80:1
    chapter: 80
    verse: 1
    ordinal: 1865
    text: 'Verily, thus saith the Lord unto you my servant Stephen Burnett: Go ye, go ye into the world and preach the gospel to every creature that cometh under the sound of your voice.'
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Mark 16:15
    kjvAllusionOsis:
    - Mark.16.15
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.80
- type: DcVerse
  data:
    ref: dc.80.2
    scripture: doctrine-and-covenants
    name: D&C 80:2
    chapter: 80
    verse: 2
    ordinal: 1866
    text: And inasmuch as you desire a companion, I will give unto you my servant Eden Smith.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.80
- type: DcVerse
  data:
    ref: dc.80.3
    scripture: doctrine-and-covenants
    name: D&C 80:3
    chapter: 80
    verse: 3
    ordinal: 1867
    text: Wherefore, go ye and preach my gospel, whether to the north or to the south, to the east or to the west, it mattereth not, for ye cannot go amiss.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.80
- type: DcVerse
  data:
    ref: dc.80.4
    scripture: doctrine-and-covenants
    name: D&C 80:4
    chapter: 80
    verse: 4
    ordinal: 1868
    text: Therefore, declare the things which ye have heard, and verily believe, and know to be true.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.80
- type: DcVerse
  data:
    ref: dc.80.5
    scripture: doctrine-and-covenants
    name: D&C 80:5
    chapter: 80
    verse: 5
    ordinal: 1869
    text: Behold, this is the will of him who hath called you, your Redeemer, even Jesus Christ. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.80
- type: DcVerse
  data:
    ref: dc.81.1
    scripture: doctrine-and-covenants
    name: D&C 81:1
    chapter: 81
    verse: 1
    ordinal: 1870
    text: 'Verily, verily, I say unto you my servant Frederick G. Williams: Listen to the voice of him who speaketh, to the word of the Lord your God, and hearken to the calling wherewith you are called, even to be a high priest in my church, and a counselor unto my servant Joseph Smith, Jun.;'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.81
- type: DcVerse
  data:
    ref: dc.81.2
    scripture: doctrine-and-covenants
    name: D&C 81:2
    chapter: 81
    verse: 2
    ordinal: 1871
    text: 'Unto whom I have given the keys of the kingdom, which belong always unto the Presidency of the High Priesthood:'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.81
- type: DcVerse
  data:
    ref: dc.81.3
    scripture: doctrine-and-covenants
    name: D&C 81:3
    chapter: 81
    verse: 3
    ordinal: 1872
    text: Therefore, verily I acknowledge him and will bless him, and also thee, inasmuch as thou art faithful in counsel, in the office which I have appointed unto you, in prayer always, vocally and in thy heart, in public and in private, also in thy ministry in proclaiming the gospel in the land of the living, and among thy brethren.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.81
- type: DcVerse
  data:
    ref: dc.81.4
    scripture: doctrine-and-covenants
    name: D&C 81:4
    chapter: 81
    verse: 4
    ordinal: 1873
    text: And in doing these things thou wilt do the greatest good unto thy fellow beings, and wilt promote the glory of him who is your Lord.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.81
- type: DcVerse
  data:
    ref: dc.81.5
    scripture: doctrine-and-covenants
    name: D&C 81:5
    chapter: 81
    verse: 5
    ordinal: 1874
    text: Wherefore, be faithful; stand in the office which I have appointed unto you; succor the weak, lift up the hands which hang down, and strengthen the feeble knees.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Hebrews 12:12
    kjvAllusionOsis:
    - Heb.12.12
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.81
- type: DcVerse
  data:
    ref: dc.81.6
    scripture: doctrine-and-covenants
    name: D&C 81:6
    chapter: 81
    verse: 6
    ordinal: 1875
    text: And if thou art faithful unto the end thou shalt have a crown of immortality, and eternal life in the mansions which I have prepared in the house of my Father.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.81
- type: DcVerse
  data:
    ref: dc.81.7
    scripture: doctrine-and-covenants
    name: D&C 81:7
    chapter: 81
    verse: 7
    ordinal: 1876
    text: Behold, and lo, these are the words of Alpha and Omega, even Jesus Christ. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.81
- type: DcVerse
  data:
    ref: dc.82.1
    scripture: doctrine-and-covenants
    name: D&C 82:1
    chapter: 82
    verse: 1
    ordinal: 1877
    text: Verily, verily, I say unto you, my servants, that inasmuch as you have forgiven one another your trespasses, even so I, the Lord, forgive you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.82
- type: DcVerse
  data:
    ref: dc.82.2
    scripture: doctrine-and-covenants
    name: D&C 82:2
    chapter: 82
    verse: 2
    ordinal: 1878
    text: Nevertheless, there are those among you who have sinned exceedingly; yea, even all of you have sinned; but verily I say unto you, beware from henceforth, and refrain from sin, lest sore judgments fall upon your heads.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.82
- type: DcVerse
  data:
    ref: dc.82.3
    scripture: doctrine-and-covenants
    name: D&C 82:3
    chapter: 82
    verse: 3
    ordinal: 1879
    text: For of him unto whom much is given much is required; and he who sins against the greater light shall receive the greater condemnation.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.82
- type: DcVerse
  data:
    ref: dc.82.4
    scripture: doctrine-and-covenants
    name: D&C 82:4
    chapter: 82
    verse: 4
    ordinal: 1880
    text: Ye call upon my name for revelations, and I give them unto you; and inasmuch as ye keep not my sayings, which I give unto you, ye become transgressors; and justice and judgment are the penalty which is affixed unto my law.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.82
- type: DcVerse
  data:
    ref: dc.82.5
    scripture: doctrine-and-covenants
    name: D&C 82:5
    chapter: 82
    verse: 5
    ordinal: 1881
    text: 'Therefore, what I say unto one I say unto all: Watch, for the adversary spreadeth his dominions, and darkness reigneth;'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.82
- type: DcVerse
  data:
    ref: dc.82.6
    scripture: doctrine-and-covenants
    name: D&C 82:6
    chapter: 82
    verse: 6
    ordinal: 1882
    text: And the anger of God kindleth against the inhabitants of the earth; and none doeth good, for all have gone out of the way.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.82
- type: DcVerse
  data:
    ref: dc.82.7
    scripture: doctrine-and-covenants
    name: D&C 82:7
    chapter: 82
    verse: 7
    ordinal: 1883
    text: And now, verily I say unto you, I, the Lord, will not lay any sin to your charge; go your ways and sin no more; but unto that soul who sinneth shall the former sins return, saith the Lord your God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.82
- type: DcVerse
  data:
    ref: dc.82.8
    scripture: doctrine-and-covenants
    name: D&C 82:8
    chapter: 82
    verse: 8
    ordinal: 1884
    text: And again, I say unto you, I give unto you a new commandment, that you may understand my will concerning you;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.82
- type: DcVerse
  data:
    ref: dc.82.9
    scripture: doctrine-and-covenants
    name: D&C 82:9
    chapter: 82
    verse: 9
    ordinal: 1885
    text: Or, in other words, I give unto you directions how you may act before me, that it may turn to you for your salvation.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.82
- type: DcVerse
  data:
    ref: dc.82.10
    scripture: doctrine-and-covenants
    name: D&C 82:10
    chapter: 82
    verse: 10
    ordinal: 1886
    text: I, the Lord, am bound when ye do what I say; but when ye do not what I say, ye have no promise.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.82
- type: DcVerse
  data:
    ref: dc.82.11
    scripture: doctrine-and-covenants
    name: D&C 82:11
    chapter: 82
    verse: 11
    ordinal: 1887
    text: Therefore, verily I say unto you, that it is expedient for my servants Edward Partridge and Newel K. Whitney, A. Sidney Gilbert and Sidney Rigdon, and my servant Joseph Smith, and John Whitmer and Oliver Cowdery, and W. W. Phelps and Martin Harris to be bound together by a bond and covenant that cannot be broken by transgression, except judgment shall immediately follow, in your several stewardships—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.82
- type: DcVerse
  data:
    ref: dc.82.12
    scripture: doctrine-and-covenants
    name: D&C 82:12
    chapter: 82
    verse: 12
    ordinal: 1888
    text: To manage the affairs of the poor, and all things pertaining to the bishopric both in the land of Zion and in the land of Kirtland;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.82
- type: DcVerse
  data:
    ref: dc.82.13
    scripture: doctrine-and-covenants
    name: D&C 82:13
    chapter: 82
    verse: 13
    ordinal: 1889
    text: For I have consecrated the land of Kirtland in mine own due time for the benefit of the saints of the Most High, and for a stake to Zion.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.82
- type: DcVerse
  data:
    ref: dc.82.14
    scripture: doctrine-and-covenants
    name: D&C 82:14
    chapter: 82
    verse: 14
    ordinal: 1890
    text: For Zion must increase in beauty, and in holiness; her borders must be enlarged; her stakes must be strengthened; yea, verily I say unto you, Zion must arise and put on her beautiful garments.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.82
- type: DcVerse
  data:
    ref: dc.82.15
    scripture: doctrine-and-covenants
    name: D&C 82:15
    chapter: 82
    verse: 15
    ordinal: 1891
    text: Therefore, I give unto you this commandment, that ye bind yourselves by this covenant, and it shall be done according to the laws of the Lord.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.82
- type: DcVerse
  data:
    ref: dc.82.16
    scripture: doctrine-and-covenants
    name: D&C 82:16
    chapter: 82
    verse: 16
    ordinal: 1892
    text: Behold, here is wisdom also in me for your good.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.82
- type: DcVerse
  data:
    ref: dc.82.17
    scripture: doctrine-and-covenants
    name: D&C 82:17
    chapter: 82
    verse: 17
    ordinal: 1893
    text: And you are to be equal, or in other words, you are to have equal claims on the properties, for the benefit of managing the concerns of your stewardships, every man according to his wants and his needs, inasmuch as his wants are just—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.82
- type: DcVerse
  data:
    ref: dc.82.18
    scripture: doctrine-and-covenants
    name: D&C 82:18
    chapter: 82
    verse: 18
    ordinal: 1894
    text: And all this for the benefit of the church of the living God, that every man may improve upon his talent, that every man may gain other talents, yea, even an hundred fold, to be cast into the Lord's storehouse, to become the common property of the whole church—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.82
- type: DcVerse
  data:
    ref: dc.82.19
    scripture: doctrine-and-covenants
    name: D&C 82:19
    chapter: 82
    verse: 19
    ordinal: 1895
    text: Every man seeking the interest of his neighbor, and doing all things with an eye single to the glory of God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.82
- type: DcVerse
  data:
    ref: dc.82.20
    scripture: doctrine-and-covenants
    name: D&C 82:20
    chapter: 82
    verse: 20
    ordinal: 1896
    text: This order I have appointed to be an everlasting order unto you, and unto your successors, inasmuch as you sin not.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.82
- type: DcVerse
  data:
    ref: dc.82.21
    scripture: doctrine-and-covenants
    name: D&C 82:21
    chapter: 82
    verse: 21
    ordinal: 1897
    text: And the soul that sins against this covenant, and hardeneth his heart against it, shall be dealt with according to the laws of my church, and shall be delivered over to the buffetings of Satan until the day of redemption.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.82
- type: DcVerse
  data:
    ref: dc.82.22
    scripture: doctrine-and-covenants
    name: D&C 82:22
    chapter: 82
    verse: 22
    ordinal: 1898
    text: And now, verily I say unto you, and this is wisdom, make unto yourselves friends with the mammon of unrighteousness, and they will not destroy you.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Luke 16:9
    kjvAllusionOsis:
    - Luke.16.9
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.82
- type: DcVerse
  data:
    ref: dc.82.23
    scripture: doctrine-and-covenants
    name: D&C 82:23
    chapter: 82
    verse: 23
    ordinal: 1899
    text: Leave judgment alone with me, for it is mine and I will repay. Peace be with you; my blessings continue with you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.82
- type: DcVerse
  data:
    ref: dc.82.24
    scripture: doctrine-and-covenants
    name: D&C 82:24
    chapter: 82
    verse: 24
    ordinal: 1900
    text: For even yet the kingdom is yours, and shall be forever, if you fall not from your steadfastness. Even so. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.82
- type: DcVerse
  data:
    ref: dc.83.1
    scripture: doctrine-and-covenants
    name: D&C 83:1
    chapter: 83
    verse: 1
    ordinal: 1901
    text: 'Verily, thus saith the Lord, in addition to the laws of the church concerning women and children, those who belong to the church, who have lost their husbands or fathers:'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.83
- type: DcVerse
  data:
    ref: dc.83.2
    scripture: doctrine-and-covenants
    name: D&C 83:2
    chapter: 83
    verse: 2
    ordinal: 1902
    text: Women have claim on their husbands for their maintenance, until their husbands are taken; and if they are not found transgressors they shall have fellowship in the church.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.83
- type: DcVerse
  data:
    ref: dc.83.3
    scripture: doctrine-and-covenants
    name: D&C 83:3
    chapter: 83
    verse: 3
    ordinal: 1903
    text: And if they are not faithful they shall not have fellowship in the church; yet they may remain upon their inheritances according to the laws of the land.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.83
- type: DcVerse
  data:
    ref: dc.83.4
    scripture: doctrine-and-covenants
    name: D&C 83:4
    chapter: 83
    verse: 4
    ordinal: 1904
    text: All children have claim upon their parents for their maintenance until they are of age.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.83
- type: DcVerse
  data:
    ref: dc.83.5
    scripture: doctrine-and-covenants
    name: D&C 83:5
    chapter: 83
    verse: 5
    ordinal: 1905
    text: And after that, they have claim upon the church, or in other words upon the Lord's storehouse, if their parents have not wherewith to give them inheritances.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.83
- type: DcVerse
  data:
    ref: dc.83.6
    scripture: doctrine-and-covenants
    name: D&C 83:6
    chapter: 83
    verse: 6
    ordinal: 1906
    text: And the storehouse shall be kept by the consecrations of the church; and widows and orphans shall be provided for, as also the poor. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.83
- type: DcVerse
  data:
    ref: dc.84.1
    scripture: doctrine-and-covenants
    name: D&C 84:1
    chapter: 84
    verse: 1
    ordinal: 1907
    text: A revelation of Jesus Christ unto his servant Joseph Smith, Jun., and six elders, as they united their hearts and lifted their voices on high.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.2
    scripture: doctrine-and-covenants
    name: D&C 84:2
    chapter: 84
    verse: 2
    ordinal: 1908
    text: Yea, the word of the Lord concerning his church, established in the last days for the restoration of his people, as he has spoken by the mouth of his prophets, and for the gathering of his saints to stand upon Mount Zion, which shall be the city of New Jerusalem.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.3
    scripture: doctrine-and-covenants
    name: D&C 84:3
    chapter: 84
    verse: 3
    ordinal: 1909
    text: Which city shall be built, beginning at the temple lot, which is appointed by the finger of the Lord, in the western boundaries of the State of Missouri, and dedicated by the hand of Joseph Smith, Jun., and others with whom the Lord was well pleased.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.4
    scripture: doctrine-and-covenants
    name: D&C 84:4
    chapter: 84
    verse: 4
    ordinal: 1910
    text: Verily this is the word of the Lord, that the city New Jerusalem shall be built by the gathering of the saints, beginning at this place, even the place of the temple, which temple shall be reared in this generation.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.5
    scripture: doctrine-and-covenants
    name: D&C 84:5
    chapter: 84
    verse: 5
    ordinal: 1911
    text: For verily this generation shall not all pass away until an house shall be built unto the Lord, and a cloud shall rest upon it, which cloud shall be even the glory of the Lord, which shall fill the house.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.6
    scripture: doctrine-and-covenants
    name: D&C 84:6
    chapter: 84
    verse: 6
    ordinal: 1912
    text: And the sons of Moses, according to the Holy Priesthood which he received under the hand of his father-in-law, Jethro;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.7
    scripture: doctrine-and-covenants
    name: D&C 84:7
    chapter: 84
    verse: 7
    ordinal: 1913
    text: And Jethro received it under the hand of Caleb;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.8
    scripture: doctrine-and-covenants
    name: D&C 84:8
    chapter: 84
    verse: 8
    ordinal: 1914
    text: And Caleb received it under the hand of Elihu;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.9
    scripture: doctrine-and-covenants
    name: D&C 84:9
    chapter: 84
    verse: 9
    ordinal: 1915
    text: And Elihu under the hand of Jeremy;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.10
    scripture: doctrine-and-covenants
    name: D&C 84:10
    chapter: 84
    verse: 10
    ordinal: 1916
    text: And Jeremy under the hand of Gad;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.11
    scripture: doctrine-and-covenants
    name: D&C 84:11
    chapter: 84
    verse: 11
    ordinal: 1917
    text: And Gad under the hand of Esaias;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.12
    scripture: doctrine-and-covenants
    name: D&C 84:12
    chapter: 84
    verse: 12
    ordinal: 1918
    text: And Esaias received it under the hand of God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.13
    scripture: doctrine-and-covenants
    name: D&C 84:13
    chapter: 84
    verse: 13
    ordinal: 1919
    text: Esaias also lived in the days of Abraham, and was blessed of him—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.14
    scripture: doctrine-and-covenants
    name: D&C 84:14
    chapter: 84
    verse: 14
    ordinal: 1920
    text: Which Abraham received the priesthood from Melchizedek, who received it through the lineage of his fathers, even till Noah;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.15
    scripture: doctrine-and-covenants
    name: D&C 84:15
    chapter: 84
    verse: 15
    ordinal: 1921
    text: And from Noah till Enoch, through the lineage of their fathers;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.16
    scripture: doctrine-and-covenants
    name: D&C 84:16
    chapter: 84
    verse: 16
    ordinal: 1922
    text: And from Enoch to Abel, who was slain by the conspiracy of his brother, who received the priesthood by the commandments of God, by the hand of his father Adam, who was the first man—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.17
    scripture: doctrine-and-covenants
    name: D&C 84:17
    chapter: 84
    verse: 17
    ordinal: 1923
    text: Which priesthood continueth in the church of God in all generations, and is without beginning of days or end of years.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.18
    scripture: doctrine-and-covenants
    name: D&C 84:18
    chapter: 84
    verse: 18
    ordinal: 1924
    text: And the Lord confirmed a priesthood also upon Aaron and his seed, throughout all their generations, which priesthood also continueth and abideth forever with the priesthood which is after the holiest order of God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.19
    scripture: doctrine-and-covenants
    name: D&C 84:19
    chapter: 84
    verse: 19
    ordinal: 1925
    text: And this greater priesthood administereth the gospel and holdeth the key of the mysteries of the kingdom, even the key of the knowledge of God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.20
    scripture: doctrine-and-covenants
    name: D&C 84:20
    chapter: 84
    verse: 20
    ordinal: 1926
    text: Therefore, in the ordinances thereof, the power of godliness is manifest.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.21
    scripture: doctrine-and-covenants
    name: D&C 84:21
    chapter: 84
    verse: 21
    ordinal: 1927
    text: And without the ordinances thereof, and the authority of the priesthood, the power of godliness is not manifest unto men in the flesh;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.22
    scripture: doctrine-and-covenants
    name: D&C 84:22
    chapter: 84
    verse: 22
    ordinal: 1928
    text: For without this no man can see the face of God, even the Father, and live.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.23
    scripture: doctrine-and-covenants
    name: D&C 84:23
    chapter: 84
    verse: 23
    ordinal: 1929
    text: Now this Moses plainly taught to the children of Israel in the wilderness, and sought diligently to sanctify his people that they might behold the face of God;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.24
    scripture: doctrine-and-covenants
    name: D&C 84:24
    chapter: 84
    verse: 24
    ordinal: 1930
    text: But they hardened their hearts and could not endure his presence; therefore, the Lord in his wrath, for his anger was kindled against them, swore that they should not enter into his rest while in the wilderness, which rest is the fulness of his glory.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.25
    scripture: doctrine-and-covenants
    name: D&C 84:25
    chapter: 84
    verse: 25
    ordinal: 1931
    text: Therefore, he took Moses out of their midst, and the Holy Priesthood also;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.26
    scripture: doctrine-and-covenants
    name: D&C 84:26
    chapter: 84
    verse: 26
    ordinal: 1932
    text: And the lesser priesthood continued, which priesthood holdeth the key of the ministering of angels and the preparatory gospel;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.27
    scripture: doctrine-and-covenants
    name: D&C 84:27
    chapter: 84
    verse: 27
    ordinal: 1933
    text: Which gospel is the gospel of repentance and of baptism, and the remission of sins, and the law of carnal commandments, which the Lord in his wrath caused to continue with the house of Aaron among the children of Israel until John, whom God raised up, being filled with the Holy Ghost from his mother's womb.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.28
    scripture: doctrine-and-covenants
    name: D&C 84:28
    chapter: 84
    verse: 28
    ordinal: 1934
    text: For he was baptized while he was yet in his childhood, and was ordained by the angel of God at the time he was eight days old unto this power, to overthrow the kingdom of the Jews, and to make straight the way of the Lord before the face of his people, to prepare them for the coming of the Lord, in whose hand is given all power.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.29
    scripture: doctrine-and-covenants
    name: D&C 84:29
    chapter: 84
    verse: 29
    ordinal: 1935
    text: And again, the offices of elder and bishop are necessary appendages belonging unto the high priesthood.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.30
    scripture: doctrine-and-covenants
    name: D&C 84:30
    chapter: 84
    verse: 30
    ordinal: 1936
    text: And again, the offices of teacher and deacon are necessary appendages belonging to the lesser priesthood, which priesthood was confirmed upon Aaron and his sons.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.31
    scripture: doctrine-and-covenants
    name: D&C 84:31
    chapter: 84
    verse: 31
    ordinal: 1937
    text: Therefore, as I said concerning the sons of Moses—for the sons of Moses and also the sons of Aaron shall offer an acceptable offering and sacrifice in the house of the Lord, which house shall be built unto the Lord in this generation, upon the consecrated spot as I have appointed—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.32
    scripture: doctrine-and-covenants
    name: D&C 84:32
    chapter: 84
    verse: 32
    ordinal: 1938
    text: And the sons of Moses and of Aaron shall be filled with the glory of the Lord, upon Mount Zion in the Lord's house, whose sons are ye; and also many whom I have called and sent forth to build up my church.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.33
    scripture: doctrine-and-covenants
    name: D&C 84:33
    chapter: 84
    verse: 33
    ordinal: 1939
    text: For whoso is faithful unto the obtaining these two priesthoods of which I have spoken, and the magnifying their calling, are sanctified by the Spirit unto the renewing of their bodies.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.34
    scripture: doctrine-and-covenants
    name: D&C 84:34
    chapter: 84
    verse: 34
    ordinal: 1940
    text: They become the sons of Moses and of Aaron and the seed of Abraham, and the church and kingdom, and the elect of God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.35
    scripture: doctrine-and-covenants
    name: D&C 84:35
    chapter: 84
    verse: 35
    ordinal: 1941
    text: And also all they who receive this priesthood receive me, saith the Lord;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.36
    scripture: doctrine-and-covenants
    name: D&C 84:36
    chapter: 84
    verse: 36
    ordinal: 1942
    text: For he that receiveth my servants receiveth me;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.37
    scripture: doctrine-and-covenants
    name: D&C 84:37
    chapter: 84
    verse: 37
    ordinal: 1943
    text: And he that receiveth me receiveth my Father;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.38
    scripture: doctrine-and-covenants
    name: D&C 84:38
    chapter: 84
    verse: 38
    ordinal: 1944
    text: And he that receiveth my Father receiveth my Father's kingdom; therefore all that my Father hath shall be given unto him.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.39
    scripture: doctrine-and-covenants
    name: D&C 84:39
    chapter: 84
    verse: 39
    ordinal: 1945
    text: And this is according to the oath and covenant which belongeth to the priesthood.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.40
    scripture: doctrine-and-covenants
    name: D&C 84:40
    chapter: 84
    verse: 40
    ordinal: 1946
    text: Therefore, all those who receive the priesthood, receive this oath and covenant of my Father, which he cannot break, neither can it be moved.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.41
    scripture: doctrine-and-covenants
    name: D&C 84:41
    chapter: 84
    verse: 41
    ordinal: 1947
    text: But whoso breaketh this covenant after he hath received it, and altogether turneth therefrom, shall not have forgiveness of sins in this world nor in the world to come.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.42
    scripture: doctrine-and-covenants
    name: D&C 84:42
    chapter: 84
    verse: 42
    ordinal: 1948
    text: And wo unto all those who come not unto this priesthood which ye have received, which I now confirm upon you who are present this day, by mine own voice out of the heavens; and even I have given the heavenly hosts and mine angels charge concerning you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.43
    scripture: doctrine-and-covenants
    name: D&C 84:43
    chapter: 84
    verse: 43
    ordinal: 1949
    text: And I now give unto you a commandment to beware concerning yourselves, to give diligent heed to the words of eternal life.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.44
    scripture: doctrine-and-covenants
    name: D&C 84:44
    chapter: 84
    verse: 44
    ordinal: 1950
    text: For you shall live by every word that proceedeth forth from the mouth of God.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Matthew 4:4
    kjvAllusionOsis:
    - Matt.4.4
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.45
    scripture: doctrine-and-covenants
    name: D&C 84:45
    chapter: 84
    verse: 45
    ordinal: 1951
    text: For the word of the Lord is truth, and whatsoever is truth is light, and whatsoever is light is Spirit, even the Spirit of Jesus Christ.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.46
    scripture: doctrine-and-covenants
    name: D&C 84:46
    chapter: 84
    verse: 46
    ordinal: 1952
    text: And the Spirit giveth light to every man that cometh into the world; and the Spirit enlighteneth every man through the world, that hearkeneth to the voice of the Spirit.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - John 1:9
    kjvAllusionOsis:
    - John.1.9
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.47
    scripture: doctrine-and-covenants
    name: D&C 84:47
    chapter: 84
    verse: 47
    ordinal: 1953
    text: And every one that hearkeneth to the voice of the Spirit cometh unto God, even the Father.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.48
    scripture: doctrine-and-covenants
    name: D&C 84:48
    chapter: 84
    verse: 48
    ordinal: 1954
    text: And the Father teacheth him of the covenant which he has renewed and confirmed upon you, which is confirmed upon you for your sakes, and not for your sakes only, but for the sake of the whole world.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.49
    scripture: doctrine-and-covenants
    name: D&C 84:49
    chapter: 84
    verse: 49
    ordinal: 1955
    text: And the whole world lieth in sin, and groaneth under darkness and under the bondage of sin.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.50
    scripture: doctrine-and-covenants
    name: D&C 84:50
    chapter: 84
    verse: 50
    ordinal: 1956
    text: And by this you may know they are under the bondage of sin, because they come not unto me.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.51
    scripture: doctrine-and-covenants
    name: D&C 84:51
    chapter: 84
    verse: 51
    ordinal: 1957
    text: For whoso cometh not unto me is under the bondage of sin.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.52
    scripture: doctrine-and-covenants
    name: D&C 84:52
    chapter: 84
    verse: 52
    ordinal: 1958
    text: And whoso receiveth not my voice is not acquainted with my voice, and is not of me.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.53
    scripture: doctrine-and-covenants
    name: D&C 84:53
    chapter: 84
    verse: 53
    ordinal: 1959
    text: And by this you may know the righteous from the wicked, and that the whole world groaneth under sin and darkness even now.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.54
    scripture: doctrine-and-covenants
    name: D&C 84:54
    chapter: 84
    verse: 54
    ordinal: 1960
    text: And your minds in times past have been darkened because of unbelief, and because you have treated lightly the things you have received—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.55
    scripture: doctrine-and-covenants
    name: D&C 84:55
    chapter: 84
    verse: 55
    ordinal: 1961
    text: Which vanity and unbelief have brought the whole church under condemnation.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.56
    scripture: doctrine-and-covenants
    name: D&C 84:56
    chapter: 84
    verse: 56
    ordinal: 1962
    text: And this condemnation resteth upon the children of Zion, even all.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.57
    scripture: doctrine-and-covenants
    name: D&C 84:57
    chapter: 84
    verse: 57
    ordinal: 1963
    text: And they shall remain under this condemnation until they repent and remember the new covenant, even the Book of Mormon and the former commandments which I have given them, not only to say, but to do according to that which I have written—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.58
    scripture: doctrine-and-covenants
    name: D&C 84:58
    chapter: 84
    verse: 58
    ordinal: 1964
    text: That they may bring forth fruit meet for their Father's kingdom; otherwise there remaineth a scourge and judgment to be poured out upon the children of Zion.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.59
    scripture: doctrine-and-covenants
    name: D&C 84:59
    chapter: 84
    verse: 59
    ordinal: 1965
    text: For shall the children of the kingdom pollute my holy land? Verily, I say unto you, Nay.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.60
    scripture: doctrine-and-covenants
    name: D&C 84:60
    chapter: 84
    verse: 60
    ordinal: 1966
    text: Verily, verily, I say unto you who now hear my words, which are my voice, blessed are ye inasmuch as you receive these things;
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Matthew 25:40
    kjvAllusionOsis:
    - Matt.25.40
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.61
    scripture: doctrine-and-covenants
    name: D&C 84:61
    chapter: 84
    verse: 61
    ordinal: 1967
    text: For I will forgive you of your sins with this commandment—that you remain steadfast in your minds in solemnity and the spirit of prayer, in bearing testimony to all the world of those things which are communicated unto you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.62
    scripture: doctrine-and-covenants
    name: D&C 84:62
    chapter: 84
    verse: 62
    ordinal: 1968
    text: Therefore, go ye into all the world; and unto whatsoever place ye cannot go ye shall send, that the testimony may go from you into all the world unto every creature.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Mark 16:15
    kjvAllusionOsis:
    - Mark.16.15
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.63
    scripture: doctrine-and-covenants
    name: D&C 84:63
    chapter: 84
    verse: 63
    ordinal: 1969
    text: And as I said unto mine apostles, even so I say unto you, for you are mine apostles, even God's high priests; ye are they whom my Father hath given me; ye are my friends;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.64
    scripture: doctrine-and-covenants
    name: D&C 84:64
    chapter: 84
    verse: 64
    ordinal: 1970
    text: Therefore, as I said unto mine apostles I say unto you again, that every soul who believeth on your words, and is baptized by water for the remission of sins, shall receive the Holy Ghost.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Acts 2:38
    kjvAllusionOsis:
    - Acts.2.38
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.65
    scripture: doctrine-and-covenants
    name: D&C 84:65
    chapter: 84
    verse: 65
    ordinal: 1971
    text: And these signs shall follow them that believe—
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Mark 16:17
    kjvAllusionOsis:
    - Mark.16.17
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.66
    scripture: doctrine-and-covenants
    name: D&C 84:66
    chapter: 84
    verse: 66
    ordinal: 1972
    text: In my name they shall do many wonderful works;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.67
    scripture: doctrine-and-covenants
    name: D&C 84:67
    chapter: 84
    verse: 67
    ordinal: 1973
    text: In my name they shall cast out devils;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.68
    scripture: doctrine-and-covenants
    name: D&C 84:68
    chapter: 84
    verse: 68
    ordinal: 1974
    text: In my name they shall heal the sick;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.69
    scripture: doctrine-and-covenants
    name: D&C 84:69
    chapter: 84
    verse: 69
    ordinal: 1975
    text: In my name they shall open the eyes of the blind, and unstop the ears of the deaf;
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Isaiah 43:8
    kjvAllusionOsis:
    - Isa.43.8
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.70
    scripture: doctrine-and-covenants
    name: D&C 84:70
    chapter: 84
    verse: 70
    ordinal: 1976
    text: And the tongue of the dumb shall speak;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.71
    scripture: doctrine-and-covenants
    name: D&C 84:71
    chapter: 84
    verse: 71
    ordinal: 1977
    text: And if any man shall administer poison unto them it shall not hurt them;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.72
    scripture: doctrine-and-covenants
    name: D&C 84:72
    chapter: 84
    verse: 72
    ordinal: 1978
    text: And the poison of a serpent shall not have power to harm them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.73
    scripture: doctrine-and-covenants
    name: D&C 84:73
    chapter: 84
    verse: 73
    ordinal: 1979
    text: But a commandment I give unto them, that they shall not boast themselves of these things, neither speak them before the world; for these things are given unto you for your profit and for salvation.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.74
    scripture: doctrine-and-covenants
    name: D&C 84:74
    chapter: 84
    verse: 74
    ordinal: 1980
    text: Verily, verily, I say unto you, they who believe not on your words, and are not baptized in water in my name, for the remission of their sins, that they may receive the Holy Ghost, shall be damned, and shall not come into my Father's kingdom where my Father and I am.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.75
    scripture: doctrine-and-covenants
    name: D&C 84:75
    chapter: 84
    verse: 75
    ordinal: 1981
    text: And this revelation unto you, and commandment, is in force from this very hour upon all the world, and the gospel is unto all who have not received it.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.76
    scripture: doctrine-and-covenants
    name: D&C 84:76
    chapter: 84
    verse: 76
    ordinal: 1982
    text: But, verily I say unto all those to whom the kingdom has been given—from you it must be preached unto them, that they shall repent of their former evil works; for they are to be upbraided for their evil hearts of unbelief, and your brethren in Zion for their rebellion against you at the time I sent you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.77
    scripture: doctrine-and-covenants
    name: D&C 84:77
    chapter: 84
    verse: 77
    ordinal: 1983
    text: And again I say unto you, my friends, for from henceforth I shall call you friends, it is expedient that I give unto you this commandment, that ye become even as my friends in days when I was with them, traveling to preach the gospel in my power;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.78
    scripture: doctrine-and-covenants
    name: D&C 84:78
    chapter: 84
    verse: 78
    ordinal: 1984
    text: For I suffered them not to have purse or scrip, neither two coats.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.79
    scripture: doctrine-and-covenants
    name: D&C 84:79
    chapter: 84
    verse: 79
    ordinal: 1985
    text: Behold, I send you out to prove the world, and the laborer is worthy of his hire.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.80
    scripture: doctrine-and-covenants
    name: D&C 84:80
    chapter: 84
    verse: 80
    ordinal: 1986
    text: And any man that shall go and preach this gospel of the kingdom, and fail not to continue faithful in all things, shall not be weary in mind, neither darkened, neither in body, limb, nor joint; and a hair of his head shall not fall to the ground unnoticed. And they shall not go hungry, neither athirst.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.81
    scripture: doctrine-and-covenants
    name: D&C 84:81
    chapter: 84
    verse: 81
    ordinal: 1987
    text: Therefore, take ye no thought for the morrow, for what ye shall eat, or what ye shall drink, or wherewithal ye shall be clothed.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Matthew 6:31
    kjvOsis:
    - Matt.6.31
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.82
    scripture: doctrine-and-covenants
    name: D&C 84:82
    chapter: 84
    verse: 82
    ordinal: 1988
    text: For, consider the lilies of the field, how they grow, they toil not, neither do they spin; and the kingdoms of the world, in all their glory, are not arrayed like one of these.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Luke 12:27
    kjvAllusionOsis:
    - Luke.12.27
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.83
    scripture: doctrine-and-covenants
    name: D&C 84:83
    chapter: 84
    verse: 83
    ordinal: 1989
    text: For your Father, who is in heaven, knoweth that you have need of all these things.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Luke 12:30
    kjvAllusionOsis:
    - Luke.12.30
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.84
    scripture: doctrine-and-covenants
    name: D&C 84:84
    chapter: 84
    verse: 84
    ordinal: 1990
    text: Therefore, let the morrow take thought for the things of itself.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Matthew 6:34
    kjvAllusionOsis:
    - Matt.6.34
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.85
    scripture: doctrine-and-covenants
    name: D&C 84:85
    chapter: 84
    verse: 85
    ordinal: 1991
    text: Neither take ye thought beforehand what ye shall say; but treasure up in your minds continually the words of life, and it shall be given you in the very hour that portion that shall be meted unto every man.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Mark 13:11
    kjvAllusionOsis:
    - Mark.13.11
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.86
    scripture: doctrine-and-covenants
    name: D&C 84:86
    chapter: 84
    verse: 86
    ordinal: 1992
    text: Therefore, let no man among you, for this commandment is unto all the faithful who are called of God in the church unto the ministry, from this hour take purse or scrip, that goeth forth to proclaim this gospel of the kingdom.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.87
    scripture: doctrine-and-covenants
    name: D&C 84:87
    chapter: 84
    verse: 87
    ordinal: 1993
    text: Behold, I send you out to reprove the world of all their unrighteous deeds, and to teach them of a judgment which is to come.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.88
    scripture: doctrine-and-covenants
    name: D&C 84:88
    chapter: 84
    verse: 88
    ordinal: 1994
    text: And whoso receiveth you, there I will be also, for I will go before your face. I will be on your right hand and on your left, and my Spirit shall be in your hearts, and mine angels round about you, to bear you up.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.89
    scripture: doctrine-and-covenants
    name: D&C 84:89
    chapter: 84
    verse: 89
    ordinal: 1995
    text: Whoso receiveth you receiveth me; and the same will feed you, and clothe you, and give you money.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.90
    scripture: doctrine-and-covenants
    name: D&C 84:90
    chapter: 84
    verse: 90
    ordinal: 1996
    text: And he who feeds you, or clothes you, or gives you money, shall in nowise lose his reward.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
    ref: dc.84.91
    scripture: doctrine-and-covenants
    name: D&C 84:91
    chapter: 84
    verse: 91
    ordinal: 1997
    text: And he that doeth not these things is not my disciple; by this you may know my disciples.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.84
- type: DcVerse
  data:
