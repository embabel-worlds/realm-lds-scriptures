    scripture: doctrine-and-covenants
    name: D&C 18:27
    chapter: 18
    verse: 27
    ordinal: 344
    text: Yea, even twelve; and the Twelve shall be my disciples, and they shall take upon them my name; and the Twelve are they who shall desire to take upon them my name with full purpose of heart.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.18
- type: DcVerse
  data:
    ref: dc.18.28
    scripture: doctrine-and-covenants
    name: D&C 18:28
    chapter: 18
    verse: 28
    ordinal: 345
    text: And if they desire to take upon them my name with full purpose of heart, they are called to go into all the world to preach my gospel unto every creature.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Mark 16:15
    kjvAllusionOsis:
    - Mark.16.15
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.18
- type: DcVerse
  data:
    ref: dc.18.29
    scripture: doctrine-and-covenants
    name: D&C 18:29
    chapter: 18
    verse: 29
    ordinal: 346
    text: And they are they who are ordained of me to baptize in my name, according to that which is written;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.18
- type: DcVerse
  data:
    ref: dc.18.30
    scripture: doctrine-and-covenants
    name: D&C 18:30
    chapter: 18
    verse: 30
    ordinal: 347
    text: And you have that which is written before you; wherefore, you must perform it according to the words which are written.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.18
- type: DcVerse
  data:
    ref: dc.18.31
    scripture: doctrine-and-covenants
    name: D&C 18:31
    chapter: 18
    verse: 31
    ordinal: 348
    text: And now I speak unto you, the Twelve—Behold, my grace is sufficient for you; you must walk uprightly before me and sin not.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.18
- type: DcVerse
  data:
    ref: dc.18.32
    scripture: doctrine-and-covenants
    name: D&C 18:32
    chapter: 18
    verse: 32
    ordinal: 349
    text: And, behold, you are they who are ordained of me to ordain priests and teachers; to declare my gospel, according to the power of the Holy Ghost which is in you, and according to the callings and gifts of God unto men;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.18
- type: DcVerse
  data:
    ref: dc.18.33
    scripture: doctrine-and-covenants
    name: D&C 18:33
    chapter: 18
    verse: 33
    ordinal: 350
    text: And I, Jesus Christ, your Lord and your God, have spoken it.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.18
- type: DcVerse
  data:
