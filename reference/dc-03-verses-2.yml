    to:
      type: DcSection
      ref: dc.46
- type: DcVerse
  data:
    ref: dc.47.1
    scripture: doctrine-and-covenants
    name: D&C 47:1
    chapter: 47
    verse: 1
    ordinal: 1055
    text: Behold, it is expedient in me that my servant John should write and keep a regular history, and assist you, my servant Joseph, in transcribing all things which shall be given you, until he is called to further duties.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.47
- type: DcVerse
  data:
    ref: dc.47.2
    scripture: doctrine-and-covenants
    name: D&C 47:2
    chapter: 47
    verse: 2
    ordinal: 1056
    text: Again, verily I say unto you that he can also lift up his voice in meetings, whenever it shall be expedient.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.47
- type: DcVerse
  data:
    ref: dc.47.3
    scripture: doctrine-and-covenants
    name: D&C 47:3
    chapter: 47
    verse: 3
    ordinal: 1057
    text: And again, I say unto you that it shall be appointed unto him to keep the church record and history continually; for Oliver Cowdery I have appointed to another office.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.47
- type: DcVerse
  data:
    ref: dc.47.4
    scripture: doctrine-and-covenants
    name: D&C 47:4
    chapter: 47
    verse: 4
    ordinal: 1058
    text: Wherefore, it shall be given him, inasmuch as he is faithful, by the Comforter, to write these things. Even so. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.47
- type: DcVerse
  data:
    ref: dc.48.1
    scripture: doctrine-and-covenants
    name: D&C 48:1
    chapter: 48
    verse: 1
    ordinal: 1059
    text: It is necessary that ye should remain for the present time in your places of abode, as it shall be suitable to your circumstances.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.48
- type: DcVerse
  data:
    ref: dc.48.2
    scripture: doctrine-and-covenants
    name: D&C 48:2
    chapter: 48
    verse: 2
    ordinal: 1060
    text: And inasmuch as ye have lands, ye shall impart to the eastern brethren;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.48
- type: DcVerse
  data:
    ref: dc.48.3
    scripture: doctrine-and-covenants
    name: D&C 48:3
    chapter: 48
    verse: 3
    ordinal: 1061
    text: And inasmuch as ye have not lands, let them buy for the present time in those regions round about, as seemeth them good, for it must needs be necessary that they have places to live for the present time.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.48
- type: DcVerse
  data:
    ref: dc.48.4
    scripture: doctrine-and-covenants
    name: D&C 48:4
    chapter: 48
    verse: 4
    ordinal: 1062
    text: It must needs be necessary that ye save all the money that ye can, and that ye obtain all that ye can in righteousness, that in time ye may be enabled to purchase land for an inheritance, even the city.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.48
- type: DcVerse
  data:
    ref: dc.48.5
    scripture: doctrine-and-covenants
    name: D&C 48:5
    chapter: 48
    verse: 5
    ordinal: 1063
    text: The place is not yet to be revealed; but after your brethren come from the east there are to be certain men appointed, and to them it shall be given to know the place, or to them it shall be revealed.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.48
- type: DcVerse
  data:
    ref: dc.48.6
    scripture: doctrine-and-covenants
    name: D&C 48:6
    chapter: 48
    verse: 6
    ordinal: 1064
    text: And they shall be appointed to purchase the lands, and to make a commencement to lay the foundation of the city; and then shall ye begin to be gathered with your families, every man according to his family, according to his circumstances, and as is appointed to him by the presidency and the bishop of the church, according to the laws and commandments which ye have received, and which ye shall hereafter receive. Even so. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.48
- type: DcVerse
  data:
    ref: dc.49.1
    scripture: doctrine-and-covenants
    name: D&C 49:1
    chapter: 49
    verse: 1
    ordinal: 1065
    text: Hearken unto my word, my servants Sidney, and Parley, and Leman; for behold, verily I say unto you, that I give unto you a commandment that you shall go and preach my gospel which ye have received, even as ye have received it, unto the Shakers.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.49
- type: DcVerse
  data:
    ref: dc.49.2
    scripture: doctrine-and-covenants
    name: D&C 49:2
    chapter: 49
    verse: 2
    ordinal: 1066
    text: Behold, I say unto you, that they desire to know the truth in part, but not all, for they are not right before me and must needs repent.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.49
- type: DcVerse
  data:
    ref: dc.49.3
    scripture: doctrine-and-covenants
    name: D&C 49:3
    chapter: 49
    verse: 3
    ordinal: 1067
    text: Wherefore, I send you, my servants Sidney and Parley, to preach the gospel unto them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.49
- type: DcVerse
  data:
    ref: dc.49.4
    scripture: doctrine-and-covenants
    name: D&C 49:4
    chapter: 49
    verse: 4
    ordinal: 1068
    text: And my servant Leman shall be ordained unto this work, that he may reason with them, not according to that which he has received of them, but according to that which shall be taught him by you my servants; and by so doing I will bless him, otherwise he shall not prosper.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.49
- type: DcVerse
  data:
    ref: dc.49.5
    scripture: doctrine-and-covenants
    name: D&C 49:5
    chapter: 49
    verse: 5
    ordinal: 1069
    text: Thus saith the Lord; for I am God, and have sent mine Only Begotten Son into the world for the redemption of the world, and have decreed that he that receiveth him shall be saved, and he that receiveth him not shall be damned—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.49
- type: DcVerse
  data:
    ref: dc.49.6
    scripture: doctrine-and-covenants
    name: D&C 49:6
    chapter: 49
    verse: 6
    ordinal: 1070
    text: And they have done unto the Son of Man even as they listed; and he has taken his power on the right hand of his glory, and now reigneth in the heavens, and will reign till he descends on the earth to put all enemies under his feet, which time is nigh at hand—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.49
- type: DcVerse
  data:
    ref: dc.49.7
    scripture: doctrine-and-covenants
    name: D&C 49:7
    chapter: 49
    verse: 7
    ordinal: 1071
    text: I, the Lord God, have spoken it; but the hour and the day no man knoweth, neither the angels in heaven, nor shall they know until he comes.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Mark 13:32
    kjvAllusionOsis:
    - Mark.13.32
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.49
- type: DcVerse
  data:
    ref: dc.49.8
    scripture: doctrine-and-covenants
    name: D&C 49:8
    chapter: 49
    verse: 8
    ordinal: 1072
    text: Wherefore, I will that all men shall repent, for all are under sin, except those which I have reserved unto myself, holy men that ye know not of.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.49
- type: DcVerse
  data:
    ref: dc.49.9
    scripture: doctrine-and-covenants
    name: D&C 49:9
    chapter: 49
    verse: 9
    ordinal: 1073
    text: Wherefore, I say unto you that I have sent unto you mine everlasting covenant, even that which was from the beginning.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.49
- type: DcVerse
  data:
    ref: dc.49.10
    scripture: doctrine-and-covenants
    name: D&C 49:10
    chapter: 49
    verse: 10
    ordinal: 1074
    text: And that which I have promised I have so fulfilled, and the nations of the earth shall bow to it; and, if not of themselves, they shall come down, for that which is now exalted of itself shall be laid low of power.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.49
- type: DcVerse
  data:
    ref: dc.49.11
    scripture: doctrine-and-covenants
    name: D&C 49:11
    chapter: 49
    verse: 11
    ordinal: 1075
    text: 'Wherefore, I give unto you a commandment that ye go among this people, and say unto them, like unto mine apostle of old, whose name was Peter:'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.49
- type: DcVerse
  data:
    ref: dc.49.12
    scripture: doctrine-and-covenants
    name: D&C 49:12
    chapter: 49
    verse: 12
    ordinal: 1076
    text: Believe on the name of the Lord Jesus, who was on the earth, and is to come, the beginning and the end;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.49
- type: DcVerse
  data:
    ref: dc.49.13
    scripture: doctrine-and-covenants
    name: D&C 49:13
    chapter: 49
    verse: 13
    ordinal: 1077
    text: Repent and be baptized in the name of Jesus Christ, according to the holy commandment, for the remission of sins;
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Acts 2:38
    kjvAllusionOsis:
    - Acts.2.38
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.49
- type: DcVerse
  data:
    ref: dc.49.14
    scripture: doctrine-and-covenants
    name: D&C 49:14
    chapter: 49
    verse: 14
    ordinal: 1078
    text: And whoso doeth this shall receive the gift of the Holy Ghost, by the laying on of the hands of the elders of the church.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.49
- type: DcVerse
  data:
    ref: dc.49.15
    scripture: doctrine-and-covenants
    name: D&C 49:15
    chapter: 49
    verse: 15
    ordinal: 1079
    text: And again, verily I say unto you, that whoso forbiddeth to marry is not ordained of God, for marriage is ordained of God unto man.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.49
- type: DcVerse
  data:
    ref: dc.49.16
    scripture: doctrine-and-covenants
    name: D&C 49:16
    chapter: 49
    verse: 16
    ordinal: 1080
    text: Wherefore, it is lawful that he should have one wife, and they twain shall be one flesh, and all this that the earth might answer the end of its creation;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.49
- type: DcVerse
  data:
    ref: dc.49.17
    scripture: doctrine-and-covenants
    name: D&C 49:17
    chapter: 49
    verse: 17
    ordinal: 1081
    text: And that it might be filled with the measure of man, according to his creation before the world was made.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.49
- type: DcVerse
  data:
    ref: dc.49.18
    scripture: doctrine-and-covenants
    name: D&C 49:18
    chapter: 49
    verse: 18
    ordinal: 1082
    text: And whoso forbiddeth to abstain from meats, that man should not eat the same, is not ordained of God;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.49
- type: DcVerse
  data:
    ref: dc.49.19
    scripture: doctrine-and-covenants
    name: D&C 49:19
    chapter: 49
    verse: 19
    ordinal: 1083
    text: For, behold, the beasts of the field and the fowls of the air, and that which cometh of the earth, is ordained for the use of man for food and for raiment, and that he might have in abundance.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.49
- type: DcVerse
  data:
    ref: dc.49.20
    scripture: doctrine-and-covenants
    name: D&C 49:20
    chapter: 49
    verse: 20
    ordinal: 1084
    text: But it is not given that one man should possess that which is above another, wherefore the world lieth in sin.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.49
- type: DcVerse
  data:
    ref: dc.49.21
    scripture: doctrine-and-covenants
    name: D&C 49:21
    chapter: 49
    verse: 21
    ordinal: 1085
    text: And wo be unto man that sheddeth blood or that wasteth flesh and hath no need.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.49
- type: DcVerse
  data:
    ref: dc.49.22
    scripture: doctrine-and-covenants
    name: D&C 49:22
    chapter: 49
    verse: 22
    ordinal: 1086
    text: And again, verily I say unto you, that the Son of Man cometh not in the form of a woman, neither of a man traveling on the earth.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.49
- type: DcVerse
  data:
    ref: dc.49.23
    scripture: doctrine-and-covenants
    name: D&C 49:23
    chapter: 49
    verse: 23
    ordinal: 1087
    text: Wherefore, be not deceived, but continue in steadfastness, looking forth for the heavens to be shaken, and the earth to tremble and to reel to and fro as a drunken man, and for the valleys to be exalted, and for the mountains to be made low, and for the rough places to become smooth—and all this when the angel shall sound his trumpet.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.49
- type: DcVerse
  data:
    ref: dc.49.24
    scripture: doctrine-and-covenants
    name: D&C 49:24
    chapter: 49
    verse: 24
    ordinal: 1088
    text: But before the great day of the Lord shall come, Jacob shall flourish in the wilderness, and the Lamanites shall blossom as the rose.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.49
- type: DcVerse
  data:
    ref: dc.49.25
    scripture: doctrine-and-covenants
    name: D&C 49:25
    chapter: 49
    verse: 25
    ordinal: 1089
    text: Zion shall flourish upon the hills and rejoice upon the mountains, and shall be assembled together unto the place which I have appointed.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.49
- type: DcVerse
  data:
    ref: dc.49.26
    scripture: doctrine-and-covenants
    name: D&C 49:26
    chapter: 49
    verse: 26
    ordinal: 1090
    text: Behold, I say unto you, go forth as I have commanded you; repent of all your sins; ask and ye shall receive; knock and it shall be opened unto you.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Luke 11:9
    kjvAllusionOsis:
    - Luke.11.9
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.49
- type: DcVerse
  data:
    ref: dc.49.27
    scripture: doctrine-and-covenants
    name: D&C 49:27
    chapter: 49
    verse: 27
    ordinal: 1091
    text: Behold, I will go before you and be your rearward; and I will be in your midst, and you shall not be confounded.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.49
- type: DcVerse
  data:
    ref: dc.49.28
    scripture: doctrine-and-covenants
    name: D&C 49:28
    chapter: 49
    verse: 28
    ordinal: 1092
    text: Behold, I am Jesus Christ, and I come quickly. Even so. Amen.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Revelation 22:20
    kjvAllusionOsis:
    - Rev.22.20
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.49
- type: DcVerse
  data:
    ref: dc.50.1
    scripture: doctrine-and-covenants
    name: D&C 50:1
    chapter: 50
    verse: 1
    ordinal: 1093
    text: Hearken, O ye elders of my church, and give ear to the voice of the living God; and attend to the words of wisdom which shall be given unto you, according as ye have asked and are agreed as touching the church, and the spirits which have gone abroad in the earth.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.50
- type: DcVerse
  data:
    ref: dc.50.2
    scripture: doctrine-and-covenants
    name: D&C 50:2
    chapter: 50
    verse: 2
    ordinal: 1094
    text: Behold, verily I say unto you, that there are many spirits which are false spirits, which have gone forth in the earth, deceiving the world.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.50
- type: DcVerse
  data:
    ref: dc.50.3
    scripture: doctrine-and-covenants
    name: D&C 50:3
    chapter: 50
    verse: 3
    ordinal: 1095
    text: And also Satan hath sought to deceive you, that he might overthrow you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.50
- type: DcVerse
  data:
    ref: dc.50.4
    scripture: doctrine-and-covenants
    name: D&C 50:4
    chapter: 50
    verse: 4
    ordinal: 1096
    text: Behold, I, the Lord, have looked upon you, and have seen abominations in the church that profess my name.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.50
- type: DcVerse
  data:
    ref: dc.50.5
    scripture: doctrine-and-covenants
    name: D&C 50:5
    chapter: 50
    verse: 5
    ordinal: 1097
    text: But blessed are they who are faithful and endure, whether in life or in death, for they shall inherit eternal life.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.50
- type: DcVerse
  data:
    ref: dc.50.6
    scripture: doctrine-and-covenants
    name: D&C 50:6
    chapter: 50
    verse: 6
    ordinal: 1098
    text: But wo unto them that are deceivers and hypocrites, for, thus saith the Lord, I will bring them to judgment.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.50
- type: DcVerse
  data:
    ref: dc.50.7
    scripture: doctrine-and-covenants
    name: D&C 50:7
    chapter: 50
    verse: 7
    ordinal: 1099
    text: Behold, verily I say unto you, there are hypocrites among you, who have deceived some, which has given the adversary power; but behold such shall be reclaimed;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.50
- type: DcVerse
  data:
    ref: dc.50.8
    scripture: doctrine-and-covenants
    name: D&C 50:8
    chapter: 50
    verse: 8
    ordinal: 1100
    text: But the hypocrites shall be detected and shall be cut off, either in life or in death, even as I will; and wo unto them who are cut off from my church, for the same are overcome of the world.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.50
- type: DcVerse
  data:
    ref: dc.50.9
    scripture: doctrine-and-covenants
    name: D&C 50:9
    chapter: 50
    verse: 9
    ordinal: 1101
    text: Wherefore, let every man beware lest he do that which is not in truth and righteousness before me.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.50
- type: DcVerse
  data:
    ref: dc.50.10
    scripture: doctrine-and-covenants
    name: D&C 50:10
    chapter: 50
    verse: 10
    ordinal: 1102
    text: And now come, saith the Lord, by the Spirit, unto the elders of his church, and let us reason together, that ye may understand;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.50
- type: DcVerse
  data:
    ref: dc.50.11
    scripture: doctrine-and-covenants
    name: D&C 50:11
    chapter: 50
    verse: 11
    ordinal: 1103
    text: Let us reason even as a man reasoneth one with another face to face.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.50
- type: DcVerse
  data:
    ref: dc.50.12
    scripture: doctrine-and-covenants
    name: D&C 50:12
    chapter: 50
    verse: 12
    ordinal: 1104
    text: Now, when a man reasoneth he is understood of man, because he reasoneth as a man; even so will I, the Lord, reason with you that you may understand.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.50
- type: DcVerse
  data:
    ref: dc.50.13
    scripture: doctrine-and-covenants
    name: D&C 50:13
    chapter: 50
    verse: 13
    ordinal: 1105
    text: Wherefore, I the Lord ask you this question—unto what were ye ordained?
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.50
- type: DcVerse
  data:
    ref: dc.50.14
    scripture: doctrine-and-covenants
    name: D&C 50:14
    chapter: 50
    verse: 14
    ordinal: 1106
    text: To preach my gospel by the Spirit, even the Comforter which was sent forth to teach the truth.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.50
- type: DcVerse
  data:
    ref: dc.50.15
    scripture: doctrine-and-covenants
    name: D&C 50:15
    chapter: 50
    verse: 15
    ordinal: 1107
    text: And then received ye spirits which ye could not understand, and received them to be of God; and in this are ye justified?
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.50
- type: DcVerse
  data:
    ref: dc.50.16
    scripture: doctrine-and-covenants
    name: D&C 50:16
    chapter: 50
    verse: 16
    ordinal: 1108
    text: Behold ye shall answer this question yourselves; nevertheless, I will be merciful unto you; he that is weak among you hereafter shall be made strong.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.50
- type: DcVerse
  data:
    ref: dc.50.17
    scripture: doctrine-and-covenants
    name: D&C 50:17
    chapter: 50
    verse: 17
    ordinal: 1109
    text: Verily I say unto you, he that is ordained of me and sent forth to preach the word of truth by the Comforter, in the Spirit of truth, doth he preach it by the Spirit of truth or some other way?
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.50
- type: DcVerse
  data:
    ref: dc.50.18
    scripture: doctrine-and-covenants
    name: D&C 50:18
    chapter: 50
    verse: 18
    ordinal: 1110
    text: And if it be by some other way it is not of God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.50
- type: DcVerse
  data:
    ref: dc.50.19
    scripture: doctrine-and-covenants
    name: D&C 50:19
    chapter: 50
    verse: 19
    ordinal: 1111
    text: And again, he that receiveth the word of truth, doth he receive it by the Spirit of truth or some other way?
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.50
- type: DcVerse
  data:
    ref: dc.50.20
    scripture: doctrine-and-covenants
    name: D&C 50:20
    chapter: 50
    verse: 20
    ordinal: 1112
    text: If it be some other way it is not of God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.50
- type: DcVerse
  data:
    ref: dc.50.21
    scripture: doctrine-and-covenants
    name: D&C 50:21
    chapter: 50
    verse: 21
    ordinal: 1113
    text: Therefore, why is it that ye cannot understand and know, that he that receiveth the word by the Spirit of truth receiveth it as it is preached by the Spirit of truth?
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.50
- type: DcVerse
  data:
    ref: dc.50.22
    scripture: doctrine-and-covenants
    name: D&C 50:22
    chapter: 50
    verse: 22
    ordinal: 1114
    text: Wherefore, he that preacheth and he that receiveth, understand one another, and both are edified and rejoice together.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.50
- type: DcVerse
  data:
    ref: dc.50.23
    scripture: doctrine-and-covenants
    name: D&C 50:23
    chapter: 50
    verse: 23
    ordinal: 1115
    text: And that which doth not edify is not of God, and is darkness.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.50
- type: DcVerse
  data:
    ref: dc.50.24
    scripture: doctrine-and-covenants
    name: D&C 50:24
    chapter: 50
    verse: 24
    ordinal: 1116
    text: That which is of God is light; and he that receiveth light, and continueth in God, receiveth more light; and that light groweth brighter and brighter until the perfect day.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.50
- type: DcVerse
  data:
    ref: dc.50.25
    scripture: doctrine-and-covenants
    name: D&C 50:25
    chapter: 50
    verse: 25
    ordinal: 1117
    text: And again, verily I say unto you, and I say it that you may know the truth, that you may chase darkness from among you;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.50
- type: DcVerse
  data:
    ref: dc.50.26
    scripture: doctrine-and-covenants
    name: D&C 50:26
    chapter: 50
    verse: 26
    ordinal: 1118
    text: He that is ordained of God and sent forth, the same is appointed to be the greatest, notwithstanding he is the least and the servant of all.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.50
- type: DcVerse
  data:
    ref: dc.50.27
    scripture: doctrine-and-covenants
    name: D&C 50:27
    chapter: 50
    verse: 27
    ordinal: 1119
    text: Wherefore, he is possessor of all things; for all things are subject unto him, both in heaven and on the earth, the life and the light, the Spirit and the power, sent forth by the will of the Father through Jesus Christ, his Son.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.50
- type: DcVerse
  data:
    ref: dc.50.28
    scripture: doctrine-and-covenants
    name: D&C 50:28
    chapter: 50
    verse: 28
    ordinal: 1120
    text: But no man is possessor of all things except he be purified and cleansed from all sin.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.50
- type: DcVerse
  data:
    ref: dc.50.29
    scripture: doctrine-and-covenants
    name: D&C 50:29
    chapter: 50
    verse: 29
    ordinal: 1121
    text: And if ye are purified and cleansed from all sin, ye shall ask whatsoever you will in the name of Jesus and it shall be done.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.50
- type: DcVerse
  data:
    ref: dc.50.30
    scripture: doctrine-and-covenants
    name: D&C 50:30
    chapter: 50
    verse: 30
    ordinal: 1122
    text: But know this, it shall be given you what you shall ask; and as ye are appointed to the head, the spirits shall be subject unto you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.50
- type: DcVerse
  data:
    ref: dc.50.31
    scripture: doctrine-and-covenants
    name: D&C 50:31
    chapter: 50
    verse: 31
    ordinal: 1123
    text: Wherefore, it shall come to pass, that if you behold a spirit manifested that you cannot understand, and you receive not that spirit, ye shall ask of the Father in the name of Jesus; and if he give not unto you that spirit, then you may know that it is not of God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.50
- type: DcVerse
  data:
    ref: dc.50.32
    scripture: doctrine-and-covenants
    name: D&C 50:32
    chapter: 50
    verse: 32
    ordinal: 1124
    text: And it shall be given unto you, power over that spirit; and you shall proclaim against that spirit with a loud voice that it is not of God—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.50
- type: DcVerse
  data:
    ref: dc.50.33
    scripture: doctrine-and-covenants
    name: D&C 50:33
    chapter: 50
    verse: 33
    ordinal: 1125
    text: Not with railing accusation, that ye be not overcome, neither with boasting nor rejoicing, lest you be seized therewith.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.50
- type: DcVerse
  data:
    ref: dc.50.34
    scripture: doctrine-and-covenants
    name: D&C 50:34
    chapter: 50
    verse: 34
    ordinal: 1126
    text: He that receiveth of God, let him account it of God; and let him rejoice that he is accounted of God worthy to receive.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.50
- type: DcVerse
  data:
    ref: dc.50.35
    scripture: doctrine-and-covenants
    name: D&C 50:35
    chapter: 50
    verse: 35
    ordinal: 1127
    text: And by giving heed and doing these things which ye have received, and which ye shall hereafter receive—and the kingdom is given you of the Father, and power to overcome all things which are not ordained of him—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.50
- type: DcVerse
  data:
    ref: dc.50.36
    scripture: doctrine-and-covenants
    name: D&C 50:36
    chapter: 50
    verse: 36
    ordinal: 1128
    text: And behold, verily I say unto you, blessed are you who are now hearing these words of mine from the mouth of my servant, for your sins are forgiven you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.50
- type: DcVerse
  data:
    ref: dc.50.37
    scripture: doctrine-and-covenants
    name: D&C 50:37
    chapter: 50
    verse: 37
    ordinal: 1129
    text: Let my servant Joseph Wakefield, in whom I am well pleased, and my servant Parley P. Pratt go forth among the churches and strengthen them by the word of exhortation;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.50
- type: DcVerse
  data:
    ref: dc.50.38
    scripture: doctrine-and-covenants
    name: D&C 50:38
    chapter: 50
    verse: 38
    ordinal: 1130
    text: And also my servant John Corrill, or as many of my servants as are ordained unto this office, and let them labor in the vineyard; and let no man hinder them doing that which I have appointed unto them—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.50
- type: DcVerse
  data:
    ref: dc.50.39
    scripture: doctrine-and-covenants
    name: D&C 50:39
    chapter: 50
    verse: 39
    ordinal: 1131
    text: Wherefore, in this thing my servant Edward Partridge is not justified; nevertheless let him repent and he shall be forgiven.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.50
- type: DcVerse
  data:
    ref: dc.50.40
    scripture: doctrine-and-covenants
    name: D&C 50:40
    chapter: 50
    verse: 40
    ordinal: 1132
    text: Behold, ye are little children and ye cannot bear all things now; ye must grow in grace and in the knowledge of the truth.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.50
- type: DcVerse
  data:
    ref: dc.50.41
    scripture: doctrine-and-covenants
    name: D&C 50:41
    chapter: 50
    verse: 41
    ordinal: 1133
    text: Fear not, little children, for you are mine, and I have overcome the world, and you are of them that my Father hath given me;
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - 1 John 4:4
    kjvAllusionOsis:
    - 1John.4.4
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.50
- type: DcVerse
  data:
    ref: dc.50.42
    scripture: doctrine-and-covenants
    name: D&C 50:42
    chapter: 50
    verse: 42
    ordinal: 1134
    text: And none of them that my Father hath given me shall be lost.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.50
- type: DcVerse
  data:
    ref: dc.50.43
    scripture: doctrine-and-covenants
    name: D&C 50:43
    chapter: 50
    verse: 43
    ordinal: 1135
    text: And the Father and I are one. I am in the Father and the Father in me; and inasmuch as ye have received me, ye are in me and I in you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.50
- type: DcVerse
  data:
    ref: dc.50.44
    scripture: doctrine-and-covenants
    name: D&C 50:44
    chapter: 50
    verse: 44
    ordinal: 1136
    text: Wherefore, I am in your midst, and I am the good shepherd, and the stone of Israel. He that buildeth upon this rock shall never fall.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.50
- type: DcVerse
  data:
    ref: dc.50.45
    scripture: doctrine-and-covenants
    name: D&C 50:45
    chapter: 50
    verse: 45
    ordinal: 1137
    text: And the day cometh that you shall hear my voice and see me, and know that I am.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.50
- type: DcVerse
  data:
    ref: dc.50.46
    scripture: doctrine-and-covenants
    name: D&C 50:46
    chapter: 50
    verse: 46
    ordinal: 1138
    text: Watch, therefore, that ye may be ready. Even so. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.50
- type: DcVerse
  data:
    ref: dc.51.1
    scripture: doctrine-and-covenants
    name: D&C 51:1
    chapter: 51
    verse: 1
    ordinal: 1139
    text: Hearken unto me, saith the Lord your God, and I will speak unto my servant Edward Partridge, and give unto him directions; for it must needs be that he receive directions how to organize this people.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.51
- type: DcVerse
  data:
    ref: dc.51.2
    scripture: doctrine-and-covenants
    name: D&C 51:2
    chapter: 51
    verse: 2
    ordinal: 1140
    text: For it must needs be that they be organized according to my laws; if otherwise, they will be cut off.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.51
- type: DcVerse
  data:
    ref: dc.51.3
    scripture: doctrine-and-covenants
    name: D&C 51:3
    chapter: 51
    verse: 3
    ordinal: 1141
    text: Wherefore, let my servant Edward Partridge, and those whom he has chosen, in whom I am well pleased, appoint unto this people their portions, every man equal according to his family, according to his circumstances and his wants and needs.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.51
- type: DcVerse
  data:
    ref: dc.51.4
    scripture: doctrine-and-covenants
    name: D&C 51:4
    chapter: 51
    verse: 4
    ordinal: 1142
    text: And let my servant Edward Partridge, when he shall appoint a man his portion, give unto him a writing that shall secure unto him his portion, that he shall hold it, even this right and this inheritance in the church, until he transgresses and is not accounted worthy by the voice of the church, according to the laws and covenants of the church, to belong to the church.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.51
- type: DcVerse
  data:
    ref: dc.51.5
    scripture: doctrine-and-covenants
    name: D&C 51:5
    chapter: 51
    verse: 5
    ordinal: 1143
    text: And if he shall transgress and is not accounted worthy to belong to the church, he shall not have power to claim that portion which he has consecrated unto the bishop for the poor and needy of my church; therefore, he shall not retain the gift, but shall only have claim on that portion that is deeded unto him.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.51
- type: DcVerse
  data:
    ref: dc.51.6
    scripture: doctrine-and-covenants
    name: D&C 51:6
    chapter: 51
    verse: 6
    ordinal: 1144
    text: And thus all things shall be made sure, according to the laws of the land.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.51
- type: DcVerse
  data:
    ref: dc.51.7
    scripture: doctrine-and-covenants
    name: D&C 51:7
    chapter: 51
    verse: 7
    ordinal: 1145
    text: And let that which belongs to this people be appointed unto this people.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.51
- type: DcVerse
  data:
    ref: dc.51.8
    scripture: doctrine-and-covenants
    name: D&C 51:8
    chapter: 51
    verse: 8
    ordinal: 1146
    text: And the money which is left unto this people—let there be an agent appointed unto this people, to take the money to provide food and raiment, according to the wants of this people.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.51
- type: DcVerse
  data:
    ref: dc.51.9
    scripture: doctrine-and-covenants
    name: D&C 51:9
    chapter: 51
    verse: 9
    ordinal: 1147
    text: And let every man deal honestly, and be alike among this people, and receive alike, that ye may be one, even as I have commanded you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.51
- type: DcVerse
  data:
    ref: dc.51.10
    scripture: doctrine-and-covenants
    name: D&C 51:10
    chapter: 51
    verse: 10
    ordinal: 1148
    text: And let that which belongeth to this people not be taken and given unto that of another church.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.51
- type: DcVerse
  data:
    ref: dc.51.11
    scripture: doctrine-and-covenants
    name: D&C 51:11
    chapter: 51
    verse: 11
    ordinal: 1149
    text: Wherefore, if another church would receive money of this church, let them pay unto this church again according as they shall agree;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.51
- type: DcVerse
  data:
    ref: dc.51.12
    scripture: doctrine-and-covenants
    name: D&C 51:12
    chapter: 51
    verse: 12
    ordinal: 1150
    text: And this shall be done through the bishop or the agent, which shall be appointed by the voice of the church.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.51
- type: DcVerse
  data:
    ref: dc.51.13
    scripture: doctrine-and-covenants
    name: D&C 51:13
    chapter: 51
    verse: 13
    ordinal: 1151
    text: And again, let the bishop appoint a storehouse unto this church; and let all things both in money and in meat, which are more than is needful for the wants of this people, be kept in the hands of the bishop.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.51
- type: DcVerse
  data:
    ref: dc.51.14
    scripture: doctrine-and-covenants
    name: D&C 51:14
    chapter: 51
    verse: 14
    ordinal: 1152
    text: And let him also reserve unto himself for his own wants, and for the wants of his family, as he shall be employed in doing this business.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.51
- type: DcVerse
  data:
    ref: dc.51.15
    scripture: doctrine-and-covenants
    name: D&C 51:15
    chapter: 51
    verse: 15
    ordinal: 1153
    text: And thus I grant unto this people a privilege of organizing themselves according to my laws.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.51
- type: DcVerse
  data:
    ref: dc.51.16
    scripture: doctrine-and-covenants
    name: D&C 51:16
    chapter: 51
    verse: 16
    ordinal: 1154
    text: And I consecrate unto them this land for a little season, until I, the Lord, shall provide for them otherwise, and command them to go hence;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.51
- type: DcVerse
  data:
    ref: dc.51.17
    scripture: doctrine-and-covenants
    name: D&C 51:17
    chapter: 51
    verse: 17
    ordinal: 1155
    text: And the hour and the day is not given unto them, wherefore let them act upon this land as for years, and this shall turn unto them for their good.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.51
- type: DcVerse
  data:
    ref: dc.51.18
    scripture: doctrine-and-covenants
    name: D&C 51:18
    chapter: 51
    verse: 18
    ordinal: 1156
    text: Behold, this shall be an example unto my servant Edward Partridge, in other places, in all churches.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.51
- type: DcVerse
  data:
    ref: dc.51.19
    scripture: doctrine-and-covenants
    name: D&C 51:19
    chapter: 51
    verse: 19
    ordinal: 1157
    text: And whoso is found a faithful, a just, and a wise steward shall enter into the joy of his Lord, and shall inherit eternal life.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.51
- type: DcVerse
  data:
    ref: dc.51.20
    scripture: doctrine-and-covenants
    name: D&C 51:20
    chapter: 51
    verse: 20
    ordinal: 1158
    text: Verily, I say unto you, I am Jesus Christ, who cometh quickly, in an hour you think not. Even so. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.51
- type: DcVerse
  data:
    ref: dc.52.1
    scripture: doctrine-and-covenants
    name: D&C 52:1
    chapter: 52
    verse: 1
    ordinal: 1159
    text: Behold, thus saith the Lord unto the elders whom he hath called and chosen in these last days, by the voice of his Spirit—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.52
- type: DcVerse
  data:
    ref: dc.52.2
    scripture: doctrine-and-covenants
    name: D&C 52:2
    chapter: 52
    verse: 2
    ordinal: 1160
    text: 'Saying: I, the Lord, will make known unto you what I will that ye shall do from this time until the next conference, which shall be held in Missouri, upon the land which I will consecrate unto my people, which are a remnant of Jacob, and those who are heirs according to the covenant.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.52
- type: DcVerse
