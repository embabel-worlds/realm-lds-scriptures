    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.18
- type: DcVerse
  data:
    ref: dc.18.42
    scripture: doctrine-and-covenants
    name: D&C 18:42
    chapter: 18
    verse: 42
    ordinal: 359
