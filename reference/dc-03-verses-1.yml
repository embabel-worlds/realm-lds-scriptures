    name: D&C 19:2
    chapter: 19
    verse: 2
    ordinal: 366
    text: I, having accomplished and finished the will of him whose I am, even the Father, concerning me—having done this that I might subdue all things unto myself—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.19
- type: DcVerse
  data:
    ref: dc.19.3
    scripture: doctrine-and-covenants
    name: D&C 19:3
    chapter: 19
    verse: 3
    ordinal: 367
    text: Retaining all power, even to the destroying of Satan and his works at the end of the world, and the last great day of judgment, which I shall pass upon the inhabitants thereof, judging every man according to his works and the deeds which he hath done.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.19
- type: DcVerse
  data:
    ref: dc.19.4
    scripture: doctrine-and-covenants
    name: D&C 19:4
    chapter: 19
    verse: 4
    ordinal: 368
    text: And surely every man must repent or suffer, for I, God, am endless.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.19
- type: DcVerse
  data:
    ref: dc.19.5
    scripture: doctrine-and-covenants
    name: D&C 19:5
    chapter: 19
    verse: 5
    ordinal: 369
    text: Wherefore, I revoke not the judgments which I shall pass, but woes shall go forth, weeping, wailing and gnashing of teeth, yea, to those who are found on my left hand.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.19
- type: DcVerse
  data:
    ref: dc.19.6
    scripture: doctrine-and-covenants
    name: D&C 19:6
    chapter: 19
    verse: 6
    ordinal: 370
    text: Nevertheless, it is not written that there shall be no end to this torment, but it is written endless torment.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.19
- type: DcVerse
  data:
    ref: dc.19.7
    scripture: doctrine-and-covenants
    name: D&C 19:7
    chapter: 19
    verse: 7
    ordinal: 371
    text: Again, it is written eternal damnation; wherefore it is more express than other scriptures, that it might work upon the hearts of the children of men, altogether for my name's glory.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.19
- type: DcVerse
  data:
    ref: dc.19.8
    scripture: doctrine-and-covenants
    name: D&C 19:8
    chapter: 19
    verse: 8
    ordinal: 372
    text: Wherefore, I will explain unto you this mystery, for it is meet unto you to know even as mine apostles.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.19
- type: DcVerse
  data:
    ref: dc.19.9
    scripture: doctrine-and-covenants
    name: D&C 19:9
    chapter: 19
    verse: 9
    ordinal: 373
    text: I speak unto you that are chosen in this thing, even as one, that you may enter into my rest.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.19
- type: DcVerse
  data:
    ref: dc.19.10
    scripture: doctrine-and-covenants
    name: D&C 19:10
    chapter: 19
    verse: 10
    ordinal: 374
    text: For, behold, the mystery of godliness, how great is it! For, behold, I am endless, and the punishment which is given from my hand is endless punishment, for Endless is my name. Wherefore—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.19
- type: DcVerse
  data:
    ref: dc.19.11
    scripture: doctrine-and-covenants
    name: D&C 19:11
    chapter: 19
    verse: 11
    ordinal: 375
    text: Eternal punishment is God's punishment.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.19
- type: DcVerse
  data:
    ref: dc.19.12
    scripture: doctrine-and-covenants
    name: D&C 19:12
    chapter: 19
    verse: 12
    ordinal: 376
    text: Endless punishment is God's punishment.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.19
- type: DcVerse
  data:
    ref: dc.19.13
    scripture: doctrine-and-covenants
    name: D&C 19:13
    chapter: 19
    verse: 13
    ordinal: 377
    text: Wherefore, I command you to repent, and keep the commandments which you have received by the hand of my servant Joseph Smith, Jun., in my name;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.19
- type: DcVerse
  data:
    ref: dc.19.14
    scripture: doctrine-and-covenants
    name: D&C 19:14
    chapter: 19
    verse: 14
    ordinal: 378
    text: And it is by my almighty power that you have received them;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.19
- type: DcVerse
  data:
    ref: dc.19.15
    scripture: doctrine-and-covenants
    name: D&C 19:15
    chapter: 19
    verse: 15
    ordinal: 379
    text: Therefore I command you to repent—repent, lest I smite you by the rod of my mouth, and by my wrath, and by my anger, and your sufferings be sore—how sore you know not, how exquisite you know not, yea, how hard to bear you know not.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.19
- type: DcVerse
  data:
    ref: dc.19.16
    scripture: doctrine-and-covenants
    name: D&C 19:16
    chapter: 19
    verse: 16
    ordinal: 380
    text: For behold, I, God, have suffered these things for all, that they might not suffer if they would repent;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.19
- type: DcVerse
  data:
    ref: dc.19.17
    scripture: doctrine-and-covenants
    name: D&C 19:17
    chapter: 19
    verse: 17
    ordinal: 381
    text: But if they would not repent they must suffer even as I;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.19
- type: DcVerse
  data:
    ref: dc.19.18
    scripture: doctrine-and-covenants
    name: D&C 19:18
    chapter: 19
    verse: 18
    ordinal: 382
    text: Which suffering caused myself, even God, the greatest of all, to tremble because of pain, and to bleed at every pore, and to suffer both body and spirit—and would that I might not drink the bitter cup, and shrink—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.19
- type: DcVerse
  data:
    ref: dc.19.19
    scripture: doctrine-and-covenants
    name: D&C 19:19
    chapter: 19
    verse: 19
    ordinal: 383
    text: Nevertheless, glory be to the Father, and I partook and finished my preparations unto the children of men.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.19
- type: DcVerse
  data:
    ref: dc.19.20
    scripture: doctrine-and-covenants
    name: D&C 19:20
    chapter: 19
    verse: 20
    ordinal: 384
    text: Wherefore, I command you again to repent, lest I humble you with my almighty power; and that you confess your sins, lest you suffer these punishments of which I have spoken, of which in the smallest, yea, even in the least degree you have tasted at the time I withdrew my Spirit.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.19
- type: DcVerse
  data:
    ref: dc.19.21
    scripture: doctrine-and-covenants
    name: D&C 19:21
    chapter: 19
    verse: 21
    ordinal: 385
    text: And I command you that you preach naught but repentance, and show not these things unto the world until it is wisdom in me.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.19
- type: DcVerse
  data:
    ref: dc.19.22
    scripture: doctrine-and-covenants
    name: D&C 19:22
    chapter: 19
    verse: 22
    ordinal: 386
    text: For they cannot bear meat now, but milk they must receive; wherefore, they must not know these things, lest they perish.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.19
- type: DcVerse
  data:
    ref: dc.19.23
    scripture: doctrine-and-covenants
    name: D&C 19:23
    chapter: 19
    verse: 23
    ordinal: 387
    text: Learn of me, and listen to my words; walk in the meekness of my Spirit, and you shall have peace in me.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.19
- type: DcVerse
  data:
    ref: dc.19.24
    scripture: doctrine-and-covenants
    name: D&C 19:24
    chapter: 19
    verse: 24
    ordinal: 388
    text: I am Jesus Christ; I came by the will of the Father, and I do his will.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.19
- type: DcVerse
  data:
    ref: dc.19.25
    scripture: doctrine-and-covenants
    name: D&C 19:25
    chapter: 19
    verse: 25
    ordinal: 389
    text: And again, I command thee that thou shalt not covet thy neighbor's wife; nor seek thy neighbor's life.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.19
- type: DcVerse
  data:
    ref: dc.19.26
    scripture: doctrine-and-covenants
    name: D&C 19:26
    chapter: 19
    verse: 26
    ordinal: 390
    text: And again, I command thee that thou shalt not covet thine own property, but impart it freely to the printing of the Book of Mormon, which contains the truth and the word of God—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.19
- type: DcVerse
  data:
    ref: dc.19.27
    scripture: doctrine-and-covenants
    name: D&C 19:27
    chapter: 19
    verse: 27
    ordinal: 391
    text: Which is my word to the Gentile, that soon it may go to the Jew, of whom the Lamanites are a remnant, that they may believe the gospel, and look not for a Messiah to come who has already come.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.19
- type: DcVerse
  data:
    ref: dc.19.28
    scripture: doctrine-and-covenants
    name: D&C 19:28
    chapter: 19
    verse: 28
    ordinal: 392
    text: And again, I command thee that thou shalt pray vocally as well as in thy heart; yea, before the world as well as in secret, in public as well as in private.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.19
- type: DcVerse
  data:
    ref: dc.19.29
    scripture: doctrine-and-covenants
    name: D&C 19:29
    chapter: 19
    verse: 29
    ordinal: 393
    text: And thou shalt declare glad tidings, yea, publish it upon the mountains, and upon every high place, and among every people that thou shalt be permitted to see.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.19
- type: DcVerse
  data:
    ref: dc.19.30
    scripture: doctrine-and-covenants
    name: D&C 19:30
    chapter: 19
    verse: 30
    ordinal: 394
    text: And thou shalt do it with all humility, trusting in me, reviling not against revilers.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.19
- type: DcVerse
  data:
    ref: dc.19.31
    scripture: doctrine-and-covenants
    name: D&C 19:31
    chapter: 19
    verse: 31
    ordinal: 395
    text: And of tenets thou shalt not talk, but thou shalt declare repentance and faith on the Savior, and remission of sins by baptism, and by fire, yea, even the Holy Ghost.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.19
- type: DcVerse
  data:
    ref: dc.19.32
    scripture: doctrine-and-covenants
    name: D&C 19:32
    chapter: 19
    verse: 32
    ordinal: 396
    text: Behold, this is a great and the last commandment which I shall give unto you concerning this matter; for this shall suffice for thy daily walk, even unto the end of thy life.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.19
- type: DcVerse
  data:
    ref: dc.19.33
    scripture: doctrine-and-covenants
    name: D&C 19:33
    chapter: 19
    verse: 33
    ordinal: 397
    text: And misery thou shalt receive if thou wilt slight these counsels, yea, even the destruction of thyself and property.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.19
- type: DcVerse
  data:
    ref: dc.19.34
    scripture: doctrine-and-covenants
    name: D&C 19:34
    chapter: 19
    verse: 34
    ordinal: 398
    text: Impart a portion of thy property, yea, even part of thy lands, and all save the support of thy family.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.19
- type: DcVerse
  data:
    ref: dc.19.35
    scripture: doctrine-and-covenants
    name: D&C 19:35
    chapter: 19
    verse: 35
    ordinal: 399
    text: Pay the debt thou hast contracted with the printer. Release thyself from bondage.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.19
- type: DcVerse
  data:
    ref: dc.19.36
    scripture: doctrine-and-covenants
    name: D&C 19:36
    chapter: 19
    verse: 36
    ordinal: 400
    text: Leave thy house and home, except when thou shalt desire to see thy family;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.19
- type: DcVerse
  data:
    ref: dc.19.37
    scripture: doctrine-and-covenants
    name: D&C 19:37
    chapter: 19
    verse: 37
    ordinal: 401
    text: And speak freely to all; yea, preach, exhort, declare the truth, even with a loud voice, with a sound of rejoicing, crying—Hosanna, hosanna, blessed be the name of the Lord God!
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.19
- type: DcVerse
  data:
    ref: dc.19.38
    scripture: doctrine-and-covenants
    name: D&C 19:38
    chapter: 19
    verse: 38
    ordinal: 402
    text: Pray always, and I will pour out my Spirit upon you, and great shall be your blessing—yea, even more than if you should obtain treasures of earth and corruptibleness to the extent thereof.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.19
- type: DcVerse
  data:
    ref: dc.19.39
    scripture: doctrine-and-covenants
    name: D&C 19:39
    chapter: 19
    verse: 39
    ordinal: 403
    text: Behold, canst thou read this without rejoicing and lifting up thy heart for gladness?
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.19
- type: DcVerse
  data:
    ref: dc.19.40
    scripture: doctrine-and-covenants
    name: D&C 19:40
    chapter: 19
    verse: 40
    ordinal: 404
    text: Or canst thou run about longer as a blind guide?
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.19
- type: DcVerse
  data:
    ref: dc.19.41
    scripture: doctrine-and-covenants
    name: D&C 19:41
    chapter: 19
    verse: 41
    ordinal: 405
    text: Or canst thou be humble and meek, and conduct thyself wisely before me? Yea, come unto me thy Savior. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.19
- type: DcVerse
  data:
    ref: dc.20.1
    scripture: doctrine-and-covenants
    name: D&C 20:1
    chapter: 20
    verse: 1
    ordinal: 406
    text: The rise of the Church of Christ in these last days, being one thousand eight hundred and thirty years since the coming of our Lord and Savior Jesus Christ in the flesh, it being regularly organized and established agreeable to the laws of our country, by the will and commandments of God, in the fourth month, and on the sixth day of the month which is called April—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.2
    scripture: doctrine-and-covenants
    name: D&C 20:2
    chapter: 20
    verse: 2
    ordinal: 407
    text: Which commandments were given to Joseph Smith, Jun., who was called of God, and ordained an apostle of Jesus Christ, to be the first elder of this church;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.3
    scripture: doctrine-and-covenants
    name: D&C 20:3
    chapter: 20
    verse: 3
    ordinal: 408
    text: And to Oliver Cowdery, who was also called of God, an apostle of Jesus Christ, to be the second elder of this church, and ordained under his hand;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.4
    scripture: doctrine-and-covenants
    name: D&C 20:4
    chapter: 20
    verse: 4
    ordinal: 409
    text: And this according to the grace of our Lord and Savior Jesus Christ, to whom be all glory, both now and forever. Amen.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Revelation 22:21
    kjvAllusionOsis:
    - Rev.22.21
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.5
    scripture: doctrine-and-covenants
    name: D&C 20:5
    chapter: 20
    verse: 5
    ordinal: 410
    text: After it was truly manifested unto this first elder that he had received a remission of his sins, he was entangled again in the vanities of the world;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.6
    scripture: doctrine-and-covenants
    name: D&C 20:6
    chapter: 20
    verse: 6
    ordinal: 411
    text: But after repenting, and humbling himself sincerely, through faith, God ministered unto him by an holy angel, whose countenance was as lightning, and whose garments were pure and white above all other whiteness;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.7
    scripture: doctrine-and-covenants
    name: D&C 20:7
    chapter: 20
    verse: 7
    ordinal: 412
    text: And gave unto him commandments which inspired him;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.8
    scripture: doctrine-and-covenants
    name: D&C 20:8
    chapter: 20
    verse: 8
    ordinal: 413
    text: And gave him power from on high, by the means which were before prepared, to translate the Book of Mormon;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.9
    scripture: doctrine-and-covenants
    name: D&C 20:9
    chapter: 20
    verse: 9
    ordinal: 414
    text: Which contains a record of a fallen people, and the fulness of the gospel of Jesus Christ to the Gentiles and to the Jews also;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.10
    scripture: doctrine-and-covenants
    name: D&C 20:10
    chapter: 20
    verse: 10
    ordinal: 415
    text: Which was given by inspiration, and is confirmed to others by the ministering of angels, and is declared unto the world by them—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.11
    scripture: doctrine-and-covenants
    name: D&C 20:11
    chapter: 20
    verse: 11
    ordinal: 416
    text: Proving to the world that the holy scriptures are true, and that God does inspire men and call them to his holy work in this age and generation, as well as in generations of old;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.12
    scripture: doctrine-and-covenants
    name: D&C 20:12
    chapter: 20
    verse: 12
    ordinal: 417
    text: Thereby showing that he is the same God yesterday, today, and forever. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.13
    scripture: doctrine-and-covenants
    name: D&C 20:13
    chapter: 20
    verse: 13
    ordinal: 418
    text: Therefore, having so great witnesses, by them shall the world be judged, even as many as shall hereafter come to a knowledge of this work.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.14
    scripture: doctrine-and-covenants
    name: D&C 20:14
    chapter: 20
    verse: 14
    ordinal: 419
    text: And those who receive it in faith, and work righteousness, shall receive a crown of eternal life;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.15
    scripture: doctrine-and-covenants
    name: D&C 20:15
    chapter: 20
    verse: 15
    ordinal: 420
    text: But those who harden their hearts in unbelief, and reject it, it shall turn to their own condemnation—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.16
    scripture: doctrine-and-covenants
    name: D&C 20:16
    chapter: 20
    verse: 16
    ordinal: 421
    text: For the Lord God has spoken it; and we, the elders of the church, have heard and bear witness to the words of the glorious Majesty on high, to whom be glory forever and ever. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.17
    scripture: doctrine-and-covenants
    name: D&C 20:17
    chapter: 20
    verse: 17
    ordinal: 422
    text: By these things we know that there is a God in heaven, who is infinite and eternal, from everlasting to everlasting the same unchangeable God, the framer of heaven and earth, and all things which are in them;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.18
    scripture: doctrine-and-covenants
    name: D&C 20:18
    chapter: 20
    verse: 18
    ordinal: 423
    text: And that he created man, male and female, after his own image and in his own likeness, created he them;
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Genesis 1:27
    kjvOsis:
    - Gen.1.27
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.19
    scripture: doctrine-and-covenants
    name: D&C 20:19
    chapter: 20
    verse: 19
    ordinal: 424
    text: And gave unto them commandments that they should love and serve him, the only living and true God, and that he should be the only being whom they should worship.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.20
    scripture: doctrine-and-covenants
    name: D&C 20:20
    chapter: 20
    verse: 20
    ordinal: 425
    text: But by the transgression of these holy laws man became sensual and devilish, and became fallen man.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.21
    scripture: doctrine-and-covenants
    name: D&C 20:21
    chapter: 20
    verse: 21
    ordinal: 426
    text: Wherefore, the Almighty God gave his Only Begotten Son, as it is written in those scriptures which have been given of him.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.22
    scripture: doctrine-and-covenants
    name: D&C 20:22
    chapter: 20
    verse: 22
    ordinal: 427
    text: He suffered temptations but gave no heed unto them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.23
    scripture: doctrine-and-covenants
    name: D&C 20:23
    chapter: 20
    verse: 23
    ordinal: 428
    text: He was crucified, died, and rose again the third day;
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - 1 Corinthians 15:4
    kjvAllusionOsis:
    - 1Cor.15.4
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.24
    scripture: doctrine-and-covenants
    name: D&C 20:24
    chapter: 20
    verse: 24
    ordinal: 429
    text: And ascended into heaven, to sit down on the right hand of the Father, to reign with almighty power according to the will of the Father;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.25
    scripture: doctrine-and-covenants
    name: D&C 20:25
    chapter: 20
    verse: 25
    ordinal: 430
    text: That as many as would believe and be baptized in his holy name, and endure in faith to the end, should be saved—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.26
    scripture: doctrine-and-covenants
    name: D&C 20:26
    chapter: 20
    verse: 26
    ordinal: 431
    text: Not only those who believed after he came in the meridian of time, in the flesh, but all those from the beginning, even as many as were before he came, who believed in the words of the holy prophets, who spake as they were inspired by the gift of the Holy Ghost, who truly testified of him in all things, should have eternal life,
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.27
    scripture: doctrine-and-covenants
    name: D&C 20:27
    chapter: 20
    verse: 27
    ordinal: 432
    text: As well as those who should come after, who should believe in the gifts and callings of God by the Holy Ghost, which beareth record of the Father and of the Son;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.28
    scripture: doctrine-and-covenants
    name: D&C 20:28
    chapter: 20
    verse: 28
    ordinal: 433
    text: Which Father, Son, and Holy Ghost are one God, infinite and eternal, without end. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.29
    scripture: doctrine-and-covenants
    name: D&C 20:29
    chapter: 20
    verse: 29
    ordinal: 434
    text: And we know that all men must repent and believe on the name of Jesus Christ, and worship the Father in his name, and endure in faith on his name to the end, or they cannot be saved in the kingdom of God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.30
    scripture: doctrine-and-covenants
    name: D&C 20:30
    chapter: 20
    verse: 30
    ordinal: 435
    text: And we know that justification through the grace of our Lord and Savior Jesus Christ is just and true;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.31
    scripture: doctrine-and-covenants
    name: D&C 20:31
    chapter: 20
    verse: 31
    ordinal: 436
    text: And we know also, that sanctification through the grace of our Lord and Savior Jesus Christ is just and true, to all those who love and serve God with all their mights, minds, and strength.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.32
    scripture: doctrine-and-covenants
    name: D&C 20:32
    chapter: 20
    verse: 32
    ordinal: 437
    text: But there is a possibility that man may fall from grace and depart from the living God;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.33
    scripture: doctrine-and-covenants
    name: D&C 20:33
    chapter: 20
    verse: 33
    ordinal: 438
    text: Therefore let the church take heed and pray always, lest they fall into temptation;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.34
    scripture: doctrine-and-covenants
    name: D&C 20:34
    chapter: 20
    verse: 34
    ordinal: 439
    text: Yea, and even let those who are sanctified take heed also.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.35
    scripture: doctrine-and-covenants
    name: D&C 20:35
    chapter: 20
    verse: 35
    ordinal: 440
    text: And we know that these things are true and according to the revelations of John, neither adding to, nor diminishing from the prophecy of his book, the holy scriptures, or the revelations of God which shall come hereafter by the gift and power of the Holy Ghost, the voice of God, or the ministering of angels.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.36
    scripture: doctrine-and-covenants
    name: D&C 20:36
    chapter: 20
    verse: 36
    ordinal: 441
    text: And the Lord God has spoken it; and honor, power and glory be rendered to his holy name, both now and ever. Amen.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Jude 1:25
    kjvAllusionOsis:
    - Jude.1.25
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.37
    scripture: doctrine-and-covenants
    name: D&C 20:37
    chapter: 20
    verse: 37
    ordinal: 442
    text: And again, by way of commandment to the church concerning the manner of baptism—All those who humble themselves before God, and desire to be baptized, and come forth with broken hearts and contrite spirits, and witness before the church that they have truly repented of all their sins, and are willing to take upon them the name of Jesus Christ, having a determination to serve him to the end, and truly manifest by their works that they have received of the Spirit of Christ unto the remission of their sins, shall be received by baptism into his church.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.38
    scripture: doctrine-and-covenants
    name: D&C 20:38
    chapter: 20
    verse: 38
    ordinal: 443
    text: The duty of the elders, priests, teachers, deacons, and members of the church of Christ—An apostle is an elder, and it is his calling to baptize;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.39
    scripture: doctrine-and-covenants
    name: D&C 20:39
    chapter: 20
    verse: 39
    ordinal: 444
    text: And to ordain other elders, priests, teachers, and deacons;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.40
    scripture: doctrine-and-covenants
    name: D&C 20:40
    chapter: 20
    verse: 40
    ordinal: 445
    text: And to administer bread and wine—the emblems of the flesh and blood of Christ—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.41
    scripture: doctrine-and-covenants
    name: D&C 20:41
    chapter: 20
    verse: 41
    ordinal: 446
    text: And to confirm those who are baptized into the church, by the laying on of hands for the baptism of fire and the Holy Ghost, according to the scriptures;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.42
    scripture: doctrine-and-covenants
    name: D&C 20:42
    chapter: 20
    verse: 42
    ordinal: 447
    text: And to teach, expound, exhort, baptize, and watch over the church;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.43
    scripture: doctrine-and-covenants
    name: D&C 20:43
    chapter: 20
    verse: 43
    ordinal: 448
    text: And to confirm the church by the laying on of the hands, and the giving of the Holy Ghost;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.44
    scripture: doctrine-and-covenants
    name: D&C 20:44
    chapter: 20
    verse: 44
    ordinal: 449
    text: And to take the lead of all meetings.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.45
    scripture: doctrine-and-covenants
    name: D&C 20:45
    chapter: 20
    verse: 45
    ordinal: 450
    text: The elders are to conduct the meetings as they are led by the Holy Ghost, according to the commandments and revelations of God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.46
    scripture: doctrine-and-covenants
    name: D&C 20:46
    chapter: 20
    verse: 46
    ordinal: 451
    text: The priest's duty is to preach, teach, expound, exhort, and baptize, and administer the sacrament,
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.47
    scripture: doctrine-and-covenants
    name: D&C 20:47
    chapter: 20
    verse: 47
    ordinal: 452
    text: And visit the house of each member, and exhort them to pray vocally and in secret and attend to all family duties.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.48
    scripture: doctrine-and-covenants
    name: D&C 20:48
    chapter: 20
    verse: 48
    ordinal: 453
    text: And he may also ordain other priests, teachers, and deacons.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.49
    scripture: doctrine-and-covenants
    name: D&C 20:49
    chapter: 20
    verse: 49
    ordinal: 454
    text: And he is to take the lead of meetings when there is no elder present;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.50
    scripture: doctrine-and-covenants
    name: D&C 20:50
    chapter: 20
    verse: 50
    ordinal: 455
    text: But when there is an elder present, he is only to preach, teach, expound, exhort, and baptize,
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.51
    scripture: doctrine-and-covenants
    name: D&C 20:51
    chapter: 20
    verse: 51
    ordinal: 456
    text: And visit the house of each member, exhorting them to pray vocally and in secret and attend to all family duties.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.52
    scripture: doctrine-and-covenants
    name: D&C 20:52
    chapter: 20
    verse: 52
    ordinal: 457
    text: In all these duties the priest is to assist the elder if occasion requires.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.53
    scripture: doctrine-and-covenants
    name: D&C 20:53
    chapter: 20
    verse: 53
    ordinal: 458
    text: The teacher's duty is to watch over the church always, and be with and strengthen them;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.54
    scripture: doctrine-and-covenants
    name: D&C 20:54
    chapter: 20
    verse: 54
    ordinal: 459
    text: And see that there is no iniquity in the church, neither hardness with each other, neither lying, backbiting, nor evil speaking;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.55
    scripture: doctrine-and-covenants
    name: D&C 20:55
    chapter: 20
    verse: 55
    ordinal: 460
    text: And see that the church meet together often, and also see that all the members do their duty.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.56
    scripture: doctrine-and-covenants
    name: D&C 20:56
    chapter: 20
    verse: 56
    ordinal: 461
    text: And he is to take the lead of meetings in the absence of the elder or priest—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.57
    scripture: doctrine-and-covenants
    name: D&C 20:57
    chapter: 20
    verse: 57
    ordinal: 462
    text: And is to be assisted always, in all his duties in the church, by the deacons, if occasion requires.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.58
    scripture: doctrine-and-covenants
    name: D&C 20:58
    chapter: 20
    verse: 58
    ordinal: 463
    text: But neither teachers nor deacons have authority to baptize, administer the sacrament, or lay on hands;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.59
    scripture: doctrine-and-covenants
    name: D&C 20:59
    chapter: 20
    verse: 59
    ordinal: 464
    text: They are, however, to warn, expound, exhort, and teach, and invite all to come unto Christ.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.60
    scripture: doctrine-and-covenants
    name: D&C 20:60
    chapter: 20
    verse: 60
    ordinal: 465
    text: Every elder, priest, teacher, or deacon is to be ordained according to the gifts and callings of God unto him; and he is to be ordained by the power of the Holy Ghost, which is in the one who ordains him.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.61
    scripture: doctrine-and-covenants
    name: D&C 20:61
    chapter: 20
    verse: 61
    ordinal: 466
    text: The several elders composing this church of Christ are to meet in conference once in three months, or from time to time as said conferences shall direct or appoint;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.62
    scripture: doctrine-and-covenants
    name: D&C 20:62
    chapter: 20
    verse: 62
    ordinal: 467
    text: And said conferences are to do whatever church business is necessary to be done at the time.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.63
    scripture: doctrine-and-covenants
    name: D&C 20:63
    chapter: 20
    verse: 63
    ordinal: 468
    text: The elders are to receive their licenses from other elders, by vote of the church to which they belong, or from the conferences.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.64
    scripture: doctrine-and-covenants
    name: D&C 20:64
    chapter: 20
    verse: 64
    ordinal: 469
    text: Each priest, teacher, or deacon, who is ordained by a priest, may take a certificate from him at the time, which certificate, when presented to an elder, shall entitle him to a license, which shall authorize him to perform the duties of his calling, or he may receive it from a conference.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.65
    scripture: doctrine-and-covenants
    name: D&C 20:65
    chapter: 20
    verse: 65
    ordinal: 470
    text: No person is to be ordained to any office in this church, where there is a regularly organized branch of the same, without the vote of that church;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.66
    scripture: doctrine-and-covenants
    name: D&C 20:66
    chapter: 20
    verse: 66
    ordinal: 471
    text: But the presiding elders, traveling bishops, high councilors, high priests, and elders, may have the privilege of ordaining, where there is no branch of the church that a vote may be called.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.67
    scripture: doctrine-and-covenants
    name: D&C 20:67
    chapter: 20
    verse: 67
    ordinal: 472
    text: Every president of the high priesthood (or presiding elder), bishop, high councilor, and high priest, is to be ordained by the direction of a high council or general conference.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.68
    scripture: doctrine-and-covenants
    name: D&C 20:68
    chapter: 20
    verse: 68
    ordinal: 473
    text: The duty of the members after they are received by baptism—The elders or priests are to have a sufficient time to expound all things concerning the church of Christ to their understanding, previous to their partaking of the sacrament and being confirmed by the laying on of the hands of the elders, so that all things may be done in order.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.69
    scripture: doctrine-and-covenants
    name: D&C 20:69
    chapter: 20
    verse: 69
    ordinal: 474
    text: And the members shall manifest before the church, and also before the elders, by a godly walk and conversation, that they are worthy of it, that there may be works and faith agreeable to the holy scriptures—walking in holiness before the Lord.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.70
    scripture: doctrine-and-covenants
    name: D&C 20:70
    chapter: 20
    verse: 70
    ordinal: 475
    text: Every member of the church of Christ having children is to bring them unto the elders before the church, who are to lay their hands upon them in the name of Jesus Christ, and bless them in his name.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.71
    scripture: doctrine-and-covenants
    name: D&C 20:71
    chapter: 20
    verse: 71
    ordinal: 476
    text: No one can be received into the church of Christ unless he has arrived unto the years of accountability before God, and is capable of repentance.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.72
    scripture: doctrine-and-covenants
    name: D&C 20:72
    chapter: 20
    verse: 72
    ordinal: 477
    text: Baptism is to be administered in the following manner unto all those who repent—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.73
    scripture: doctrine-and-covenants
    name: D&C 20:73
    chapter: 20
    verse: 73
    ordinal: 478
    text: 'The person who is called of God and has authority from Jesus Christ to baptize, shall go down into the water with the person who has presented himself or herself for baptism, and shall say, calling him or her by name: Having been commissioned of Jesus Christ, I baptize you in the name of the Father, and of the Son, and of the Holy Ghost. Amen.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.74
    scripture: doctrine-and-covenants
    name: D&C 20:74
    chapter: 20
    verse: 74
    ordinal: 479
    text: Then shall he immerse him or her in the water, and come forth again out of the water.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.75
    scripture: doctrine-and-covenants
    name: D&C 20:75
    chapter: 20
    verse: 75
    ordinal: 480
    text: It is expedient that the church meet together often to partake of bread and wine in the remembrance of the Lord Jesus;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.76
    scripture: doctrine-and-covenants
    name: D&C 20:76
    chapter: 20
    verse: 76
    ordinal: 481
    text: 'And the elder or priest shall administer it; and after this manner shall he administer it—he shall kneel with the church and call upon the Father in solemn prayer, saying:'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.77
    scripture: doctrine-and-covenants
    name: D&C 20:77
    chapter: 20
    verse: 77
    ordinal: 482
    text: O God, the Eternal Father, we ask thee in the name of thy Son, Jesus Christ, to bless and sanctify this bread to the souls of all those who partake of it, that they may eat in remembrance of the body of thy Son, and witness unto thee, O God, the Eternal Father, that they are willing to take upon them the name of thy Son, and always remember him and keep his commandments which he has given them; that they may always have his Spirit to be with them. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.78
    scripture: doctrine-and-covenants
    name: D&C 20:78
    chapter: 20
    verse: 78
    ordinal: 483
    text: 'The manner of administering the wine—he shall take the cup also, and say:'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.79
    scripture: doctrine-and-covenants
    name: D&C 20:79
    chapter: 20
    verse: 79
    ordinal: 484
    text: O God, the Eternal Father, we ask thee in the name of thy Son, Jesus Christ, to bless and sanctify this wine to the souls of all those who drink of it, that they may do it in remembrance of the blood of thy Son, which was shed for them; that they may witness unto thee, O God, the Eternal Father, that they do always remember him, that they may have his Spirit to be with them. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.80
    scripture: doctrine-and-covenants
    name: D&C 20:80
    chapter: 20
    verse: 80
    ordinal: 485
    text: Any member of the church of Christ transgressing, or being overtaken in a fault, shall be dealt with as the scriptures direct.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.81
    scripture: doctrine-and-covenants
    name: D&C 20:81
    chapter: 20
    verse: 81
    ordinal: 486
    text: It shall be the duty of the several churches, composing the church of Christ, to send one or more of their teachers to attend the several conferences held by the elders of the church,
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.82
    scripture: doctrine-and-covenants
    name: D&C 20:82
    chapter: 20
    verse: 82
    ordinal: 487
    text: With a list of the names of the several members uniting themselves with the church since the last conference; or send by the hand of some priest; so that a regular list of all the names of the whole church may be kept in a book by one of the elders, whomsoever the other elders shall appoint from time to time;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.83
    scripture: doctrine-and-covenants
    name: D&C 20:83
    chapter: 20
    verse: 83
    ordinal: 488
    text: And also, if any have been expelled from the church, so that their names may be blotted out of the general church record of names.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.20.84
    scripture: doctrine-and-covenants
    name: D&C 20:84
    chapter: 20
    verse: 84
    ordinal: 489
    text: All members removing from the church where they reside, if going to a church where they are not known, may take a letter certifying that they are regular members and in good standing, which certificate may be signed by any elder or priest if the member receiving the letter is personally acquainted with the elder or priest, or it may be signed by the teachers or deacons of the church.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.20
- type: DcVerse
  data:
    ref: dc.21.1
    scripture: doctrine-and-covenants
    name: D&C 21:1
    chapter: 21
    verse: 1
    ordinal: 490
    text: Behold, there shall be a record kept among you; and in it thou shalt be called a seer, a translator, a prophet, an apostle of Jesus Christ, an elder of the church through the will of God the Father, and the grace of your Lord Jesus Christ,
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.21
- type: DcVerse
  data:
    ref: dc.21.2
    scripture: doctrine-and-covenants
    name: D&C 21:2
    chapter: 21
    verse: 2
    ordinal: 491
    text: Being inspired of the Holy Ghost to lay the foundation thereof, and to build it up unto the most holy faith.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.21
- type: DcVerse
  data:
    ref: dc.21.3
    scripture: doctrine-and-covenants
    name: D&C 21:3
    chapter: 21
    verse: 3
    ordinal: 492
    text: Which church was organized and established in the year of your Lord eighteen hundred and thirty, in the fourth month, and on the sixth day of the month which is called April.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.21
- type: DcVerse
  data:
    ref: dc.21.4
    scripture: doctrine-and-covenants
    name: D&C 21:4
    chapter: 21
    verse: 4
    ordinal: 493
    text: Wherefore, meaning the church, thou shalt give heed unto all his words and commandments which he shall give unto you as he receiveth them, walking in all holiness before me;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.21
- type: DcVerse
  data:
    ref: dc.21.5
    scripture: doctrine-and-covenants
    name: D&C 21:5
    chapter: 21
    verse: 5
    ordinal: 494
    text: For his word ye shall receive, as if from mine own mouth, in all patience and faith.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.21
- type: DcVerse
  data:
    ref: dc.21.6
    scripture: doctrine-and-covenants
    name: D&C 21:6
    chapter: 21
    verse: 6
    ordinal: 495
    text: For by doing these things the gates of hell shall not prevail against you; yea, and the Lord God will disperse the powers of darkness from before you, and cause the heavens to shake for your good, and his name's glory.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.21
- type: DcVerse
  data:
    ref: dc.21.7
    scripture: doctrine-and-covenants
    name: D&C 21:7
    chapter: 21
    verse: 7
    ordinal: 496
    text: 'For thus saith the Lord God: Him have I inspired to move the cause of Zion in mighty power for good, and his diligence I know, and his prayers I have heard.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.21
- type: DcVerse
  data:
    ref: dc.21.8
    scripture: doctrine-and-covenants
    name: D&C 21:8
    chapter: 21
    verse: 8
    ordinal: 497
    text: Yea, his weeping for Zion I have seen, and I will cause that he shall mourn for her no longer; for his days of rejoicing are come unto the remission of his sins, and the manifestations of my blessings upon his works.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.21
- type: DcVerse
  data:
    ref: dc.21.9
    scripture: doctrine-and-covenants
    name: D&C 21:9
    chapter: 21
    verse: 9
    ordinal: 498
    text: For, behold, I will bless all those who labor in my vineyard with a mighty blessing, and they shall believe on his words, which are given him through me by the Comforter, which manifesteth that Jesus was crucified by sinful men for the sins of the world, yea, for the remission of sins unto the contrite heart.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.21
- type: DcVerse
  data:
    ref: dc.21.10
    scripture: doctrine-and-covenants
    name: D&C 21:10
    chapter: 21
    verse: 10
    ordinal: 499
    text: Wherefore it behooveth me that he should be ordained by you, Oliver Cowdery mine apostle;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.21
- type: DcVerse
  data:
    ref: dc.21.11
    scripture: doctrine-and-covenants
    name: D&C 21:11
    chapter: 21
    verse: 11
    ordinal: 500
    text: This being an ordinance unto you, that you are an elder under his hand, he being the first unto you, that you might be an elder unto this church of Christ, bearing my name—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.21
- type: DcVerse
  data:
    ref: dc.21.12
    scripture: doctrine-and-covenants
    name: D&C 21:12
    chapter: 21
    verse: 12
    ordinal: 501
    text: And the first preacher of this church unto the church, and before the world, yea, before the Gentiles; yea, and thus saith the Lord God, lo, lo! to the Jews also. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.21
- type: DcVerse
  data:
    ref: dc.22.1
    scripture: doctrine-and-covenants
    name: D&C 22:1
    chapter: 22
    verse: 1
    ordinal: 502
    text: Behold, I say unto you that all old covenants have I caused to be done away in this thing; and this is a new and an everlasting covenant, even that which was from the beginning.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.22
- type: DcVerse
  data:
    ref: dc.22.2
    scripture: doctrine-and-covenants
    name: D&C 22:2
    chapter: 22
    verse: 2
    ordinal: 503
    text: Wherefore, although a man should be baptized an hundred times it availeth him nothing, for you cannot enter in at the strait gate by the law of Moses, neither by your dead works.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.22
- type: DcVerse
  data:
    ref: dc.22.3
    scripture: doctrine-and-covenants
    name: D&C 22:3
    chapter: 22
    verse: 3
    ordinal: 504
    text: For it is because of your dead works that I have caused this last covenant and this church to be built up unto me, even as in days of old.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.22
- type: DcVerse
  data:
    ref: dc.22.4
    scripture: doctrine-and-covenants
    name: D&C 22:4
    chapter: 22
    verse: 4
    ordinal: 505
    text: Wherefore, enter ye in at the gate, as I have commanded, and seek not to counsel your God. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.22
- type: DcVerse
  data:
    ref: dc.23.1
    scripture: doctrine-and-covenants
    name: D&C 23:1
    chapter: 23
    verse: 1
    ordinal: 506
    text: Behold, I speak unto you, Oliver, a few words. Behold, thou art blessed, and art under no condemnation. But beware of pride, lest thou shouldst enter into temptation.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.23
- type: DcVerse
  data:
    ref: dc.23.2
    scripture: doctrine-and-covenants
    name: D&C 23:2
    chapter: 23
    verse: 2
    ordinal: 507
    text: Make known thy calling unto the church, and also before the world, and thy heart shall be opened to preach the truth from henceforth and forever. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.23
- type: DcVerse
  data:
    ref: dc.23.3
    scripture: doctrine-and-covenants
    name: D&C 23:3
    chapter: 23
    verse: 3
    ordinal: 508
    text: Behold, I speak unto you, Hyrum, a few words; for thou also art under no condemnation, and thy heart is opened, and thy tongue loosed; and thy calling is to exhortation, and to strengthen the church continually. Wherefore thy duty is unto the church forever, and this because of thy family. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.23
- type: DcVerse
  data:
    ref: dc.23.4
    scripture: doctrine-and-covenants
    name: D&C 23:4
    chapter: 23
    verse: 4
    ordinal: 509
    text: Behold, I speak a few words unto you, Samuel; for thou also art under no condemnation, and thy calling is to exhortation, and to strengthen the church; and thou art not as yet called to preach before the world. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.23
- type: DcVerse
  data:
    ref: dc.23.5
    scripture: doctrine-and-covenants
    name: D&C 23:5
    chapter: 23
    verse: 5
    ordinal: 510
    text: Behold, I speak a few words unto you, Joseph; for thou also art under no condemnation, and thy calling also is to exhortation, and to strengthen the church; and this is thy duty from henceforth and forever. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.23
- type: DcVerse
  data:
    ref: dc.23.6
    scripture: doctrine-and-covenants
    name: D&C 23:6
    chapter: 23
    verse: 6
    ordinal: 511
    text: Behold, I manifest unto you, Joseph Knight, by these words, that you must take up your cross, in the which you must pray vocally before the world as well as in secret, and in your family, and among your friends, and in all places.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.23
- type: DcVerse
  data:
    ref: dc.23.7
    scripture: doctrine-and-covenants
    name: D&C 23:7
    chapter: 23
    verse: 7
    ordinal: 512
    text: And, behold, it is your duty to unite with the true church, and give your language to exhortation continually, that you may receive the reward of the laborer. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.23
- type: DcVerse
  data:
    ref: dc.24.1
    scripture: doctrine-and-covenants
    name: D&C 24:1
    chapter: 24
    verse: 1
    ordinal: 513
    text: Behold, thou wast called and chosen to write the Book of Mormon, and to my ministry; and I have lifted thee up out of thine afflictions, and have counseled thee, that thou hast been delivered from all thine enemies, and thou hast been delivered from the powers of Satan and from darkness!
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.24
- type: DcVerse
  data:
    ref: dc.24.2
    scripture: doctrine-and-covenants
    name: D&C 24:2
    chapter: 24
    verse: 2
    ordinal: 514
    text: Nevertheless, thou art not excusable in thy transgressions; nevertheless, go thy way and sin no more.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.24
- type: DcVerse
  data:
    ref: dc.24.3
    scripture: doctrine-and-covenants
    name: D&C 24:3
    chapter: 24
    verse: 3
    ordinal: 515
    text: Magnify thine office; and after thou hast sowed thy fields and secured them, go speedily unto the church which is in Colesville, Fayette, and Manchester, and they shall support thee; and I will bless them both spiritually and temporally;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.24
- type: DcVerse
  data:
    ref: dc.24.4
    scripture: doctrine-and-covenants
    name: D&C 24:4
    chapter: 24
    verse: 4
    ordinal: 516
    text: But if they receive thee not, I will send upon them a cursing instead of a blessing.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.24
- type: DcVerse
  data:
    ref: dc.24.5
    scripture: doctrine-and-covenants
    name: D&C 24:5
    chapter: 24
    verse: 5
    ordinal: 517
    text: And thou shalt continue in calling upon God in my name, and writing the things which shall be given thee by the Comforter, and expounding all scriptures unto the church.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.24
- type: DcVerse
  data:
    ref: dc.24.6
    scripture: doctrine-and-covenants
    name: D&C 24:6
    chapter: 24
    verse: 6
    ordinal: 518
    text: And it shall be given thee in the very moment what thou shalt speak and write, and they shall hear it, or I will send unto them a cursing instead of a blessing.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.24
- type: DcVerse
  data:
    ref: dc.24.7
    scripture: doctrine-and-covenants
    name: D&C 24:7
    chapter: 24
    verse: 7
    ordinal: 519
    text: For thou shalt devote all thy service in Zion; and in this thou shalt have strength.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.24
- type: DcVerse
  data:
    ref: dc.24.8
    scripture: doctrine-and-covenants
    name: D&C 24:8
    chapter: 24
    verse: 8
    ordinal: 520
    text: Be patient in afflictions, for thou shalt have many; but endure them, for, lo, I am with thee, even unto the end of thy days.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.24
- type: DcVerse
  data:
    ref: dc.24.9
    scripture: doctrine-and-covenants
    name: D&C 24:9
    chapter: 24
    verse: 9
    ordinal: 521
    text: And in temporal labors thou shalt not have strength, for this is not thy calling. Attend to thy calling and thou shalt have wherewith to magnify thine office, and to expound all scriptures, and continue in laying on of the hands and confirming the churches.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.24
- type: DcVerse
  data:
    ref: dc.24.10
    scripture: doctrine-and-covenants
    name: D&C 24:10
    chapter: 24
    verse: 10
    ordinal: 522
    text: And thy brother Oliver shall continue in bearing my name before the world, and also to the church. And he shall not suppose that he can say enough in my cause; and lo, I am with him to the end.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.24
- type: DcVerse
  data:
    ref: dc.24.11
    scripture: doctrine-and-covenants
    name: D&C 24:11
    chapter: 24
    verse: 11
    ordinal: 523
    text: In me he shall have glory, and not of himself, whether in weakness or in strength, whether in bonds or free;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.24
- type: DcVerse
  data:
    ref: dc.24.12
    scripture: doctrine-and-covenants
    name: D&C 24:12
    chapter: 24
    verse: 12
    ordinal: 524
    text: And at all times, and in all places, he shall open his mouth and declare my gospel as with the voice of a trump, both day and night. And I will give unto him strength such as is not known among men.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.24
- type: DcVerse
  data:
    ref: dc.24.13
    scripture: doctrine-and-covenants
    name: D&C 24:13
    chapter: 24
    verse: 13
    ordinal: 525
    text: Require not miracles, except I shall command you, except casting out devils, healing the sick, and against poisonous serpents, and against deadly poisons;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.24
- type: DcVerse
  data:
    ref: dc.24.14
    scripture: doctrine-and-covenants
    name: D&C 24:14
    chapter: 24
    verse: 14
    ordinal: 526
    text: And these things ye shall not do, except it be required of you by them who desire it, that the scriptures might be fulfilled; for ye shall do according to that which is written.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.24
- type: DcVerse
  data:
    ref: dc.24.15
    scripture: doctrine-and-covenants
    name: D&C 24:15
    chapter: 24
    verse: 15
    ordinal: 527
    text: And in whatsoever place ye shall enter, and they receive you not in my name, ye shall leave a cursing instead of a blessing, by casting off the dust of your feet against them as a testimony, and cleansing your feet by the wayside.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.24
- type: DcVerse
  data:
    ref: dc.24.16
    scripture: doctrine-and-covenants
    name: D&C 24:16
    chapter: 24
    verse: 16
    ordinal: 528
    text: And it shall come to pass that whosoever shall lay their hands upon you by violence, ye shall command to be smitten in my name; and, behold, I will smite them according to your words, in mine own due time.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.24
- type: DcVerse
  data:
    ref: dc.24.17
    scripture: doctrine-and-covenants
    name: D&C 24:17
    chapter: 24
    verse: 17
    ordinal: 529
    text: And whosoever shall go to law with thee shall be cursed by the law.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.24
- type: DcVerse
  data:
    ref: dc.24.18
    scripture: doctrine-and-covenants
    name: D&C 24:18
    chapter: 24
    verse: 18
    ordinal: 530
    text: And thou shalt take no purse nor scrip, neither staves, neither two coats, for the church shall give unto thee in the very hour what thou needest for food and for raiment, and for shoes and for money, and for scrip.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.24
- type: DcVerse
  data:
    ref: dc.24.19
    scripture: doctrine-and-covenants
    name: D&C 24:19
    chapter: 24
    verse: 19
    ordinal: 531
    text: For thou art called to prune my vineyard with a mighty pruning, yea, even for the last time; yea, and also all those whom thou hast ordained, and they shall do even according to this pattern. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.24
- type: DcVerse
  data:
    ref: dc.25.1
    scripture: doctrine-and-covenants
    name: D&C 25:1
    chapter: 25
    verse: 1
    ordinal: 532
    text: Hearken unto the voice of the Lord your God, while I speak unto you, Emma Smith, my daughter; for verily I say unto you, all those who receive my gospel are sons and daughters in my kingdom.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.25
- type: DcVerse
  data:
    ref: dc.25.2
    scripture: doctrine-and-covenants
    name: D&C 25:2
    chapter: 25
    verse: 2
    ordinal: 533
    text: A revelation I give unto you concerning my will; and if thou art faithful and walk in the paths of virtue before me, I will preserve thy life, and thou shalt receive an inheritance in Zion.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.25
- type: DcVerse
  data:
    ref: dc.25.3
    scripture: doctrine-and-covenants
    name: D&C 25:3
    chapter: 25
    verse: 3
    ordinal: 534
    text: Behold, thy sins are forgiven thee, and thou art an elect lady, whom I have called.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.25
- type: DcVerse
  data:
    ref: dc.25.4
    scripture: doctrine-and-covenants
    name: D&C 25:4
    chapter: 25
    verse: 4
    ordinal: 535
    text: Murmur not because of the things which thou hast not seen, for they are withheld from thee and from the world, which is wisdom in me in a time to come.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.25
- type: DcVerse
  data:
    ref: dc.25.5
    scripture: doctrine-and-covenants
    name: D&C 25:5
    chapter: 25
    verse: 5
    ordinal: 536
    text: And the office of thy calling shall be for a comfort unto my servant, Joseph Smith, Jun., thy husband, in his afflictions, with consoling words, in the spirit of meekness.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.25
- type: DcVerse
  data:
    ref: dc.25.6
    scripture: doctrine-and-covenants
    name: D&C 25:6
    chapter: 25
    verse: 6
    ordinal: 537
    text: And thou shalt go with him at the time of his going, and be unto him for a scribe, while there is no one to be a scribe for him, that I may send my servant, Oliver Cowdery, whithersoever I will.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.25
- type: DcVerse
  data:
    ref: dc.25.7
    scripture: doctrine-and-covenants
    name: D&C 25:7
    chapter: 25
    verse: 7
    ordinal: 538
    text: And thou shalt be ordained under his hand to expound scriptures, and to exhort the church, according as it shall be given thee by my Spirit.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.25
- type: DcVerse
  data:
    ref: dc.25.8
    scripture: doctrine-and-covenants
    name: D&C 25:8
    chapter: 25
    verse: 8
    ordinal: 539
    text: For he shall lay his hands upon thee, and thou shalt receive the Holy Ghost, and thy time shall be given to writing, and to learning much.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.25
- type: DcVerse
  data:
    ref: dc.25.9
    scripture: doctrine-and-covenants
    name: D&C 25:9
    chapter: 25
    verse: 9
    ordinal: 540
    text: And thou needest not fear, for thy husband shall support thee in the church; for unto them is his calling, that all things might be revealed unto them, whatsoever I will, according to their faith.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.25
- type: DcVerse
  data:
    ref: dc.25.10
    scripture: doctrine-and-covenants
    name: D&C 25:10
    chapter: 25
    verse: 10
    ordinal: 541
    text: And verily I say unto thee that thou shalt lay aside the things of this world, and seek for the things of a better.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.25
- type: DcVerse
  data:
    ref: dc.25.11
    scripture: doctrine-and-covenants
    name: D&C 25:11
    chapter: 25
    verse: 11
    ordinal: 542
    text: And it shall be given thee, also, to make a selection of sacred hymns, as it shall be given thee, which is pleasing unto me, to be had in my church.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.25
- type: DcVerse
  data:
    ref: dc.25.12
    scripture: doctrine-and-covenants
    name: D&C 25:12
    chapter: 25
    verse: 12
    ordinal: 543
    text: For my soul delighteth in the song of the heart; yea, the song of the righteous is a prayer unto me, and it shall be answered with a blessing upon their heads.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.25
- type: DcVerse
  data:
    ref: dc.25.13
    scripture: doctrine-and-covenants
    name: D&C 25:13
    chapter: 25
    verse: 13
    ordinal: 544
    text: Wherefore, lift up thy heart and rejoice, and cleave unto the covenants which thou hast made.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.25
- type: DcVerse
  data:
    ref: dc.25.14
    scripture: doctrine-and-covenants
    name: D&C 25:14
    chapter: 25
    verse: 14
    ordinal: 545
    text: Continue in the spirit of meekness, and beware of pride. Let thy soul delight in thy husband, and the glory which shall come upon him.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.25
- type: DcVerse
  data:
    ref: dc.25.15
    scripture: doctrine-and-covenants
    name: D&C 25:15
    chapter: 25
    verse: 15
    ordinal: 546
    text: Keep my commandments continually, and a crown of righteousness thou shalt receive. And except thou do this, where I am you cannot come.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.25
- type: DcVerse
  data:
    ref: dc.25.16
    scripture: doctrine-and-covenants
    name: D&C 25:16
    chapter: 25
    verse: 16
    ordinal: 547
    text: And verily, verily, I say unto you, that this is my voice unto all. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.25
- type: DcVerse
  data:
    ref: dc.26.1
    scripture: doctrine-and-covenants
    name: D&C 26:1
    chapter: 26
    verse: 1
    ordinal: 548
    text: Behold, I say unto you that you shall let your time be devoted to the studying of the scriptures, and to preaching, and to confirming the church at Colesville, and to performing your labors on the land, such as is required, until after you shall go to the west to hold the next conference; and then it shall be made known what you shall do.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.26
- type: DcVerse
  data:
    ref: dc.26.2
    scripture: doctrine-and-covenants
    name: D&C 26:2
    chapter: 26
    verse: 2
    ordinal: 549
    text: And all things shall be done by common consent in the church, by much prayer and faith, for all things you shall receive by faith. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.26
- type: DcVerse
  data:
    ref: dc.27.1
    scripture: doctrine-and-covenants
    name: D&C 27:1
    chapter: 27
    verse: 1
    ordinal: 550
    text: Listen to the voice of Jesus Christ, your Lord, your God, and your Redeemer, whose word is quick and powerful.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.27
- type: DcVerse
  data:
    ref: dc.27.2
    scripture: doctrine-and-covenants
    name: D&C 27:2
    chapter: 27
    verse: 2
    ordinal: 551
    text: For, behold, I say unto you, that it mattereth not what ye shall eat or what ye shall drink when ye partake of the sacrament, if it so be that ye do it with an eye single to my glory—remembering unto the Father my body which was laid down for you, and my blood which was shed for the remission of your sins.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.27
- type: DcVerse
  data:
    ref: dc.27.3
    scripture: doctrine-and-covenants
    name: D&C 27:3
    chapter: 27
    verse: 3
    ordinal: 552
    text: Wherefore, a commandment I give unto you, that you shall not purchase wine neither strong drink of your enemies;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.27
- type: DcVerse
  data:
    ref: dc.27.4
    scripture: doctrine-and-covenants
    name: D&C 27:4
    chapter: 27
    verse: 4
    ordinal: 553
    text: Wherefore, you shall partake of none except it is made new among you; yea, in this my Father's kingdom which shall be built up on the earth.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.27
- type: DcVerse
  data:
    ref: dc.27.5
    scripture: doctrine-and-covenants
    name: D&C 27:5
    chapter: 27
    verse: 5
    ordinal: 554
    text: Behold, this is wisdom in me; wherefore, marvel not, for the hour cometh that I will drink of the fruit of the vine with you on the earth, and with Moroni, whom I have sent unto you to reveal the Book of Mormon, containing the fulness of my everlasting gospel, to whom I have committed the keys of the record of the stick of Ephraim;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.27
- type: DcVerse
  data:
    ref: dc.27.6
    scripture: doctrine-and-covenants
    name: D&C 27:6
    chapter: 27
    verse: 6
    ordinal: 555
    text: And also with Elias, to whom I have committed the keys of bringing to pass the restoration of all things spoken by the mouth of all the holy prophets since the world began, concerning the last days;
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Acts 3:21
    kjvAllusionOsis:
    - Acts.3.21
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.27
- type: DcVerse
  data:
    ref: dc.27.7
    scripture: doctrine-and-covenants
    name: D&C 27:7
    chapter: 27
    verse: 7
    ordinal: 556
    text: And also John the son of Zacharias, which Zacharias he (Elias) visited and gave promise that he should have a son, and his name should be John, and he should be filled with the spirit of Elias;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.27
- type: DcVerse
  data:
    ref: dc.27.8
    scripture: doctrine-and-covenants
    name: D&C 27:8
    chapter: 27
    verse: 8
    ordinal: 557
    text: Which John I have sent unto you, my servants, Joseph Smith, Jun., and Oliver Cowdery, to ordain you unto the first priesthood which you have received, that you might be called and ordained even as Aaron;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.27
- type: DcVerse
  data:
    ref: dc.27.9
    scripture: doctrine-and-covenants
    name: D&C 27:9
    chapter: 27
    verse: 9
    ordinal: 558
    text: And also Elijah, unto whom I have committed the keys of the power of turning the hearts of the fathers to the children, and the hearts of the children to the fathers, that the whole earth may not be smitten with a curse;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.27
- type: DcVerse
  data:
    ref: dc.27.10
    scripture: doctrine-and-covenants
    name: D&C 27:10
    chapter: 27
    verse: 10
    ordinal: 559
    text: And also with Joseph and Jacob, and Isaac, and Abraham, your fathers, by whom the promises remain;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.27
- type: DcVerse
  data:
    ref: dc.27.11
    scripture: doctrine-and-covenants
    name: D&C 27:11
    chapter: 27
    verse: 11
    ordinal: 560
    text: And also with Michael, or Adam, the father of all, the prince of all, the ancient of days;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.27
- type: DcVerse
  data:
    ref: dc.27.12
    scripture: doctrine-and-covenants
    name: D&C 27:12
    chapter: 27
    verse: 12
    ordinal: 561
    text: And also with Peter, and James, and John, whom I have sent unto you, by whom I have ordained you and confirmed you to be apostles, and especial witnesses of my name, and bear the keys of your ministry and of the same things which I revealed unto them;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.27
- type: DcVerse
  data:
    ref: dc.27.13
    scripture: doctrine-and-covenants
    name: D&C 27:13
    chapter: 27
    verse: 13
    ordinal: 562
    text: Unto whom I have committed the keys of my kingdom, and a dispensation of the gospel for the last times; and for the fulness of times, in the which I will gather together in one all things, both which are in heaven, and which are on earth;
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Ephesians 1:10
    kjvAllusionOsis:
    - Eph.1.10
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.27
- type: DcVerse
  data:
    ref: dc.27.14
    scripture: doctrine-and-covenants
    name: D&C 27:14
    chapter: 27
    verse: 14
    ordinal: 563
    text: And also with all those whom my Father hath given me out of the world.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.27
- type: DcVerse
  data:
    ref: dc.27.15
    scripture: doctrine-and-covenants
    name: D&C 27:15
    chapter: 27
    verse: 15
    ordinal: 564
    text: Wherefore, lift up your hearts and rejoice, and gird up your loins, and take upon you my whole armor, that ye may be able to withstand the evil day, having done all, that ye may be able to stand.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Ephesians 6:13
    kjvAllusionOsis:
    - Eph.6.13
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.27
- type: DcVerse
  data:
    ref: dc.27.16
    scripture: doctrine-and-covenants
    name: D&C 27:16
    chapter: 27
    verse: 16
    ordinal: 565
    text: Stand, therefore, having your loins girt about with truth, having on the breastplate of righteousness, and your feet shod with the preparation of the gospel of peace, which I have sent mine angels to commit unto you;
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Ephesians 6:14
    kjvAllusionOsis:
    - Eph.6.14
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.27
- type: DcVerse
  data:
    ref: dc.27.17
    scripture: doctrine-and-covenants
    name: D&C 27:17
    chapter: 27
    verse: 17
    ordinal: 566
    text: Taking the shield of faith wherewith ye shall be able to quench all the fiery darts of the wicked;
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Ephesians 6:16
    kjvOsis:
    - Eph.6.16
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.27
- type: DcVerse
  data:
    ref: dc.27.18
    scripture: doctrine-and-covenants
    name: D&C 27:18
    chapter: 27
    verse: 18
    ordinal: 567
    text: And take the helmet of salvation, and the sword of my Spirit, which I will pour out upon you, and my word which I reveal unto you, and be agreed as touching all things whatsoever ye ask of me, and be faithful until I come, and ye shall be caught up, that where I am ye shall be also. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.27
- type: DcVerse
  data:
    ref: dc.28.1
    scripture: doctrine-and-covenants
    name: D&C 28:1
    chapter: 28
    verse: 1
    ordinal: 568
    text: Behold, I say unto thee, Oliver, that it shall be given unto thee that thou shalt be heard by the church in all things whatsoever thou shalt teach them by the Comforter, concerning the revelations and commandments which I have given.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.28
- type: DcVerse
  data:
    ref: dc.28.2
    scripture: doctrine-and-covenants
    name: D&C 28:2
    chapter: 28
    verse: 2
    ordinal: 569
    text: But, behold, verily, verily, I say unto thee, no one shall be appointed to receive commandments and revelations in this church excepting my servant Joseph Smith, Jun., for he receiveth them even as Moses.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.28
- type: DcVerse
  data:
    ref: dc.28.3
    scripture: doctrine-and-covenants
    name: D&C 28:3
    chapter: 28
    verse: 3
    ordinal: 570
    text: And thou shalt be obedient unto the things which I shall give unto him, even as Aaron, to declare faithfully the commandments and the revelations, with power and authority unto the church.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.28
- type: DcVerse
  data:
    ref: dc.28.4
    scripture: doctrine-and-covenants
    name: D&C 28:4
    chapter: 28
    verse: 4
    ordinal: 571
    text: And if thou art led at any time by the Comforter to speak or teach, or at all times by the way of commandment unto the church, thou mayest do it.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.28
- type: DcVerse
  data:
    ref: dc.28.5
    scripture: doctrine-and-covenants
    name: D&C 28:5
    chapter: 28
    verse: 5
    ordinal: 572
    text: But thou shalt not write by way of commandment, but by wisdom;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.28
- type: DcVerse
  data:
    ref: dc.28.6
    scripture: doctrine-and-covenants
    name: D&C 28:6
    chapter: 28
    verse: 6
    ordinal: 573
    text: And thou shalt not command him who is at thy head, and at the head of the church;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.28
- type: DcVerse
  data:
    ref: dc.28.7
    scripture: doctrine-and-covenants
    name: D&C 28:7
    chapter: 28
    verse: 7
    ordinal: 574
    text: For I have given him the keys of the mysteries, and the revelations which are sealed, until I shall appoint unto them another in his stead.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.28
- type: DcVerse
  data:
    ref: dc.28.8
    scripture: doctrine-and-covenants
    name: D&C 28:8
    chapter: 28
    verse: 8
    ordinal: 575
    text: And now, behold, I say unto you that you shall go unto the Lamanites and preach my gospel unto them; and inasmuch as they receive thy teachings thou shalt cause my church to be established among them; and thou shalt have revelations, but write them not by way of commandment.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.28
- type: DcVerse
  data:
    ref: dc.28.9
    scripture: doctrine-and-covenants
    name: D&C 28:9
    chapter: 28
    verse: 9
    ordinal: 576
    text: And now, behold, I say unto you that it is not revealed, and no man knoweth where the city Zion shall be built, but it shall be given hereafter. Behold, I say unto you that it shall be on the borders by the Lamanites.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.28
- type: DcVerse
  data:
    ref: dc.28.10
    scripture: doctrine-and-covenants
    name: D&C 28:10
    chapter: 28
    verse: 10
    ordinal: 577
    text: Thou shalt not leave this place until after the conference; and my servant Joseph shall be appointed to preside over the conference by the voice of it, and what he saith to thee thou shalt tell.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.28
- type: DcVerse
  data:
    ref: dc.28.11
    scripture: doctrine-and-covenants
    name: D&C 28:11
    chapter: 28
    verse: 11
    ordinal: 578
    text: And again, thou shalt take thy brother, Hiram Page, between him and thee alone, and tell him that those things which he hath written from that stone are not of me and that Satan deceiveth him;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.28
- type: DcVerse
  data:
    ref: dc.28.12
    scripture: doctrine-and-covenants
    name: D&C 28:12
    chapter: 28
    verse: 12
    ordinal: 579
    text: For, behold, these things have not been appointed unto him, neither shall anything be appointed unto any of this church contrary to the church covenants.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.28
- type: DcVerse
  data:
    ref: dc.28.13
    scripture: doctrine-and-covenants
    name: D&C 28:13
    chapter: 28
    verse: 13
    ordinal: 580
    text: For all things must be done in order, and by common consent in the church, by the prayer of faith.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.28
- type: DcVerse
  data:
    ref: dc.28.14
    scripture: doctrine-and-covenants
    name: D&C 28:14
    chapter: 28
    verse: 14
    ordinal: 581
    text: And thou shalt assist to settle all these things, according to the covenants of the church, before thou shalt take thy journey among the Lamanites.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.28
- type: DcVerse
  data:
    ref: dc.28.15
    scripture: doctrine-and-covenants
    name: D&C 28:15
    chapter: 28
    verse: 15
    ordinal: 582
    text: And it shall be given thee from the time thou shalt go, until the time thou shalt return, what thou shalt do.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.28
- type: DcVerse
  data:
    ref: dc.28.16
    scripture: doctrine-and-covenants
    name: D&C 28:16
    chapter: 28
    verse: 16
    ordinal: 583
    text: And thou must open thy mouth at all times, declaring my gospel with the sound of rejoicing. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.28
- type: DcVerse
  data:
    ref: dc.29.1
    scripture: doctrine-and-covenants
    name: D&C 29:1
    chapter: 29
    verse: 1
    ordinal: 584
    text: Listen to the voice of Jesus Christ, your Redeemer, the Great I AM, whose arm of mercy hath atoned for your sins;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.29
- type: DcVerse
  data:
    ref: dc.29.2
    scripture: doctrine-and-covenants
    name: D&C 29:2
    chapter: 29
    verse: 2
    ordinal: 585
    text: Who will gather his people even as a hen gathereth her chickens under her wings, even as many as will hearken to my voice and humble themselves before me, and call upon me in mighty prayer.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.29
- type: DcVerse
  data:
    ref: dc.29.3
    scripture: doctrine-and-covenants
    name: D&C 29:3
    chapter: 29
    verse: 3
    ordinal: 586
    text: Behold, verily, verily, I say unto you, that at this time your sins are forgiven you, therefore ye receive these things; but remember to sin no more, lest perils shall come upon you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.29
- type: DcVerse
  data:
    ref: dc.29.4
    scripture: doctrine-and-covenants
    name: D&C 29:4
    chapter: 29
    verse: 4
    ordinal: 587
    text: Verily, I say unto you that ye are chosen out of the world to declare my gospel with the sound of rejoicing, as with the voice of a trump.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.29
- type: DcVerse
  data:
    ref: dc.29.5
    scripture: doctrine-and-covenants
    name: D&C 29:5
    chapter: 29
    verse: 5
    ordinal: 588
    text: Lift up your hearts and be glad, for I am in your midst, and am your advocate with the Father; and it is his good will to give you the kingdom.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.29
- type: DcVerse
  data:
    ref: dc.29.6
    scripture: doctrine-and-covenants
    name: D&C 29:6
    chapter: 29
    verse: 6
    ordinal: 589
    text: And, as it is written—Whatsoever ye shall ask in faith, being united in prayer according to my command, ye shall receive.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Matthew 21:22
    kjvAllusionOsis:
    - Matt.21.22
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.29
- type: DcVerse
  data:
    ref: dc.29.7
    scripture: doctrine-and-covenants
    name: D&C 29:7
    chapter: 29
    verse: 7
    ordinal: 590
    text: And ye are called to bring to pass the gathering of mine elect; for mine elect hear my voice and harden not their hearts;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.29
- type: DcVerse
  data:
    ref: dc.29.8
    scripture: doctrine-and-covenants
    name: D&C 29:8
    chapter: 29
    verse: 8
    ordinal: 591
    text: Wherefore the decree hath gone forth from the Father that they shall be gathered in unto one place upon the face of this land, to prepare their hearts and be prepared in all things against the day when tribulation and desolation are sent forth upon the wicked.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.29
- type: DcVerse
  data:
    ref: dc.29.9
    scripture: doctrine-and-covenants
    name: D&C 29:9
    chapter: 29
    verse: 9
    ordinal: 592
    text: For the hour is nigh and the day soon at hand when the earth is ripe; and all the proud and they that do wickedly shall be as stubble; and I will burn them up, saith the Lord of Hosts, that wickedness shall not be upon the earth;
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Malachi 4:1
    kjvAllusionOsis:
    - Mal.4.1
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.29
- type: DcVerse
  data:
    ref: dc.29.10
    scripture: doctrine-and-covenants
    name: D&C 29:10
    chapter: 29
    verse: 10
    ordinal: 593
    text: For the hour is nigh, and that which was spoken by mine apostles must be fulfilled; for as they spoke so shall it come to pass;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.29
- type: DcVerse
  data:
    ref: dc.29.11
    scripture: doctrine-and-covenants
    name: D&C 29:11
    chapter: 29
    verse: 11
    ordinal: 594
    text: For I will reveal myself from heaven with power and great glory, with all the hosts thereof, and dwell in righteousness with men on earth a thousand years, and the wicked shall not stand.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.29
- type: DcVerse
  data:
    ref: dc.29.12
    scripture: doctrine-and-covenants
    name: D&C 29:12
    chapter: 29
    verse: 12
    ordinal: 595
    text: And again, verily, verily, I say unto you, and it hath gone forth in a firm decree, by the will of the Father, that mine apostles, the Twelve which were with me in my ministry at Jerusalem, shall stand at my right hand at the day of my coming in a pillar of fire, being clothed with robes of righteousness, with crowns upon their heads, in glory even as I am, to judge the whole house of Israel, even as many as have loved me and kept my commandments, and none else.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.29
- type: DcVerse
  data:
    ref: dc.29.13
    scripture: doctrine-and-covenants
    name: D&C 29:13
    chapter: 29
    verse: 13
    ordinal: 596
    text: For a trump shall sound both long and loud, even as upon Mount Sinai, and all the earth shall quake, and they shall come forth—yea, even the dead which died in me, to receive a crown of righteousness, and to be clothed upon, even as I am, to be with me, that we may be one.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.29
- type: DcVerse
  data:
    ref: dc.29.14
    scripture: doctrine-and-covenants
    name: D&C 29:14
    chapter: 29
    verse: 14
    ordinal: 597
    text: But, behold, I say unto you that before this great day shall come the sun shall be darkened, and the moon shall be turned into blood, and the stars shall fall from heaven, and there shall be greater signs in heaven above and in the earth beneath;
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Acts 2:20
    kjvAllusionOsis:
    - Acts.2.20
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.29
- type: DcVerse
  data:
    ref: dc.29.15
    scripture: doctrine-and-covenants
    name: D&C 29:15
    chapter: 29
    verse: 15
    ordinal: 598
    text: And there shall be weeping and wailing among the hosts of men;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.29
- type: DcVerse
  data:
    ref: dc.29.16
    scripture: doctrine-and-covenants
    name: D&C 29:16
    chapter: 29
    verse: 16
    ordinal: 599
    text: And there shall be a great hailstorm sent forth to destroy the crops of the earth.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.29
- type: DcVerse
  data:
    ref: dc.29.17
    scripture: doctrine-and-covenants
    name: D&C 29:17
    chapter: 29
    verse: 17
    ordinal: 600
    text: And it shall come to pass, because of the wickedness of the world, that I will take vengeance upon the wicked, for they will not repent; for the cup of mine indignation is full; for behold, my blood shall not cleanse them if they hear me not.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.29
- type: DcVerse
  data:
    ref: dc.29.18
    scripture: doctrine-and-covenants
    name: D&C 29:18
    chapter: 29
    verse: 18
    ordinal: 601
    text: Wherefore, I the Lord God will send forth flies upon the face of the earth, which shall take hold of the inhabitants thereof, and shall eat their flesh, and shall cause maggots to come in upon them;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.29
- type: DcVerse
  data:
    ref: dc.29.19
    scripture: doctrine-and-covenants
    name: D&C 29:19
    chapter: 29
    verse: 19
    ordinal: 602
    text: And their tongues shall be stayed that they shall not utter against me; and their flesh shall fall from off their bones, and their eyes from their sockets;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.29
- type: DcVerse
  data:
    ref: dc.29.20
    scripture: doctrine-and-covenants
    name: D&C 29:20
    chapter: 29
    verse: 20
    ordinal: 603
    text: And it shall come to pass that the beasts of the forest and the fowls of the air shall devour them up.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Isaiah 56:9
    kjvAllusionOsis:
    - Isa.56.9
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.29
- type: DcVerse
  data:
    ref: dc.29.21
    scripture: doctrine-and-covenants
    name: D&C 29:21
    chapter: 29
    verse: 21
    ordinal: 604
    text: And the great and abominable church, which is the whore of all the earth, shall be cast down by devouring fire, according as it is spoken by the mouth of Ezekiel the prophet, who spoke of these things, which have not come to pass but surely must, as I live, for abominations shall not reign.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.29
- type: DcVerse
  data:
    ref: dc.29.22
    scripture: doctrine-and-covenants
    name: D&C 29:22
    chapter: 29
    verse: 22
    ordinal: 605
    text: And again, verily, verily, I say unto you that when the thousand years are ended, and men again begin to deny their God, then will I spare the earth but for a little season;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.29
- type: DcVerse
  data:
    ref: dc.29.23
    scripture: doctrine-and-covenants
    name: D&C 29:23
    chapter: 29
    verse: 23
    ordinal: 606
    text: And the end shall come, and the heaven and the earth shall be consumed and pass away, and there shall be a new heaven and a new earth.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.29
- type: DcVerse
  data:
    ref: dc.29.24
    scripture: doctrine-and-covenants
    name: D&C 29:24
    chapter: 29
    verse: 24
    ordinal: 607
    text: For all old things shall pass away, and all things shall become new, even the heaven and the earth, and all the fulness thereof, both men and beasts, the fowls of the air, and the fishes of the sea;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.29
- type: DcVerse
  data:
    ref: dc.29.25
    scripture: doctrine-and-covenants
    name: D&C 29:25
    chapter: 29
    verse: 25
    ordinal: 608
    text: And not one hair, neither mote, shall be lost, for it is the workmanship of mine hand.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.29
- type: DcVerse
  data:
    ref: dc.29.26
    scripture: doctrine-and-covenants
    name: D&C 29:26
    chapter: 29
    verse: 26
    ordinal: 609
    text: But, behold, verily I say unto you, before the earth shall pass away, Michael, mine archangel, shall sound his trump, and then shall all the dead awake, for their graves shall be opened, and they shall come forth—yea, even all.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.29
- type: DcVerse
  data:
    ref: dc.29.27
    scripture: doctrine-and-covenants
    name: D&C 29:27
    chapter: 29
    verse: 27
    ordinal: 610
    text: And the righteous shall be gathered on my right hand unto eternal life; and the wicked on my left hand will I be ashamed to own before the Father;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.29
- type: DcVerse
  data:
    ref: dc.29.28
    scripture: doctrine-and-covenants
    name: D&C 29:28
    chapter: 29
    verse: 28
    ordinal: 611
    text: Wherefore I will say unto them—Depart from me, ye cursed, into everlasting fire, prepared for the devil and his angels.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Matthew 25:41
    kjvOsis:
    - Matt.25.41
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.29
- type: DcVerse
  data:
    ref: dc.29.29
    scripture: doctrine-and-covenants
    name: D&C 29:29
    chapter: 29
    verse: 29
    ordinal: 612
    text: And now, behold, I say unto you, never at any time have I declared from mine own mouth that they should return, for where I am they cannot come, for they have no power.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.29
- type: DcVerse
  data:
    ref: dc.29.30
    scripture: doctrine-and-covenants
    name: D&C 29:30
    chapter: 29
    verse: 30
    ordinal: 613
    text: But remember that all my judgments are not given unto men; and as the words have gone forth out of my mouth even so shall they be fulfilled, that the first shall be last, and that the last shall be first in all things whatsoever I have created by the word of my power, which is the power of my Spirit.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.29
- type: DcVerse
  data:
    ref: dc.29.31
    scripture: doctrine-and-covenants
    name: D&C 29:31
    chapter: 29
    verse: 31
    ordinal: 614
    text: For by the power of my Spirit created I them; yea, all things both spiritual and temporal—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.29
- type: DcVerse
  data:
    ref: dc.29.32
    scripture: doctrine-and-covenants
    name: D&C 29:32
    chapter: 29
    verse: 32
    ordinal: 615
    text: First spiritual, secondly temporal, which is the beginning of my work; and again, first temporal, and secondly spiritual, which is the last of my work—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.29
- type: DcVerse
  data:
    ref: dc.29.33
    scripture: doctrine-and-covenants
    name: D&C 29:33
    chapter: 29
    verse: 33
    ordinal: 616
    text: Speaking unto you that you may naturally understand; but unto myself my works have no end, neither beginning; but it is given unto you that ye may understand, because ye have asked it of me and are agreed.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.29
- type: DcVerse
  data:
    ref: dc.29.34
    scripture: doctrine-and-covenants
    name: D&C 29:34
    chapter: 29
    verse: 34
    ordinal: 617
    text: Wherefore, verily I say unto you that all things unto me are spiritual, and not at any time have I given unto you a law which was temporal; neither any man, nor the children of men; neither Adam, your father, whom I created.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.29
- type: DcVerse
  data:
    ref: dc.29.35
    scripture: doctrine-and-covenants
    name: D&C 29:35
    chapter: 29
    verse: 35
    ordinal: 618
    text: Behold, I gave unto him that he should be an agent unto himself; and I gave unto him commandment, but no temporal commandment gave I unto him, for my commandments are spiritual; they are not natural nor temporal, neither carnal nor sensual.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.29
- type: DcVerse
  data:
    ref: dc.29.36
    scripture: doctrine-and-covenants
    name: D&C 29:36
    chapter: 29
    verse: 36
    ordinal: 619
    text: And it came to pass that Adam, being tempted of the devil—for, behold, the devil was before Adam, for he rebelled against me, saying, Give me thine honor, which is my power; and also a third part of the hosts of heaven turned he away from me because of their agency;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.29
- type: DcVerse
  data:
    ref: dc.29.37
    scripture: doctrine-and-covenants
    name: D&C 29:37
    chapter: 29
    verse: 37
    ordinal: 620
    text: And they were thrust down, and thus came the devil and his angels;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.29
- type: DcVerse
  data:
    ref: dc.29.38
    scripture: doctrine-and-covenants
    name: D&C 29:38
    chapter: 29
    verse: 38
    ordinal: 621
    text: And, behold, there is a place prepared for them from the beginning, which place is hell.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.29
- type: DcVerse
  data:
    ref: dc.29.39
    scripture: doctrine-and-covenants
    name: D&C 29:39
    chapter: 29
    verse: 39
    ordinal: 622
    text: And it must needs be that the devil should tempt the children of men, or they could not be agents unto themselves; for if they never should have bitter they could not know the sweet—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.29
- type: DcVerse
  data:
    ref: dc.29.40
    scripture: doctrine-and-covenants
    name: D&C 29:40
    chapter: 29
    verse: 40
    ordinal: 623
    text: Wherefore, it came to pass that the devil tempted Adam, and he partook of the forbidden fruit and transgressed the commandment, wherein he became subject to the will of the devil, because he yielded unto temptation.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.29
- type: DcVerse
  data:
    ref: dc.29.41
    scripture: doctrine-and-covenants
    name: D&C 29:41
    chapter: 29
    verse: 41
    ordinal: 624
    text: 'Wherefore, I, the Lord God, caused that he should be cast out from the Garden of Eden, from my presence, because of his transgression, wherein he became spiritually dead, which is the first death, even that same death which is the last death, which is spiritual, which shall be pronounced upon the wicked when I shall say: Depart, ye cursed.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.29
- type: DcVerse
  data:
    ref: dc.29.42
    scripture: doctrine-and-covenants
    name: D&C 29:42
    chapter: 29
    verse: 42
    ordinal: 625
    text: But, behold, I say unto you that I, the Lord God, gave unto Adam and unto his seed, that they should not die as to the temporal death, until I, the Lord God, should send forth angels to declare unto them repentance and redemption, through faith on the name of mine Only Begotten Son.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.29
- type: DcVerse
  data:
    ref: dc.29.43
    scripture: doctrine-and-covenants
    name: D&C 29:43
    chapter: 29
    verse: 43
    ordinal: 626
    text: And thus did I, the Lord God, appoint unto man the days of his probation—that by his natural death he might be raised in immortality unto eternal life, even as many as would believe;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.29
- type: DcVerse
  data:
    ref: dc.29.44
    scripture: doctrine-and-covenants
    name: D&C 29:44
    chapter: 29
    verse: 44
    ordinal: 627
    text: And they that believe not unto eternal damnation; for they cannot be redeemed from their spiritual fall, because they repent not;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.29
- type: DcVerse
  data:
    ref: dc.29.45
    scripture: doctrine-and-covenants
    name: D&C 29:45
    chapter: 29
    verse: 45
    ordinal: 628
    text: For they love darkness rather than light, and their deeds are evil, and they receive their wages of whom they list to obey.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - John 3:19
    kjvAllusionOsis:
    - John.3.19
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.29
- type: DcVerse
  data:
    ref: dc.29.46
    scripture: doctrine-and-covenants
    name: D&C 29:46
    chapter: 29
    verse: 46
    ordinal: 629
    text: But behold, I say unto you, that little children are redeemed from the foundation of the world through mine Only Begotten;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.29
- type: DcVerse
  data:
    ref: dc.29.47
    scripture: doctrine-and-covenants
    name: D&C 29:47
    chapter: 29
    verse: 47
    ordinal: 630
    text: Wherefore, they cannot sin, for power is not given unto Satan to tempt little children, until they begin to become accountable before me;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.29
- type: DcVerse
  data:
    ref: dc.29.48
    scripture: doctrine-and-covenants
    name: D&C 29:48
    chapter: 29
    verse: 48
    ordinal: 631
    text: For it is given unto them even as I will, according to mine own pleasure, that great things may be required at the hand of their fathers.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.29
- type: DcVerse
  data:
    ref: dc.29.49
    scripture: doctrine-and-covenants
    name: D&C 29:49
    chapter: 29
    verse: 49
    ordinal: 632
    text: And, again, I say unto you, that whoso having knowledge, have I not commanded to repent?
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.29
- type: DcVerse
  data:
    ref: dc.29.50
    scripture: doctrine-and-covenants
    name: D&C 29:50
    chapter: 29
    verse: 50
    ordinal: 633
    text: And he that hath no understanding, it remaineth in me to do according as it is written. And now I declare no more unto you at this time. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.29
- type: DcVerse
  data:
    ref: dc.30.1
    scripture: doctrine-and-covenants
    name: D&C 30:1
    chapter: 30
    verse: 1
    ordinal: 634
    text: Behold, I say unto you, David, that you have feared man and have not relied on me for strength as you ought.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.30
- type: DcVerse
  data:
    ref: dc.30.2
    scripture: doctrine-and-covenants
    name: D&C 30:2
    chapter: 30
    verse: 2
    ordinal: 635
    text: But your mind has been on the things of the earth more than on the things of me, your Maker, and the ministry whereunto you have been called; and you have not given heed unto my Spirit, and to those who were set over you, but have been persuaded by those whom I have not commanded.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.30
- type: DcVerse
  data:
    ref: dc.30.3
    scripture: doctrine-and-covenants
    name: D&C 30:3
    chapter: 30
    verse: 3
    ordinal: 636
    text: Wherefore, you are left to inquire for yourself at my hand, and ponder upon the things which you have received.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.30
- type: DcVerse
  data:
    ref: dc.30.4
    scripture: doctrine-and-covenants
    name: D&C 30:4
    chapter: 30
    verse: 4
    ordinal: 637
    text: And your home shall be at your father's house, until I give unto you further commandments. And you shall attend to the ministry in the church, and before the world, and in the regions round about. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.30
- type: DcVerse
  data:
    ref: dc.30.5
    scripture: doctrine-and-covenants
    name: D&C 30:5
    chapter: 30
    verse: 5
    ordinal: 638
    text: Behold, I say unto you, Peter, that you shall take your journey with your brother Oliver; for the time has come that it is expedient in me that you shall open your mouth to declare my gospel; therefore, fear not, but give heed unto the words and advice of your brother, which he shall give you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.30
- type: DcVerse
  data:
    ref: dc.30.6
    scripture: doctrine-and-covenants
    name: D&C 30:6
    chapter: 30
    verse: 6
    ordinal: 639
    text: And be you afflicted in all his afflictions, ever lifting up your heart unto me in prayer and faith, for his and your deliverance; for I have given unto him power to build up my church among the Lamanites;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.30
- type: DcVerse
  data:
    ref: dc.30.7
    scripture: doctrine-and-covenants
    name: D&C 30:7
    chapter: 30
    verse: 7
    ordinal: 640
    text: And none have I appointed to be his counselor over him in the church, concerning church matters, except it is his brother, Joseph Smith, Jun.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.30
- type: DcVerse
  data:
    ref: dc.30.8
    scripture: doctrine-and-covenants
    name: D&C 30:8
    chapter: 30
    verse: 8
    ordinal: 641
    text: Wherefore, give heed unto these things and be diligent in keeping my commandments, and you shall be blessed unto eternal life. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.30
- type: DcVerse
  data:
    ref: dc.30.9
    scripture: doctrine-and-covenants
    name: D&C 30:9
    chapter: 30
    verse: 9
    ordinal: 642
    text: Behold, I say unto you, my servant John, that thou shalt commence from this time forth to proclaim my gospel, as with the voice of a trump.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.30
- type: DcVerse
  data:
    ref: dc.30.10
    scripture: doctrine-and-covenants
    name: D&C 30:10
    chapter: 30
    verse: 10
    ordinal: 643
    text: And your labor shall be at your brother Philip Burroughs', and in that region round about, yea, wherever you can be heard, until I command you to go from hence.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.30
- type: DcVerse
  data:
    ref: dc.30.11
    scripture: doctrine-and-covenants
    name: D&C 30:11
    chapter: 30
    verse: 11
    ordinal: 644
    text: And your whole labor shall be in Zion, with all your soul, from henceforth; yea, you shall ever open your mouth in my cause, not fearing what man can do, for I am with you. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.30
- type: DcVerse
  data:
    ref: dc.31.1
    scripture: doctrine-and-covenants
    name: D&C 31:1
    chapter: 31
    verse: 1
    ordinal: 645
    text: Thomas, my son, blessed are you because of your faith in my work.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.31
- type: DcVerse
  data:
    ref: dc.31.2
    scripture: doctrine-and-covenants
    name: D&C 31:2
    chapter: 31
    verse: 2
    ordinal: 646
    text: Behold, you have had many afflictions because of your family; nevertheless, I will bless you and your family, yea, your little ones; and the day cometh that they will believe and know the truth and be one with you in my church.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.31
- type: DcVerse
  data:
    ref: dc.31.3
    scripture: doctrine-and-covenants
    name: D&C 31:3
    chapter: 31
    verse: 3
    ordinal: 647
    text: Lift up your heart and rejoice, for the hour of your mission is come; and your tongue shall be loosed, and you shall declare glad tidings of great joy unto this generation.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.31
- type: DcVerse
  data:
    ref: dc.31.4
    scripture: doctrine-and-covenants
    name: D&C 31:4
    chapter: 31
    verse: 4
    ordinal: 648
    text: You shall declare the things which have been revealed to my servant, Joseph Smith, Jun. You shall begin to preach from this time forth, yea, to reap in the field which is white already to be burned.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.31
- type: DcVerse
  data:
    ref: dc.31.5
    scripture: doctrine-and-covenants
    name: D&C 31:5
    chapter: 31
    verse: 5
    ordinal: 649
    text: Therefore, thrust in your sickle with all your soul, and your sins are forgiven you, and you shall be laden with sheaves upon your back, for the laborer is worthy of his hire. Wherefore, your family shall live.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.31
- type: DcVerse
  data:
    ref: dc.31.6
    scripture: doctrine-and-covenants
    name: D&C 31:6
    chapter: 31
    verse: 6
    ordinal: 650
    text: Behold, verily I say unto you, go from them only for a little time, and declare my word, and I will prepare a place for them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.31
- type: DcVerse
  data:
    ref: dc.31.7
    scripture: doctrine-and-covenants
    name: D&C 31:7
    chapter: 31
    verse: 7
    ordinal: 651
    text: Yea, I will open the hearts of the people, and they will receive you. And I will establish a church by your hand;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.31
- type: DcVerse
  data:
    ref: dc.31.8
    scripture: doctrine-and-covenants
    name: D&C 31:8
    chapter: 31
    verse: 8
    ordinal: 652
    text: And you shall strengthen them and prepare them against the time when they shall be gathered.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.31
- type: DcVerse
  data:
    ref: dc.31.9
    scripture: doctrine-and-covenants
    name: D&C 31:9
    chapter: 31
    verse: 9
    ordinal: 653
    text: Be patient in afflictions, revile not against those that revile. Govern your house in meekness, and be steadfast.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.31
- type: DcVerse
  data:
    ref: dc.31.10
    scripture: doctrine-and-covenants
    name: D&C 31:10
    chapter: 31
    verse: 10
    ordinal: 654
    text: Behold, I say unto you that you shall be a physician unto the church, but not unto the world, for they will not receive you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.31
- type: DcVerse
  data:
    ref: dc.31.11
    scripture: doctrine-and-covenants
    name: D&C 31:11
    chapter: 31
    verse: 11
    ordinal: 655
    text: Go your way whithersoever I will, and it shall be given you by the Comforter what you shall do and whither you shall go.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.31
- type: DcVerse
  data:
    ref: dc.31.12
    scripture: doctrine-and-covenants
    name: D&C 31:12
    chapter: 31
    verse: 12
    ordinal: 656
    text: Pray always, lest you enter into temptation and lose your reward.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Luke 22:46
    kjvAllusionOsis:
    - Luke.22.46
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.31
- type: DcVerse
  data:
    ref: dc.31.13
    scripture: doctrine-and-covenants
    name: D&C 31:13
    chapter: 31
    verse: 13
    ordinal: 657
    text: Be faithful unto the end, and lo, I am with you. These words are not of man nor of men, but of me, even Jesus Christ, your Redeemer, by the will of the Father. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.31
- type: DcVerse
  data:
    ref: dc.32.1
    scripture: doctrine-and-covenants
    name: D&C 32:1
    chapter: 32
    verse: 1
    ordinal: 658
    text: And now concerning my servant Parley P. Pratt, behold, I say unto him that as I live I will that he shall declare my gospel and learn of me, and be meek and lowly of heart.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.32
- type: DcVerse
  data:
    ref: dc.32.2
    scripture: doctrine-and-covenants
    name: D&C 32:2
    chapter: 32
    verse: 2
    ordinal: 659
    text: And that which I have appointed unto him is that he shall go with my servants, Oliver Cowdery and Peter Whitmer, Jun., into the wilderness among the Lamanites.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.32
- type: DcVerse
  data:
    ref: dc.32.3
    scripture: doctrine-and-covenants
    name: D&C 32:3
    chapter: 32
    verse: 3
    ordinal: 660
    text: And Ziba Peterson also shall go with them; and I myself will go with them and be in their midst; and I am their advocate with the Father, and nothing shall prevail against them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.32
- type: DcVerse
  data:
    ref: dc.32.4
    scripture: doctrine-and-covenants
    name: D&C 32:4
    chapter: 32
    verse: 4
    ordinal: 661
    text: And they shall give heed to that which is written, and pretend to no other revelation; and they shall pray always that I may unfold the same to their understanding.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.32
- type: DcVerse
  data:
    ref: dc.32.5
    scripture: doctrine-and-covenants
    name: D&C 32:5
    chapter: 32
    verse: 5
    ordinal: 662
    text: And they shall give heed unto these words and trifle not, and I will bless them. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.32
- type: DcVerse
  data:
    ref: dc.33.1
    scripture: doctrine-and-covenants
    name: D&C 33:1
    chapter: 33
    verse: 1
    ordinal: 663
    text: Behold, I say unto you, my servants Ezra and Northrop, open ye your ears and hearken to the voice of the Lord your God, whose word is quick and powerful, sharper than a two-edged sword, to the dividing asunder of the joints and marrow, soul and spirit; and is a discerner of the thoughts and intents of the heart.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Hebrews 4:12
    kjvOsis:
    - Heb.4.12
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.33
- type: DcVerse
  data:
    ref: dc.33.2
    scripture: doctrine-and-covenants
    name: D&C 33:2
    chapter: 33
    verse: 2
    ordinal: 664
    text: For verily, verily, I say unto you that ye are called to lift up your voices as with the sound of a trump, to declare my gospel unto a crooked and perverse generation.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.33
- type: DcVerse
  data:
    ref: dc.33.3
    scripture: doctrine-and-covenants
    name: D&C 33:3
    chapter: 33
    verse: 3
    ordinal: 665
    text: For behold, the field is white already to harvest; and it is the eleventh hour, and the last time that I shall call laborers into my vineyard.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.33
- type: DcVerse
  data:
    ref: dc.33.4
    scripture: doctrine-and-covenants
    name: D&C 33:4
    chapter: 33
    verse: 4
    ordinal: 666
    text: And my vineyard has become corrupted every whit; and there is none which doeth good save it be a few; and they err in many instances because of priestcrafts, all having corrupt minds.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.33
- type: DcVerse
  data:
    ref: dc.33.5
    scripture: doctrine-and-covenants
    name: D&C 33:5
    chapter: 33
    verse: 5
    ordinal: 667
    text: And verily, verily, I say unto you, that this church have I established and called forth out of the wilderness.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.33
- type: DcVerse
  data:
    ref: dc.33.6
    scripture: doctrine-and-covenants
    name: D&C 33:6
    chapter: 33
    verse: 6
    ordinal: 668
    text: And even so will I gather mine elect from the four quarters of the earth, even as many as will believe in me, and hearken unto my voice.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.33
- type: DcVerse
  data:
    ref: dc.33.7
    scripture: doctrine-and-covenants
    name: D&C 33:7
    chapter: 33
    verse: 7
    ordinal: 669
    text: Yea, verily, verily, I say unto you, that the field is white already to harvest; wherefore, thrust in your sickles, and reap with all your might, mind, and strength.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.33
- type: DcVerse
  data:
    ref: dc.33.8
    scripture: doctrine-and-covenants
    name: D&C 33:8
    chapter: 33
    verse: 8
    ordinal: 670
    text: Open your mouths and they shall be filled, and you shall become even as Nephi of old, who journeyed from Jerusalem in the wilderness.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.33
- type: DcVerse
  data:
    ref: dc.33.9
    scripture: doctrine-and-covenants
    name: D&C 33:9
    chapter: 33
    verse: 9
    ordinal: 671
    text: Yea, open your mouths and spare not, and you shall be laden with sheaves upon your backs, for lo, I am with you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.33
- type: DcVerse
  data:
    ref: dc.33.10
    scripture: doctrine-and-covenants
    name: D&C 33:10
    chapter: 33
    verse: 10
    ordinal: 672
    text: 'Yea, open your mouths and they shall be filled, saying: Repent, repent, and prepare ye the way of the Lord, and make his paths straight; for the kingdom of heaven is at hand;'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.33
- type: DcVerse
  data:
    ref: dc.33.11
    scripture: doctrine-and-covenants
    name: D&C 33:11
    chapter: 33
    verse: 11
    ordinal: 673
    text: Yea, repent and be baptized, every one of you, for a remission of your sins; yea, be baptized even by water, and then cometh the baptism of fire and of the Holy Ghost.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Acts 2:38
    kjvAllusionOsis:
    - Acts.2.38
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.33
- type: DcVerse
  data:
    ref: dc.33.12
    scripture: doctrine-and-covenants
    name: D&C 33:12
    chapter: 33
    verse: 12
    ordinal: 674
    text: Behold, verily, verily, I say unto you, this is my gospel; and remember that they shall have faith in me or they can in nowise be saved;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.33
- type: DcVerse
  data:
    ref: dc.33.13
    scripture: doctrine-and-covenants
    name: D&C 33:13
    chapter: 33
    verse: 13
    ordinal: 675
    text: And upon this rock I will build my church; yea, upon this rock ye are built, and if ye continue, the gates of hell shall not prevail against you.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Matthew 16:18
    kjvAllusionOsis:
    - Matt.16.18
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.33
- type: DcVerse
  data:
    ref: dc.33.14
    scripture: doctrine-and-covenants
    name: D&C 33:14
    chapter: 33
    verse: 14
    ordinal: 676
    text: And ye shall remember the church articles and covenants to keep them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.33
- type: DcVerse
  data:
    ref: dc.33.15
    scripture: doctrine-and-covenants
    name: D&C 33:15
    chapter: 33
    verse: 15
    ordinal: 677
    text: And whoso having faith you shall confirm in my church, by the laying on of the hands, and I will bestow the gift of the Holy Ghost upon them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.33
- type: DcVerse
  data:
    ref: dc.33.16
    scripture: doctrine-and-covenants
    name: D&C 33:16
    chapter: 33
    verse: 16
    ordinal: 678
    text: And the Book of Mormon and the holy scriptures are given of me for your instruction; and the power of my Spirit quickeneth all things.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.33
- type: DcVerse
  data:
    ref: dc.33.17
    scripture: doctrine-and-covenants
    name: D&C 33:17
    chapter: 33
    verse: 17
    ordinal: 679
