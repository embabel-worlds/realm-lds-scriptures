    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.18
- type: DcVerse
  data:
    ref: dc.18.45
    scripture: doctrine-and-covenants
    name: D&C 18:45
    chapter: 18
    verse: 45
    ordinal: 362
    text: Wherefore, the blessings which I give unto you are above all things.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.18
- type: DcVerse
  data:
    ref: dc.18.46
    scripture: doctrine-and-covenants
    name: D&C 18:46
    chapter: 18
    verse: 46
    ordinal: 363
    text: And after that you have received this, if you keep not my commandments you cannot be saved in the kingdom of my Father.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.18
- type: DcVerse
  data:
    ref: dc.18.47
    scripture: doctrine-and-covenants
    name: D&C 18:47
    chapter: 18
    verse: 47
    ordinal: 364
    text: Behold, I, Jesus Christ, your Lord and your God, and your Redeemer, by the power of my Spirit have spoken it. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.18
- type: DcVerse
  data:
