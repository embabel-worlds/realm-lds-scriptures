    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.54
- type: DcVerse
  data:
    ref: dc.54.6
    scripture: doctrine-and-covenants
    name: D&C 54:6
    chapter: 54
    verse: 6
    ordinal: 1215
    text: But blessed are they who have kept the covenant and observed the commandment, for they shall obtain mercy.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Matthew 5:7
    kjvAllusionOsis:
    - Matt.5.7
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.54
- type: DcVerse
  data:
    ref: dc.54.7
    scripture: doctrine-and-covenants
    name: D&C 54:7
    chapter: 54
    verse: 7
    ordinal: 1216
    text: Wherefore, go to now and flee the land, lest your enemies come upon you; and take your journey, and appoint whom you will to be your leader, and to pay moneys for you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.54
- type: DcVerse
  data:
    ref: dc.54.8
    scripture: doctrine-and-covenants
    name: D&C 54:8
    chapter: 54
    verse: 8
    ordinal: 1217
    text: And thus you shall take your journey into the regions westward, unto the land of Missouri, unto the borders of the Lamanites.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.54
- type: DcVerse
  data:
    ref: dc.54.9
    scripture: doctrine-and-covenants
    name: D&C 54:9
    chapter: 54
    verse: 9
    ordinal: 1218
    text: And after you have done journeying, behold, I say unto you, seek ye a living like unto men, until I prepare a place for you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.54
- type: DcVerse
  data:
    ref: dc.54.10
    scripture: doctrine-and-covenants
    name: D&C 54:10
    chapter: 54
    verse: 10
    ordinal: 1219
    text: And again, be patient in tribulation until I come; and, behold, I come quickly, and my reward is with me, and they who have sought me early shall find rest to their souls. Even so. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.54
- type: DcVerse
  data:
    ref: dc.55.1
    scripture: doctrine-and-covenants
    name: D&C 55:1
    chapter: 55
    verse: 1
    ordinal: 1220
    text: Behold, thus saith the Lord unto you, my servant William, yea, even the Lord of the whole earth, thou art called and chosen; and after thou hast been baptized by water, which if you do with an eye single to my glory, you shall have a remission of your sins and a reception of the Holy Spirit by the laying on of hands;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.55
- type: DcVerse
  data:
    ref: dc.55.2
    scripture: doctrine-and-covenants
    name: D&C 55:2
    chapter: 55
    verse: 2
    ordinal: 1221
    text: And then thou shalt be ordained by the hand of my servant Joseph Smith, Jun., to be an elder unto this church, to preach repentance and remission of sins by way of baptism in the name of Jesus Christ, the Son of the living God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.55
- type: DcVerse
  data:
    ref: dc.55.3
    scripture: doctrine-and-covenants
    name: D&C 55:3
    chapter: 55
    verse: 3
    ordinal: 1222
    text: And on whomsoever you shall lay your hands, if they are contrite before me, you shall have power to give the Holy Spirit.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Acts 8:19
    kjvAllusionOsis:
    - Acts.8.19
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.55
- type: DcVerse
  data:
    ref: dc.55.4
    scripture: doctrine-and-covenants
    name: D&C 55:4
    chapter: 55
    verse: 4
    ordinal: 1223
    text: And again, you shall be ordained to assist my servant Oliver Cowdery to do the work of printing, and of selecting and writing books for schools in this church, that little children also may receive instruction before me as is pleasing unto me.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.55
- type: DcVerse
  data:
    ref: dc.55.5
    scripture: doctrine-and-covenants
    name: D&C 55:5
    chapter: 55
    verse: 5
    ordinal: 1224
    text: And again, verily I say unto you, for this cause you shall take your journey with my servants Joseph Smith, Jun., and Sidney Rigdon, that you may be planted in the land of your inheritance to do this work.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.55
- type: DcVerse
  data:
    ref: dc.55.6
    scripture: doctrine-and-covenants
    name: D&C 55:6
    chapter: 55
    verse: 6
    ordinal: 1225
    text: And again, let my servant Joseph Coe also take his journey with them. The residue shall be made known hereafter, even as I will. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.55
- type: DcVerse
  data:
    ref: dc.56.1
    scripture: doctrine-and-covenants
    name: D&C 56:1
    chapter: 56
    verse: 1
    ordinal: 1226
    text: Hearken, O ye people who profess my name, saith the Lord your God; for behold, mine anger is kindled against the rebellious, and they shall know mine arm and mine indignation, in the day of visitation and of wrath upon the nations.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.56
- type: DcVerse
  data:
    ref: dc.56.2
    scripture: doctrine-and-covenants
    name: D&C 56:2
    chapter: 56
    verse: 2
    ordinal: 1227
    text: And he that will not take up his cross and follow me, and keep my commandments, the same shall not be saved.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.56
- type: DcVerse
  data:
    ref: dc.56.3
    scripture: doctrine-and-covenants
    name: D&C 56:3
    chapter: 56
    verse: 3
    ordinal: 1228
    text: Behold, I, the Lord, command; and he that will not obey shall be cut off in mine own due time, after I have commanded and the commandment is broken.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.56
- type: DcVerse
  data:
    ref: dc.56.4
    scripture: doctrine-and-covenants
    name: D&C 56:4
    chapter: 56
    verse: 4
    ordinal: 1229
    text: Wherefore I, the Lord, command and revoke, as it seemeth me good; and all this to be answered upon the heads of the rebellious, saith the Lord.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.56
- type: DcVerse
  data:
    ref: dc.56.5
    scripture: doctrine-and-covenants
    name: D&C 56:5
    chapter: 56
    verse: 5
    ordinal: 1230
    text: Wherefore, I revoke the commandment which was given unto my servants Thomas B. Marsh and Ezra Thayre, and give a new commandment unto my servant Thomas, that he shall take up his journey speedily to the land of Missouri, and my servant Selah J. Griffin shall also go with him.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.56
- type: DcVerse
  data:
    ref: dc.56.6
    scripture: doctrine-and-covenants
    name: D&C 56:6
    chapter: 56
    verse: 6
    ordinal: 1231
    text: For behold, I revoke the commandment which was given unto my servants Selah J. Griffin and Newel Knight, in consequence of the stiffneckedness of my people which are in Thompson, and their rebellions.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.56
- type: DcVerse
  data:
    ref: dc.56.7
    scripture: doctrine-and-covenants
    name: D&C 56:7
    chapter: 56
    verse: 7
    ordinal: 1232
    text: Wherefore, let my servant Newel Knight remain with them; and as many as will go may go, that are contrite before me, and be led by him to the land which I have appointed.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.56
- type: DcVerse
  data:
    ref: dc.56.8
    scripture: doctrine-and-covenants
    name: D&C 56:8
    chapter: 56
    verse: 8
    ordinal: 1233
    text: And again, verily I say unto you, that my servant Ezra Thayre must repent of his pride, and of his selfishness, and obey the former commandment which I have given him concerning the place upon which he lives.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.56
- type: DcVerse
  data:
    ref: dc.56.9
    scripture: doctrine-and-covenants
    name: D&C 56:9
    chapter: 56
    verse: 9
    ordinal: 1234
    text: And if he will do this, as there shall be no divisions made upon the land, he shall be appointed still to go to the land of Missouri;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.56
- type: DcVerse
  data:
    ref: dc.56.10
    scripture: doctrine-and-covenants
    name: D&C 56:10
    chapter: 56
    verse: 10
    ordinal: 1235
    text: Otherwise he shall receive the money which he has paid, and shall leave the place, and shall be cut off out of my church, saith the Lord God of hosts;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.56
- type: DcVerse
  data:
    ref: dc.56.11
    scripture: doctrine-and-covenants
    name: D&C 56:11
    chapter: 56
    verse: 11
    ordinal: 1236
    text: And though the heaven and the earth pass away, these words shall not pass away, but shall be fulfilled.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.56
- type: DcVerse
  data:
    ref: dc.56.12
    scripture: doctrine-and-covenants
    name: D&C 56:12
    chapter: 56
    verse: 12
    ordinal: 1237
    text: And if my servant Joseph Smith, Jun., must needs pay the money, behold, I, the Lord, will pay it unto him again in the land of Missouri, that those of whom he shall receive may be rewarded again according to that which they do;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.56
- type: DcVerse
  data:
    ref: dc.56.13
    scripture: doctrine-and-covenants
    name: D&C 56:13
    chapter: 56
    verse: 13
    ordinal: 1238
    text: For according to that which they do they shall receive, even in lands for their inheritance.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.56
- type: DcVerse
  data:
    ref: dc.56.14
    scripture: doctrine-and-covenants
    name: D&C 56:14
    chapter: 56
    verse: 14
    ordinal: 1239
    text: Behold, thus saith the Lord unto my people—you have many things to do and to repent of; for behold, your sins have come up unto me, and are not pardoned, because you seek to counsel in your own ways.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.56
- type: DcVerse
  data:
    ref: dc.56.15
    scripture: doctrine-and-covenants
    name: D&C 56:15
    chapter: 56
    verse: 15
    ordinal: 1240
    text: And your hearts are not satisfied. And ye obey not the truth, but have pleasure in unrighteousness.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Romans 2:8
    kjvAllusionOsis:
    - Rom.2.8
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.56
- type: DcVerse
  data:
    ref: dc.56.16
    scripture: doctrine-and-covenants
    name: D&C 56:16
    chapter: 56
    verse: 16
    ordinal: 1241
    text: 'Wo unto you rich men, that will not give your substance to the poor, for your riches will canker your souls; and this shall be your lamentation in the day of visitation, and of judgment, and of indignation: The harvest is past, the summer is ended, and my soul is not saved!'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.56
- type: DcVerse
  data:
    ref: dc.56.17
    scripture: doctrine-and-covenants
    name: D&C 56:17
    chapter: 56
    verse: 17
    ordinal: 1242
    text: Wo unto you poor men, whose hearts are not broken, whose spirits are not contrite, and whose bellies are not satisfied, and whose hands are not stayed from laying hold upon other men's goods, whose eyes are full of greediness, and who will not labor with your own hands!
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.56
- type: DcVerse
  data:
    ref: dc.56.18
    scripture: doctrine-and-covenants
    name: D&C 56:18
    chapter: 56
    verse: 18
    ordinal: 1243
    text: But blessed are the poor who are pure in heart, whose hearts are broken, and whose spirits are contrite, for they shall see the kingdom of God coming in power and great glory unto their deliverance; for the fatness of the earth shall be theirs.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.56
- type: DcVerse
  data:
    ref: dc.56.19
    scripture: doctrine-and-covenants
    name: D&C 56:19
    chapter: 56
    verse: 19
    ordinal: 1244
    text: For behold, the Lord shall come, and his recompense shall be with him, and he shall reward every man, and the poor shall rejoice;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.56
- type: DcVerse
  data:
    ref: dc.56.20
    scripture: doctrine-and-covenants
    name: D&C 56:20
    chapter: 56
    verse: 20
    ordinal: 1245
    text: And their generations shall inherit the earth from generation to generation, forever and ever. And now I make an end of speaking unto you. Even so. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.56
- type: DcVerse
  data:
    ref: dc.57.1
    scripture: doctrine-and-covenants
    name: D&C 57:1
    chapter: 57
    verse: 1
    ordinal: 1246
    text: Hearken, O ye elders of my church, saith the Lord your God, who have assembled yourselves together, according to my commandments, in this land, which is the land of Missouri, which is the land which I have appointed and consecrated for the gathering of the saints.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.57
- type: DcVerse
  data:
    ref: dc.57.2
    scripture: doctrine-and-covenants
    name: D&C 57:2
    chapter: 57
    verse: 2
    ordinal: 1247
    text: Wherefore, this is the land of promise, and the place for the city of Zion.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.57
- type: DcVerse
  data:
    ref: dc.57.3
    scripture: doctrine-and-covenants
    name: D&C 57:3
    chapter: 57
    verse: 3
    ordinal: 1248
    text: And thus saith the Lord your God, if you will receive wisdom here is wisdom. Behold, the place which is now called Independence is the center place; and a spot for the temple is lying westward, upon a lot which is not far from the courthouse.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.57
- type: DcVerse
  data:
    ref: dc.57.4
    scripture: doctrine-and-covenants
    name: D&C 57:4
    chapter: 57
    verse: 4
    ordinal: 1249
    text: Wherefore, it is wisdom that the land should be purchased by the saints, and also every tract lying westward, even unto the line running directly between Jew and Gentile;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.57
- type: DcVerse
  data:
    ref: dc.57.5
    scripture: doctrine-and-covenants
    name: D&C 57:5
    chapter: 57
    verse: 5
    ordinal: 1250
    text: And also every tract bordering by the prairies, inasmuch as my disciples are enabled to buy lands. Behold, this is wisdom, that they may obtain it for an everlasting inheritance.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.57
- type: DcVerse
  data:
    ref: dc.57.6
    scripture: doctrine-and-covenants
    name: D&C 57:6
    chapter: 57
    verse: 6
    ordinal: 1251
    text: And let my servant Sidney Gilbert stand in the office to which I have appointed him, to receive moneys, to be an agent unto the church, to buy land in all the regions round about, inasmuch as can be done in righteousness, and as wisdom shall direct.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.57
- type: DcVerse
  data:
    ref: dc.57.7
    scripture: doctrine-and-covenants
    name: D&C 57:7
    chapter: 57
    verse: 7
    ordinal: 1252
    text: And let my servant Edward Partridge stand in the office to which I have appointed him, and divide unto the saints their inheritance, even as I have commanded; and also those whom he has appointed to assist him.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.57
- type: DcVerse
  data:
    ref: dc.57.8
    scripture: doctrine-and-covenants
    name: D&C 57:8
    chapter: 57
    verse: 8
    ordinal: 1253
    text: And again, verily I say unto you, let my servant Sidney Gilbert plant himself in this place, and establish a store, that he may sell goods without fraud, that he may obtain money to buy lands for the good of the saints, and that he may obtain whatsoever things the disciples may need to plant them in their inheritance.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.57
- type: DcVerse
  data:
    ref: dc.57.9
    scripture: doctrine-and-covenants
    name: D&C 57:9
    chapter: 57
    verse: 9
    ordinal: 1254
    text: And also let my servant Sidney Gilbert obtain a license—behold here is wisdom, and whoso readeth let him understand—that he may send goods also unto the people, even by whom he will as clerks employed in his service;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.57
- type: DcVerse
  data:
    ref: dc.57.10
    scripture: doctrine-and-covenants
    name: D&C 57:10
    chapter: 57
    verse: 10
    ordinal: 1255
    text: And thus provide for my saints, that my gospel may be preached unto those who sit in darkness and in the region and shadow of death.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.57
- type: DcVerse
  data:
    ref: dc.57.11
    scripture: doctrine-and-covenants
    name: D&C 57:11
    chapter: 57
    verse: 11
    ordinal: 1256
    text: And again, verily I say unto you, let my servant William W. Phelps be planted in this place, and be established as a printer unto the church.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.57
- type: DcVerse
  data:
    ref: dc.57.12
    scripture: doctrine-and-covenants
    name: D&C 57:12
    chapter: 57
    verse: 12
    ordinal: 1257
    text: And lo, if the world receive his writings—behold here is wisdom—let him obtain whatsoever he can obtain in righteousness, for the good of the saints.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.57
- type: DcVerse
  data:
    ref: dc.57.13
    scripture: doctrine-and-covenants
    name: D&C 57:13
    chapter: 57
    verse: 13
    ordinal: 1258
    text: And let my servant Oliver Cowdery assist him, even as I have commanded, in whatsoever place I shall appoint unto him, to copy, and to correct, and select, that all things may be right before me, as it shall be proved by the Spirit through him.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.57
- type: DcVerse
  data:
    ref: dc.57.14
    scripture: doctrine-and-covenants
    name: D&C 57:14
    chapter: 57
    verse: 14
    ordinal: 1259
    text: And thus let those of whom I have spoken be planted in the land of Zion, as speedily as can be, with their families, to do those things even as I have spoken.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.57
- type: DcVerse
  data:
    ref: dc.57.15
    scripture: doctrine-and-covenants
    name: D&C 57:15
    chapter: 57
    verse: 15
    ordinal: 1260
    text: And now concerning the gathering—Let the bishop and the agent make preparations for those families which have been commanded to come to this land, as soon as possible, and plant them in their inheritance.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.57
- type: DcVerse
  data:
    ref: dc.57.16
    scripture: doctrine-and-covenants
    name: D&C 57:16
    chapter: 57
    verse: 16
    ordinal: 1261
    text: And unto the residue of both elders and members further directions shall be given hereafter. Even so. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.57
- type: DcVerse
  data:
    ref: dc.58.1
    scripture: doctrine-and-covenants
    name: D&C 58:1
    chapter: 58
    verse: 1
    ordinal: 1262
    text: Hearken, O ye elders of my church, and give ear to my word, and learn of me what I will concerning you, and also concerning this land unto which I have sent you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.58
- type: DcVerse
  data:
    ref: dc.58.2
    scripture: doctrine-and-covenants
    name: D&C 58:2
    chapter: 58
    verse: 2
    ordinal: 1263
    text: For verily I say unto you, blessed is he that keepeth my commandments, whether in life or in death; and he that is faithful in tribulation, the reward of the same is greater in the kingdom of heaven.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.58
- type: DcVerse
  data:
    ref: dc.58.3
    scripture: doctrine-and-covenants
    name: D&C 58:3
    chapter: 58
    verse: 3
    ordinal: 1264
    text: Ye cannot behold with your natural eyes, for the present time, the design of your God concerning those things which shall come hereafter, and the glory which shall follow after much tribulation.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.58
- type: DcVerse
  data:
    ref: dc.58.4
    scripture: doctrine-and-covenants
    name: D&C 58:4
    chapter: 58
    verse: 4
    ordinal: 1265
    text: For after much tribulation come the blessings. Wherefore the day cometh that ye shall be crowned with much glory; the hour is not yet, but is nigh at hand.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.58
- type: DcVerse
  data:
    ref: dc.58.5
    scripture: doctrine-and-covenants
    name: D&C 58:5
    chapter: 58
    verse: 5
    ordinal: 1266
    text: Remember this, which I tell you before, that you may lay it to heart, and receive that which is to follow.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.58
- type: DcVerse
  data:
    ref: dc.58.6
    scripture: doctrine-and-covenants
    name: D&C 58:6
    chapter: 58
    verse: 6
    ordinal: 1267
    text: Behold, verily I say unto you, for this cause I have sent you—that you might be obedient, and that your hearts might be prepared to bear testimony of the things which are to come;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.58
- type: DcVerse
  data:
    ref: dc.58.7
    scripture: doctrine-and-covenants
    name: D&C 58:7
    chapter: 58
    verse: 7
    ordinal: 1268
    text: And also that you might be honored in laying the foundation, and in bearing record of the land upon which the Zion of God shall stand;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.58
- type: DcVerse
  data:
    ref: dc.58.8
    scripture: doctrine-and-covenants
    name: D&C 58:8
    chapter: 58
    verse: 8
    ordinal: 1269
    text: And also that a feast of fat things might be prepared for the poor; yea, a feast of fat things, of wine on the lees well refined, that the earth may know that the mouths of the prophets shall not fail;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.58
- type: DcVerse
  data:
    ref: dc.58.9
    scripture: doctrine-and-covenants
    name: D&C 58:9
    chapter: 58
    verse: 9
    ordinal: 1270
    text: Yea, a supper of the house of the Lord, well prepared, unto which all nations shall be invited.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.58
- type: DcVerse
  data:
    ref: dc.58.10
    scripture: doctrine-and-covenants
    name: D&C 58:10
    chapter: 58
    verse: 10
    ordinal: 1271
    text: First, the rich and the learned, the wise and the noble;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.58
- type: DcVerse
  data:
    ref: dc.58.11
    scripture: doctrine-and-covenants
    name: D&C 58:11
    chapter: 58
    verse: 11
    ordinal: 1272
    text: And after that cometh the day of my power; then shall the poor, the lame, and the blind, and the deaf, come in unto the marriage of the Lamb, and partake of the supper of the Lord, prepared for the great day to come.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.58
- type: DcVerse
  data:
    ref: dc.58.12
    scripture: doctrine-and-covenants
    name: D&C 58:12
    chapter: 58
    verse: 12
    ordinal: 1273
    text: Behold, I, the Lord, have spoken it.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.58
- type: DcVerse
  data:
    ref: dc.58.13
    scripture: doctrine-and-covenants
    name: D&C 58:13
    chapter: 58
    verse: 13
    ordinal: 1274
    text: And that the testimony might go forth from Zion, yea, from the mouth of the city of the heritage of God—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.58
- type: DcVerse
  data:
    ref: dc.58.14
    scripture: doctrine-and-covenants
    name: D&C 58:14
    chapter: 58
    verse: 14
    ordinal: 1275
    text: Yea, for this cause I have sent you hither, and have selected my servant Edward Partridge, and have appointed unto him his mission in this land.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.58
- type: DcVerse
  data:
    ref: dc.58.15
    scripture: doctrine-and-covenants
    name: D&C 58:15
    chapter: 58
    verse: 15
    ordinal: 1276
    text: But if he repent not of his sins, which are unbelief and blindness of heart, let him take heed lest he fall.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.58
- type: DcVerse
  data:
    ref: dc.58.16
    scripture: doctrine-and-covenants
    name: D&C 58:16
    chapter: 58
    verse: 16
    ordinal: 1277
    text: Behold his mission is given unto him, and it shall not be given again.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.58
- type: DcVerse
  data:
    ref: dc.58.17
    scripture: doctrine-and-covenants
    name: D&C 58:17
    chapter: 58
    verse: 17
    ordinal: 1278
    text: And whoso standeth in this mission is appointed to be a judge in Israel, like as it was in ancient days, to divide the lands of the heritage of God unto his children;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.58
- type: DcVerse
  data:
    ref: dc.58.18
    scripture: doctrine-and-covenants
    name: D&C 58:18
    chapter: 58
    verse: 18
    ordinal: 1279
    text: And to judge his people by the testimony of the just, and by the assistance of his counselors, according to the laws of the kingdom which are given by the prophets of God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.58
- type: DcVerse
  data:
    ref: dc.58.19
    scripture: doctrine-and-covenants
    name: D&C 58:19
    chapter: 58
    verse: 19
    ordinal: 1280
    text: For verily I say unto you, my law shall be kept on this land.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.58
- type: DcVerse
  data:
    ref: dc.58.20
    scripture: doctrine-and-covenants
    name: D&C 58:20
    chapter: 58
    verse: 20
    ordinal: 1281
    text: Let no man think he is ruler; but let God rule him that judgeth, according to the counsel of his own will, or, in other words, him that counseleth or sitteth upon the judgment seat.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.58
- type: DcVerse
  data:
    ref: dc.58.21
    scripture: doctrine-and-covenants
    name: D&C 58:21
    chapter: 58
    verse: 21
    ordinal: 1282
    text: Let no man break the laws of the land, for he that keepeth the laws of God hath no need to break the laws of the land.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.58
- type: DcVerse
  data:
    ref: dc.58.22
    scripture: doctrine-and-covenants
    name: D&C 58:22
    chapter: 58
    verse: 22
    ordinal: 1283
    text: Wherefore, be subject to the powers that be, until he reigns whose right it is to reign, and subdues all enemies under his feet.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.58
- type: DcVerse
  data:
    ref: dc.58.23
    scripture: doctrine-and-covenants
    name: D&C 58:23
    chapter: 58
    verse: 23
    ordinal: 1284
    text: Behold, the laws which ye have received from my hand are the laws of the church, and in this light ye shall hold them forth. Behold, here is wisdom.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.58
- type: DcVerse
  data:
    ref: dc.58.24
    scripture: doctrine-and-covenants
    name: D&C 58:24
    chapter: 58
    verse: 24
    ordinal: 1285
    text: And now, as I spake concerning my servant Edward Partridge, this land is the land of his residence, and those whom he has appointed for his counselors; and also the land of the residence of him whom I have appointed to keep my storehouse;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.58
- type: DcVerse
  data:
    ref: dc.58.25
    scripture: doctrine-and-covenants
    name: D&C 58:25
    chapter: 58
    verse: 25
    ordinal: 1286
    text: Wherefore, let them bring their families to this land, as they shall counsel between themselves and me.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.58
- type: DcVerse
  data:
    ref: dc.58.26
    scripture: doctrine-and-covenants
    name: D&C 58:26
    chapter: 58
    verse: 26
    ordinal: 1287
    text: For behold, it is not meet that I should command in all things; for he that is compelled in all things, the same is a slothful and not a wise servant; wherefore he receiveth no reward.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.58
- type: DcVerse
  data:
    ref: dc.58.27
    scripture: doctrine-and-covenants
    name: D&C 58:27
    chapter: 58
    verse: 27
    ordinal: 1288
    text: Verily I say, men should be anxiously engaged in a good cause, and do many things of their own free will, and bring to pass much righteousness;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.58
- type: DcVerse
  data:
    ref: dc.58.28
    scripture: doctrine-and-covenants
    name: D&C 58:28
    chapter: 58
    verse: 28
    ordinal: 1289
    text: For the power is in them, wherein they are agents unto themselves. And inasmuch as men do good they shall in nowise lose their reward.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.58
- type: DcVerse
  data:
    ref: dc.58.29
    scripture: doctrine-and-covenants
    name: D&C 58:29
    chapter: 58
    verse: 29
    ordinal: 1290
    text: But he that doeth not anything until he is commanded, and receiveth a commandment with doubtful heart, and keepeth it with slothfulness, the same is damned.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.58
- type: DcVerse
  data:
    ref: dc.58.30
    scripture: doctrine-and-covenants
    name: D&C 58:30
    chapter: 58
    verse: 30
    ordinal: 1291
    text: Who am I that made man, saith the Lord, that will hold him guiltless that obeys not my commandments?
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.58
- type: DcVerse
  data:
    ref: dc.58.31
    scripture: doctrine-and-covenants
    name: D&C 58:31
    chapter: 58
    verse: 31
    ordinal: 1292
    text: Who am I, saith the Lord, that have promised and have not fulfilled?
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.58
- type: DcVerse
  data:
    ref: dc.58.32
    scripture: doctrine-and-covenants
    name: D&C 58:32
    chapter: 58
    verse: 32
    ordinal: 1293
    text: I command and men obey not; I revoke and they receive not the blessing.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Deuteronomy 11:27
    kjvAllusionOsis:
    - Deut.11.27
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.58
- type: DcVerse
  data:
    ref: dc.58.33
    scripture: doctrine-and-covenants
    name: D&C 58:33
    chapter: 58
    verse: 33
    ordinal: 1294
    text: 'Then they say in their hearts: This is not the work of the Lord, for his promises are not fulfilled. But wo unto such, for their reward lurketh beneath, and not from above.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.58
- type: DcVerse
  data:
    ref: dc.58.34
    scripture: doctrine-and-covenants
    name: D&C 58:34
    chapter: 58
    verse: 34
    ordinal: 1295
    text: And now I give unto you further directions concerning this land.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.58
- type: DcVerse
  data:
    ref: dc.58.35
    scripture: doctrine-and-covenants
    name: D&C 58:35
    chapter: 58
    verse: 35
    ordinal: 1296
    text: It is wisdom in me that my servant Martin Harris should be an example unto the church, in laying his moneys before the bishop of the church.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.58
- type: DcVerse
  data:
    ref: dc.58.36
    scripture: doctrine-and-covenants
    name: D&C 58:36
    chapter: 58
    verse: 36
    ordinal: 1297
    text: And also, this is a law unto every man that cometh unto this land to receive an inheritance; and he shall do with his moneys according as the law directs.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.58
- type: DcVerse
  data:
    ref: dc.58.37
    scripture: doctrine-and-covenants
    name: D&C 58:37
    chapter: 58
    verse: 37
    ordinal: 1298
    text: And it is wisdom also that there should be lands purchased in Independence, for the place of the storehouse, and also for the house of the printing.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.58
- type: DcVerse
  data:
    ref: dc.58.38
    scripture: doctrine-and-covenants
    name: D&C 58:38
    chapter: 58
    verse: 38
    ordinal: 1299
    text: And other directions concerning my servant Martin Harris shall be given him of the Spirit, that he may receive his inheritance as seemeth him good;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.58
- type: DcVerse
  data:
    ref: dc.58.39
    scripture: doctrine-and-covenants
    name: D&C 58:39
    chapter: 58
    verse: 39
    ordinal: 1300
    text: And let him repent of his sins, for he seeketh the praise of the world.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.58
- type: DcVerse
  data:
    ref: dc.58.40
    scripture: doctrine-and-covenants
    name: D&C 58:40
    chapter: 58
    verse: 40
    ordinal: 1301
    text: And also let my servant William W. Phelps stand in the office to which I have appointed him, and receive his inheritance in the land;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.58
- type: DcVerse
  data:
    ref: dc.58.41
    scripture: doctrine-and-covenants
    name: D&C 58:41
    chapter: 58
    verse: 41
    ordinal: 1302
    text: And also he hath need to repent, for I, the Lord, am not well pleased with him, for he seeketh to excel, and he is not sufficiently meek before me.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.58
- type: DcVerse
  data:
    ref: dc.58.42
    scripture: doctrine-and-covenants
    name: D&C 58:42
    chapter: 58
    verse: 42
    ordinal: 1303
    text: Behold, he who has repented of his sins, the same is forgiven, and I, the Lord, remember them no more.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.58
- type: DcVerse
  data:
    ref: dc.58.43
    scripture: doctrine-and-covenants
    name: D&C 58:43
    chapter: 58
    verse: 43
    ordinal: 1304
    text: By this ye may know if a man repenteth of his sins—behold, he will confess them and forsake them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.58
- type: DcVerse
  data:
    ref: dc.58.44
    scripture: doctrine-and-covenants
    name: D&C 58:44
    chapter: 58
    verse: 44
    ordinal: 1305
    text: And now, verily, I say concerning the residue of the elders of my church, the time has not yet come, for many years, for them to receive their inheritance in this land, except they desire it through the prayer of faith, only as it shall be appointed unto them of the Lord.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.58
- type: DcVerse
  data:
    ref: dc.58.45
    scripture: doctrine-and-covenants
    name: D&C 58:45
    chapter: 58
    verse: 45
    ordinal: 1306
    text: For, behold, they shall push the people together from the ends of the earth.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.58
- type: DcVerse
  data:
    ref: dc.58.46
    scripture: doctrine-and-covenants
    name: D&C 58:46
    chapter: 58
    verse: 46
    ordinal: 1307
    text: Wherefore, assemble yourselves together; and they who are not appointed to stay in this land, let them preach the gospel in the regions round about; and after that let them return to their homes.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.58
- type: DcVerse
  data:
    ref: dc.58.47
    scripture: doctrine-and-covenants
    name: D&C 58:47
    chapter: 58
    verse: 47
    ordinal: 1308
    text: Let them preach by the way, and bear testimony of the truth in all places, and call upon the rich, the high and the low, and the poor to repent.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.58
- type: DcVerse
  data:
    ref: dc.58.48
    scripture: doctrine-and-covenants
    name: D&C 58:48
    chapter: 58
    verse: 48
    ordinal: 1309
    text: And let them build up churches, inasmuch as the inhabitants of the earth will repent.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.58
- type: DcVerse
  data:
    ref: dc.58.49
    scripture: doctrine-and-covenants
    name: D&C 58:49
    chapter: 58
    verse: 49
    ordinal: 1310
    text: And let there be an agent appointed by the voice of the church, unto the church in Ohio, to receive moneys to purchase lands in Zion.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.58
- type: DcVerse
  data:
    ref: dc.58.50
    scripture: doctrine-and-covenants
    name: D&C 58:50
    chapter: 58
    verse: 50
    ordinal: 1311
    text: And I give unto my servant Sidney Rigdon a commandment, that he shall write a description of the land of Zion, and a statement of the will of God, as it shall be made known by the Spirit unto him;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.58
- type: DcVerse
  data:
    ref: dc.58.51
    scripture: doctrine-and-covenants
    name: D&C 58:51
    chapter: 58
    verse: 51
    ordinal: 1312
    text: And an epistle and subscription, to be presented unto all the churches to obtain moneys, to be put into the hands of the bishop, of himself or the agent, as seemeth him good or as he shall direct, to purchase lands for an inheritance for the children of God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.58
- type: DcVerse
  data:
    ref: dc.58.52
    scripture: doctrine-and-covenants
    name: D&C 58:52
    chapter: 58
    verse: 52
    ordinal: 1313
    text: For, behold, verily I say unto you, the Lord willeth that the disciples and the children of men should open their hearts, even to purchase this whole region of country, as soon as time will permit.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.58
- type: DcVerse
  data:
    ref: dc.58.53
    scripture: doctrine-and-covenants
    name: D&C 58:53
    chapter: 58
    verse: 53
    ordinal: 1314
    text: Behold, here is wisdom. Let them do this lest they receive none inheritance, save it be by the shedding of blood.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.58
- type: DcVerse
  data:
    ref: dc.58.54
    scripture: doctrine-and-covenants
    name: D&C 58:54
    chapter: 58
    verse: 54
    ordinal: 1315
    text: And again, inasmuch as there is land obtained, let there be workmen sent forth of all kinds unto this land, to labor for the saints of God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.58
- type: DcVerse
  data:
    ref: dc.58.55
    scripture: doctrine-and-covenants
    name: D&C 58:55
    chapter: 58
    verse: 55
    ordinal: 1316
    text: Let all these things be done in order; and let the privileges of the lands be made known from time to time, by the bishop or the agent of the church.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.58
- type: DcVerse
  data:
    ref: dc.58.56
    scripture: doctrine-and-covenants
    name: D&C 58:56
    chapter: 58
    verse: 56
    ordinal: 1317
    text: And let the work of the gathering be not in haste, nor by flight; but let it be done as it shall be counseled by the elders of the church at the conferences, according to the knowledge which they receive from time to time.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.58
- type: DcVerse
  data:
    ref: dc.58.57
    scripture: doctrine-and-covenants
    name: D&C 58:57
    chapter: 58
    verse: 57
    ordinal: 1318
    text: And let my servant Sidney Rigdon consecrate and dedicate this land, and the spot for the temple, unto the Lord.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.58
- type: DcVerse
  data:
    ref: dc.58.58
    scripture: doctrine-and-covenants
    name: D&C 58:58
    chapter: 58
    verse: 58
    ordinal: 1319
    text: And let a conference meeting be called; and after that let my servants Sidney Rigdon and Joseph Smith, Jun., return, and also Oliver Cowdery with them, to accomplish the residue of the work which I have appointed unto them in their own land, and the residue as shall be ruled by the conferences.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.58
- type: DcVerse
  data:
    ref: dc.58.59
    scripture: doctrine-and-covenants
    name: D&C 58:59
    chapter: 58
    verse: 59
    ordinal: 1320
    text: And let no man return from this land except he bear record by the way, of that which he knows and most assuredly believes.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.58
- type: DcVerse
  data:
    ref: dc.58.60
    scripture: doctrine-and-covenants
    name: D&C 58:60
    chapter: 58
    verse: 60
    ordinal: 1321
    text: Let that which has been bestowed upon Ziba Peterson be taken from him; and let him stand as a member in the church, and labor with his own hands, with the brethren, until he is sufficiently chastened for all his sins; for he confesseth them not, and he thinketh to hide them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.58
- type: DcVerse
  data:
    ref: dc.58.61
    scripture: doctrine-and-covenants
    name: D&C 58:61
    chapter: 58
    verse: 61
    ordinal: 1322
    text: Let the residue of the elders of this church, who are coming to this land, some of whom are exceedingly blessed even above measure, also hold a conference upon this land.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.58
- type: DcVerse
  data:
    ref: dc.58.62
    scripture: doctrine-and-covenants
    name: D&C 58:62
    chapter: 58
    verse: 62
    ordinal: 1323
    text: And let my servant Edward Partridge direct the conference which shall be held by them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.58
- type: DcVerse
  data:
    ref: dc.58.63
    scripture: doctrine-and-covenants
    name: D&C 58:63
    chapter: 58
    verse: 63
    ordinal: 1324
    text: And let them also return, preaching the gospel by the way, bearing record of the things which are revealed unto them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.58
- type: DcVerse
  data:
    ref: dc.58.64
    scripture: doctrine-and-covenants
    name: D&C 58:64
    chapter: 58
    verse: 64
    ordinal: 1325
    text: For, verily, the sound must go forth from this place into all the world, and unto the uttermost parts of the earth—the gospel must be preached unto every creature, with signs following them that believe.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.58
- type: DcVerse
  data:
    ref: dc.58.65
    scripture: doctrine-and-covenants
    name: D&C 58:65
    chapter: 58
    verse: 65
    ordinal: 1326
    text: And behold the Son of Man cometh. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.58
- type: DcVerse
  data:
    ref: dc.59.1
    scripture: doctrine-and-covenants
    name: D&C 59:1
    chapter: 59
    verse: 1
    ordinal: 1327
    text: Behold, blessed, saith the Lord, are they who have come up unto this land with an eye single to my glory, according to my commandments.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.59
- type: DcVerse
  data:
    ref: dc.59.2
    scripture: doctrine-and-covenants
    name: D&C 59:2
    chapter: 59
    verse: 2
    ordinal: 1328
    text: For those that live shall inherit the earth, and those that die shall rest from all their labors, and their works shall follow them; and they shall receive a crown in the mansions of my Father, which I have prepared for them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.59
- type: DcVerse
  data:
    ref: dc.59.3
    scripture: doctrine-and-covenants
    name: D&C 59:3
    chapter: 59
    verse: 3
    ordinal: 1329
    text: Yea, blessed are they whose feet stand upon the land of Zion, who have obeyed my gospel; for they shall receive for their reward the good things of the earth, and it shall bring forth in its strength.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.59
- type: DcVerse
  data:
    ref: dc.59.4
    scripture: doctrine-and-covenants
    name: D&C 59:4
    chapter: 59
    verse: 4
    ordinal: 1330
    text: And they shall also be crowned with blessings from above, yea, and with commandments not a few, and with revelations in their time—they that are faithful and diligent before me.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.59
- type: DcVerse
  data:
    ref: dc.59.5
    scripture: doctrine-and-covenants
    name: D&C 59:5
    chapter: 59
    verse: 5
    ordinal: 1331
    text: 'Wherefore, I give unto them a commandment, saying thus: Thou shalt love the Lord thy God with all thy heart, with all thy might, mind, and strength; and in the name of Jesus Christ thou shalt serve him.'
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Mark 12:30
    kjvAllusionOsis:
    - Mark.12.30
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.59
- type: DcVerse
  data:
    ref: dc.59.6
    scripture: doctrine-and-covenants
    name: D&C 59:6
    chapter: 59
    verse: 6
    ordinal: 1332
    text: Thou shalt love thy neighbor as thyself. Thou shalt not steal; neither commit adultery, nor kill, nor do anything like unto it.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Matthew 22:39
    kjvAllusionOsis:
    - Matt.22.39
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.59
- type: DcVerse
  data:
    ref: dc.59.7
    scripture: doctrine-and-covenants
    name: D&C 59:7
    chapter: 59
    verse: 7
    ordinal: 1333
    text: Thou shalt thank the Lord thy God in all things.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.59
- type: DcVerse
  data:
    ref: dc.59.8
    scripture: doctrine-and-covenants
    name: D&C 59:8
    chapter: 59
    verse: 8
    ordinal: 1334
    text: Thou shalt offer a sacrifice unto the Lord thy God in righteousness, even that of a broken heart and a contrite spirit.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Psalms 51:17
    kjvAllusionOsis:
    - Ps.51.17
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.59
- type: DcVerse
  data:
    ref: dc.59.9
    scripture: doctrine-and-covenants
    name: D&C 59:9
    chapter: 59
    verse: 9
    ordinal: 1335
    text: And that thou mayest more fully keep thyself unspotted from the world, thou shalt go to the house of prayer and offer up thy sacraments upon my holy day;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.59
- type: DcVerse
  data:
    ref: dc.59.10
    scripture: doctrine-and-covenants
    name: D&C 59:10
    chapter: 59
    verse: 10
    ordinal: 1336
    text: For verily this is a day appointed unto you to rest from your labors, and to pay thy devotions unto the Most High;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.59
- type: DcVerse
  data:
    ref: dc.59.11
    scripture: doctrine-and-covenants
    name: D&C 59:11
    chapter: 59
    verse: 11
    ordinal: 1337
    text: Nevertheless thy vows shall be offered up in righteousness on all days and at all times;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.59
- type: DcVerse
  data:
    ref: dc.59.12
    scripture: doctrine-and-covenants
    name: D&C 59:12
    chapter: 59
    verse: 12
    ordinal: 1338
    text: But remember that on this, the Lord's day, thou shalt offer thine oblations and thy sacraments unto the Most High, confessing thy sins unto thy brethren, and before the Lord.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.59
- type: DcVerse
  data:
    ref: dc.59.13
    scripture: doctrine-and-covenants
    name: D&C 59:13
    chapter: 59
    verse: 13
    ordinal: 1339
    text: And on this day thou shalt do none other thing, only let thy food be prepared with singleness of heart that thy fasting may be perfect, or, in other words, that thy joy may be full.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.59
- type: DcVerse
  data:
    ref: dc.59.14
    scripture: doctrine-and-covenants
    name: D&C 59:14
    chapter: 59
    verse: 14
    ordinal: 1340
    text: Verily, this is fasting and prayer, or in other words, rejoicing and prayer.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.59
- type: DcVerse
  data:
    ref: dc.59.15
    scripture: doctrine-and-covenants
    name: D&C 59:15
    chapter: 59
    verse: 15
    ordinal: 1341
    text: And inasmuch as ye do these things with thanksgiving, with cheerful hearts and countenances, not with much laughter, for this is sin, but with a glad heart and a cheerful countenance—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.59
- type: DcVerse
  data:
    ref: dc.59.16
    scripture: doctrine-and-covenants
    name: D&C 59:16
    chapter: 59
    verse: 16
    ordinal: 1342
    text: Verily I say, that inasmuch as ye do this, the fulness of the earth is yours, the beasts of the field and the fowls of the air, and that which climbeth upon the trees and walketh upon the earth;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.59
- type: DcVerse
  data:
    ref: dc.59.17
    scripture: doctrine-and-covenants
    name: D&C 59:17
    chapter: 59
    verse: 17
    ordinal: 1343
    text: Yea, and the herb, and the good things which come of the earth, whether for food or for raiment, or for houses, or for barns, or for orchards, or for gardens, or for vineyards;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.59
- type: DcVerse
  data:
    ref: dc.59.18
    scripture: doctrine-and-covenants
    name: D&C 59:18
    chapter: 59
    verse: 18
    ordinal: 1344
    text: Yea, all things which come of the earth, in the season thereof, are made for the benefit and the use of man, both to please the eye and to gladden the heart;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.59
- type: DcVerse
  data:
    ref: dc.59.19
    scripture: doctrine-and-covenants
    name: D&C 59:19
    chapter: 59
    verse: 19
    ordinal: 1345
    text: Yea, for food and for raiment, for taste and for smell, to strengthen the body and to enliven the soul.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.59
- type: DcVerse
  data:
    ref: dc.59.20
    scripture: doctrine-and-covenants
    name: D&C 59:20
    chapter: 59
    verse: 20
    ordinal: 1346
    text: And it pleaseth God that he hath given all these things unto man; for unto this end were they made to be used, with judgment, not to excess, neither by extortion.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.59
- type: DcVerse
  data:
    ref: dc.59.21
    scripture: doctrine-and-covenants
    name: D&C 59:21
    chapter: 59
    verse: 21
    ordinal: 1347
    text: And in nothing doth man offend God, or against none is his wrath kindled, save those who confess not his hand in all things, and obey not his commandments.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.59
- type: DcVerse
  data:
    ref: dc.59.22
    scripture: doctrine-and-covenants
    name: D&C 59:22
    chapter: 59
    verse: 22
    ordinal: 1348
    text: Behold, this is according to the law and the prophets; wherefore, trouble me no more concerning this matter.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.59
- type: DcVerse
  data:
    ref: dc.59.23
    scripture: doctrine-and-covenants
    name: D&C 59:23
    chapter: 59
    verse: 23
    ordinal: 1349
    text: But learn that he who doeth the works of righteousness shall receive his reward, even peace in this world, and eternal life in the world to come.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.59
- type: DcVerse
  data:
    ref: dc.59.24
    scripture: doctrine-and-covenants
    name: D&C 59:24
    chapter: 59
    verse: 24
    ordinal: 1350
    text: I, the Lord, have spoken it, and the Spirit beareth record. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.59
- type: DcVerse
  data:
    ref: dc.60.1
    scripture: doctrine-and-covenants
    name: D&C 60:1
    chapter: 60
    verse: 1
    ordinal: 1351
    text: 'Behold, thus saith the Lord unto the elders of his church, who are to return speedily to the land from whence they came: Behold, it pleaseth me, that you have come up hither;'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.60
- type: DcVerse
  data:
    ref: dc.60.2
    scripture: doctrine-and-covenants
    name: D&C 60:2
    chapter: 60
    verse: 2
    ordinal: 1352
    text: But with some I am not well pleased, for they will not open their mouths, but they hide the talent which I have given unto them, because of the fear of man. Wo unto such, for mine anger is kindled against them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.60
- type: DcVerse
  data:
    ref: dc.60.3
    scripture: doctrine-and-covenants
    name: D&C 60:3
    chapter: 60
    verse: 3
    ordinal: 1353
    text: And it shall come to pass, if they are not more faithful unto me, it shall be taken away, even that which they have.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.60
- type: DcVerse
  data:
    ref: dc.60.4
    scripture: doctrine-and-covenants
    name: D&C 60:4
    chapter: 60
    verse: 4
    ordinal: 1354
    text: For I, the Lord, rule in the heavens above, and among the armies of the earth; and in the day when I shall make up my jewels, all men shall know what it is that bespeaketh the power of God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.60
- type: DcVerse
  data:
    ref: dc.60.5
    scripture: doctrine-and-covenants
    name: D&C 60:5
    chapter: 60
    verse: 5
    ordinal: 1355
    text: But, verily, I will speak unto you concerning your journey unto the land from whence you came. Let there be a craft made, or bought, as seemeth you good, it mattereth not unto me, and take your journey speedily for the place which is called St. Louis.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.60
- type: DcVerse
  data:
    ref: dc.60.6
    scripture: doctrine-and-covenants
    name: D&C 60:6
    chapter: 60
    verse: 6
    ordinal: 1356
    text: And from thence let my servants, Sidney Rigdon, Joseph Smith, Jun., and Oliver Cowdery, take their journey for Cincinnati;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.60
- type: DcVerse
  data:
    ref: dc.60.7
    scripture: doctrine-and-covenants
    name: D&C 60:7
    chapter: 60
    verse: 7
    ordinal: 1357
    text: And in this place let them lift up their voice and declare my word with loud voices, without wrath or doubting, lifting up holy hands upon them. For I am able to make you holy, and your sins are forgiven you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.60
- type: DcVerse
  data:
    ref: dc.60.8
    scripture: doctrine-and-covenants
    name: D&C 60:8
    chapter: 60
    verse: 8
    ordinal: 1358
    text: And let the residue take their journey from St. Louis, two by two, and preach the word, not in haste, among the congregations of the wicked, until they return to the churches from whence they came.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.60
- type: DcVerse
  data:
    ref: dc.60.9
    scripture: doctrine-and-covenants
    name: D&C 60:9
    chapter: 60
    verse: 9
    ordinal: 1359
    text: And all this for the good of the churches; for this intent have I sent them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.60
- type: DcVerse
  data:
    ref: dc.60.10
    scripture: doctrine-and-covenants
    name: D&C 60:10
    chapter: 60
    verse: 10
    ordinal: 1360
    text: And let my servant Edward Partridge impart of the money which I have given him, a portion unto mine elders who are commanded to return;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.60
- type: DcVerse
  data:
    ref: dc.60.11
    scripture: doctrine-and-covenants
    name: D&C 60:11
    chapter: 60
    verse: 11
    ordinal: 1361
    text: And he that is able, let him return it by the way of the agent; and he that is not, of him it is not required.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.60
- type: DcVerse
  data:
    ref: dc.60.12
    scripture: doctrine-and-covenants
    name: D&C 60:12
    chapter: 60
    verse: 12
    ordinal: 1362
    text: And now I speak of the residue who are to come unto this land.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.60
- type: DcVerse
  data:
    ref: dc.60.13
    scripture: doctrine-and-covenants
    name: D&C 60:13
    chapter: 60
    verse: 13
    ordinal: 1363
    text: 'Behold, they have been sent to preach my gospel among the congregations of the wicked; wherefore, I give unto them a commandment, thus: Thou shalt not idle away thy time, neither shalt thou bury thy talent that it may not be known.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.60
- type: DcVerse
  data:
    ref: dc.60.14
    scripture: doctrine-and-covenants
    name: D&C 60:14
    chapter: 60
    verse: 14
    ordinal: 1364
    text: And after thou hast come up unto the land of Zion, and hast proclaimed my word, thou shalt speedily return, proclaiming my word among the congregations of the wicked, not in haste, neither in wrath nor with strife.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.60
- type: DcVerse
  data:
    ref: dc.60.15
    scripture: doctrine-and-covenants
    name: D&C 60:15
    chapter: 60
    verse: 15
    ordinal: 1365
    text: And shake off the dust of thy feet against those who receive thee not, not in their presence, lest thou provoke them, but in secret; and wash thy feet, as a testimony against them in the day of judgment.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Luke 9:5
    kjvAllusionOsis:
    - Luke.9.5
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.60
- type: DcVerse
  data:
    ref: dc.60.16
    scripture: doctrine-and-covenants
    name: D&C 60:16
    chapter: 60
    verse: 16
    ordinal: 1366
    text: Behold, this is sufficient for you, and the will of him who hath sent you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.60
- type: DcVerse
  data:
    ref: dc.60.17
    scripture: doctrine-and-covenants
    name: D&C 60:17
    chapter: 60
    verse: 17
    ordinal: 1367
    text: And by the mouth of my servant Joseph Smith, Jun., it shall be made known concerning Sidney Rigdon and Oliver Cowdery. The residue hereafter. Even so. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.60
- type: DcVerse
  data:
    ref: dc.61.1
    scripture: doctrine-and-covenants
    name: D&C 61:1
    chapter: 61
    verse: 1
    ordinal: 1368
    text: Behold, and hearken unto the voice of him who has all power, who is from everlasting to everlasting, even Alpha and Omega, the beginning and the end.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Revelation 22:13
    kjvAllusionOsis:
    - Rev.22.13
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.61
- type: DcVerse
  data:
    ref: dc.61.2
    scripture: doctrine-and-covenants
    name: D&C 61:2
    chapter: 61
    verse: 2
    ordinal: 1369
    text: Behold, verily thus saith the Lord unto you, O ye elders of my church, who are assembled upon this spot, whose sins are now forgiven you, for I, the Lord, forgive sins, and am merciful unto those who confess their sins with humble hearts;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.61
- type: DcVerse
  data:
    ref: dc.61.3
    scripture: doctrine-and-covenants
    name: D&C 61:3
    chapter: 61
    verse: 3
    ordinal: 1370
    text: But verily I say unto you, that it is not needful for this whole company of mine elders to be moving swiftly upon the waters, whilst the inhabitants on either side are perishing in unbelief.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.61
- type: DcVerse
  data:
    ref: dc.61.4
    scripture: doctrine-and-covenants
    name: D&C 61:4
    chapter: 61
    verse: 4
    ordinal: 1371
    text: Nevertheless, I suffered it that ye might bear record; behold, there are many dangers upon the waters, and more especially hereafter;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.61
- type: DcVerse
  data:
    ref: dc.61.5
    scripture: doctrine-and-covenants
    name: D&C 61:5
    chapter: 61
    verse: 5
    ordinal: 1372
    text: For I, the Lord, have decreed in mine anger many destructions upon the waters; yea, and especially upon these waters.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.61
- type: DcVerse
  data:
    ref: dc.61.6
    scripture: doctrine-and-covenants
    name: D&C 61:6
    chapter: 61
    verse: 6
    ordinal: 1373
    text: Nevertheless, all flesh is in mine hand, and he that is faithful among you shall not perish by the waters.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.61
- type: DcVerse
  data:
    ref: dc.61.7
    scripture: doctrine-and-covenants
    name: D&C 61:7
    chapter: 61
    verse: 7
    ordinal: 1374
    text: Wherefore, it is expedient that my servant Sidney Gilbert and my servant William W. Phelps be in haste upon their errand and mission.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.61
- type: DcVerse
  data:
    ref: dc.61.8
    scripture: doctrine-and-covenants
    name: D&C 61:8
    chapter: 61
    verse: 8
    ordinal: 1375
    text: Nevertheless, I would not suffer that ye should part until you were chastened for all your sins, that you might be one, that you might not perish in wickedness;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.61
- type: DcVerse
  data:
    ref: dc.61.9
    scripture: doctrine-and-covenants
    name: D&C 61:9
    chapter: 61
    verse: 9
    ordinal: 1376
    text: But now, verily I say, it behooveth me that ye should part. Wherefore let my servants Sidney Gilbert and William W. Phelps take their former company, and let them take their journey in haste that they may fill their mission, and through faith they shall overcome;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.61
- type: DcVerse
  data:
    ref: dc.61.10
    scripture: doctrine-and-covenants
    name: D&C 61:10
    chapter: 61
    verse: 10
    ordinal: 1377
    text: And inasmuch as they are faithful they shall be preserved, and I, the Lord, will be with them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.61
- type: DcVerse
  data:
    ref: dc.61.11
    scripture: doctrine-and-covenants
    name: D&C 61:11
    chapter: 61
    verse: 11
    ordinal: 1378
    text: And let the residue take that which is needful for clothing.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.61
- type: DcVerse
  data:
    ref: dc.61.12
    scripture: doctrine-and-covenants
    name: D&C 61:12
    chapter: 61
    verse: 12
    ordinal: 1379
    text: Let my servant Sidney Gilbert take that which is not needful with him, as you shall agree.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.61
- type: DcVerse
  data:
    ref: dc.61.13
    scripture: doctrine-and-covenants
    name: D&C 61:13
    chapter: 61
    verse: 13
    ordinal: 1380
    text: And now, behold, for your good I gave unto you a commandment concerning these things; and I, the Lord, will reason with you as with men in days of old.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.61
- type: DcVerse
  data:
    ref: dc.61.14
    scripture: doctrine-and-covenants
    name: D&C 61:14
    chapter: 61
    verse: 14
    ordinal: 1381
    text: Behold, I, the Lord, in the beginning blessed the waters; but in the last days, by the mouth of my servant John, I cursed the waters.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.61
- type: DcVerse
  data:
    ref: dc.61.15
    scripture: doctrine-and-covenants
    name: D&C 61:15
    chapter: 61
    verse: 15
    ordinal: 1382
    text: Wherefore, the days will come that no flesh shall be safe upon the waters.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.61
- type: DcVerse
  data:
    ref: dc.61.16
    scripture: doctrine-and-covenants
    name: D&C 61:16
    chapter: 61
    verse: 16
    ordinal: 1383
    text: And it shall be said in days to come that none is able to go up to the land of Zion upon the waters, but he that is upright in heart.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.61
- type: DcVerse
  data:
    ref: dc.61.17
    scripture: doctrine-and-covenants
    name: D&C 61:17
    chapter: 61
    verse: 17
    ordinal: 1384
    text: And, as I, the Lord, in the beginning cursed the land, even so in the last days have I blessed it, in its time, for the use of my saints, that they may partake the fatness thereof.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.61
- type: DcVerse
  data:
    ref: dc.61.18
    scripture: doctrine-and-covenants
    name: D&C 61:18
    chapter: 61
    verse: 18
    ordinal: 1385
    text: And now I give unto you a commandment that what I say unto one I say unto all, that you shall forewarn your brethren concerning these waters, that they come not in journeying upon them, lest their faith fail and they are caught in snares;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.61
- type: DcVerse
  data:
    ref: dc.61.19
    scripture: doctrine-and-covenants
    name: D&C 61:19
    chapter: 61
    verse: 19
    ordinal: 1386
    text: I, the Lord, have decreed, and the destroyer rideth upon the face thereof, and I revoke not the decree.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.61
- type: DcVerse
  data:
    ref: dc.61.20
    scripture: doctrine-and-covenants
    name: D&C 61:20
    chapter: 61
    verse: 20
    ordinal: 1387
    text: I, the Lord, was angry with you yesterday, but today mine anger is turned away.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.61
- type: DcVerse
  data:
    ref: dc.61.21
    scripture: doctrine-and-covenants
    name: D&C 61:21
    chapter: 61
    verse: 21
    ordinal: 1388
    text: Wherefore, let those concerning whom I have spoken, that should take their journey in haste—again I say unto you, let them take their journey in haste.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.61
- type: DcVerse
  data:
    ref: dc.61.22
    scripture: doctrine-and-covenants
    name: D&C 61:22
    chapter: 61
    verse: 22
    ordinal: 1389
    text: And it mattereth not unto me, after a little, if it so be that they fill their mission, whether they go by water or by land; let this be as it is made known unto them according to their judgments hereafter.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.61
- type: DcVerse
  data:
    ref: dc.61.23
    scripture: doctrine-and-covenants
    name: D&C 61:23
    chapter: 61
    verse: 23
    ordinal: 1390
    text: And now, concerning my servants, Sidney Rigdon, Joseph Smith, Jun., and Oliver Cowdery, let them come not again upon the waters, save it be upon the canal, while journeying unto their homes; or in other words they shall not come upon the waters to journey, save upon the canal.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.61
- type: DcVerse
  data:
    ref: dc.61.24
    scripture: doctrine-and-covenants
    name: D&C 61:24
    chapter: 61
    verse: 24
    ordinal: 1391
    text: Behold, I, the Lord, have appointed a way for the journeying of my saints; and behold, this is the way—that after they leave the canal they shall journey by land, inasmuch as they are commanded to journey and go up unto the land of Zion;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.61
- type: DcVerse
  data:
    ref: dc.61.25
    scripture: doctrine-and-covenants
    name: D&C 61:25
    chapter: 61
    verse: 25
    ordinal: 1392
    text: And they shall do like unto the children of Israel, pitching their tents by the way.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.61
- type: DcVerse
  data:
    ref: dc.61.26
    scripture: doctrine-and-covenants
    name: D&C 61:26
    chapter: 61
    verse: 26
    ordinal: 1393
    text: And, behold, this commandment you shall give unto all your brethren.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.61
- type: DcVerse
  data:
    ref: dc.61.27
    scripture: doctrine-and-covenants
    name: D&C 61:27
    chapter: 61
    verse: 27
    ordinal: 1394
    text: Nevertheless, unto whom is given power to command the waters, unto him it is given by the Spirit to know all his ways;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.61
- type: DcVerse
  data:
    ref: dc.61.28
    scripture: doctrine-and-covenants
    name: D&C 61:28
    chapter: 61
    verse: 28
    ordinal: 1395
    text: Wherefore, let him do as the Spirit of the living God commandeth him, whether upon the land or upon the waters, as it remaineth with me to do hereafter.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.61
- type: DcVerse
  data:
    ref: dc.61.29
    scripture: doctrine-and-covenants
    name: D&C 61:29
    chapter: 61
    verse: 29
    ordinal: 1396
    text: And unto you is given the course for the saints, or the way for the saints of the camp of the Lord, to journey.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.61
- type: DcVerse
  data:
    ref: dc.61.30
    scripture: doctrine-and-covenants
    name: D&C 61:30
    chapter: 61
    verse: 30
    ordinal: 1397
    text: And again, verily I say unto you, my servants, Sidney Rigdon, Joseph Smith, Jun., and Oliver Cowdery, shall not open their mouths in the congregations of the wicked until they arrive at Cincinnati;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.61
- type: DcVerse
  data:
    ref: dc.61.31
    scripture: doctrine-and-covenants
    name: D&C 61:31
    chapter: 61
    verse: 31
    ordinal: 1398
    text: And in that place they shall lift up their voices unto God against that people, yea, unto him whose anger is kindled against their wickedness, a people who are well-nigh ripened for destruction.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.61
- type: DcVerse
  data:
    ref: dc.61.32
    scripture: doctrine-and-covenants
    name: D&C 61:32
    chapter: 61
    verse: 32
    ordinal: 1399
    text: And from thence let them journey for the congregations of their brethren, for their labors even now are wanted more abundantly among them than among the congregations of the wicked.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.61
- type: DcVerse
  data:
    ref: dc.61.33
    scripture: doctrine-and-covenants
    name: D&C 61:33
    chapter: 61
    verse: 33
    ordinal: 1400
    text: And now, concerning the residue, let them journey and declare the word among the congregations of the wicked, inasmuch as it is given;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.61
- type: DcVerse
  data:
    ref: dc.61.34
    scripture: doctrine-and-covenants
    name: D&C 61:34
    chapter: 61
    verse: 34
    ordinal: 1401
    text: And inasmuch as they do this they shall rid their garments, and they shall be spotless before me.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.61
- type: DcVerse
  data:
    ref: dc.61.35
    scripture: doctrine-and-covenants
    name: D&C 61:35
    chapter: 61
    verse: 35
    ordinal: 1402
    text: And let them journey together, or two by two, as seemeth them good, only let my servant Reynolds Cahoon, and my servant Samuel H. Smith, with whom I am well pleased, be not separated until they return to their homes, and this for a wise purpose in me.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.61
- type: DcVerse
  data:
    ref: dc.61.36
    scripture: doctrine-and-covenants
    name: D&C 61:36
    chapter: 61
    verse: 36
    ordinal: 1403
    text: And now, verily I say unto you, and what I say unto one I say unto all, be of good cheer, little children; for I am in your midst, and I have not forsaken you;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.61
- type: DcVerse
  data:
    ref: dc.61.37
    scripture: doctrine-and-covenants
    name: D&C 61:37
    chapter: 61
    verse: 37
    ordinal: 1404
    text: And inasmuch as you have humbled yourselves before me, the blessings of the kingdom are yours.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.61
- type: DcVerse
  data:
    ref: dc.61.38
    scripture: doctrine-and-covenants
    name: D&C 61:38
    chapter: 61
    verse: 38
    ordinal: 1405
    text: Gird up your loins and be watchful and be sober, looking forth for the coming of the Son of Man, for he cometh in an hour you think not.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.61
- type: DcVerse
  data:
    ref: dc.61.39
    scripture: doctrine-and-covenants
    name: D&C 61:39
    chapter: 61
    verse: 39
    ordinal: 1406
    text: Pray always that you enter not into temptation, that you may abide the day of his coming, whether in life or in death. Even so. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.61
- type: DcVerse
  data:
    ref: dc.62.1
    scripture: doctrine-and-covenants
    name: D&C 62:1
    chapter: 62
    verse: 1
    ordinal: 1407
    text: Behold, and hearken, O ye elders of my church, saith the Lord your God, even Jesus Christ, your advocate, who knoweth the weakness of man and how to succor them who are tempted.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.62
- type: DcVerse
  data:
    ref: dc.62.2
    scripture: doctrine-and-covenants
    name: D&C 62:2
    chapter: 62
    verse: 2
    ordinal: 1408
    text: And verily mine eyes are upon those who have not as yet gone up unto the land of Zion; wherefore your mission is not yet full.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.62
- type: DcVerse
  data:
    ref: dc.62.3
    scripture: doctrine-and-covenants
    name: D&C 62:3
    chapter: 62
    verse: 3
    ordinal: 1409
    text: Nevertheless, ye are blessed, for the testimony which ye have borne is recorded in heaven for the angels to look upon; and they rejoice over you, and your sins are forgiven you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.62
- type: DcVerse
  data:
    ref: dc.62.4
    scripture: doctrine-and-covenants
    name: D&C 62:4
    chapter: 62
    verse: 4
    ordinal: 1410
    text: And now continue your journey. Assemble yourselves upon the land of Zion; and hold a meeting and rejoice together, and offer a sacrament unto the Most High.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.62
- type: DcVerse
  data:
    ref: dc.62.5
    scripture: doctrine-and-covenants
    name: D&C 62:5
    chapter: 62
    verse: 5
    ordinal: 1411
    text: And then you may return to bear record, yea, even altogether, or two by two, as seemeth you good, it mattereth not unto me; only be faithful, and declare glad tidings unto the inhabitants of the earth, or among the congregations of the wicked.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.62
- type: DcVerse
  data:
    ref: dc.62.6
    scripture: doctrine-and-covenants
    name: D&C 62:6
    chapter: 62
    verse: 6
    ordinal: 1412
    text: Behold, I, the Lord, have brought you together that the promise might be fulfilled, that the faithful among you should be preserved and rejoice together in the land of Missouri. I, the Lord, promise the faithful and cannot lie.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.62
- type: DcVerse
  data:
    ref: dc.62.7
    scripture: doctrine-and-covenants
    name: D&C 62:7
    chapter: 62
    verse: 7
    ordinal: 1413
    text: I, the Lord, am willing, if any among you desire to ride upon horses, or upon mules, or in chariots, he shall receive this blessing, if he receive it from the hand of the Lord, with a thankful heart in all things.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.62
- type: DcVerse
  data:
    ref: dc.62.8
    scripture: doctrine-and-covenants
    name: D&C 62:8
    chapter: 62
    verse: 8
    ordinal: 1414
    text: These things remain with you to do according to judgment and the directions of the Spirit.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.62
- type: DcVerse
  data:
    ref: dc.62.9
    scripture: doctrine-and-covenants
    name: D&C 62:9
    chapter: 62
    verse: 9
    ordinal: 1415
    text: Behold, the kingdom is yours. And behold, and lo, I am with the faithful always. Even so. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.62
- type: DcVerse
  data:
    ref: dc.63.1
    scripture: doctrine-and-covenants
    name: D&C 63:1
    chapter: 63
    verse: 1
    ordinal: 1416
    text: Hearken, O ye people, and open your hearts and give ear from afar; and listen, you that call yourselves the people of the Lord, and hear the word of the Lord and his will concerning you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.63
- type: DcVerse
  data:
    ref: dc.63.2
    scripture: doctrine-and-covenants
    name: D&C 63:2
    chapter: 63
    verse: 2
    ordinal: 1417
    text: Yea, verily, I say, hear the word of him whose anger is kindled against the wicked and rebellious;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.63
- type: DcVerse
  data:
    ref: dc.63.3
    scripture: doctrine-and-covenants
    name: D&C 63:3
    chapter: 63
    verse: 3
    ordinal: 1418
    text: Who willeth to take even them whom he will take, and preserveth in life them whom he will preserve;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.63
- type: DcVerse
  data:
    ref: dc.63.4
    scripture: doctrine-and-covenants
    name: D&C 63:4
    chapter: 63
    verse: 4
    ordinal: 1419
    text: Who buildeth up at his own will and pleasure; and destroyeth when he pleases, and is able to cast the soul down to hell.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.63
- type: DcVerse
  data:
    ref: dc.63.5
    scripture: doctrine-and-covenants
    name: D&C 63:5
    chapter: 63
    verse: 5
    ordinal: 1420
    text: Behold, I, the Lord, utter my voice, and it shall be obeyed.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.63
- type: DcVerse
  data:
    ref: dc.63.6
    scripture: doctrine-and-covenants
    name: D&C 63:6
    chapter: 63
    verse: 6
    ordinal: 1421
    text: Wherefore, verily I say, let the wicked take heed, and let the rebellious fear and tremble; and let the unbelieving hold their lips, for the day of wrath shall come upon them as a whirlwind, and all flesh shall know that I am God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.63
- type: DcVerse
  data:
    ref: dc.63.7
    scripture: doctrine-and-covenants
    name: D&C 63:7
    chapter: 63
    verse: 7
    ordinal: 1422
    text: And he that seeketh signs shall see signs, but not unto salvation.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.63
- type: DcVerse
  data:
    ref: dc.63.8
    scripture: doctrine-and-covenants
    name: D&C 63:8
    chapter: 63
    verse: 8
    ordinal: 1423
    text: Verily, I say unto you, there are those among you who seek signs, and there have been such even from the beginning;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.63
- type: DcVerse
  data:
    ref: dc.63.9
    scripture: doctrine-and-covenants
    name: D&C 63:9
    chapter: 63
    verse: 9
    ordinal: 1424
    text: But, behold, faith cometh not by signs, but signs follow those that believe.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.63
- type: DcVerse
  data:
    ref: dc.63.10
    scripture: doctrine-and-covenants
    name: D&C 63:10
    chapter: 63
    verse: 10
    ordinal: 1425
    text: Yea, signs come by faith, not by the will of men, nor as they please, but by the will of God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.63
- type: DcVerse
  data:
    ref: dc.63.11
    scripture: doctrine-and-covenants
    name: D&C 63:11
    chapter: 63
    verse: 11
    ordinal: 1426
    text: Yea, signs come by faith, unto mighty works, for without faith no man pleaseth God; and with whom God is angry he is not well pleased; wherefore, unto such he showeth no signs, only in wrath unto their condemnation.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.63
- type: DcVerse
  data:
    ref: dc.63.12
    scripture: doctrine-and-covenants
    name: D&C 63:12
    chapter: 63
    verse: 12
    ordinal: 1427
    text: Wherefore, I, the Lord, am not pleased with those among you who have sought after signs and wonders for faith, and not for the good of men unto my glory.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.63
- type: DcVerse
  data:
    ref: dc.63.13
    scripture: doctrine-and-covenants
    name: D&C 63:13
    chapter: 63
    verse: 13
    ordinal: 1428
    text: Nevertheless, I give commandments, and many have turned away from my commandments and have not kept them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.63
- type: DcVerse
  data:
    ref: dc.63.14
    scripture: doctrine-and-covenants
    name: D&C 63:14
    chapter: 63
    verse: 14
    ordinal: 1429
    text: There were among you adulterers and adulteresses; some of whom have turned away from you, and others remain with you that hereafter shall be revealed.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.63
- type: DcVerse
  data:
    ref: dc.63.15
    scripture: doctrine-and-covenants
    name: D&C 63:15
    chapter: 63
    verse: 15
    ordinal: 1430
    text: Let such beware and repent speedily, lest judgment shall come upon them as a snare, and their folly shall be made manifest, and their works shall follow them in the eyes of the people.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.63
- type: DcVerse
  data:
    ref: dc.63.16
    scripture: doctrine-and-covenants
    name: D&C 63:16
    chapter: 63
    verse: 16
    ordinal: 1431
    text: And verily I say unto you, as I have said before, he that looketh on a woman to lust after her, or if any shall commit adultery in their hearts, they shall not have the Spirit, but shall deny the faith and shall fear.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Matthew 5:28
    kjvAllusionOsis:
    - Matt.5.28
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.63
- type: DcVerse
  data:
    ref: dc.63.17
    scripture: doctrine-and-covenants
    name: D&C 63:17
    chapter: 63
    verse: 17
    ordinal: 1432
    text: Wherefore, I, the Lord, have said that the fearful, and the unbelieving, and all liars, and whosoever loveth and maketh a lie, and the whoremonger, and the sorcerer, shall have their part in that lake which burneth with fire and brimstone, which is the second death.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Revelation 21:8
    kjvAllusionOsis:
    - Rev.21.8
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.63
- type: DcVerse
  data:
    ref: dc.63.18
    scripture: doctrine-and-covenants
    name: D&C 63:18
    chapter: 63
    verse: 18
    ordinal: 1433
    text: Verily I say, that they shall not have part in the first resurrection.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.63
- type: DcVerse
  data:
    ref: dc.63.19
    scripture: doctrine-and-covenants
    name: D&C 63:19
    chapter: 63
    verse: 19
    ordinal: 1434
    text: And now behold, I, the Lord, say unto you that ye are not justified, because these things are among you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.63
- type: DcVerse
  data:
    ref: dc.63.20
    scripture: doctrine-and-covenants
    name: D&C 63:20
    chapter: 63
    verse: 20
    ordinal: 1435
    text: Nevertheless, he that endureth in faith and doeth my will, the same shall overcome, and shall receive an inheritance upon the earth when the day of transfiguration shall come;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.63
- type: DcVerse
  data:
    ref: dc.63.21
    scripture: doctrine-and-covenants
    name: D&C 63:21
    chapter: 63
    verse: 21
    ordinal: 1436
    text: When the earth shall be transfigured, even according to the pattern which was shown unto mine apostles upon the mount; of which account the fulness ye have not yet received.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.63
- type: DcVerse
  data:
    ref: dc.63.22
    scripture: doctrine-and-covenants
    name: D&C 63:22
    chapter: 63
    verse: 22
    ordinal: 1437
    text: And now, verily I say unto you, that as I said that I would make known my will unto you, behold I will make it known unto you, not by the way of commandment, for there are many who observe not to keep my commandments.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.63
- type: DcVerse
  data:
    ref: dc.63.23
    scripture: doctrine-and-covenants
    name: D&C 63:23
    chapter: 63
    verse: 23
    ordinal: 1438
    text: But unto him that keepeth my commandments I will give the mysteries of my kingdom, and the same shall be in him a well of living water, springing up unto everlasting life.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - John 4:14
    kjvAllusionOsis:
    - John.4.14
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.63
- type: DcVerse
  data:
    ref: dc.63.24
    scripture: doctrine-and-covenants
    name: D&C 63:24
    chapter: 63
    verse: 24
    ordinal: 1439
    text: And now, behold, this is the will of the Lord your God concerning his saints, that they should assemble themselves together unto the land of Zion, not in haste, lest there should be confusion, which bringeth pestilence.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.63
- type: DcVerse
  data:
    ref: dc.63.25
    scripture: doctrine-and-covenants
    name: D&C 63:25
    chapter: 63
    verse: 25
    ordinal: 1440
    text: Behold, the land of Zion—I, the Lord, hold it in mine own hands;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.63
- type: DcVerse
  data:
    ref: dc.63.26
    scripture: doctrine-and-covenants
    name: D&C 63:26
    chapter: 63
    verse: 26
    ordinal: 1441
    text: Nevertheless, I, the Lord, render unto Cæsar the things which are Cæsar's.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.63
- type: DcVerse
  data:
    ref: dc.63.27
    scripture: doctrine-and-covenants
    name: D&C 63:27
    chapter: 63
    verse: 27
    ordinal: 1442
    text: Wherefore, I the Lord will that you should purchase the lands, that you may have advantage of the world, that you may have claim on the world, that they may not be stirred up unto anger.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.63
- type: DcVerse
  data:
    ref: dc.63.28
    scripture: doctrine-and-covenants
    name: D&C 63:28
    chapter: 63
    verse: 28
    ordinal: 1443
    text: For Satan putteth it into their hearts to anger against you, and to the shedding of blood.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.63
- type: DcVerse
  data:
    ref: dc.63.29
    scripture: doctrine-and-covenants
    name: D&C 63:29
    chapter: 63
    verse: 29
    ordinal: 1444
    text: Wherefore, the land of Zion shall not be obtained but by purchase or by blood, otherwise there is none inheritance for you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.63
- type: DcVerse
  data:
    ref: dc.63.30
    scripture: doctrine-and-covenants
    name: D&C 63:30
    chapter: 63
    verse: 30
    ordinal: 1445
    text: And if by purchase, behold you are blessed;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.63
- type: DcVerse
  data:
    ref: dc.63.31
    scripture: doctrine-and-covenants
    name: D&C 63:31
    chapter: 63
    verse: 31
    ordinal: 1446
    text: And if by blood, as you are forbidden to shed blood, lo, your enemies are upon you, and ye shall be scourged from city to city, and from synagogue to synagogue, and but few shall stand to receive an inheritance.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.63
- type: DcVerse
  data:
    ref: dc.63.32
    scripture: doctrine-and-covenants
    name: D&C 63:32
    chapter: 63
    verse: 32
    ordinal: 1447
    text: I, the Lord, am angry with the wicked; I am holding my Spirit from the inhabitants of the earth.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.63
- type: DcVerse
  data:
    ref: dc.63.33
    scripture: doctrine-and-covenants
    name: D&C 63:33
    chapter: 63
    verse: 33
    ordinal: 1448
    text: I have sworn in my wrath, and decreed wars upon the face of the earth, and the wicked shall slay the wicked, and fear shall come upon every man;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.63
- type: DcVerse
  data:
    ref: dc.63.34
    scripture: doctrine-and-covenants
    name: D&C 63:34
    chapter: 63
    verse: 34
    ordinal: 1449
    text: And the saints also shall hardly escape; nevertheless, I, the Lord, am with them, and will come down in heaven from the presence of my Father and consume the wicked with unquenchable fire.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.63
- type: DcVerse
  data:
    ref: dc.63.35
    scripture: doctrine-and-covenants
    name: D&C 63:35
    chapter: 63
    verse: 35
    ordinal: 1450
    text: And behold, this is not yet, but by and by.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.63
- type: DcVerse
  data:
    ref: dc.63.36
    scripture: doctrine-and-covenants
    name: D&C 63:36
    chapter: 63
    verse: 36
    ordinal: 1451
    text: Wherefore, seeing that I, the Lord, have decreed all these things upon the face of the earth, I will that my saints should be assembled upon the land of Zion;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.63
- type: DcVerse
  data:
    ref: dc.63.37
    scripture: doctrine-and-covenants
    name: D&C 63:37
    chapter: 63
    verse: 37
    ordinal: 1452
    text: And that every man should take righteousness in his hands and faithfulness upon his loins, and lift a warning voice unto the inhabitants of the earth; and declare both by word and by flight that desolation shall come upon the wicked.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.63
- type: DcVerse
  data:
    ref: dc.63.38
    scripture: doctrine-and-covenants
    name: D&C 63:38
    chapter: 63
    verse: 38
    ordinal: 1453
    text: Wherefore, let my disciples in Kirtland arrange their temporal concerns, who dwell upon this farm.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.63
- type: DcVerse
  data:
    ref: dc.63.39
    scripture: doctrine-and-covenants
    name: D&C 63:39
    chapter: 63
    verse: 39
    ordinal: 1454
    text: Let my servant Titus Billings, who has the care thereof, dispose of the land, that he may be prepared in the coming spring to take his journey up unto the land of Zion, with those that dwell upon the face thereof, excepting those whom I shall reserve unto myself, that shall not go until I shall command them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.63
- type: DcVerse
  data:
    ref: dc.63.40
    scripture: doctrine-and-covenants
    name: D&C 63:40
    chapter: 63
    verse: 40
    ordinal: 1455
    text: And let all the moneys which can be spared, it mattereth not unto me whether it be little or much, be sent up unto the land of Zion, unto them whom I have appointed to receive.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.63
- type: DcVerse
  data:
    ref: dc.63.41
    scripture: doctrine-and-covenants
    name: D&C 63:41
    chapter: 63
    verse: 41
    ordinal: 1456
    text: Behold, I, the Lord, will give unto my servant Joseph Smith, Jun., power that he shall be enabled to discern by the Spirit those who shall go up unto the land of Zion, and those of my disciples who shall tarry.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.63
- type: DcVerse
  data:
    ref: dc.63.42
    scripture: doctrine-and-covenants
    name: D&C 63:42
    chapter: 63
    verse: 42
    ordinal: 1457
    text: Let my servant Newel K. Whitney retain his store, or in other words, the store, yet for a little season.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.63
- type: DcVerse
  data:
    ref: dc.63.43
    scripture: doctrine-and-covenants
    name: D&C 63:43
    chapter: 63
    verse: 43
    ordinal: 1458
    text: Nevertheless, let him impart all the money which he can impart, to be sent up unto the land of Zion.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.63
- type: DcVerse
  data:
    ref: dc.63.44
    scripture: doctrine-and-covenants
    name: D&C 63:44
    chapter: 63
    verse: 44
    ordinal: 1459
    text: Behold, these things are in his own hands, let him do according to wisdom.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.63
- type: DcVerse
  data:
    ref: dc.63.45
    scripture: doctrine-and-covenants
    name: D&C 63:45
    chapter: 63
    verse: 45
    ordinal: 1460
    text: Verily I say, let him be ordained as an agent unto the disciples that shall tarry, and let him be ordained unto this power;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.63
- type: DcVerse
  data:
    ref: dc.63.46
    scripture: doctrine-and-covenants
    name: D&C 63:46
    chapter: 63
    verse: 46
    ordinal: 1461
    text: And now speedily visit the churches, expounding these things unto them, with my servant Oliver Cowdery. Behold, this is my will, obtaining moneys even as I have directed.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.63
- type: DcVerse
  data:
    ref: dc.63.47
    scripture: doctrine-and-covenants
    name: D&C 63:47
    chapter: 63
    verse: 47
    ordinal: 1462
    text: He that is faithful and endureth shall overcome the world.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.63
- type: DcVerse
  data:
    ref: dc.63.48
    scripture: doctrine-and-covenants
    name: D&C 63:48
    chapter: 63
    verse: 48
    ordinal: 1463
    text: He that sendeth up treasures unto the land of Zion shall receive an inheritance in this world, and his works shall follow him, and also a reward in the world to come.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.63
- type: DcVerse
  data:
    ref: dc.63.49
    scripture: doctrine-and-covenants
    name: D&C 63:49
    chapter: 63
    verse: 49
    ordinal: 1464
    text: Yea, and blessed are the dead that die in the Lord, from henceforth, when the Lord shall come, and old things shall pass away, and all things become new, they shall rise from the dead and shall not die after, and shall receive an inheritance before the Lord, in the holy city.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.63
- type: DcVerse
  data:
    ref: dc.63.50
    scripture: doctrine-and-covenants
    name: D&C 63:50
    chapter: 63
    verse: 50
    ordinal: 1465
    text: And he that liveth when the Lord shall come, and hath kept the faith, blessed is he; nevertheless, it is appointed to him to die at the age of man.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.63
- type: DcVerse
  data:
    ref: dc.63.51
    scripture: doctrine-and-covenants
    name: D&C 63:51
    chapter: 63
    verse: 51
    ordinal: 1466
    text: Wherefore, children shall grow up until they become old; old men shall die; but they shall not sleep in the dust, but they shall be changed in the twinkling of an eye.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.63
- type: DcVerse
  data:
    ref: dc.63.52
    scripture: doctrine-and-covenants
    name: D&C 63:52
    chapter: 63
    verse: 52
    ordinal: 1467
    text: Wherefore, for this cause preached the apostles unto the world the resurrection of the dead.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.63
- type: DcVerse
  data:
    ref: dc.63.53
    scripture: doctrine-and-covenants
    name: D&C 63:53
    chapter: 63
    verse: 53
    ordinal: 1468
    text: These things are the things that ye must look for; and, speaking after the manner of the Lord, they are now nigh at hand, and in a time to come, even in the day of the coming of the Son of Man.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.63
- type: DcVerse
  data:
    ref: dc.63.54
    scripture: doctrine-and-covenants
    name: D&C 63:54
    chapter: 63
    verse: 54
    ordinal: 1469
    text: And until that hour there will be foolish virgins among the wise; and at that hour cometh an entire separation of the righteous and the wicked; and in that day will I send mine angels to pluck out the wicked and cast them into unquenchable fire.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.63
- type: DcVerse
  data:
    ref: dc.63.55
    scripture: doctrine-and-covenants
    name: D&C 63:55
    chapter: 63
    verse: 55
    ordinal: 1470
    text: And now behold, verily I say unto you, I, the Lord, am not pleased with my servant Sidney Rigdon; he exalted himself in his heart, and received not counsel, but grieved the Spirit;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.63
- type: DcVerse
  data:
    ref: dc.63.56
    scripture: doctrine-and-covenants
    name: D&C 63:56
    chapter: 63
    verse: 56
    ordinal: 1471
    text: Wherefore his writing is not acceptable unto the Lord, and he shall make another; and if the Lord receive it not, behold he standeth no longer in the office to which I have appointed him.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.63
- type: DcVerse
  data:
    ref: dc.63.57
    scripture: doctrine-and-covenants
    name: D&C 63:57
    chapter: 63
    verse: 57
    ordinal: 1472
    text: And again, verily I say unto you, those who desire in their hearts, in meekness, to warn sinners to repentance, let them be ordained unto this power.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.63
- type: DcVerse
  data:
    ref: dc.63.58
    scripture: doctrine-and-covenants
    name: D&C 63:58
    chapter: 63
    verse: 58
    ordinal: 1473
    text: For this is a day of warning, and not a day of many words. For I, the Lord, am not to be mocked in the last days.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.63
- type: DcVerse
  data:
    ref: dc.63.59
    scripture: doctrine-and-covenants
    name: D&C 63:59
    chapter: 63
    verse: 59
    ordinal: 1474
    text: Behold, I am from above, and my power lieth beneath. I am over all, and in all, and through all, and search all things, and the day cometh that all things shall be subject unto me.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.63
- type: DcVerse
  data:
    ref: dc.63.60
    scripture: doctrine-and-covenants
    name: D&C 63:60
    chapter: 63
    verse: 60
    ordinal: 1475
    text: Behold, I am Alpha and Omega, even Jesus Christ.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Revelation 22:13
    kjvAllusionOsis:
    - Rev.22.13
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.63
- type: DcVerse
  data:
    ref: dc.63.61
    scripture: doctrine-and-covenants
    name: D&C 63:61
    chapter: 63
    verse: 61
    ordinal: 1476
    text: Wherefore, let all men beware how they take my name in their lips—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.63
- type: DcVerse
  data:
    ref: dc.63.62
    scripture: doctrine-and-covenants
    name: D&C 63:62
    chapter: 63
    verse: 62
    ordinal: 1477
    text: For behold, verily I say, that many there be who are under this condemnation, who use the name of the Lord, and use it in vain, having not authority.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.63
- type: DcVerse
  data:
    ref: dc.63.63
    scripture: doctrine-and-covenants
    name: D&C 63:63
    chapter: 63
    verse: 63
    ordinal: 1478
    text: Wherefore, let the church repent of their sins, and I, the Lord, will own them; otherwise they shall be cut off.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.63
- type: DcVerse
  data:
    ref: dc.63.64
    scripture: doctrine-and-covenants
    name: D&C 63:64
    chapter: 63
    verse: 64
    ordinal: 1479
    text: Remember that that which cometh from above is sacred, and must be spoken with care, and by constraint of the Spirit; and in this there is no condemnation, and ye receive the Spirit through prayer; wherefore, without this there remaineth condemnation.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.63
- type: DcVerse
  data:
    ref: dc.63.65
    scripture: doctrine-and-covenants
    name: D&C 63:65
    chapter: 63
    verse: 65
    ordinal: 1480
    text: Let my servants, Joseph Smith, Jun., and Sidney Rigdon, seek them a home, as they are taught through prayer by the Spirit.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.63
- type: DcVerse
  data:
    ref: dc.63.66
    scripture: doctrine-and-covenants
    name: D&C 63:66
    chapter: 63
    verse: 66
    ordinal: 1481
    text: These things remain to overcome through patience, that such may receive a more exceeding and eternal weight of glory, otherwise, a greater condemnation. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.63
- type: DcVerse
  data:
    ref: dc.64.1
    scripture: doctrine-and-covenants
    name: D&C 64:1
    chapter: 64
    verse: 1
    ordinal: 1482
    text: Behold, thus saith the Lord your God unto you, O ye elders of my church, hearken ye and hear, and receive my will concerning you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.64
- type: DcVerse
  data:
    ref: dc.64.2
    scripture: doctrine-and-covenants
    name: D&C 64:2
    chapter: 64
    verse: 2
    ordinal: 1483
    text: For verily I say unto you, I will that ye should overcome the world; wherefore I will have compassion upon you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.64
- type: DcVerse
  data:
    ref: dc.64.3
    scripture: doctrine-and-covenants
    name: D&C 64:3
    chapter: 64
    verse: 3
    ordinal: 1484
    text: There are those among you who have sinned; but verily I say, for this once, for mine own glory, and for the salvation of souls, I have forgiven you your sins.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.64
- type: DcVerse
  data:
    ref: dc.64.4
    scripture: doctrine-and-covenants
    name: D&C 64:4
    chapter: 64
    verse: 4
    ordinal: 1485
    text: I will be merciful unto you, for I have given unto you the kingdom.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.64
- type: DcVerse
  data:
    ref: dc.64.5
    scripture: doctrine-and-covenants
    name: D&C 64:5
    chapter: 64
    verse: 5
    ordinal: 1486
    text: And the keys of the mysteries of the kingdom shall not be taken from my servant Joseph Smith, Jun., through the means I have appointed, while he liveth, inasmuch as he obeyeth mine ordinances.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.64
- type: DcVerse
  data:
    ref: dc.64.6
    scripture: doctrine-and-covenants
    name: D&C 64:6
    chapter: 64
    verse: 6
    ordinal: 1487
    text: There are those who have sought occasion against him without cause;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.64
- type: DcVerse
  data:
    ref: dc.64.7
    scripture: doctrine-and-covenants
    name: D&C 64:7
    chapter: 64
    verse: 7
    ordinal: 1488
    text: Nevertheless, he has sinned; but verily I say unto you, I, the Lord, forgive sins unto those who confess their sins before me and ask forgiveness, who have not sinned unto death.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.64
- type: DcVerse
  data:
    ref: dc.64.8
    scripture: doctrine-and-covenants
    name: D&C 64:8
    chapter: 64
    verse: 8
    ordinal: 1489
    text: My disciples, in days of old, sought occasion against one another and forgave not one another in their hearts; and for this evil they were afflicted and sorely chastened.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.64
- type: DcVerse
  data:
    ref: dc.64.9
    scripture: doctrine-and-covenants
    name: D&C 64:9
    chapter: 64
    verse: 9
    ordinal: 1490
    text: Wherefore, I say unto you, that ye ought to forgive one another; for he that forgiveth not his brother his trespasses standeth condemned before the Lord; for there remaineth in him the greater sin.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.64
- type: DcVerse
  data:
    ref: dc.64.10
    scripture: doctrine-and-covenants
    name: D&C 64:10
    chapter: 64
    verse: 10
    ordinal: 1491
    text: I, the Lord, will forgive whom I will forgive, but of you it is required to forgive all men.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.64
- type: DcVerse
  data:
    ref: dc.64.11
    scripture: doctrine-and-covenants
    name: D&C 64:11
    chapter: 64
    verse: 11
    ordinal: 1492
    text: And ye ought to say in your hearts—let God judge between me and thee, and reward thee according to thy deeds.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.64
- type: DcVerse
  data:
    ref: dc.64.12
    scripture: doctrine-and-covenants
    name: D&C 64:12
    chapter: 64
    verse: 12
    ordinal: 1493
    text: And him that repenteth not of his sins, and confesseth them not, ye shall bring before the church, and do with him as the scripture saith unto you, either by commandment or by revelation.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.64
- type: DcVerse
  data:
    ref: dc.64.13
    scripture: doctrine-and-covenants
    name: D&C 64:13
    chapter: 64
    verse: 13
    ordinal: 1494
    text: And this ye shall do that God may be glorified—not because ye forgive not, having not compassion, but that ye may be justified in the eyes of the law, that ye may not offend him who is your lawgiver—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.64
- type: DcVerse
  data:
    ref: dc.64.14
    scripture: doctrine-and-covenants
    name: D&C 64:14
    chapter: 64
    verse: 14
    ordinal: 1495
    text: Verily I say, for this cause ye shall do these things.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.64
- type: DcVerse
  data:
    ref: dc.64.15
    scripture: doctrine-and-covenants
    name: D&C 64:15
    chapter: 64
    verse: 15
    ordinal: 1496
    text: Behold, I, the Lord, was angry with him who was my servant Ezra Booth, and also my servant Isaac Morley, for they kept not the law, neither the commandment;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.64
- type: DcVerse
  data:
    ref: dc.64.16
    scripture: doctrine-and-covenants
    name: D&C 64:16
    chapter: 64
    verse: 16
    ordinal: 1497
    text: They sought evil in their hearts, and I, the Lord, withheld my Spirit. They condemned for evil that thing in which there was no evil; nevertheless I have forgiven my servant Isaac Morley.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.64
- type: DcVerse
  data:
    ref: dc.64.17
    scripture: doctrine-and-covenants
    name: D&C 64:17
    chapter: 64
    verse: 17
    ordinal: 1498
    text: And also my servant Edward Partridge, behold, he hath sinned, and Satan seeketh to destroy his soul; but when these things are made known unto them, and they repent of the evil, they shall be forgiven.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.64
- type: DcVerse
  data:
    ref: dc.64.18
    scripture: doctrine-and-covenants
    name: D&C 64:18
    chapter: 64
    verse: 18
    ordinal: 1499
    text: And now, verily I say that it is expedient in me that my servant Sidney Gilbert, after a few weeks, shall return upon his business, and to his agency in the land of Zion;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.64
- type: DcVerse
  data:
    ref: dc.64.19
    scripture: doctrine-and-covenants
    name: D&C 64:19
    chapter: 64
    verse: 19
    ordinal: 1500
    text: And that which he hath seen and heard may be made known unto my disciples, that they perish not. And for this cause have I spoken these things.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.64
- type: DcVerse
  data:
    ref: dc.64.20
    scripture: doctrine-and-covenants
    name: D&C 64:20
    chapter: 64
    verse: 20
    ordinal: 1501
    text: And again, I say unto you, that my servant Isaac Morley may not be tempted above that which he is able to bear, and counsel wrongfully to your hurt, I gave commandment that his farm should be sold.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.64
- type: DcVerse
  data:
    ref: dc.64.21
    scripture: doctrine-and-covenants
    name: D&C 64:21
    chapter: 64
    verse: 21
    ordinal: 1502
    text: I will not that my servant Frederick G. Williams should sell his farm, for I, the Lord, will to retain a strong hold in the land of Kirtland, for the space of five years, in the which I will not overthrow the wicked, that thereby I may save some.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.64
- type: DcVerse
  data:
    ref: dc.64.22
    scripture: doctrine-and-covenants
    name: D&C 64:22
    chapter: 64
    verse: 22
    ordinal: 1503
    text: And after that day, I, the Lord, will not hold any guilty that shall go with an open heart up to the land of Zion; for I, the Lord, require the hearts of the children of men.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.64
- type: DcVerse
  data:
    ref: dc.64.23
    scripture: doctrine-and-covenants
    name: D&C 64:23
    chapter: 64
    verse: 23
    ordinal: 1504
    text: Behold, now it is called today until the coming of the Son of Man, and verily it is a day of sacrifice, and a day for the tithing of my people; for he that is tithed shall not be burned at his coming.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.64
- type: DcVerse
  data:
    ref: dc.64.24
    scripture: doctrine-and-covenants
    name: D&C 64:24
    chapter: 64
    verse: 24
    ordinal: 1505
    text: For after today cometh the burning—this is speaking after the manner of the Lord—for verily I say, tomorrow all the proud and they that do wickedly shall be as stubble; and I will burn them up, for I am the Lord of Hosts; and I will not spare any that remain in Babylon.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Malachi 4:1
    kjvAllusionOsis:
    - Mal.4.1
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.64
- type: DcVerse
  data:
    ref: dc.64.25
    scripture: doctrine-and-covenants
    name: D&C 64:25
    chapter: 64
    verse: 25
    ordinal: 1506
    text: Wherefore, if ye believe me, ye will labor while it is called today.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.64
- type: DcVerse
  data:
    ref: dc.64.26
    scripture: doctrine-and-covenants
    name: D&C 64:26
    chapter: 64
    verse: 26
    ordinal: 1507
    text: And it is not meet that my servants, Newel K. Whitney and Sidney Gilbert, should sell their store and their possessions here; for this is not wisdom until the residue of the church, which remaineth in this place, shall go up unto the land of Zion.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.64
- type: DcVerse
  data:
    ref: dc.64.27
    scripture: doctrine-and-covenants
    name: D&C 64:27
    chapter: 64
    verse: 27
    ordinal: 1508
    text: Behold, it is said in my laws, or forbidden, to get in debt to thine enemies;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.64
- type: DcVerse
  data:
    ref: dc.64.28
    scripture: doctrine-and-covenants
    name: D&C 64:28
    chapter: 64
    verse: 28
    ordinal: 1509
    text: But behold, it is not said at any time that the Lord should not take when he please, and pay as seemeth him good.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.64
- type: DcVerse
  data:
    ref: dc.64.29
    scripture: doctrine-and-covenants
    name: D&C 64:29
    chapter: 64
    verse: 29
    ordinal: 1510
    text: Wherefore, as ye are agents, ye are on the Lord's errand; and whatever ye do according to the will of the Lord is the Lord's business.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.64
- type: DcVerse
  data:
    ref: dc.64.30
    scripture: doctrine-and-covenants
    name: D&C 64:30
    chapter: 64
    verse: 30
    ordinal: 1511
    text: And he hath set you to provide for his saints in these last days, that they may obtain an inheritance in the land of Zion.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.64
- type: DcVerse
  data:
    ref: dc.64.31
    scripture: doctrine-and-covenants
    name: D&C 64:31
    chapter: 64
    verse: 31
    ordinal: 1512
    text: And behold, I, the Lord, declare unto you, and my words are sure and shall not fail, that they shall obtain it.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.64
- type: DcVerse
  data:
    ref: dc.64.32
    scripture: doctrine-and-covenants
    name: D&C 64:32
    chapter: 64
    verse: 32
    ordinal: 1513
    text: But all things must come to pass in their time.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.64
- type: DcVerse
  data:
    ref: dc.64.33
    scripture: doctrine-and-covenants
    name: D&C 64:33
    chapter: 64
    verse: 33
    ordinal: 1514
    text: Wherefore, be not weary in well-doing, for ye are laying the foundation of a great work. And out of small things proceedeth that which is great.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.64
- type: DcVerse
  data:
    ref: dc.64.34
    scripture: doctrine-and-covenants
    name: D&C 64:34
    chapter: 64
    verse: 34
    ordinal: 1515
    text: Behold, the Lord requireth the heart and a willing mind; and the willing and obedient shall eat the good of the land of Zion in these last days.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Isaiah 1:19
    kjvAllusionOsis:
    - Isa.1.19
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.64
- type: DcVerse
  data:
    ref: dc.64.35
    scripture: doctrine-and-covenants
    name: D&C 64:35
    chapter: 64
    verse: 35
    ordinal: 1516
    text: And the rebellious shall be cut off out of the land of Zion, and shall be sent away, and shall not inherit the land.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.64
- type: DcVerse
  data:
    ref: dc.64.36
    scripture: doctrine-and-covenants
    name: D&C 64:36
    chapter: 64
    verse: 36
    ordinal: 1517
    text: For, verily I say that the rebellious are not of the blood of Ephraim, wherefore they shall be plucked out.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.64
- type: DcVerse
  data:
    ref: dc.64.37
    scripture: doctrine-and-covenants
    name: D&C 64:37
    chapter: 64
    verse: 37
    ordinal: 1518
    text: Behold, I, the Lord, have made my church in these last days like unto a judge sitting on a hill, or in a high place, to judge the nations.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.64
- type: DcVerse
  data:
    ref: dc.64.38
    scripture: doctrine-and-covenants
    name: D&C 64:38
    chapter: 64
    verse: 38
    ordinal: 1519
    text: For it shall come to pass that the inhabitants of Zion shall judge all things pertaining to Zion.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.64
- type: DcVerse
  data:
    ref: dc.64.39
    scripture: doctrine-and-covenants
    name: D&C 64:39
    chapter: 64
    verse: 39
    ordinal: 1520
    text: And liars and hypocrites shall be proved by them, and they who are not apostles and prophets shall be known.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.64
- type: DcVerse
  data:
    ref: dc.64.40
    scripture: doctrine-and-covenants
    name: D&C 64:40
    chapter: 64
    verse: 40
    ordinal: 1521
    text: And even the bishop, who is a judge, and his counselors, if they are not faithful in their stewardships shall be condemned, and others shall be planted in their stead.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.64
- type: DcVerse
  data:
    ref: dc.64.41
    scripture: doctrine-and-covenants
    name: D&C 64:41
    chapter: 64
    verse: 41
    ordinal: 1522
    text: For, behold, I say unto you that Zion shall flourish, and the glory of the Lord shall be upon her;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.64
- type: DcVerse
  data:
    ref: dc.64.42
    scripture: doctrine-and-covenants
    name: D&C 64:42
    chapter: 64
    verse: 42
    ordinal: 1523
    text: And she shall be an ensign unto the people, and there shall come unto her out of every nation under heaven.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.64
- type: DcVerse
  data:
    ref: dc.64.43
    scripture: doctrine-and-covenants
    name: D&C 64:43
    chapter: 64
    verse: 43
    ordinal: 1524
    text: And the day shall come when the nations of the earth shall tremble because of her, and shall fear because of her terrible ones. The Lord hath spoken it. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.64
- type: DcVerse
  data:
    ref: dc.65.1
    scripture: doctrine-and-covenants
    name: D&C 65:1
    chapter: 65
    verse: 1
    ordinal: 1525
    text: Hearken, and lo, a voice as of one sent down from on high, who is mighty and powerful, whose going forth is unto the ends of the earth, yea, whose voice is unto men—Prepare ye the way of the Lord, make his paths straight.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.65
- type: DcVerse
  data:
    ref: dc.65.2
    scripture: doctrine-and-covenants
    name: D&C 65:2
    chapter: 65
    verse: 2
    ordinal: 1526
    text: The keys of the kingdom of God are committed unto man on the earth, and from thence shall the gospel roll forth unto the ends of the earth, as the stone which is cut out of the mountain without hands shall roll forth, until it has filled the whole earth.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.65
- type: DcVerse
  data:
    ref: dc.65.3
    scripture: doctrine-and-covenants
    name: D&C 65:3
    chapter: 65
    verse: 3
    ordinal: 1527
    text: Yea, a voice crying—Prepare ye the way of the Lord, prepare ye the supper of the Lamb, make ready for the Bridegroom.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Mark 1:3
    kjvAllusionOsis:
    - Mark.1.3
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.65
- type: DcVerse
  data:
    ref: dc.65.4
    scripture: doctrine-and-covenants
    name: D&C 65:4
    chapter: 65
    verse: 4
    ordinal: 1528
    text: Pray unto the Lord, call upon his holy name, make known his wonderful works among the people.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - 1 Chronicles 16:8
    kjvAllusionOsis:
    - 1Chr.16.8
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.65
- type: DcVerse
  data:
    ref: dc.65.5
    scripture: doctrine-and-covenants
    name: D&C 65:5
    chapter: 65
    verse: 5
    ordinal: 1529
    text: Call upon the Lord, that his kingdom may go forth upon the earth, that the inhabitants thereof may receive it, and be prepared for the days to come, in the which the Son of Man shall come down in heaven, clothed in the brightness of his glory, to meet the kingdom of God which is set up on the earth.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.65
- type: DcVerse
  data:
    ref: dc.65.6
    scripture: doctrine-and-covenants
    name: D&C 65:6
    chapter: 65
    verse: 6
    ordinal: 1530
    text: Wherefore, may the kingdom of God go forth, that the kingdom of heaven may come, that thou, O God, mayest be glorified in heaven so on earth, that thine enemies may be subdued; for thine is the honor, power and glory, forever and ever. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.65
- type: DcVerse
  data:
    ref: dc.66.1
    scripture: doctrine-and-covenants
    name: D&C 66:1
    chapter: 66
    verse: 1
    ordinal: 1531
    text: Behold, thus saith the Lord unto my servant William E. McLellin—Blessed are you, inasmuch as you have turned away from your iniquities, and have received my truths, saith the Lord your Redeemer, the Savior of the world, even of as many as believe on my name.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.66
- type: DcVerse
  data:
    ref: dc.66.2
    scripture: doctrine-and-covenants
    name: D&C 66:2
    chapter: 66
    verse: 2
    ordinal: 1532
    text: Verily I say unto you, blessed are you for receiving mine everlasting covenant, even the fulness of my gospel, sent forth unto the children of men, that they might have life and be made partakers of the glories which are to be revealed in the last days, as it was written by the prophets and apostles in days of old.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.66
- type: DcVerse
  data:
    ref: dc.66.3
    scripture: doctrine-and-covenants
    name: D&C 66:3
    chapter: 66
    verse: 3
    ordinal: 1533
    text: Verily I say unto you, my servant William, that you are clean, but not all; repent, therefore, of those things which are not pleasing in my sight, saith the Lord, for the Lord will show them unto you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.66
- type: DcVerse
  data:
    ref: dc.66.4
    scripture: doctrine-and-covenants
    name: D&C 66:4
    chapter: 66
    verse: 4
    ordinal: 1534
    text: And now, verily, I, the Lord, will show unto you what I will concerning you, or what is my will concerning you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.66
- type: DcVerse
  data:
    ref: dc.66.5
    scripture: doctrine-and-covenants
    name: D&C 66:5
    chapter: 66
    verse: 5
    ordinal: 1535
    text: Behold, verily I say unto you, that it is my will that you should proclaim my gospel from land to land, and from city to city, yea, in those regions round about where it has not been proclaimed.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.66
- type: DcVerse
  data:
    ref: dc.66.6
    scripture: doctrine-and-covenants
    name: D&C 66:6
    chapter: 66
    verse: 6
    ordinal: 1536
    text: Tarry not many days in this place; go not up unto the land of Zion as yet; but inasmuch as you can send, send; otherwise, think not of thy property.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.66
- type: DcVerse
  data:
    ref: dc.66.7
    scripture: doctrine-and-covenants
    name: D&C 66:7
    chapter: 66
    verse: 7
    ordinal: 1537
    text: Go unto the eastern lands, bear testimony in every place, unto every people and in their synagogues, reasoning with the people.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.66
- type: DcVerse
  data:
    ref: dc.66.8
    scripture: doctrine-and-covenants
    name: D&C 66:8
    chapter: 66
    verse: 8
    ordinal: 1538
    text: Let my servant Samuel H. Smith go with you, and forsake him not, and give him thine instructions; and he that is faithful shall be made strong in every place; and I, the Lord, will go with you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.66
- type: DcVerse
  data:
    ref: dc.66.9
    scripture: doctrine-and-covenants
    name: D&C 66:9
    chapter: 66
    verse: 9
    ordinal: 1539
    text: Lay your hands upon the sick, and they shall recover. Return not till I, the Lord, shall send you. Be patient in affliction. Ask, and ye shall receive; knock, and it shall be opened unto you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.66
- type: DcVerse
  data:
    ref: dc.66.10
    scripture: doctrine-and-covenants
    name: D&C 66:10
    chapter: 66
    verse: 10
    ordinal: 1540
    text: Seek not to be cumbered. Forsake all unrighteousness. Commit not adultery—a temptation with which thou hast been troubled.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.66
- type: DcVerse
  data:
    ref: dc.66.11
    scripture: doctrine-and-covenants
    name: D&C 66:11
    chapter: 66
    verse: 11
    ordinal: 1541
    text: Keep these sayings, for they are true and faithful; and thou shalt magnify thine office, and push many people to Zion with songs of everlasting joy upon their heads.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.66
- type: DcVerse
  data:
    ref: dc.66.12
    scripture: doctrine-and-covenants
    name: D&C 66:12
    chapter: 66
    verse: 12
    ordinal: 1542
    text: Continue in these things even unto the end, and you shall have a crown of eternal life at the right hand of my Father, who is full of grace and truth.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.66
- type: DcVerse
  data:
    ref: dc.66.13
    scripture: doctrine-and-covenants
    name: D&C 66:13
    chapter: 66
    verse: 13
    ordinal: 1543
    text: Verily, thus saith the Lord your God, your Redeemer, even Jesus Christ. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.66
- type: DcVerse
  data:
    ref: dc.67.1
    scripture: doctrine-and-covenants
    name: D&C 67:1
    chapter: 67
    verse: 1
    ordinal: 1544
    text: Behold and hearken, O ye elders of my church, who have assembled yourselves together, whose prayers I have heard, and whose hearts I know, and whose desires have come up before me.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.67
- type: DcVerse
  data:
    ref: dc.67.2
    scripture: doctrine-and-covenants
    name: D&C 67:2
    chapter: 67
    verse: 2
    ordinal: 1545
    text: Behold and lo, mine eyes are upon you, and the heavens and the earth are in mine hands, and the riches of eternity are mine to give.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.67
- type: DcVerse
  data:
    ref: dc.67.3
    scripture: doctrine-and-covenants
    name: D&C 67:3
    chapter: 67
    verse: 3
    ordinal: 1546
    text: Ye endeavored to believe that ye should receive the blessing which was offered unto you; but behold, verily I say unto you there were fears in your hearts, and verily this is the reason that ye did not receive.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.67
- type: DcVerse
  data:
    ref: dc.67.4
    scripture: doctrine-and-covenants
    name: D&C 67:4
    chapter: 67
    verse: 4
    ordinal: 1547
    text: And now I, the Lord, give unto you a testimony of the truth of these commandments which are lying before you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.67
- type: DcVerse
  data:
    ref: dc.67.5
    scripture: doctrine-and-covenants
    name: D&C 67:5
    chapter: 67
    verse: 5
    ordinal: 1548
    text: Your eyes have been upon my servant Joseph Smith, Jun., and his language you have known, and his imperfections you have known; and you have sought in your hearts knowledge that you might express beyond his language; this you also know.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.67
- type: DcVerse
  data:
    ref: dc.67.6
    scripture: doctrine-and-covenants
    name: D&C 67:6
    chapter: 67
    verse: 6
    ordinal: 1549
    text: Now, seek ye out of the Book of Commandments, even the least that is among them, and appoint him that is the most wise among you;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.67
- type: DcVerse
  data:
    ref: dc.67.7
    scripture: doctrine-and-covenants
    name: D&C 67:7
    chapter: 67
    verse: 7
    ordinal: 1550
    text: Or, if there be any among you that shall make one like unto it, then ye are justified in saying that ye do not know that they are true;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.67
- type: DcVerse
  data:
    ref: dc.67.8
    scripture: doctrine-and-covenants
    name: D&C 67:8
    chapter: 67
    verse: 8
    ordinal: 1551
    text: But if ye cannot make one like unto it, ye are under condemnation if ye do not bear record that they are true.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.67
- type: DcVerse
  data:
    ref: dc.67.9
    scripture: doctrine-and-covenants
    name: D&C 67:9
    chapter: 67
    verse: 9
    ordinal: 1552
    text: For ye know that there is no unrighteousness in them, and that which is righteous cometh down from above, from the Father of lights.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.67
- type: DcVerse
  data:
    ref: dc.67.10
    scripture: doctrine-and-covenants
    name: D&C 67:10
    chapter: 67
    verse: 10
    ordinal: 1553
    text: And again, verily I say unto you that it is your privilege, and a promise I give unto you that have been ordained unto this ministry, that inasmuch as you strip yourselves from jealousies and fears, and humble yourselves before me, for ye are not sufficiently humble, the veil shall be rent and you shall see me and know that I am—not with the carnal neither natural mind, but with the spiritual.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.67
- type: DcVerse
  data:
    ref: dc.67.11
    scripture: doctrine-and-covenants
    name: D&C 67:11
    chapter: 67
    verse: 11
    ordinal: 1554
    text: For no man has seen God at any time in the flesh, except quickened by the Spirit of God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.67
- type: DcVerse
  data:
    ref: dc.67.12
    scripture: doctrine-and-covenants
    name: D&C 67:12
    chapter: 67
    verse: 12
    ordinal: 1555
    text: Neither can any natural man abide the presence of God, neither after the carnal mind.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.67
- type: DcVerse
  data:
    ref: dc.67.13
    scripture: doctrine-and-covenants
    name: D&C 67:13
    chapter: 67
    verse: 13
    ordinal: 1556
    text: Ye are not able to abide the presence of God now, neither the ministering of angels; wherefore, continue in patience until ye are perfected.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.67
- type: DcVerse
  data:
    ref: dc.67.14
    scripture: doctrine-and-covenants
    name: D&C 67:14
    chapter: 67
    verse: 14
    ordinal: 1557
    text: Let not your minds turn back; and when ye are worthy, in mine own due time, ye shall see and know that which was conferred upon you by the hands of my servant Joseph Smith, Jun. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.67
- type: DcVerse
  data:
    ref: dc.68.1
    scripture: doctrine-and-covenants
    name: D&C 68:1
    chapter: 68
    verse: 1
    ordinal: 1558
    text: My servant, Orson Hyde, was called by his ordination to proclaim the everlasting gospel, by the Spirit of the living God, from people to people, and from land to land, in the congregations of the wicked, in their synagogues, reasoning with and expounding all scriptures unto them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.68
- type: DcVerse
  data:
    ref: dc.68.2
    scripture: doctrine-and-covenants
    name: D&C 68:2
    chapter: 68
    verse: 2
    ordinal: 1559
    text: And, behold, and lo, this is an ensample unto all those who were ordained unto this priesthood, whose mission is appointed unto them to go forth—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.68
- type: DcVerse
  data:
    ref: dc.68.3
    scripture: doctrine-and-covenants
    name: D&C 68:3
    chapter: 68
    verse: 3
    ordinal: 1560
    text: And this is the ensample unto them, that they shall speak as they are moved upon by the Holy Ghost.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.68
- type: DcVerse
  data:
    ref: dc.68.4
    scripture: doctrine-and-covenants
    name: D&C 68:4
    chapter: 68
    verse: 4
    ordinal: 1561
    text: And whatsoever they shall speak when moved upon by the Holy Ghost shall be scripture, shall be the will of the Lord, shall be the mind of the Lord, shall be the word of the Lord, shall be the voice of the Lord, and the power of God unto salvation.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.68
- type: DcVerse
  data:
    ref: dc.68.5
    scripture: doctrine-and-covenants
    name: D&C 68:5
    chapter: 68
    verse: 5
    ordinal: 1562
    text: Behold, this is the promise of the Lord unto you, O ye my servants.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.68
- type: DcVerse
  data:
    ref: dc.68.6
    scripture: doctrine-and-covenants
    name: D&C 68:6
    chapter: 68
    verse: 6
    ordinal: 1563
    text: Wherefore, be of good cheer, and do not fear, for I the Lord am with you, and will stand by you; and ye shall bear record of me, even Jesus Christ, that I am the Son of the living God, that I was, that I am, and that I am to come.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.68
- type: DcVerse
  data:
    ref: dc.68.7
    scripture: doctrine-and-covenants
    name: D&C 68:7
    chapter: 68
    verse: 7
    ordinal: 1564
    text: This is the word of the Lord unto you, my servant Orson Hyde, and also unto my servant Luke Johnson, and unto my servant Lyman Johnson, and unto my servant William E. McLellin, and unto all the faithful elders of my church—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.68
- type: DcVerse
  data:
    ref: dc.68.8
    scripture: doctrine-and-covenants
    name: D&C 68:8
    chapter: 68
    verse: 8
    ordinal: 1565
    text: Go ye into all the world, preach the gospel to every creature, acting in the authority which I have given you, baptizing in the name of the Father, and of the Son, and of the Holy Ghost.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Mark 16:15
    kjvAllusionOsis:
    - Mark.16.15
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.68
- type: DcVerse
  data:
    ref: dc.68.9
    scripture: doctrine-and-covenants
    name: D&C 68:9
    chapter: 68
    verse: 9
    ordinal: 1566
    text: And he that believeth and is baptized shall be saved, and he that believeth not shall be damned.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Mark 16:16
    kjvOsis:
    - Mark.16.16
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.68
- type: DcVerse
  data:
    ref: dc.68.10
    scripture: doctrine-and-covenants
    name: D&C 68:10
    chapter: 68
    verse: 10
    ordinal: 1567
    text: And he that believeth shall be blest with signs following, even as it is written.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.68
- type: DcVerse
  data:
    ref: dc.68.11
    scripture: doctrine-and-covenants
    name: D&C 68:11
    chapter: 68
    verse: 11
    ordinal: 1568
    text: And unto you it shall be given to know the signs of the times, and the signs of the coming of the Son of Man;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.68
- type: DcVerse
  data:
    ref: dc.68.12
    scripture: doctrine-and-covenants
    name: D&C 68:12
    chapter: 68
    verse: 12
    ordinal: 1569
    text: And of as many as the Father shall bear record, to you shall be given power to seal them up unto eternal life. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.68
- type: DcVerse
  data:
    ref: dc.68.13
    scripture: doctrine-and-covenants
    name: D&C 68:13
    chapter: 68
    verse: 13
    ordinal: 1570
    text: And now, concerning the items in addition to the covenants and commandments, they are these—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.68
- type: DcVerse
  data:
    ref: dc.68.14
    scripture: doctrine-and-covenants
    name: D&C 68:14
    chapter: 68
    verse: 14
    ordinal: 1571
    text: There remain hereafter, in the due time of the Lord, other bishops to be set apart unto the church, to minister even according to the first;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.68
- type: DcVerse
  data:
    ref: dc.68.15
    scripture: doctrine-and-covenants
    name: D&C 68:15
    chapter: 68
    verse: 15
    ordinal: 1572
    text: Wherefore they shall be high priests who are worthy, and they shall be appointed by the First Presidency of the Melchizedek Priesthood, except they be literal descendants of Aaron.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.68
- type: DcVerse
  data:
    ref: dc.68.16
    scripture: doctrine-and-covenants
    name: D&C 68:16
    chapter: 68
    verse: 16
    ordinal: 1573
    text: And if they be literal descendants of Aaron they have a legal right to the bishopric, if they are the firstborn among the sons of Aaron;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.68
- type: DcVerse
  data:
    ref: dc.68.17
    scripture: doctrine-and-covenants
    name: D&C 68:17
    chapter: 68
    verse: 17
    ordinal: 1574
    text: For the firstborn holds the right of the presidency over this priesthood, and the keys or authority of the same.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.68
- type: DcVerse
  data:
    ref: dc.68.18
    scripture: doctrine-and-covenants
    name: D&C 68:18
    chapter: 68
    verse: 18
    ordinal: 1575
    text: No man has a legal right to this office, to hold the keys of this priesthood, except he be a literal descendant and the firstborn of Aaron.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.68
- type: DcVerse
  data:
    ref: dc.68.19
    scripture: doctrine-and-covenants
    name: D&C 68:19
    chapter: 68
    verse: 19
    ordinal: 1576
    text: But, as a high priest of the Melchizedek Priesthood has authority to officiate in all the lesser offices he may officiate in the office of bishop when no literal descendant of Aaron can be found, provided he is called and set apart and ordained unto this power, under the hands of the First Presidency of the Melchizedek Priesthood.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.68
- type: DcVerse
  data:
    ref: dc.68.20
    scripture: doctrine-and-covenants
    name: D&C 68:20
    chapter: 68
    verse: 20
    ordinal: 1577
    text: And a literal descendant of Aaron, also, must be designated by this Presidency, and found worthy, and anointed, and ordained under the hands of this Presidency, otherwise they are not legally authorized to officiate in their priesthood.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.68
- type: DcVerse
  data:
    ref: dc.68.21
    scripture: doctrine-and-covenants
    name: D&C 68:21
    chapter: 68
    verse: 21
    ordinal: 1578
    text: But, by virtue of the decree concerning their right of the priesthood descending from father to son, they may claim their anointing if at any time they can prove their lineage, or do ascertain it by revelation from the Lord under the hands of the above named Presidency.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.68
- type: DcVerse
  data:
    ref: dc.68.22
    scripture: doctrine-and-covenants
    name: D&C 68:22
    chapter: 68
    verse: 22
    ordinal: 1579
    text: And again, no bishop or high priest who shall be set apart for this ministry shall be tried or condemned for any crime, save it be before the First Presidency of the church;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.68
- type: DcVerse
  data:
    ref: dc.68.23
    scripture: doctrine-and-covenants
    name: D&C 68:23
    chapter: 68
    verse: 23
    ordinal: 1580
    text: And inasmuch as he is found guilty before this Presidency, by testimony that cannot be impeached, he shall be condemned;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.68
- type: DcVerse
  data:
    ref: dc.68.24
    scripture: doctrine-and-covenants
    name: D&C 68:24
    chapter: 68
    verse: 24
    ordinal: 1581
    text: And if he repent he shall be forgiven, according to the covenants and commandments of the church.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.68
- type: DcVerse
  data:
    ref: dc.68.25
    scripture: doctrine-and-covenants
    name: D&C 68:25
    chapter: 68
    verse: 25
    ordinal: 1582
    text: And again, inasmuch as parents have children in Zion, or in any of her stakes which are organized, that teach them not to understand the doctrine of repentance, faith in Christ the Son of the living God, and of baptism and the gift of the Holy Ghost by the laying on of the hands, when eight years old, the sin be upon the heads of the parents.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.68
- type: DcVerse
  data:
    ref: dc.68.26
    scripture: doctrine-and-covenants
    name: D&C 68:26
    chapter: 68
    verse: 26
    ordinal: 1583
    text: For this shall be a law unto the inhabitants of Zion, or in any of her stakes which are organized.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.68
- type: DcVerse
  data:
    ref: dc.68.27
    scripture: doctrine-and-covenants
    name: D&C 68:27
    chapter: 68
    verse: 27
    ordinal: 1584
    text: And their children shall be baptized for the remission of their sins when eight years old, and receive the laying on of the hands.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.68
- type: DcVerse
  data:
    ref: dc.68.28
    scripture: doctrine-and-covenants
    name: D&C 68:28
    chapter: 68
    verse: 28
    ordinal: 1585
    text: And they shall also teach their children to pray, and to walk uprightly before the Lord.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.68
- type: DcVerse
  data:
    ref: dc.68.29
    scripture: doctrine-and-covenants
    name: D&C 68:29
    chapter: 68
    verse: 29
    ordinal: 1586
    text: And the inhabitants of Zion shall also observe the Sabbath day to keep it holy.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.68
- type: DcVerse
  data:
    ref: dc.68.30
    scripture: doctrine-and-covenants
    name: D&C 68:30
    chapter: 68
    verse: 30
    ordinal: 1587
    text: And the inhabitants of Zion also shall remember their labors, inasmuch as they are appointed to labor, in all faithfulness; for the idler shall be had in remembrance before the Lord.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.68
- type: DcVerse
  data:
    ref: dc.68.31
    scripture: doctrine-and-covenants
    name: D&C 68:31
    chapter: 68
    verse: 31
    ordinal: 1588
    text: Now, I, the Lord, am not well pleased with the inhabitants of Zion, for there are idlers among them; and their children are also growing up in wickedness; they also seek not earnestly the riches of eternity, but their eyes are full of greediness.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.68
- type: DcVerse
  data:
    ref: dc.68.32
    scripture: doctrine-and-covenants
    name: D&C 68:32
    chapter: 68
    verse: 32
    ordinal: 1589
    text: These things ought not to be, and must be done away from among them; wherefore, let my servant Oliver Cowdery carry these sayings unto the land of Zion.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.68
- type: DcVerse
  data:
    ref: dc.68.33
    scripture: doctrine-and-covenants
    name: D&C 68:33
    chapter: 68
    verse: 33
    ordinal: 1590
    text: And a commandment I give unto them—that he that observeth not his prayers before the Lord in the season thereof, let him be had in remembrance before the judge of my people.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.68
- type: DcVerse
  data:
    ref: dc.68.34
    scripture: doctrine-and-covenants
    name: D&C 68:34
    chapter: 68
    verse: 34
    ordinal: 1591
    text: These sayings are true and faithful; wherefore, transgress them not, neither take therefrom.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.68
- type: DcVerse
  data:
    ref: dc.68.35
    scripture: doctrine-and-covenants
    name: D&C 68:35
    chapter: 68
    verse: 35
    ordinal: 1592
    text: Behold, I am Alpha and Omega, and I come quickly. Amen.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Revelation 22:13
    kjvAllusionOsis:
    - Rev.22.13
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.68
- type: DcVerse
  data:
    ref: dc.69.1
    scripture: doctrine-and-covenants
    name: D&C 69:1
    chapter: 69
    verse: 1
    ordinal: 1593
    text: Hearken unto me, saith the Lord your God, for my servant Oliver Cowdery's sake. It is not wisdom in me that he should be entrusted with the commandments and the moneys which he shall carry unto the land of Zion, except one go with him who will be true and faithful.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.69
- type: DcVerse
  data:
    ref: dc.69.2
    scripture: doctrine-and-covenants
    name: D&C 69:2
    chapter: 69
    verse: 2
    ordinal: 1594
    text: Wherefore, I, the Lord, will that my servant, John Whitmer, should go with my servant Oliver Cowdery;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.69
- type: DcVerse
  data:
    ref: dc.69.3
    scripture: doctrine-and-covenants
    name: D&C 69:3
    chapter: 69
    verse: 3
    ordinal: 1595
    text: And also that he shall continue in writing and making a history of all the important things which he shall observe and know concerning my church;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.69
- type: DcVerse
  data:
    ref: dc.69.4
    scripture: doctrine-and-covenants
    name: D&C 69:4
    chapter: 69
    verse: 4
    ordinal: 1596
    text: And also that he receive counsel and assistance from my servant Oliver Cowdery and others.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.69
- type: DcVerse
  data:
    ref: dc.69.5
    scripture: doctrine-and-covenants
    name: D&C 69:5
    chapter: 69
    verse: 5
    ordinal: 1597
    text: And also, my servants who are abroad in the earth should send forth the accounts of their stewardships to the land of Zion;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.69
- type: DcVerse
  data:
    ref: dc.69.6
    scripture: doctrine-and-covenants
    name: D&C 69:6
    chapter: 69
    verse: 6
    ordinal: 1598
    text: For the land of Zion shall be a seat and a place to receive and do all these things.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.69
- type: DcVerse
  data:
    ref: dc.69.7
    scripture: doctrine-and-covenants
    name: D&C 69:7
    chapter: 69
    verse: 7
    ordinal: 1599
    text: Nevertheless, let my servant John Whitmer travel many times from place to place, and from church to church, that he may the more easily obtain knowledge—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.69
- type: DcVerse
  data:
    ref: dc.69.8
    scripture: doctrine-and-covenants
    name: D&C 69:8
    chapter: 69
    verse: 8
    ordinal: 1600
    text: Preaching and expounding, writing, copying, selecting, and obtaining all things which shall be for the good of the church, and for the rising generations that shall grow up on the land of Zion, to possess it from generation to generation, forever and ever. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.69
- type: DcVerse
  data:
    ref: dc.70.1
    scripture: doctrine-and-covenants
    name: D&C 70:1
    chapter: 70
    verse: 1
    ordinal: 1601
    text: Behold, and hearken, O ye inhabitants of Zion, and all ye people of my church who are afar off, and hear the word of the Lord which I give unto my servant Joseph Smith, Jun., and also unto my servant Martin Harris, and also unto my servant Oliver Cowdery, and also unto my servant John Whitmer, and also unto my servant Sidney Rigdon, and also unto my servant William W. Phelps, by the way of commandment unto them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.70
- type: DcVerse
  data:
    ref: dc.70.2
    scripture: doctrine-and-covenants
    name: D&C 70:2
    chapter: 70
    verse: 2
    ordinal: 1602
    text: For I give unto them a commandment; wherefore hearken and hear, for thus saith the Lord unto them—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.70
- type: DcVerse
  data:
    ref: dc.70.3
    scripture: doctrine-and-covenants
    name: D&C 70:3
    chapter: 70
    verse: 3
    ordinal: 1603
    text: I, the Lord, have appointed them, and ordained them to be stewards over the revelations and commandments which I have given unto them, and which I shall hereafter give unto them;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.70
- type: DcVerse
  data:
    ref: dc.70.4
    scripture: doctrine-and-covenants
    name: D&C 70:4
    chapter: 70
    verse: 4
    ordinal: 1604
    text: And an account of this stewardship will I require of them in the day of judgment.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.70
- type: DcVerse
  data:
    ref: dc.70.5
    scripture: doctrine-and-covenants
    name: D&C 70:5
    chapter: 70
    verse: 5
    ordinal: 1605
    text: Wherefore, I have appointed unto them, and this is their business in the church of God, to manage them and the concerns thereof, yea, the benefits thereof.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.70
- type: DcVerse
  data:
    ref: dc.70.6
    scripture: doctrine-and-covenants
    name: D&C 70:6
    chapter: 70
    verse: 6
    ordinal: 1606
    text: Wherefore, a commandment I give unto them, that they shall not give these things unto the church, neither unto the world;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.70
- type: DcVerse
  data:
    ref: dc.70.7
    scripture: doctrine-and-covenants
    name: D&C 70:7
    chapter: 70
    verse: 7
    ordinal: 1607
    text: Nevertheless, inasmuch as they receive more than is needful for their necessities and their wants, it shall be given into my storehouse;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.70
- type: DcVerse
  data:
    ref: dc.70.8
    scripture: doctrine-and-covenants
    name: D&C 70:8
    chapter: 70
    verse: 8
    ordinal: 1608
    text: And the benefits shall be consecrated unto the inhabitants of Zion, and unto their generations, inasmuch as they become heirs according to the laws of the kingdom.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.70
- type: DcVerse
  data:
    ref: dc.70.9
    scripture: doctrine-and-covenants
    name: D&C 70:9
    chapter: 70
    verse: 9
    ordinal: 1609
    text: Behold, this is what the Lord requires of every man in his stewardship, even as I, the Lord, have appointed or shall hereafter appoint unto any man.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.70
- type: DcVerse
  data:
    ref: dc.70.10
    scripture: doctrine-and-covenants
    name: D&C 70:10
    chapter: 70
    verse: 10
    ordinal: 1610
    text: And behold, none are exempt from this law who belong to the church of the living God;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.70
- type: DcVerse
  data:
    ref: dc.70.11
    scripture: doctrine-and-covenants
    name: D&C 70:11
    chapter: 70
    verse: 11
    ordinal: 1611
    text: Yea, neither the bishop, neither the agent who keepeth the Lord's storehouse, neither he who is appointed in a stewardship over temporal things.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.70
- type: DcVerse
  data:
    ref: dc.70.12
    scripture: doctrine-and-covenants
    name: D&C 70:12
    chapter: 70
    verse: 12
    ordinal: 1612
    text: He who is appointed to administer spiritual things, the same is worthy of his hire, even as those who are appointed to a stewardship to administer in temporal things;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.70
- type: DcVerse
  data:
    ref: dc.70.13
    scripture: doctrine-and-covenants
    name: D&C 70:13
    chapter: 70
    verse: 13
    ordinal: 1613
    text: Yea, even more abundantly, which abundance is multiplied unto them through the manifestations of the Spirit.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.70
- type: DcVerse
  data:
    ref: dc.70.14
    scripture: doctrine-and-covenants
    name: D&C 70:14
    chapter: 70
    verse: 14
    ordinal: 1614
    text: Nevertheless, in your temporal things you shall be equal, and this not grudgingly, otherwise the abundance of the manifestations of the Spirit shall be withheld.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.70
- type: DcVerse
  data:
    ref: dc.70.15
    scripture: doctrine-and-covenants
    name: D&C 70:15
    chapter: 70
    verse: 15
    ordinal: 1615
    text: Now, this commandment I give unto my servants for their benefit while they remain, for a manifestation of my blessings upon their heads, and for a reward of their diligence and for their security;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.70
- type: DcVerse
  data:
    ref: dc.70.16
    scripture: doctrine-and-covenants
    name: D&C 70:16
    chapter: 70
    verse: 16
    ordinal: 1616
    text: For food and for raiment; for an inheritance; for houses and for lands, in whatsoever circumstances I, the Lord, shall place them, and whithersoever I, the Lord, shall send them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.70
- type: DcVerse
  data:
    ref: dc.70.17
    scripture: doctrine-and-covenants
    name: D&C 70:17
    chapter: 70
    verse: 17
    ordinal: 1617
    text: For they have been faithful over many things, and have done well inasmuch as they have not sinned.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.70
- type: DcVerse
  data:
    ref: dc.70.18
    scripture: doctrine-and-covenants
    name: D&C 70:18
    chapter: 70
    verse: 18
    ordinal: 1618
    text: Behold, I, the Lord, am merciful and will bless them, and they shall enter into the joy of these things. Even so. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.70
- type: DcVerse
  data:
    ref: dc.71.1
    scripture: doctrine-and-covenants
    name: D&C 71:1
    chapter: 71
    verse: 1
    ordinal: 1619
    text: Behold, thus saith the Lord unto you my servants Joseph Smith, Jun., and Sidney Rigdon, that the time has verily come that it is necessary and expedient in me that you should open your mouths in proclaiming my gospel, the things of the kingdom, expounding the mysteries thereof out of the scriptures, according to that portion of Spirit and power which shall be given unto you, even as I will.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.71
- type: DcVerse
  data:
    ref: dc.71.2
    scripture: doctrine-and-covenants
    name: D&C 71:2
    chapter: 71
    verse: 2
    ordinal: 1620
    text: Verily I say unto you, proclaim unto the world in the regions round about, and in the church also, for the space of a season, even until it shall be made known unto you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.71
- type: DcVerse
  data:
    ref: dc.71.3
    scripture: doctrine-and-covenants
    name: D&C 71:3
    chapter: 71
    verse: 3
    ordinal: 1621
    text: Verily this is a mission for a season, which I give unto you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.71
- type: DcVerse
  data:
    ref: dc.71.4
    scripture: doctrine-and-covenants
    name: D&C 71:4
    chapter: 71
    verse: 4
    ordinal: 1622
    text: Wherefore, labor ye in my vineyard. Call upon the inhabitants of the earth, and bear record, and prepare the way for the commandments and revelations which are to come.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.71
- type: DcVerse
  data:
    ref: dc.71.5
    scripture: doctrine-and-covenants
    name: D&C 71:5
    chapter: 71
    verse: 5
    ordinal: 1623
    text: Now, behold this is wisdom; whoso readeth, let him understand and receive also;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.71
- type: DcVerse
  data:
    ref: dc.71.6
    scripture: doctrine-and-covenants
    name: D&C 71:6
    chapter: 71
    verse: 6
    ordinal: 1624
    text: For unto him that receiveth it shall be given more abundantly, even power.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.71
- type: DcVerse
  data:
    ref: dc.71.7
    scripture: doctrine-and-covenants
    name: D&C 71:7
    chapter: 71
    verse: 7
    ordinal: 1625
    text: Wherefore, confound your enemies; call upon them to meet you both in public and in private; and inasmuch as ye are faithful their shame shall be made manifest.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.71
- type: DcVerse
  data:
    ref: dc.71.8
    scripture: doctrine-and-covenants
    name: D&C 71:8
    chapter: 71
    verse: 8
    ordinal: 1626
    text: Wherefore, let them bring forth their strong reasons against the Lord.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Isaiah 41:21
    kjvAllusionOsis:
    - Isa.41.21
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.71
- type: DcVerse
  data:
    ref: dc.71.9
    scripture: doctrine-and-covenants
    name: D&C 71:9
    chapter: 71
    verse: 9
    ordinal: 1627
    text: Verily, thus saith the Lord unto you—there is no weapon that is formed against you shall prosper;
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Isaiah 54:17
    kjvAllusionOsis:
    - Isa.54.17
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.71
- type: DcVerse
  data:
    ref: dc.71.10
    scripture: doctrine-and-covenants
    name: D&C 71:10
    chapter: 71
    verse: 10
    ordinal: 1628
    text: And if any man lift his voice against you he shall be confounded in mine own due time.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.71
- type: DcVerse
  data:
    ref: dc.71.11
    scripture: doctrine-and-covenants
    name: D&C 71:11
    chapter: 71
    verse: 11
    ordinal: 1629
    text: Wherefore, keep my commandments; they are true and faithful. Even so. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.71
- type: DcVerse
  data:
    ref: dc.72.1
    scripture: doctrine-and-covenants
    name: D&C 72:1
    chapter: 72
    verse: 1
    ordinal: 1630
    text: Hearken, and listen to the voice of the Lord, O ye who have assembled yourselves together, who are the high priests of my church, to whom the kingdom and power have been given.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.72
- type: DcVerse
  data:
    ref: dc.72.2
    scripture: doctrine-and-covenants
    name: D&C 72:2
    chapter: 72
    verse: 2
    ordinal: 1631
    text: For verily thus saith the Lord, it is expedient in me for a bishop to be appointed unto you, or of you, unto the church in this part of the Lord's vineyard.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.72
- type: DcVerse
  data:
    ref: dc.72.3
    scripture: doctrine-and-covenants
    name: D&C 72:3
    chapter: 72
    verse: 3
    ordinal: 1632
    text: And verily in this thing ye have done wisely, for it is required of the Lord, at the hand of every steward, to render an account of his stewardship, both in time and in eternity.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.72
- type: DcVerse
  data:
    ref: dc.72.4
    scripture: doctrine-and-covenants
    name: D&C 72:4
    chapter: 72
    verse: 4
    ordinal: 1633
    text: For he who is faithful and wise in time is accounted worthy to inherit the mansions prepared for him of my Father.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.72
- type: DcVerse
  data:
    ref: dc.72.5
    scripture: doctrine-and-covenants
    name: D&C 72:5
    chapter: 72
    verse: 5
    ordinal: 1634
    text: Verily I say unto you, the elders of the church in this part of my vineyard shall render an account of their stewardship unto the bishop, who shall be appointed of me in this part of my vineyard.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.72
- type: DcVerse
  data:
    ref: dc.72.6
    scripture: doctrine-and-covenants
    name: D&C 72:6
    chapter: 72
    verse: 6
    ordinal: 1635
    text: These things shall be had on record, to be handed over unto the bishop in Zion.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.72
- type: DcVerse
  data:
    ref: dc.72.7
    scripture: doctrine-and-covenants
    name: D&C 72:7
    chapter: 72
    verse: 7
    ordinal: 1636
    text: And the duty of the bishop shall be made known by the commandments which have been given, and the voice of the conference.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.72
- type: DcVerse
  data:
    ref: dc.72.8
    scripture: doctrine-and-covenants
    name: D&C 72:8
    chapter: 72
    verse: 8
    ordinal: 1637
    text: And now, verily I say unto you, my servant Newel K. Whitney is the man who shall be appointed and ordained unto this power. This is the will of the Lord your God, your Redeemer. Even so. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.72
- type: DcVerse
  data:
    ref: dc.72.9
    scripture: doctrine-and-covenants
    name: D&C 72:9
    chapter: 72
    verse: 9
    ordinal: 1638
    text: The word of the Lord, in addition to the law which has been given, making known the duty of the bishop who has been ordained unto the church in this part of the vineyard, which is verily this—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.72
- type: DcVerse
  data:
    ref: dc.72.10
    scripture: doctrine-and-covenants
    name: D&C 72:10
    chapter: 72
    verse: 10
    ordinal: 1639
    text: To keep the Lord's storehouse; to receive the funds of the church in this part of the vineyard;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.72
- type: DcVerse
  data:
    ref: dc.72.11
    scripture: doctrine-and-covenants
    name: D&C 72:11
    chapter: 72
    verse: 11
    ordinal: 1640
    text: To take an account of the elders as before has been commanded; and to administer to their wants, who shall pay for that which they receive, inasmuch as they have wherewith to pay;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.72
- type: DcVerse
  data:
    ref: dc.72.12
    scripture: doctrine-and-covenants
    name: D&C 72:12
    chapter: 72
    verse: 12
    ordinal: 1641
    text: That this also may be consecrated to the good of the church, to the poor and needy.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.72
- type: DcVerse
  data:
    ref: dc.72.13
    scripture: doctrine-and-covenants
    name: D&C 72:13
    chapter: 72
    verse: 13
    ordinal: 1642
    text: And he who hath not wherewith to pay, an account shall be taken and handed over to the bishop of Zion, who shall pay the debt out of that which the Lord shall put into his hands.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.72
- type: DcVerse
  data:
    ref: dc.72.14
    scripture: doctrine-and-covenants
    name: D&C 72:14
    chapter: 72
    verse: 14
    ordinal: 1643
    text: And the labors of the faithful who labor in spiritual things, in administering the gospel and the things of the kingdom unto the church, and unto the world, shall answer the debt unto the bishop in Zion;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.72
- type: DcVerse
  data:
    ref: dc.72.15
    scripture: doctrine-and-covenants
    name: D&C 72:15
    chapter: 72
    verse: 15
    ordinal: 1644
    text: Thus it cometh out of the church, for according to the law every man that cometh up to Zion must lay all things before the bishop in Zion.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.72
- type: DcVerse
  data:
    ref: dc.72.16
    scripture: doctrine-and-covenants
    name: D&C 72:16
    chapter: 72
    verse: 16
    ordinal: 1645
    text: And now, verily I say unto you, that as every elder in this part of the vineyard must give an account of his stewardship unto the bishop in this part of the vineyard—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.72
- type: DcVerse
  data:
    ref: dc.72.17
    scripture: doctrine-and-covenants
    name: D&C 72:17
    chapter: 72
    verse: 17
    ordinal: 1646
    text: A certificate from the judge or bishop in this part of the vineyard, unto the bishop in Zion, rendereth every man acceptable, and answereth all things, for an inheritance, and to be received as a wise steward and as a faithful laborer;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.72
- type: DcVerse
  data:
    ref: dc.72.18
    scripture: doctrine-and-covenants
    name: D&C 72:18
    chapter: 72
    verse: 18
    ordinal: 1647
    text: Otherwise he shall not be accepted of the bishop of Zion.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.72
- type: DcVerse
  data:
    ref: dc.72.19
    scripture: doctrine-and-covenants
    name: D&C 72:19
    chapter: 72
    verse: 19
    ordinal: 1648
    text: And now, verily I say unto you, let every elder who shall give an account unto the bishop of the church in this part of the vineyard be recommended by the church or churches, in which he labors, that he may render himself and his accounts approved in all things.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.72
- type: DcVerse
  data:
    ref: dc.72.20
    scripture: doctrine-and-covenants
    name: D&C 72:20
    chapter: 72
    verse: 20
    ordinal: 1649
    text: And again, let my servants who are appointed as stewards over the literary concerns of my church have claim for assistance upon the bishop or bishops in all things—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.72
- type: DcVerse
  data:
    ref: dc.72.21
    scripture: doctrine-and-covenants
    name: D&C 72:21
    chapter: 72
    verse: 21
    ordinal: 1650
    text: That the revelations may be published, and go forth unto the ends of the earth; that they also may obtain funds which shall benefit the church in all things;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.72
- type: DcVerse
  data:
    ref: dc.72.22
    scripture: doctrine-and-covenants
    name: D&C 72:22
    chapter: 72
    verse: 22
    ordinal: 1651
    text: That they also may render themselves approved in all things, and be accounted as wise stewards.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.72
- type: DcVerse
  data:
    ref: dc.72.23
    scripture: doctrine-and-covenants
    name: D&C 72:23
    chapter: 72
    verse: 23
    ordinal: 1652
    text: And now, behold, this shall be an ensample for all the extensive branches of my church, in whatsoever land they shall be established. And now I make an end of my sayings. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.72
- type: DcVerse
  data:
    ref: dc.72.24
    scripture: doctrine-and-covenants
    name: D&C 72:24
    chapter: 72
    verse: 24
    ordinal: 1653
    text: A few words in addition to the laws of the kingdom, respecting the members of the church—they that are appointed by the Holy Spirit to go up unto Zion, and they who are privileged to go up unto Zion—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.72
- type: DcVerse
  data:
    ref: dc.72.25
    scripture: doctrine-and-covenants
    name: D&C 72:25
    chapter: 72
    verse: 25
    ordinal: 1654
    text: Let them carry up unto the bishop a certificate from three elders of the church, or a certificate from the bishop;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.72
- type: DcVerse
  data:
    ref: dc.72.26
    scripture: doctrine-and-covenants
    name: D&C 72:26
    chapter: 72
    verse: 26
    ordinal: 1655
    text: Otherwise he who shall go up unto the land of Zion shall not be accounted as a wise steward. This is also an ensample. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.72
- type: DcVerse
  data:
    ref: dc.73.1
    scripture: doctrine-and-covenants
    name: D&C 73:1
    chapter: 73
    verse: 1
    ordinal: 1656
    text: For verily, thus saith the Lord, it is expedient in me that they should continue preaching the gospel, and in exhortation to the churches in the regions round about, until conference;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.73
- type: DcVerse
  data:
    ref: dc.73.2
    scripture: doctrine-and-covenants
    name: D&C 73:2
    chapter: 73
    verse: 2
    ordinal: 1657
    text: And then, behold, it shall be made known unto them, by the voice of the conference, their several missions.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.73
- type: DcVerse
  data:
    ref: dc.73.3
    scripture: doctrine-and-covenants
    name: D&C 73:3
    chapter: 73
    verse: 3
    ordinal: 1658
    text: Now, verily I say unto you my servants, Joseph Smith, Jun., and Sidney Rigdon, saith the Lord, it is expedient to translate again;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.73
- type: DcVerse
  data:
    ref: dc.73.4
    scripture: doctrine-and-covenants
    name: D&C 73:4
    chapter: 73
    verse: 4
    ordinal: 1659
    text: And, inasmuch as it is practicable, to preach in the regions round about until conference; and after that it is expedient to continue the work of translation until it be finished.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.73
- type: DcVerse
  data:
    ref: dc.73.5
    scripture: doctrine-and-covenants
    name: D&C 73:5
    chapter: 73
    verse: 5
    ordinal: 1660
    text: And let this be a pattern unto the elders until further knowledge, even as it is written.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.73
- type: DcVerse
  data:
    ref: dc.73.6
    scripture: doctrine-and-covenants
    name: D&C 73:6
    chapter: 73
    verse: 6
    ordinal: 1661
    text: Now I give no more unto you at this time. Gird up your loins and be sober. Even so. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.73
- type: DcVerse
  data:
    ref: dc.74.1
    scripture: doctrine-and-covenants
    name: D&C 74:1
    chapter: 74
    verse: 1
    ordinal: 1662
    text: For the unbelieving husband is sanctified by the wife, and the unbelieving wife is sanctified by the husband; else were your children unclean, but now are they holy.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - 1 Corinthians 7:14
    kjvOsis:
    - 1Cor.7.14
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.74
- type: DcVerse
  data:
    ref: dc.74.2
    scripture: doctrine-and-covenants
    name: D&C 74:2
    chapter: 74
    verse: 2
    ordinal: 1663
    text: Now, in the days of the apostles the law of circumcision was had among all the Jews who believed not the gospel of Jesus Christ.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.74
- type: DcVerse
  data:
    ref: dc.74.3
    scripture: doctrine-and-covenants
    name: D&C 74:3
    chapter: 74
    verse: 3
    ordinal: 1664
    text: And it came to pass that there arose a great contention among the people concerning the law of circumcision, for the unbelieving husband was desirous that his children should be circumcised and become subject to the law of Moses, which law was fulfilled.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.74
- type: DcVerse
  data:
    ref: dc.74.4
    scripture: doctrine-and-covenants
    name: D&C 74:4
    chapter: 74
    verse: 4
    ordinal: 1665
    text: And it came to pass that the children, being brought up in subjection to the law of Moses, gave heed to the traditions of their fathers and believed not the gospel of Christ, wherein they became unholy.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.74
- type: DcVerse
  data:
    ref: dc.74.5
    scripture: doctrine-and-covenants
    name: D&C 74:5
    chapter: 74
    verse: 5
    ordinal: 1666
    text: Wherefore, for this cause the apostle wrote unto the church, giving unto them a commandment, not of the Lord, but of himself, that a believer should not be united to an unbeliever; except the law of Moses should be done away among them,
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.74
- type: DcVerse
  data:
    ref: dc.74.6
    scripture: doctrine-and-covenants
    name: D&C 74:6
    chapter: 74
    verse: 6
    ordinal: 1667
    text: That their children might remain without circumcision; and that the tradition might be done away, which saith that little children are unholy; for it was had among the Jews;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.74
- type: DcVerse
  data:
    ref: dc.74.7
    scripture: doctrine-and-covenants
    name: D&C 74:7
    chapter: 74
    verse: 7
    ordinal: 1668
    text: But little children are holy, being sanctified through the atonement of Jesus Christ; and this is what the scriptures mean.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.74
- type: DcVerse
  data:
    ref: dc.75.1
    scripture: doctrine-and-covenants
    name: D&C 75:1
    chapter: 75
    verse: 1
    ordinal: 1669
    text: Verily, verily, I say unto you, I who speak even by the voice of my Spirit, even Alpha and Omega, your Lord and your God—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.75
- type: DcVerse
  data:
    ref: dc.75.2
    scripture: doctrine-and-covenants
    name: D&C 75:2
    chapter: 75
    verse: 2
    ordinal: 1670
    text: Hearken, O ye who have given your names to go forth to proclaim my gospel, and to prune my vineyard.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.75
- type: DcVerse
  data:
    ref: dc.75.3
    scripture: doctrine-and-covenants
    name: D&C 75:3
    chapter: 75
    verse: 3
    ordinal: 1671
    text: Behold, I say unto you that it is my will that you should go forth and not tarry, neither be idle but labor with your might—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.75
- type: DcVerse
  data:
    ref: dc.75.4
    scripture: doctrine-and-covenants
    name: D&C 75:4
    chapter: 75
    verse: 4
    ordinal: 1672
    text: Lifting up your voices as with the sound of a trump, proclaiming the truth according to the revelations and commandments which I have given you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.75
- type: DcVerse
  data:
    ref: dc.75.5
    scripture: doctrine-and-covenants
    name: D&C 75:5
    chapter: 75
    verse: 5
    ordinal: 1673
    text: And thus, if ye are faithful ye shall be laden with many sheaves, and crowned with honor, and glory, and immortality, and eternal life.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.75
- type: DcVerse
  data:
    ref: dc.75.6
    scripture: doctrine-and-covenants
    name: D&C 75:6
    chapter: 75
    verse: 6
    ordinal: 1674
    text: Therefore, verily I say unto my servant William E. McLellin, I revoke the commission which I gave unto him to go unto the eastern countries;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.75
- type: DcVerse
  data:
    ref: dc.75.7
    scripture: doctrine-and-covenants
    name: D&C 75:7
    chapter: 75
    verse: 7
    ordinal: 1675
    text: And I give unto him a new commission and a new commandment, in the which I, the Lord, chasten him for the murmurings of his heart;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.75
- type: DcVerse
  data:
    ref: dc.75.8
    scripture: doctrine-and-covenants
    name: D&C 75:8
    chapter: 75
    verse: 8
    ordinal: 1676
    text: And he sinned; nevertheless, I forgive him and say unto him again, Go ye into the south countries.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.75
- type: DcVerse
  data:
    ref: dc.75.9
    scripture: doctrine-and-covenants
    name: D&C 75:9
    chapter: 75
    verse: 9
    ordinal: 1677
    text: And let my servant Luke Johnson go with him, and proclaim the things which I have commanded them—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.75
- type: DcVerse
  data:
    ref: dc.75.10
    scripture: doctrine-and-covenants
    name: D&C 75:10
    chapter: 75
    verse: 10
    ordinal: 1678
    text: Calling on the name of the Lord for the Comforter, which shall teach them all things that are expedient for them—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.75
- type: DcVerse
  data:
    ref: dc.75.11
    scripture: doctrine-and-covenants
    name: D&C 75:11
    chapter: 75
    verse: 11
    ordinal: 1679
    text: Praying always that they faint not; and inasmuch as they do this, I will be with them even unto the end.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.75
- type: DcVerse
  data:
    ref: dc.75.12
    scripture: doctrine-and-covenants
    name: D&C 75:12
    chapter: 75
    verse: 12
    ordinal: 1680
    text: Behold, this is the will of the Lord your God concerning you. Even so. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.75
- type: DcVerse
  data:
    ref: dc.75.13
    scripture: doctrine-and-covenants
    name: D&C 75:13
    chapter: 75
    verse: 13
    ordinal: 1681
    text: And again, verily thus saith the Lord, let my servant Orson Hyde and my servant Samuel H. Smith take their journey into the eastern countries, and proclaim the things which I have commanded them; and inasmuch as they are faithful, lo, I will be with them even unto the end.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.75
- type: DcVerse
  data:
    ref: dc.75.14
    scripture: doctrine-and-covenants
    name: D&C 75:14
    chapter: 75
    verse: 14
    ordinal: 1682
    text: And again, verily I say unto my servant Lyman Johnson, and unto my servant Orson Pratt, they shall also take their journey into the eastern countries; and behold, and lo, I am with them also, even unto the end.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.75
- type: DcVerse
  data:
    ref: dc.75.15
    scripture: doctrine-and-covenants
    name: D&C 75:15
    chapter: 75
    verse: 15
    ordinal: 1683
    text: And again, I say unto my servant Asa Dodds, and unto my servant Calves Wilson, that they also shall take their journey unto the western countries, and proclaim my gospel, even as I have commanded them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.75
- type: DcVerse
  data:
    ref: dc.75.16
    scripture: doctrine-and-covenants
    name: D&C 75:16
    chapter: 75
    verse: 16
    ordinal: 1684
    text: And he who is faithful shall overcome all things, and shall be lifted up at the last day.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.75
- type: DcVerse
  data:
    ref: dc.75.17
    scripture: doctrine-and-covenants
    name: D&C 75:17
    chapter: 75
    verse: 17
    ordinal: 1685
    text: And again, I say unto my servant Major N. Ashley, and my servant Burr Riggs, let them take their journey also into the south country.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.75
- type: DcVerse
  data:
    ref: dc.75.18
    scripture: doctrine-and-covenants
    name: D&C 75:18
    chapter: 75
    verse: 18
    ordinal: 1686
    text: Yea, let all those take their journey, as I have commanded them, going from house to house, and from village to village, and from city to city.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.75
- type: DcVerse
  data:
    ref: dc.75.19
    scripture: doctrine-and-covenants
    name: D&C 75:19
    chapter: 75
    verse: 19
    ordinal: 1687
    text: And in whatsoever house ye enter, and they receive you, leave your blessing upon that house.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Luke 10:10
    kjvAllusionOsis:
    - Luke.10.10
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.75
- type: DcVerse
  data:
    ref: dc.75.20
    scripture: doctrine-and-covenants
    name: D&C 75:20
    chapter: 75
    verse: 20
    ordinal: 1688
    text: And in whatsoever house ye enter, and they receive you not, ye shall depart speedily from that house, and shake off the dust of your feet as a testimony against them.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Luke 9:5
    kjvAllusionOsis:
    - Luke.9.5
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.75
- type: DcVerse
  data:
    ref: dc.75.21
    scripture: doctrine-and-covenants
    name: D&C 75:21
    chapter: 75
    verse: 21
    ordinal: 1689
    text: And you shall be filled with joy and gladness; and know this, that in the day of judgment you shall be judges of that house, and condemn them;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.75
- type: DcVerse
  data:
    ref: dc.75.22
    scripture: doctrine-and-covenants
    name: D&C 75:22
    chapter: 75
    verse: 22
    ordinal: 1690
    text: And it shall be more tolerable for the heathen in the day of judgment, than for that house; therefore, gird up your loins and be faithful, and ye shall overcome all things, and be lifted up at the last day. Even so. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.75
- type: DcVerse
  data:
    ref: dc.75.23
    scripture: doctrine-and-covenants
    name: D&C 75:23
    chapter: 75
    verse: 23
    ordinal: 1691
    text: And again, thus saith the Lord unto you, O ye elders of my church, who have given your names that you might know his will concerning you—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.75
- type: DcVerse
  data:
    ref: dc.75.24
    scripture: doctrine-and-covenants
    name: D&C 75:24
    chapter: 75
    verse: 24
    ordinal: 1692
    text: Behold, I say unto you, that it is the duty of the church to assist in supporting the families of those, and also to support the families of those who are called and must needs be sent unto the world to proclaim the gospel unto the world.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.75
- type: DcVerse
  data:
    ref: dc.75.25
    scripture: doctrine-and-covenants
    name: D&C 75:25
    chapter: 75
    verse: 25
    ordinal: 1693
    text: Wherefore, I, the Lord, give unto you this commandment, that ye obtain places for your families, inasmuch as your brethren are willing to open their hearts.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.75
- type: DcVerse
  data:
    ref: dc.75.26
    scripture: doctrine-and-covenants
    name: D&C 75:26
    chapter: 75
    verse: 26
    ordinal: 1694
    text: And let all such as can obtain places for their families, and support of the church for them, not fail to go into the world, whether to the east or to the west, or to the north, or to the south.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.75
- type: DcVerse
  data:
    ref: dc.75.27
    scripture: doctrine-and-covenants
    name: D&C 75:27
    chapter: 75
    verse: 27
    ordinal: 1695
    text: Let them ask and they shall receive, knock and it shall be opened unto them, and be made known from on high, even by the Comforter, whither they shall go.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.75
- type: DcVerse
  data:
    ref: dc.75.28
    scripture: doctrine-and-covenants
    name: D&C 75:28
    chapter: 75
    verse: 28
    ordinal: 1696
    text: And again, verily I say unto you, that every man who is obliged to provide for his own family, let him provide, and he shall in nowise lose his crown; and let him labor in the church.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.75
- type: DcVerse
  data:
    ref: dc.75.29
    scripture: doctrine-and-covenants
    name: D&C 75:29
    chapter: 75
    verse: 29
    ordinal: 1697
    text: Let every man be diligent in all things. And the idler shall not have place in the church, except he repent and mend his ways.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.75
- type: DcVerse
  data:
    ref: dc.75.30
    scripture: doctrine-and-covenants
    name: D&C 75:30
    chapter: 75
    verse: 30
    ordinal: 1698
    text: Wherefore, let my servant Simeon Carter and my servant Emer Harris be united in the ministry;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.75
- type: DcVerse
  data:
    ref: dc.75.31
    scripture: doctrine-and-covenants
    name: D&C 75:31
    chapter: 75
    verse: 31
    ordinal: 1699
    text: And also my servant Ezra Thayre and my servant Thomas B. Marsh;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.75
- type: DcVerse
  data:
    ref: dc.75.32
    scripture: doctrine-and-covenants
    name: D&C 75:32
    chapter: 75
    verse: 32
    ordinal: 1700
    text: Also my servant Hyrum Smith and my servant Reynolds Cahoon;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.75
- type: DcVerse
  data:
    ref: dc.75.33
    scripture: doctrine-and-covenants
    name: D&C 75:33
    chapter: 75
    verse: 33
    ordinal: 1701
    text: And also my servant Daniel Stanton and my servant Seymour Brunson;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.75
- type: DcVerse
  data:
    ref: dc.75.34
    scripture: doctrine-and-covenants
    name: D&C 75:34
    chapter: 75
    verse: 34
    ordinal: 1702
    text: And also my servant Sylvester Smith and my servant Gideon Carter;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.75
- type: DcVerse
  data:
    ref: dc.75.35
    scripture: doctrine-and-covenants
    name: D&C 75:35
    chapter: 75
    verse: 35
    ordinal: 1703
    text: And also my servant Ruggles Eames and my servant Stephen Burnett;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.75
- type: DcVerse
  data:
    ref: dc.75.36
    scripture: doctrine-and-covenants
    name: D&C 75:36
    chapter: 75
    verse: 36
    ordinal: 1704
    text: And also my servant Micah B. Welton and also my servant Eden Smith. Even so. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.75
- type: DcVerse
  data:
    ref: dc.76.1
    scripture: doctrine-and-covenants
    name: D&C 76:1
    chapter: 76
    verse: 1
    ordinal: 1705
    text: Hear, O ye heavens, and give ear, O earth, and rejoice ye inhabitants thereof, for the Lord is God, and beside him there is no Savior.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Deuteronomy 32:1
    kjvAllusionOsis:
    - Deut.32.1
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.2
    scripture: doctrine-and-covenants
    name: D&C 76:2
    chapter: 76
    verse: 2
    ordinal: 1706
    text: Great is his wisdom, marvelous are his ways, and the extent of his doings none can find out.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.3
    scripture: doctrine-and-covenants
    name: D&C 76:3
    chapter: 76
    verse: 3
    ordinal: 1707
    text: His purposes fail not, neither are there any who can stay his hand.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.4
    scripture: doctrine-and-covenants
    name: D&C 76:4
    chapter: 76
    verse: 4
    ordinal: 1708
    text: From eternity to eternity he is the same, and his years never fail.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.5
    scripture: doctrine-and-covenants
    name: D&C 76:5
    chapter: 76
    verse: 5
    ordinal: 1709
    text: For thus saith the Lord—I, the Lord, am merciful and gracious unto those who fear me, and delight to honor those who serve me in righteousness and in truth unto the end.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.6
    scripture: doctrine-and-covenants
    name: D&C 76:6
    chapter: 76
    verse: 6
    ordinal: 1710
    text: Great shall be their reward and eternal shall be their glory.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.7
    scripture: doctrine-and-covenants
    name: D&C 76:7
    chapter: 76
    verse: 7
    ordinal: 1711
    text: And to them will I reveal all mysteries, yea, all the hidden mysteries of my kingdom from days of old, and for ages to come, will I make known unto them the good pleasure of my will concerning all things pertaining to my kingdom.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.8
    scripture: doctrine-and-covenants
    name: D&C 76:8
    chapter: 76
    verse: 8
    ordinal: 1712
    text: Yea, even the wonders of eternity shall they know, and things to come will I show them, even the things of many generations.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.9
    scripture: doctrine-and-covenants
    name: D&C 76:9
    chapter: 76
    verse: 9
    ordinal: 1713
    text: And their wisdom shall be great, and their understanding reach to heaven; and before them the wisdom of the wise shall perish, and the understanding of the prudent shall come to naught.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.10
    scripture: doctrine-and-covenants
    name: D&C 76:10
    chapter: 76
    verse: 10
    ordinal: 1714
    text: For by my Spirit will I enlighten them, and by my power will I make known unto them the secrets of my will—yea, even those things which eye has not seen, nor ear heard, nor yet entered into the heart of man.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - 1 Corinthians 2:9
    kjvAllusionOsis:
    - 1Cor.2.9
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.11
    scripture: doctrine-and-covenants
    name: D&C 76:11
    chapter: 76
    verse: 11
    ordinal: 1715
    text: We, Joseph Smith, Jun., and Sidney Rigdon, being in the Spirit on the sixteenth day of February, in the year of our Lord one thousand eight hundred and thirty-two—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.12
    scripture: doctrine-and-covenants
    name: D&C 76:12
    chapter: 76
    verse: 12
    ordinal: 1716
    text: By the power of the Spirit our eyes were opened and our understandings were enlightened, so as to see and understand the things of God—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.13
    scripture: doctrine-and-covenants
    name: D&C 76:13
    chapter: 76
    verse: 13
    ordinal: 1717
    text: Even those things which were from the beginning before the world was, which were ordained of the Father, through his Only Begotten Son, who was in the bosom of the Father, even from the beginning;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.14
    scripture: doctrine-and-covenants
    name: D&C 76:14
    chapter: 76
    verse: 14
    ordinal: 1718
    text: Of whom we bear record; and the record which we bear is the fulness of the gospel of Jesus Christ, who is the Son, whom we saw and with whom we conversed in the heavenly vision.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.15
    scripture: doctrine-and-covenants
    name: D&C 76:15
    chapter: 76
    verse: 15
    ordinal: 1719
    text: For while we were doing the work of translation, which the Lord had appointed unto us, we came to the twenty-ninth verse of the fifth chapter of John, which was given unto us as follows—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.16
    scripture: doctrine-and-covenants
    name: D&C 76:16
    chapter: 76
    verse: 16
    ordinal: 1720
    text: 'Speaking of the resurrection of the dead, concerning those who shall hear the voice of the Son of Man:'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.17
    scripture: doctrine-and-covenants
    name: D&C 76:17
    chapter: 76
    verse: 17
    ordinal: 1721
    text: And shall come forth; they who have done good, in the resurrection of the just; and they who have done evil, in the resurrection of the unjust.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.18
    scripture: doctrine-and-covenants
    name: D&C 76:18
    chapter: 76
    verse: 18
    ordinal: 1722
    text: Now this caused us to marvel, for it was given unto us of the Spirit.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.19
    scripture: doctrine-and-covenants
    name: D&C 76:19
    chapter: 76
    verse: 19
    ordinal: 1723
    text: And while we meditated upon these things, the Lord touched the eyes of our understandings and they were opened, and the glory of the Lord shone round about.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Luke 2:9
    kjvAllusionOsis:
    - Luke.2.9
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.20
    scripture: doctrine-and-covenants
    name: D&C 76:20
    chapter: 76
    verse: 20
    ordinal: 1724
    text: And we beheld the glory of the Son, on the right hand of the Father, and received of his fulness;
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - John 1:16
    kjvAllusionOsis:
    - John.1.16
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.21
    scripture: doctrine-and-covenants
    name: D&C 76:21
    chapter: 76
    verse: 21
    ordinal: 1725
    text: And saw the holy angels, and them who are sanctified before his throne, worshiping God, and the Lamb, who worship him forever and ever.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.22
    scripture: doctrine-and-covenants
    name: D&C 76:22
    chapter: 76
    verse: 22
    ordinal: 1726
    text: 'And now, after the many testimonies which have been given of him, this is the testimony, last of all, which we give of him: That he lives!'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.23
    scripture: doctrine-and-covenants
    name: D&C 76:23
    chapter: 76
    verse: 23
    ordinal: 1727
    text: For we saw him, even on the right hand of God; and we heard the voice bearing record that he is the Only Begotten of the Father—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.24
    scripture: doctrine-and-covenants
    name: D&C 76:24
    chapter: 76
    verse: 24
    ordinal: 1728
    text: That by him, and through him, and of him, the worlds are and were created, and the inhabitants thereof are begotten sons and daughters unto God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.25
    scripture: doctrine-and-covenants
    name: D&C 76:25
    chapter: 76
    verse: 25
    ordinal: 1729
    text: And this we saw also, and bear record, that an angel of God who was in authority in the presence of God, who rebelled against the Only Begotten Son whom the Father loved and who was in the bosom of the Father, was thrust down from the presence of God and the Son,
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.26
    scripture: doctrine-and-covenants
    name: D&C 76:26
    chapter: 76
    verse: 26
    ordinal: 1730
    text: And was called Perdition, for the heavens wept over him—he was Lucifer, a son of the morning.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.27
    scripture: doctrine-and-covenants
    name: D&C 76:27
    chapter: 76
    verse: 27
    ordinal: 1731
    text: And we beheld, and lo, he is fallen! is fallen, even a son of the morning!
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.28
    scripture: doctrine-and-covenants
    name: D&C 76:28
    chapter: 76
    verse: 28
    ordinal: 1732
    text: And while we were yet in the Spirit, the Lord commanded us that we should write the vision; for we beheld Satan, that old serpent, even the devil, who rebelled against God, and sought to take the kingdom of our God and his Christ—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.29
    scripture: doctrine-and-covenants
    name: D&C 76:29
    chapter: 76
    verse: 29
    ordinal: 1733
    text: Wherefore, he maketh war with the saints of God, and encompasseth them round about.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.30
    scripture: doctrine-and-covenants
    name: D&C 76:30
    chapter: 76
    verse: 30
    ordinal: 1734
    text: 'And we saw a vision of the sufferings of those with whom he made war and overcame, for thus came the voice of the Lord unto us:'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.31
    scripture: doctrine-and-covenants
    name: D&C 76:31
    chapter: 76
    verse: 31
    ordinal: 1735
    text: Thus saith the Lord concerning all those who know my power, and have been made partakers thereof, and suffered themselves through the power of the devil to be overcome, and to deny the truth and defy my power—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.32
    scripture: doctrine-and-covenants
    name: D&C 76:32
    chapter: 76
    verse: 32
    ordinal: 1736
    text: They are they who are the sons of perdition, of whom I say that it had been better for them never to have been born;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.33
    scripture: doctrine-and-covenants
    name: D&C 76:33
    chapter: 76
    verse: 33
    ordinal: 1737
    text: For they are vessels of wrath, doomed to suffer the wrath of God, with the devil and his angels in eternity;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.34
    scripture: doctrine-and-covenants
    name: D&C 76:34
    chapter: 76
    verse: 34
    ordinal: 1738
    text: Concerning whom I have said there is no forgiveness in this world nor in the world to come—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.35
    scripture: doctrine-and-covenants
    name: D&C 76:35
    chapter: 76
    verse: 35
    ordinal: 1739
    text: Having denied the Holy Spirit after having received it, and having denied the Only Begotten Son of the Father, having crucified him unto themselves and put him to an open shame.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.36
    scripture: doctrine-and-covenants
    name: D&C 76:36
    chapter: 76
    verse: 36
    ordinal: 1740
    text: These are they who shall go away into the lake of fire and brimstone, with the devil and his angels—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.37
    scripture: doctrine-and-covenants
    name: D&C 76:37
    chapter: 76
    verse: 37
    ordinal: 1741
    text: And the only ones on whom the second death shall have any power;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.38
    scripture: doctrine-and-covenants
    name: D&C 76:38
    chapter: 76
    verse: 38
    ordinal: 1742
    text: Yea, verily, the only ones who shall not be redeemed in the due time of the Lord, after the sufferings of his wrath.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.39
    scripture: doctrine-and-covenants
    name: D&C 76:39
    chapter: 76
    verse: 39
    ordinal: 1743
    text: For all the rest shall be brought forth by the resurrection of the dead, through the triumph and the glory of the Lamb, who was slain, who was in the bosom of the Father before the worlds were made.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.40
    scripture: doctrine-and-covenants
    name: D&C 76:40
    chapter: 76
    verse: 40
    ordinal: 1744
    text: And this is the gospel, the glad tidings, which the voice out of the heavens bore record unto us—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.41
    scripture: doctrine-and-covenants
    name: D&C 76:41
    chapter: 76
    verse: 41
    ordinal: 1745
    text: That he came into the world, even Jesus, to be crucified for the world, and to bear the sins of the world, and to sanctify the world, and to cleanse it from all unrighteousness;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.42
    scripture: doctrine-and-covenants
    name: D&C 76:42
    chapter: 76
    verse: 42
    ordinal: 1746
    text: That through him all might be saved whom the Father had put into his power and made by him;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.43
    scripture: doctrine-and-covenants
    name: D&C 76:43
    chapter: 76
    verse: 43
    ordinal: 1747
    text: Who glorifies the Father, and saves all the works of his hands, except those sons of perdition who deny the Son after the Father has revealed him.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.44
    scripture: doctrine-and-covenants
    name: D&C 76:44
    chapter: 76
    verse: 44
    ordinal: 1748
    text: Wherefore, he saves all except them—they shall go away into everlasting punishment, which is endless punishment, which is eternal punishment, to reign with the devil and his angels in eternity, where their worm dieth not, and the fire is not quenched, which is their torment—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.45
    scripture: doctrine-and-covenants
    name: D&C 76:45
    chapter: 76
    verse: 45
    ordinal: 1749
    text: And the end thereof, neither the place thereof, nor their torment, no man knows;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.46
    scripture: doctrine-and-covenants
    name: D&C 76:46
    chapter: 76
    verse: 46
    ordinal: 1750
    text: Neither was it revealed, neither is, neither will be revealed unto man, except to them who are made partakers thereof;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.47
    scripture: doctrine-and-covenants
    name: D&C 76:47
    chapter: 76
    verse: 47
    ordinal: 1751
    text: Nevertheless, I, the Lord, show it by vision unto many, but straightway shut it up again;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.48
    scripture: doctrine-and-covenants
    name: D&C 76:48
    chapter: 76
    verse: 48
    ordinal: 1752
    text: Wherefore, the end, the width, the height, the depth, and the misery thereof, they understand not, neither any man except those who are ordained unto this condemnation.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.49
    scripture: doctrine-and-covenants
    name: D&C 76:49
    chapter: 76
    verse: 49
    ordinal: 1753
    text: 'And we heard the voice, saying: Write the vision, for lo, this is the end of the vision of the sufferings of the ungodly.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.50
    scripture: doctrine-and-covenants
    name: D&C 76:50
    chapter: 76
    verse: 50
    ordinal: 1754
    text: And again we bear record—for we saw and heard, and this is the testimony of the gospel of Christ concerning them who shall come forth in the resurrection of the just—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.51
    scripture: doctrine-and-covenants
    name: D&C 76:51
    chapter: 76
    verse: 51
    ordinal: 1755
    text: They are they who received the testimony of Jesus, and believed on his name and were baptized after the manner of his burial, being buried in the water in his name, and this according to the commandment which he has given—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.52
    scripture: doctrine-and-covenants
    name: D&C 76:52
    chapter: 76
    verse: 52
    ordinal: 1756
    text: That by keeping the commandments they might be washed and cleansed from all their sins, and receive the Holy Spirit by the laying on of the hands of him who is ordained and sealed unto this power;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.53
    scripture: doctrine-and-covenants
    name: D&C 76:53
    chapter: 76
    verse: 53
    ordinal: 1757
    text: And who overcome by faith, and are sealed by the Holy Spirit of promise, which the Father sheds forth upon all those who are just and true.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.54
    scripture: doctrine-and-covenants
    name: D&C 76:54
    chapter: 76
    verse: 54
    ordinal: 1758
    text: They are they who are the church of the Firstborn.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.55
    scripture: doctrine-and-covenants
    name: D&C 76:55
    chapter: 76
    verse: 55
    ordinal: 1759
    text: They are they into whose hands the Father has given all things—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.56
    scripture: doctrine-and-covenants
    name: D&C 76:56
    chapter: 76
    verse: 56
    ordinal: 1760
    text: They are they who are priests and kings, who have received of his fulness, and of his glory;
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - John 1:16
    kjvAllusionOsis:
    - John.1.16
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.57
    scripture: doctrine-and-covenants
    name: D&C 76:57
    chapter: 76
    verse: 57
    ordinal: 1761
    text: And are priests of the Most High, after the order of Melchizedek, which was after the order of Enoch, which was after the order of the Only Begotten Son.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.58
    scripture: doctrine-and-covenants
    name: D&C 76:58
    chapter: 76
    verse: 58
    ordinal: 1762
    text: Wherefore, as it is written, they are gods, even the sons of God—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.59
    scripture: doctrine-and-covenants
    name: D&C 76:59
    chapter: 76
    verse: 59
    ordinal: 1763
    text: Wherefore, all things are theirs, whether life or death, or things present, or things to come, all are theirs and they are Christ's, and Christ is God's.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - 1 Corinthians 3:22
    kjvAllusionOsis:
    - 1Cor.3.22
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.60
    scripture: doctrine-and-covenants
    name: D&C 76:60
    chapter: 76
    verse: 60
    ordinal: 1764
    text: And they shall overcome all things.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.61
    scripture: doctrine-and-covenants
    name: D&C 76:61
    chapter: 76
    verse: 61
    ordinal: 1765
    text: Wherefore, let no man glory in man, but rather let him glory in God, who shall subdue all enemies under his feet.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.62
    scripture: doctrine-and-covenants
    name: D&C 76:62
    chapter: 76
    verse: 62
    ordinal: 1766
    text: These shall dwell in the presence of God and his Christ forever and ever.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.63
    scripture: doctrine-and-covenants
    name: D&C 76:63
    chapter: 76
    verse: 63
    ordinal: 1767
    text: These are they whom he shall bring with him, when he shall come in the clouds of heaven to reign on the earth over his people.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.64
    scripture: doctrine-and-covenants
    name: D&C 76:64
    chapter: 76
    verse: 64
    ordinal: 1768
    text: These are they who shall have part in the first resurrection.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.65
    scripture: doctrine-and-covenants
    name: D&C 76:65
    chapter: 76
    verse: 65
    ordinal: 1769
    text: These are they who shall come forth in the resurrection of the just.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.66
    scripture: doctrine-and-covenants
    name: D&C 76:66
    chapter: 76
    verse: 66
    ordinal: 1770
    text: These are they who are come unto Mount Zion, and unto the city of the living God, the heavenly place, the holiest of all.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Hebrews 12:22
    kjvAllusionOsis:
    - Heb.12.22
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.67
    scripture: doctrine-and-covenants
    name: D&C 76:67
    chapter: 76
    verse: 67
    ordinal: 1771
    text: These are they who have come to an innumerable company of angels, to the general assembly and church of Enoch, and of the Firstborn.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.68
    scripture: doctrine-and-covenants
    name: D&C 76:68
    chapter: 76
    verse: 68
    ordinal: 1772
    text: These are they whose names are written in heaven, where God and Christ are the judge of all.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.69
    scripture: doctrine-and-covenants
    name: D&C 76:69
    chapter: 76
    verse: 69
    ordinal: 1773
    text: These are they who are just men made perfect through Jesus the mediator of the new covenant, who wrought out this perfect atonement through the shedding of his own blood.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.70
    scripture: doctrine-and-covenants
    name: D&C 76:70
    chapter: 76
    verse: 70
    ordinal: 1774
    text: These are they whose bodies are celestial, whose glory is that of the sun, even the glory of God, the highest of all, whose glory the sun of the firmament is written of as being typical.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.71
    scripture: doctrine-and-covenants
    name: D&C 76:71
    chapter: 76
    verse: 71
    ordinal: 1775
    text: And again, we saw the terrestrial world, and behold and lo, these are they who are of the terrestrial, whose glory differs from that of the church of the Firstborn who have received the fulness of the Father, even as that of the moon differs from the sun in the firmament.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.72
    scripture: doctrine-and-covenants
    name: D&C 76:72
    chapter: 76
    verse: 72
    ordinal: 1776
    text: Behold, these are they who died without law;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.73
    scripture: doctrine-and-covenants
    name: D&C 76:73
    chapter: 76
    verse: 73
    ordinal: 1777
    text: And also they who are the spirits of men kept in prison, whom the Son visited, and preached the gospel unto them, that they might be judged according to men in the flesh;
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - 1 Peter 4:6
    kjvAllusionOsis:
    - 1Pet.4.6
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.74
    scripture: doctrine-and-covenants
    name: D&C 76:74
    chapter: 76
    verse: 74
    ordinal: 1778
    text: Who received not the testimony of Jesus in the flesh, but afterwards received it.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.75
    scripture: doctrine-and-covenants
    name: D&C 76:75
    chapter: 76
    verse: 75
    ordinal: 1779
    text: These are they who are honorable men of the earth, who were blinded by the craftiness of men.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.76
    scripture: doctrine-and-covenants
    name: D&C 76:76
    chapter: 76
    verse: 76
    ordinal: 1780
    text: These are they who receive of his glory, but not of his fulness.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.77
    scripture: doctrine-and-covenants
    name: D&C 76:77
    chapter: 76
    verse: 77
    ordinal: 1781
    text: These are they who receive of the presence of the Son, but not of the fulness of the Father.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.78
    scripture: doctrine-and-covenants
    name: D&C 76:78
    chapter: 76
    verse: 78
    ordinal: 1782
    text: Wherefore, they are bodies terrestrial, and not bodies celestial, and differ in glory as the moon differs from the sun.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - 1 Corinthians 15:40
    kjvAllusionOsis:
    - 1Cor.15.40
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.79
    scripture: doctrine-and-covenants
    name: D&C 76:79
    chapter: 76
    verse: 79
    ordinal: 1783
    text: These are they who are not valiant in the testimony of Jesus; wherefore, they obtain not the crown over the kingdom of our God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.80
    scripture: doctrine-and-covenants
    name: D&C 76:80
    chapter: 76
    verse: 80
    ordinal: 1784
    text: And now this is the end of the vision which we saw of the terrestrial, that the Lord commanded us to write while we were yet in the Spirit.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.81
    scripture: doctrine-and-covenants
    name: D&C 76:81
    chapter: 76
    verse: 81
    ordinal: 1785
    text: And again, we saw the glory of the telestial, which glory is that of the lesser, even as the glory of the stars differs from that of the glory of the moon in the firmament.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.82
    scripture: doctrine-and-covenants
    name: D&C 76:82
    chapter: 76
    verse: 82
    ordinal: 1786
    text: These are they who received not the gospel of Christ, neither the testimony of Jesus.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.83
    scripture: doctrine-and-covenants
    name: D&C 76:83
    chapter: 76
    verse: 83
    ordinal: 1787
    text: These are they who deny not the Holy Spirit.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.84
    scripture: doctrine-and-covenants
    name: D&C 76:84
    chapter: 76
    verse: 84
    ordinal: 1788
    text: These are they who are thrust down to hell.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.85
    scripture: doctrine-and-covenants
    name: D&C 76:85
    chapter: 76
    verse: 85
    ordinal: 1789
    text: These are they who shall not be redeemed from the devil until the last resurrection, until the Lord, even Christ the Lamb, shall have finished his work.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.86
    scripture: doctrine-and-covenants
    name: D&C 76:86
    chapter: 76
    verse: 86
    ordinal: 1790
    text: These are they who receive not of his fulness in the eternal world, but of the Holy Spirit through the ministration of the terrestrial;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.76
- type: DcVerse
  data:
    ref: dc.76.87
    scripture: doctrine-and-covenants
    name: D&C 76:87
    chapter: 76
    verse: 87
    ordinal: 1791
    text: And the terrestrial through the ministration of the celestial.
    translation: 2013 edition
    original: ''
