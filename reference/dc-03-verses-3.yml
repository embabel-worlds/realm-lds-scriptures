    chapter: 87
    verse: 1
    ordinal: 2050
    text: Verily, thus saith the Lord concerning the wars that will shortly come to pass, beginning at the rebellion of South Carolina, which will eventually terminate in the death and misery of many souls;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.87
- type: DcVerse
  data:
    ref: dc.87.2
    scripture: doctrine-and-covenants
    name: D&C 87:2
    chapter: 87
    verse: 2
    ordinal: 2051
    text: And the time will come that war will be poured out upon all nations, beginning at this place.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.87
- type: DcVerse
  data:
    ref: dc.87.3
    scripture: doctrine-and-covenants
    name: D&C 87:3
    chapter: 87
    verse: 3
    ordinal: 2052
    text: For behold, the Southern States shall be divided against the Northern States, and the Southern States will call on other nations, even the nation of Great Britain, as it is called, and they shall also call upon other nations, in order to defend themselves against other nations; and then war shall be poured out upon all nations.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.87
- type: DcVerse
  data:
    ref: dc.87.4
    scripture: doctrine-and-covenants
    name: D&C 87:4
    chapter: 87
    verse: 4
    ordinal: 2053
    text: And it shall come to pass, after many days, slaves shall rise up against their masters, who shall be marshaled and disciplined for war.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.87
- type: DcVerse
  data:
    ref: dc.87.5
    scripture: doctrine-and-covenants
    name: D&C 87:5
    chapter: 87
    verse: 5
    ordinal: 2054
    text: And it shall come to pass also that the remnants who are left of the land will marshal themselves, and shall become exceedingly angry, and shall vex the Gentiles with a sore vexation.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.87
- type: DcVerse
  data:
    ref: dc.87.6
    scripture: doctrine-and-covenants
    name: D&C 87:6
    chapter: 87
    verse: 6
    ordinal: 2055
    text: And thus, with the sword and by bloodshed the inhabitants of the earth shall mourn; and with famine, and plague, and earthquake, and the thunder of heaven, and the fierce and vivid lightning also, shall the inhabitants of the earth be made to feel the wrath, and indignation, and chastening hand of an Almighty God, until the consumption decreed hath made a full end of all nations;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.87
- type: DcVerse
  data:
    ref: dc.87.7
    scripture: doctrine-and-covenants
    name: D&C 87:7
    chapter: 87
    verse: 7
    ordinal: 2056
    text: That the cry of the saints, and of the blood of the saints, shall cease to come up into the ears of the Lord of Sabaoth, from the earth, to be avenged of their enemies.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.87
- type: DcVerse
  data:
    ref: dc.87.8
    scripture: doctrine-and-covenants
    name: D&C 87:8
    chapter: 87
    verse: 8
    ordinal: 2057
    text: Wherefore, stand ye in holy places, and be not moved, until the day of the Lord come; for behold, it cometh quickly, saith the Lord. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.87
- type: DcVerse
  data:
    ref: dc.88.1
    scripture: doctrine-and-covenants
    name: D&C 88:1
    chapter: 88
    verse: 1
    ordinal: 2058
    text: 'Verily, thus saith the Lord unto you who have assembled yourselves together to receive his will concerning you:'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.2
    scripture: doctrine-and-covenants
    name: D&C 88:2
    chapter: 88
    verse: 2
    ordinal: 2059
    text: Behold, this is pleasing unto your Lord, and the angels rejoice over you; the alms of your prayers have come up into the ears of the Lord of Sabaoth, and are recorded in the book of the names of the sanctified, even them of the celestial world.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.3
    scripture: doctrine-and-covenants
    name: D&C 88:3
    chapter: 88
    verse: 3
    ordinal: 2060
    text: Wherefore, I now send upon you another Comforter, even upon you my friends, that it may abide in your hearts, even the Holy Spirit of promise; which other Comforter is the same that I promised unto my disciples, as is recorded in the testimony of John.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.4
    scripture: doctrine-and-covenants
    name: D&C 88:4
    chapter: 88
    verse: 4
    ordinal: 2061
    text: This Comforter is the promise which I give unto you of eternal life, even the glory of the celestial kingdom;
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - 1 John 2:25
    kjvAllusionOsis:
    - 1John.2.25
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.5
    scripture: doctrine-and-covenants
    name: D&C 88:5
    chapter: 88
    verse: 5
    ordinal: 2062
    text: Which glory is that of the church of the Firstborn, even of God, the holiest of all, through Jesus Christ his Son—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.6
    scripture: doctrine-and-covenants
    name: D&C 88:6
    chapter: 88
    verse: 6
    ordinal: 2063
    text: He that ascended up on high, as also he descended below all things, in that he comprehended all things, that he might be in all and through all things, the light of truth;
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Ephesians 4:10
    kjvAllusionOsis:
    - Eph.4.10
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.7
    scripture: doctrine-and-covenants
    name: D&C 88:7
    chapter: 88
    verse: 7
    ordinal: 2064
    text: Which truth shineth. This is the light of Christ. As also he is in the sun, and the light of the sun, and the power thereof by which it was made.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.8
    scripture: doctrine-and-covenants
    name: D&C 88:8
    chapter: 88
    verse: 8
    ordinal: 2065
    text: As also he is in the moon, and is the light of the moon, and the power thereof by which it was made;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.9
    scripture: doctrine-and-covenants
    name: D&C 88:9
    chapter: 88
    verse: 9
    ordinal: 2066
    text: As also the light of the stars, and the power thereof by which they were made;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.10
    scripture: doctrine-and-covenants
    name: D&C 88:10
    chapter: 88
    verse: 10
    ordinal: 2067
    text: And the earth also, and the power thereof, even the earth upon which you stand.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.11
    scripture: doctrine-and-covenants
    name: D&C 88:11
    chapter: 88
    verse: 11
    ordinal: 2068
    text: And the light which shineth, which giveth you light, is through him who enlighteneth your eyes, which is the same light that quickeneth your understandings;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.12
    scripture: doctrine-and-covenants
    name: D&C 88:12
    chapter: 88
    verse: 12
    ordinal: 2069
    text: Which light proceedeth forth from the presence of God to fill the immensity of space—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.13
    scripture: doctrine-and-covenants
    name: D&C 88:13
    chapter: 88
    verse: 13
    ordinal: 2070
    text: The light which is in all things, which giveth life to all things, which is the law by which all things are governed, even the power of God who sitteth upon his throne, who is in the bosom of eternity, who is in the midst of all things.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.14
    scripture: doctrine-and-covenants
    name: D&C 88:14
    chapter: 88
    verse: 14
    ordinal: 2071
    text: Now, verily I say unto you, that through the redemption which is made for you is brought to pass the resurrection from the dead.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.15
    scripture: doctrine-and-covenants
    name: D&C 88:15
    chapter: 88
    verse: 15
    ordinal: 2072
    text: And the spirit and the body are the soul of man.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.16
    scripture: doctrine-and-covenants
    name: D&C 88:16
    chapter: 88
    verse: 16
    ordinal: 2073
    text: And the resurrection from the dead is the redemption of the soul.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.17
    scripture: doctrine-and-covenants
    name: D&C 88:17
    chapter: 88
    verse: 17
    ordinal: 2074
    text: And the redemption of the soul is through him that quickeneth all things, in whose bosom it is decreed that the poor and the meek of the earth shall inherit it.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.18
    scripture: doctrine-and-covenants
    name: D&C 88:18
    chapter: 88
    verse: 18
    ordinal: 2075
    text: Therefore, it must needs be sanctified from all unrighteousness, that it may be prepared for the celestial glory;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.19
    scripture: doctrine-and-covenants
    name: D&C 88:19
    chapter: 88
    verse: 19
    ordinal: 2076
    text: For after it hath filled the measure of its creation, it shall be crowned with glory, even with the presence of God the Father;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.20
    scripture: doctrine-and-covenants
    name: D&C 88:20
    chapter: 88
    verse: 20
    ordinal: 2077
    text: That bodies who are of the celestial kingdom may possess it forever and ever; for, for this intent was it made and created, and for this intent are they sanctified.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.21
    scripture: doctrine-and-covenants
    name: D&C 88:21
    chapter: 88
    verse: 21
    ordinal: 2078
    text: And they who are not sanctified through the law which I have given unto you, even the law of Christ, must inherit another kingdom, even that of a terrestrial kingdom, or that of a telestial kingdom.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.22
    scripture: doctrine-and-covenants
    name: D&C 88:22
    chapter: 88
    verse: 22
    ordinal: 2079
    text: For he who is not able to abide the law of a celestial kingdom cannot abide a celestial glory.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.23
    scripture: doctrine-and-covenants
    name: D&C 88:23
    chapter: 88
    verse: 23
    ordinal: 2080
    text: And he who cannot abide the law of a terrestrial kingdom cannot abide a terrestrial glory.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.24
    scripture: doctrine-and-covenants
    name: D&C 88:24
    chapter: 88
    verse: 24
    ordinal: 2081
    text: And he who cannot abide the law of a telestial kingdom cannot abide a telestial glory; therefore he is not meet for a kingdom of glory. Therefore he must abide a kingdom which is not a kingdom of glory.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.25
    scripture: doctrine-and-covenants
    name: D&C 88:25
    chapter: 88
    verse: 25
    ordinal: 2082
    text: And again, verily I say unto you, the earth abideth the law of a celestial kingdom, for it filleth the measure of its creation, and transgresseth not the law—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.26
    scripture: doctrine-and-covenants
    name: D&C 88:26
    chapter: 88
    verse: 26
    ordinal: 2083
    text: Wherefore, it shall be sanctified; yea, notwithstanding it shall die, it shall be quickened again, and shall abide the power by which it is quickened, and the righteous shall inherit it.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.27
    scripture: doctrine-and-covenants
    name: D&C 88:27
    chapter: 88
    verse: 27
    ordinal: 2084
    text: For notwithstanding they die, they also shall rise again, a spiritual body.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.28
    scripture: doctrine-and-covenants
    name: D&C 88:28
    chapter: 88
    verse: 28
    ordinal: 2085
    text: They who are of a celestial spirit shall receive the same body which was a natural body; even ye shall receive your bodies, and your glory shall be that glory by which your bodies are quickened.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.29
    scripture: doctrine-and-covenants
    name: D&C 88:29
    chapter: 88
    verse: 29
    ordinal: 2086
    text: Ye who are quickened by a portion of the celestial glory shall then receive of the same, even a fulness.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.30
    scripture: doctrine-and-covenants
    name: D&C 88:30
    chapter: 88
    verse: 30
    ordinal: 2087
    text: And they who are quickened by a portion of the terrestrial glory shall then receive of the same, even a fulness.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.31
    scripture: doctrine-and-covenants
    name: D&C 88:31
    chapter: 88
    verse: 31
    ordinal: 2088
    text: And also they who are quickened by a portion of the telestial glory shall then receive of the same, even a fulness.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.32
    scripture: doctrine-and-covenants
    name: D&C 88:32
    chapter: 88
    verse: 32
    ordinal: 2089
    text: And they who remain shall also be quickened; nevertheless, they shall return again to their own place, to enjoy that which they are willing to receive, because they were not willing to enjoy that which they might have received.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.33
    scripture: doctrine-and-covenants
    name: D&C 88:33
    chapter: 88
    verse: 33
    ordinal: 2090
    text: For what doth it profit a man if a gift is bestowed upon him, and he receive not the gift? Behold, he rejoices not in that which is given unto him, neither rejoices in him who is the giver of the gift.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.34
    scripture: doctrine-and-covenants
    name: D&C 88:34
    chapter: 88
    verse: 34
    ordinal: 2091
    text: And again, verily I say unto you, that which is governed by law is also preserved by law and perfected and sanctified by the same.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.35
    scripture: doctrine-and-covenants
    name: D&C 88:35
    chapter: 88
    verse: 35
    ordinal: 2092
    text: That which breaketh a law, and abideth not by law, but seeketh to become a law unto itself, and willeth to abide in sin, and altogether abideth in sin, cannot be sanctified by law, neither by mercy, justice, nor judgment. Therefore, they must remain filthy still.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.36
    scripture: doctrine-and-covenants
    name: D&C 88:36
    chapter: 88
    verse: 36
    ordinal: 2093
    text: All kingdoms have a law given;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.37
    scripture: doctrine-and-covenants
    name: D&C 88:37
    chapter: 88
    verse: 37
    ordinal: 2094
    text: And there are many kingdoms; for there is no space in the which there is no kingdom; and there is no kingdom in which there is no space, either a greater or a lesser kingdom.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.38
    scripture: doctrine-and-covenants
    name: D&C 88:38
    chapter: 88
    verse: 38
    ordinal: 2095
    text: And unto every kingdom is given a law; and unto every law there are certain bounds also and conditions.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.39
    scripture: doctrine-and-covenants
    name: D&C 88:39
    chapter: 88
    verse: 39
    ordinal: 2096
    text: All beings who abide not in those conditions are not justified.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.40
    scripture: doctrine-and-covenants
    name: D&C 88:40
    chapter: 88
    verse: 40
    ordinal: 2097
    text: For intelligence cleaveth unto intelligence; wisdom receiveth wisdom; truth embraceth truth; virtue loveth virtue; light cleaveth unto light; mercy hath compassion on mercy and claimeth her own; justice continueth its course and claimeth its own; judgment goeth before the face of him who sitteth upon the throne and governeth and executeth all things.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.41
    scripture: doctrine-and-covenants
    name: D&C 88:41
    chapter: 88
    verse: 41
    ordinal: 2098
    text: He comprehendeth all things, and all things are before him, and all things are round about him; and he is above all things, and in all things, and is through all things, and is round about all things; and all things are by him, and of him, even God, forever and ever.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.42
    scripture: doctrine-and-covenants
    name: D&C 88:42
    chapter: 88
    verse: 42
    ordinal: 2099
    text: And again, verily I say unto you, he hath given a law unto all things, by which they move in their times and their seasons;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.43
    scripture: doctrine-and-covenants
    name: D&C 88:43
    chapter: 88
    verse: 43
    ordinal: 2100
    text: And their courses are fixed, even the courses of the heavens and the earth, which comprehend the earth and all the planets.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.44
    scripture: doctrine-and-covenants
    name: D&C 88:44
    chapter: 88
    verse: 44
    ordinal: 2101
    text: And they give light to each other in their times and in their seasons, in their minutes, in their hours, in their days, in their weeks, in their months, in their years—all these are one year with God, but not with man.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.45
    scripture: doctrine-and-covenants
    name: D&C 88:45
    chapter: 88
    verse: 45
    ordinal: 2102
    text: The earth rolls upon her wings, and the sun giveth his light by day, and the moon giveth her light by night, and the stars also give their light, as they roll upon their wings in their glory, in the midst of the power of God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.46
    scripture: doctrine-and-covenants
    name: D&C 88:46
    chapter: 88
    verse: 46
    ordinal: 2103
    text: Unto what shall I liken these kingdoms, that ye may understand?
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.47
    scripture: doctrine-and-covenants
    name: D&C 88:47
    chapter: 88
    verse: 47
    ordinal: 2104
    text: Behold, all these are kingdoms, and any man who hath seen any or the least of these hath seen God moving in his majesty and power.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.48
    scripture: doctrine-and-covenants
    name: D&C 88:48
    chapter: 88
    verse: 48
    ordinal: 2105
    text: I say unto you, he hath seen him; nevertheless, he who came unto his own was not comprehended.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.49
    scripture: doctrine-and-covenants
    name: D&C 88:49
    chapter: 88
    verse: 49
    ordinal: 2106
    text: The light shineth in darkness, and the darkness comprehendeth it not; nevertheless, the day shall come when you shall comprehend even God, being quickened in him and by him.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.50
    scripture: doctrine-and-covenants
    name: D&C 88:50
    chapter: 88
    verse: 50
    ordinal: 2107
    text: Then shall ye know that ye have seen me, that I am, and that I am the true light that is in you, and that you are in me; otherwise ye could not abound.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.51
    scripture: doctrine-and-covenants
    name: D&C 88:51
    chapter: 88
    verse: 51
    ordinal: 2108
    text: Behold, I will liken these kingdoms unto a man having a field, and he sent forth his servants into the field to dig in the field.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.52
    scripture: doctrine-and-covenants
    name: D&C 88:52
    chapter: 88
    verse: 52
    ordinal: 2109
    text: 'And he said unto the first: Go ye and labor in the field, and in the first hour I will come unto you, and ye shall behold the joy of my countenance.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.53
    scripture: doctrine-and-covenants
    name: D&C 88:53
    chapter: 88
    verse: 53
    ordinal: 2110
    text: 'And he said unto the second: Go ye also into the field, and in the second hour I will visit you with the joy of my countenance.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.54
    scripture: doctrine-and-covenants
    name: D&C 88:54
    chapter: 88
    verse: 54
    ordinal: 2111
    text: 'And also unto the third, saying: I will visit you;'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.55
    scripture: doctrine-and-covenants
    name: D&C 88:55
    chapter: 88
    verse: 55
    ordinal: 2112
    text: And unto the fourth, and so on unto the twelfth.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.56
    scripture: doctrine-and-covenants
    name: D&C 88:56
    chapter: 88
    verse: 56
    ordinal: 2113
    text: And the lord of the field went unto the first in the first hour, and tarried with him all that hour, and he was made glad with the light of the countenance of his lord.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.57
    scripture: doctrine-and-covenants
    name: D&C 88:57
    chapter: 88
    verse: 57
    ordinal: 2114
    text: And then he withdrew from the first that he might visit the second also, and the third, and the fourth, and so on unto the twelfth.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.58
    scripture: doctrine-and-covenants
    name: D&C 88:58
    chapter: 88
    verse: 58
    ordinal: 2115
    text: And thus they all received the light of the countenance of their lord, every man in his hour, and in his time, and in his season—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.59
    scripture: doctrine-and-covenants
    name: D&C 88:59
    chapter: 88
    verse: 59
    ordinal: 2116
    text: Beginning at the first, and so on unto the last, and from the last unto the first, and from the first unto the last;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.60
    scripture: doctrine-and-covenants
    name: D&C 88:60
    chapter: 88
    verse: 60
    ordinal: 2117
    text: Every man in his own order, until his hour was finished, even according as his lord had commanded him, that his lord might be glorified in him, and he in his lord, that they all might be glorified.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.61
    scripture: doctrine-and-covenants
    name: D&C 88:61
    chapter: 88
    verse: 61
    ordinal: 2118
    text: Therefore, unto this parable I will liken all these kingdoms, and the inhabitants thereof—every kingdom in its hour, and in its time, and in its season, even according to the decree which God hath made.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.62
    scripture: doctrine-and-covenants
    name: D&C 88:62
    chapter: 88
    verse: 62
    ordinal: 2119
    text: And again, verily I say unto you, my friends, I leave these sayings with you to ponder in your hearts, with this commandment which I give unto you, that ye shall call upon me while I am near—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.63
    scripture: doctrine-and-covenants
    name: D&C 88:63
    chapter: 88
    verse: 63
    ordinal: 2120
    text: Draw near unto me and I will draw near unto you; seek me diligently and ye shall find me; ask, and ye shall receive; knock, and it shall be opened unto you.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Matthew 7:7
    kjvAllusionOsis:
    - Matt.7.7
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.64
    scripture: doctrine-and-covenants
    name: D&C 88:64
    chapter: 88
    verse: 64
    ordinal: 2121
    text: Whatsoever ye ask the Father in my name it shall be given unto you, that is expedient for you;
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - John 16:23
    kjvAllusionOsis:
    - John.16.23
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.65
    scripture: doctrine-and-covenants
    name: D&C 88:65
    chapter: 88
    verse: 65
    ordinal: 2122
    text: And if ye ask anything that is not expedient for you, it shall turn unto your condemnation.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.66
    scripture: doctrine-and-covenants
    name: D&C 88:66
    chapter: 88
    verse: 66
    ordinal: 2123
    text: Behold, that which you hear is as the voice of one crying in the wilderness—in the wilderness, because you cannot see him—my voice, because my voice is Spirit; my Spirit is truth; truth abideth and hath no end; and if it be in you it shall abound.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.67
    scripture: doctrine-and-covenants
    name: D&C 88:67
    chapter: 88
    verse: 67
    ordinal: 2124
    text: And if your eye be single to my glory, your whole bodies shall be filled with light, and there shall be no darkness in you; and that body which is filled with light comprehendeth all things.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Matthew 6:22
    kjvAllusionOsis:
    - Matt.6.22
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.68
    scripture: doctrine-and-covenants
    name: D&C 88:68
    chapter: 88
    verse: 68
    ordinal: 2125
    text: Therefore, sanctify yourselves that your minds become single to God, and the days will come that you shall see him; for he will unveil his face unto you, and it shall be in his own time, and in his own way, and according to his own will.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.69
    scripture: doctrine-and-covenants
    name: D&C 88:69
    chapter: 88
    verse: 69
    ordinal: 2126
    text: Remember the great and last promise which I have made unto you; cast away your idle thoughts and your excess of laughter far from you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.70
    scripture: doctrine-and-covenants
    name: D&C 88:70
    chapter: 88
    verse: 70
    ordinal: 2127
    text: Tarry ye, tarry ye in this place, and call a solemn assembly, even of those who are the first laborers in this last kingdom.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.71
    scripture: doctrine-and-covenants
    name: D&C 88:71
    chapter: 88
    verse: 71
    ordinal: 2128
    text: And let those whom they have warned in their traveling call on the Lord, and ponder the warning in their hearts which they have received, for a little season.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.72
    scripture: doctrine-and-covenants
    name: D&C 88:72
    chapter: 88
    verse: 72
    ordinal: 2129
    text: Behold, and lo, I will take care of your flocks, and will raise up elders and send unto them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.73
    scripture: doctrine-and-covenants
    name: D&C 88:73
    chapter: 88
    verse: 73
    ordinal: 2130
    text: Behold, I will hasten my work in its time.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.74
    scripture: doctrine-and-covenants
    name: D&C 88:74
    chapter: 88
    verse: 74
    ordinal: 2131
    text: And I give unto you, who are the first laborers in this last kingdom, a commandment that you assemble yourselves together, and organize yourselves, and prepare yourselves, and sanctify yourselves; yea, purify your hearts, and cleanse your hands and your feet before me, that I may make you clean;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.75
    scripture: doctrine-and-covenants
    name: D&C 88:75
    chapter: 88
    verse: 75
    ordinal: 2132
    text: That I may testify unto your Father, and your God, and my God, that you are clean from the blood of this wicked generation; that I may fulfil this promise, this great and last promise, which I have made unto you, when I will.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.76
    scripture: doctrine-and-covenants
    name: D&C 88:76
    chapter: 88
    verse: 76
    ordinal: 2133
    text: Also, I give unto you a commandment that ye shall continue in prayer and fasting from this time forth.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.77
    scripture: doctrine-and-covenants
    name: D&C 88:77
    chapter: 88
    verse: 77
    ordinal: 2134
    text: And I give unto you a commandment that you shall teach one another the doctrine of the kingdom.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.78
    scripture: doctrine-and-covenants
    name: D&C 88:78
    chapter: 88
    verse: 78
    ordinal: 2135
    text: Teach ye diligently and my grace shall attend you, that you may be instructed more perfectly in theory, in principle, in doctrine, in the law of the gospel, in all things that pertain unto the kingdom of God, that are expedient for you to understand;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.79
    scripture: doctrine-and-covenants
    name: D&C 88:79
    chapter: 88
    verse: 79
    ordinal: 2136
    text: Of things both in heaven and in the earth, and under the earth; things which have been, things which are, things which must shortly come to pass; things which are at home, things which are abroad; the wars and the perplexities of the nations, and the judgments which are on the land; and a knowledge also of countries and of kingdoms—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.80
    scripture: doctrine-and-covenants
    name: D&C 88:80
    chapter: 88
    verse: 80
    ordinal: 2137
    text: That ye may be prepared in all things when I shall send you again to magnify the calling whereunto I have called you, and the mission with which I have commissioned you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.81
    scripture: doctrine-and-covenants
    name: D&C 88:81
    chapter: 88
    verse: 81
    ordinal: 2138
    text: Behold, I sent you out to testify and warn the people, and it becometh every man who hath been warned to warn his neighbor.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.82
    scripture: doctrine-and-covenants
    name: D&C 88:82
    chapter: 88
    verse: 82
    ordinal: 2139
    text: Therefore, they are left without excuse, and their sins are upon their own heads.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.83
    scripture: doctrine-and-covenants
    name: D&C 88:83
    chapter: 88
    verse: 83
    ordinal: 2140
    text: He that seeketh me early shall find me, and shall not be forsaken.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Proverbs 8:17
    kjvAllusionOsis:
    - Prov.8.17
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.84
    scripture: doctrine-and-covenants
    name: D&C 88:84
    chapter: 88
    verse: 84
    ordinal: 2141
    text: Therefore, tarry ye, and labor diligently, that you may be perfected in your ministry to go forth among the Gentiles for the last time, as many as the mouth of the Lord shall name, to bind up the law and seal up the testimony, and to prepare the saints for the hour of judgment which is to come;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.85
    scripture: doctrine-and-covenants
    name: D&C 88:85
    chapter: 88
    verse: 85
    ordinal: 2142
    text: That their souls may escape the wrath of God, the desolation of abomination which awaits the wicked, both in this world and in the world to come. Verily, I say unto you, let those who are not the first elders continue in the vineyard until the mouth of the Lord shall call them, for their time is not yet come; their garments are not clean from the blood of this generation.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.86
    scripture: doctrine-and-covenants
    name: D&C 88:86
    chapter: 88
    verse: 86
    ordinal: 2143
    text: Abide ye in the liberty wherewith ye are made free; entangle not yourselves in sin, but let your hands be clean, until the Lord comes.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.87
    scripture: doctrine-and-covenants
    name: D&C 88:87
    chapter: 88
    verse: 87
    ordinal: 2144
    text: For not many days hence and the earth shall tremble and reel to and fro as a drunken man; and the sun shall hide his face, and shall refuse to give light; and the moon shall be bathed in blood; and the stars shall become exceedingly angry, and shall cast themselves down as a fig that falleth from off a fig tree.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.88
    scripture: doctrine-and-covenants
    name: D&C 88:88
    chapter: 88
    verse: 88
    ordinal: 2145
    text: And after your testimony cometh wrath and indignation upon the people.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.89
    scripture: doctrine-and-covenants
    name: D&C 88:89
    chapter: 88
    verse: 89
    ordinal: 2146
    text: For after your testimony cometh the testimony of earthquakes, that shall cause groanings in the midst of her, and men shall fall upon the ground and shall not be able to stand.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.90
    scripture: doctrine-and-covenants
    name: D&C 88:90
    chapter: 88
    verse: 90
    ordinal: 2147
    text: And also cometh the testimony of the voice of thunderings, and the voice of lightnings, and the voice of tempests, and the voice of the waves of the sea heaving themselves beyond their bounds.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.91
    scripture: doctrine-and-covenants
    name: D&C 88:91
    chapter: 88
    verse: 91
    ordinal: 2148
    text: And all things shall be in commotion; and surely, men's hearts shall fail them; for fear shall come upon all people.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.92
    scripture: doctrine-and-covenants
    name: D&C 88:92
    chapter: 88
    verse: 92
    ordinal: 2149
    text: 'And angels shall fly through the midst of heaven, crying with a loud voice, sounding the trump of God, saying: Prepare ye, prepare ye, O inhabitants of the earth; for the judgment of our God is come. Behold, and lo, the Bridegroom cometh; go ye out to meet him.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.93
    scripture: doctrine-and-covenants
    name: D&C 88:93
    chapter: 88
    verse: 93
    ordinal: 2150
    text: And immediately there shall appear a great sign in heaven, and all people shall see it together.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.94
    scripture: doctrine-and-covenants
    name: D&C 88:94
    chapter: 88
    verse: 94
    ordinal: 2151
    text: 'And another angel shall sound his trump, saying: That great church, the mother of abominations, that made all nations drink of the wine of the wrath of her fornication, that persecuteth the saints of God, that shed their blood—she who sitteth upon many waters, and upon the islands of the sea—behold, she is the tares of the earth; she is bound in bundles; her bands are made strong, no man can loose them; therefore, she is ready to be burned. And he shall sound his trump both long and loud, and all nations shall hear it.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.95
    scripture: doctrine-and-covenants
    name: D&C 88:95
    chapter: 88
    verse: 95
    ordinal: 2152
    text: And there shall be silence in heaven for the space of half an hour; and immediately after shall the curtain of heaven be unfolded, as a scroll is unfolded after it is rolled up, and the face of the Lord shall be unveiled;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.96
    scripture: doctrine-and-covenants
    name: D&C 88:96
    chapter: 88
    verse: 96
    ordinal: 2153
    text: And the saints that are upon the earth, who are alive, shall be quickened and be caught up to meet him.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.97
    scripture: doctrine-and-covenants
    name: D&C 88:97
    chapter: 88
    verse: 97
    ordinal: 2154
    text: And they who have slept in their graves shall come forth, for their graves shall be opened; and they also shall be caught up to meet him in the midst of the pillar of heaven—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.98
    scripture: doctrine-and-covenants
    name: D&C 88:98
    chapter: 88
    verse: 98
    ordinal: 2155
    text: They are Christ's, the first fruits, they who shall descend with him first, and they who are on the earth and in their graves, who are first caught up to meet him; and all this by the voice of the sounding of the trump of the angel of God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.99
    scripture: doctrine-and-covenants
    name: D&C 88:99
    chapter: 88
    verse: 99
    ordinal: 2156
    text: And after this another angel shall sound, which is the second trump; and then cometh the redemption of those who are Christ's at his coming; who have received their part in that prison which is prepared for them, that they might receive the gospel, and be judged according to men in the flesh.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.100
    scripture: doctrine-and-covenants
    name: D&C 88:100
    chapter: 88
    verse: 100
    ordinal: 2157
    text: And again, another trump shall sound, which is the third trump; and then come the spirits of men who are to be judged, and are found under condemnation;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.101
    scripture: doctrine-and-covenants
    name: D&C 88:101
    chapter: 88
    verse: 101
    ordinal: 2158
    text: And these are the rest of the dead; and they live not again until the thousand years are ended, neither again, until the end of the earth.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.102
    scripture: doctrine-and-covenants
    name: D&C 88:102
    chapter: 88
    verse: 102
    ordinal: 2159
    text: 'And another trump shall sound, which is the fourth trump, saying: There are found among those who are to remain until that great and last day, even the end, who shall remain filthy still.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.103
    scripture: doctrine-and-covenants
    name: D&C 88:103
    chapter: 88
    verse: 103
    ordinal: 2160
    text: And another trump shall sound, which is the fifth trump, which is the fifth angel who committeth the everlasting gospel—flying through the midst of heaven, unto all nations, kindreds, tongues, and people;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.104
    scripture: doctrine-and-covenants
    name: D&C 88:104
    chapter: 88
    verse: 104
    ordinal: 2161
    text: 'And this shall be the sound of his trump, saying to all people, both in heaven and in earth, and that are under the earth—for every ear shall hear it, and every knee shall bow, and every tongue shall confess, while they hear the sound of the trump, saying: Fear God, and give glory to him who sitteth upon the throne, forever and ever; for the hour of his judgment is come.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.105
    scripture: doctrine-and-covenants
    name: D&C 88:105
    chapter: 88
    verse: 105
    ordinal: 2162
    text: 'And again, another angel shall sound his trump, which is the sixth angel, saying: She is fallen who made all nations drink of the wine of the wrath of her fornication; she is fallen, is fallen!'
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Revelation 14:8
    kjvAllusionOsis:
    - Rev.14.8
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.106
    scripture: doctrine-and-covenants
    name: D&C 88:106
    chapter: 88
    verse: 106
    ordinal: 2163
    text: 'And again, another angel shall sound his trump, which is the seventh angel, saying: It is finished; it is finished! The Lamb of God hath overcome and trodden the wine-press alone, even the wine-press of the fierceness of the wrath of Almighty God.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.107
    scripture: doctrine-and-covenants
    name: D&C 88:107
    chapter: 88
    verse: 107
    ordinal: 2164
    text: And then shall the angels be crowned with the glory of his might, and the saints shall be filled with his glory, and receive their inheritance and be made equal with him.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.108
    scripture: doctrine-and-covenants
    name: D&C 88:108
    chapter: 88
    verse: 108
    ordinal: 2165
    text: And then shall the first angel again sound his trump in the ears of all living, and reveal the secret acts of men, and the mighty works of God in the first thousand years.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.109
    scripture: doctrine-and-covenants
    name: D&C 88:109
    chapter: 88
    verse: 109
    ordinal: 2166
    text: And then shall the second angel sound his trump, and reveal the secret acts of men, and the thoughts and intents of their hearts, and the mighty works of God in the second thousand years—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.110
    scripture: doctrine-and-covenants
    name: D&C 88:110
    chapter: 88
    verse: 110
    ordinal: 2167
    text: And so on, until the seventh angel shall sound his trump; and he shall stand forth upon the land and upon the sea, and swear in the name of him who sitteth upon the throne, that there shall be time no longer; and Satan shall be bound, that old serpent, who is called the devil, and shall not be loosed for the space of a thousand years.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.111
    scripture: doctrine-and-covenants
    name: D&C 88:111
    chapter: 88
    verse: 111
    ordinal: 2168
    text: And then he shall be loosed for a little season, that he may gather together his armies.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.112
    scripture: doctrine-and-covenants
    name: D&C 88:112
    chapter: 88
    verse: 112
    ordinal: 2169
    text: And Michael, the seventh angel, even the archangel, shall gather together his armies, even the hosts of heaven.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.113
    scripture: doctrine-and-covenants
    name: D&C 88:113
    chapter: 88
    verse: 113
    ordinal: 2170
    text: And the devil shall gather together his armies; even the hosts of hell, and shall come up to battle against Michael and his armies.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.114
    scripture: doctrine-and-covenants
    name: D&C 88:114
    chapter: 88
    verse: 114
    ordinal: 2171
    text: And then cometh the battle of the great God; and the devil and his armies shall be cast away into their own place, that they shall not have power over the saints any more at all.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.115
    scripture: doctrine-and-covenants
    name: D&C 88:115
    chapter: 88
    verse: 115
    ordinal: 2172
    text: For Michael shall fight their battles, and shall overcome him who seeketh the throne of him who sitteth upon the throne, even the Lamb.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.116
    scripture: doctrine-and-covenants
    name: D&C 88:116
    chapter: 88
    verse: 116
    ordinal: 2173
    text: This is the glory of God, and the sanctified; and they shall not any more see death.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.117
    scripture: doctrine-and-covenants
    name: D&C 88:117
    chapter: 88
    verse: 117
    ordinal: 2174
    text: Therefore, verily I say unto you, my friends, call your solemn assembly, as I have commanded you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.118
    scripture: doctrine-and-covenants
    name: D&C 88:118
    chapter: 88
    verse: 118
    ordinal: 2175
    text: And as all have not faith, seek ye diligently and teach one another words of wisdom; yea, seek ye out of the best books words of wisdom; seek learning, even by study and also by faith.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.119
    scripture: doctrine-and-covenants
    name: D&C 88:119
    chapter: 88
    verse: 119
    ordinal: 2176
    text: Organize yourselves; prepare every needful thing; and establish a house, even a house of prayer, a house of fasting, a house of faith, a house of learning, a house of glory, a house of order, a house of God;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.120
    scripture: doctrine-and-covenants
    name: D&C 88:120
    chapter: 88
    verse: 120
    ordinal: 2177
    text: That your incomings may be in the name of the Lord; that your outgoings may be in the name of the Lord; that all your salutations may be in the name of the Lord, with uplifted hands unto the Most High.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.121
    scripture: doctrine-and-covenants
    name: D&C 88:121
    chapter: 88
    verse: 121
    ordinal: 2178
    text: Therefore, cease from all your light speeches, from all laughter, from all your lustful desires, from all your pride and light-mindedness, and from all your wicked doings.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.122
    scripture: doctrine-and-covenants
    name: D&C 88:122
    chapter: 88
    verse: 122
    ordinal: 2179
    text: Appoint among yourselves a teacher, and let not all be spokesmen at once; but let one speak at a time and let all listen unto his sayings, that when all have spoken that all may be edified of all, and that every man may have an equal privilege.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.123
    scripture: doctrine-and-covenants
    name: D&C 88:123
    chapter: 88
    verse: 123
    ordinal: 2180
    text: See that ye love one another; cease to be covetous; learn to impart one to another as the gospel requires.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.124
    scripture: doctrine-and-covenants
    name: D&C 88:124
    chapter: 88
    verse: 124
    ordinal: 2181
    text: Cease to be idle; cease to be unclean; cease to find fault one with another; cease to sleep longer than is needful; retire to thy bed early, that ye may not be weary; arise early, that your bodies and your minds may be invigorated.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.125
    scripture: doctrine-and-covenants
    name: D&C 88:125
    chapter: 88
    verse: 125
    ordinal: 2182
    text: And above all things, clothe yourselves with the bond of charity, as with a mantle, which is the bond of perfectness and peace.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Colossians 3:14
    kjvAllusionOsis:
    - Col.3.14
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.126
    scripture: doctrine-and-covenants
    name: D&C 88:126
    chapter: 88
    verse: 126
    ordinal: 2183
    text: Pray always, that ye may not faint, until I come. Behold, and lo, I will come quickly, and receive you unto myself. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.127
    scripture: doctrine-and-covenants
    name: D&C 88:127
    chapter: 88
    verse: 127
    ordinal: 2184
    text: And again, the order of the house prepared for the presidency of the school of the prophets, established for their instruction in all things that are expedient for them, even for all the officers of the church, or in other words, those who are called to the ministry in the church, beginning at the high priests, even down to the deacons—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.128
    scripture: doctrine-and-covenants
    name: D&C 88:128
    chapter: 88
    verse: 128
    ordinal: 2185
    text: 'And this shall be the order of the house of the presidency of the school: He that is appointed to be president, or teacher, shall be found standing in his place, in the house which shall be prepared for him.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.129
    scripture: doctrine-and-covenants
    name: D&C 88:129
    chapter: 88
    verse: 129
    ordinal: 2186
    text: Therefore, he shall be first in the house of God, in a place that the congregation in the house may hear his words carefully and distinctly, not with loud speech.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.130
    scripture: doctrine-and-covenants
    name: D&C 88:130
    chapter: 88
    verse: 130
    ordinal: 2187
    text: And when he cometh into the house of God, for he should be first in the house—behold, this is beautiful, that he may be an example—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.131
    scripture: doctrine-and-covenants
    name: D&C 88:131
    chapter: 88
    verse: 131
    ordinal: 2188
    text: Let him offer himself in prayer upon his knees before God, in token or remembrance of the everlasting covenant.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.132
    scripture: doctrine-and-covenants
    name: D&C 88:132
    chapter: 88
    verse: 132
    ordinal: 2189
    text: 'And when any shall come in after him, let the teacher arise, and, with uplifted hands to heaven, yea, even directly, salute his brother or brethren with these words:'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.133
    scripture: doctrine-and-covenants
    name: D&C 88:133
    chapter: 88
    verse: 133
    ordinal: 2190
    text: Art thou a brother or brethren? I salute you in the name of the Lord Jesus Christ, in token or remembrance of the everlasting covenant, in which covenant I receive you to fellowship, in a determination that is fixed, immovable, and unchangeable, to be your friend and brother through the grace of God in the bonds of love, to walk in all the commandments of God blameless, in thanksgiving, forever and ever. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.134
    scripture: doctrine-and-covenants
    name: D&C 88:134
    chapter: 88
    verse: 134
    ordinal: 2191
    text: And he that is found unworthy of this salutation shall not have place among you; for ye shall not suffer that mine house shall be polluted by him.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.135
    scripture: doctrine-and-covenants
    name: D&C 88:135
    chapter: 88
    verse: 135
    ordinal: 2192
    text: And he that cometh in and is faithful before me, and is a brother, or if they be brethren, they shall salute the president or teacher with uplifted hands to heaven, with this same prayer and covenant, or by saying Amen, in token of the same.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.136
    scripture: doctrine-and-covenants
    name: D&C 88:136
    chapter: 88
    verse: 136
    ordinal: 2193
    text: Behold, verily, I say unto you, this is an ensample unto you for a salutation to one another in the house of God, in the school of the prophets.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.137
    scripture: doctrine-and-covenants
    name: D&C 88:137
    chapter: 88
    verse: 137
    ordinal: 2194
    text: And ye are called to do this by prayer and thanksgiving, as the Spirit shall give utterance in all your doings in the house of the Lord, in the school of the prophets, that it may become a sanctuary, a tabernacle of the Holy Spirit to your edification.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.138
    scripture: doctrine-and-covenants
    name: D&C 88:138
    chapter: 88
    verse: 138
    ordinal: 2195
    text: And ye shall not receive any among you into this school save he is clean from the blood of this generation;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.139
    scripture: doctrine-and-covenants
    name: D&C 88:139
    chapter: 88
    verse: 139
    ordinal: 2196
    text: And he shall be received by the ordinance of the washing of feet, for unto this end was the ordinance of the washing of feet instituted.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.140
    scripture: doctrine-and-covenants
    name: D&C 88:140
    chapter: 88
    verse: 140
    ordinal: 2197
    text: And again, the ordinance of washing feet is to be administered by the president, or presiding elder of the church.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.88.141
    scripture: doctrine-and-covenants
    name: D&C 88:141
    chapter: 88
    verse: 141
    ordinal: 2198
    text: It is to be commenced with prayer; and after partaking of bread and wine, he is to gird himself according to the pattern given in the thirteenth chapter of John's testimony concerning me. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.88
- type: DcVerse
  data:
    ref: dc.89.1
    scripture: doctrine-and-covenants
    name: D&C 89:1
    chapter: 89
    verse: 1
    ordinal: 2199
    text: A WORD OF WISDOM, for the benefit of the council of high priests, assembled in Kirtland, and the church, and also the saints in Zion—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.89
- type: DcVerse
  data:
    ref: dc.89.2
    scripture: doctrine-and-covenants
    name: D&C 89:2
    chapter: 89
    verse: 2
    ordinal: 2200
    text: To be sent greeting; not by commandment or constraint, but by revelation and the word of wisdom, showing forth the order and will of God in the temporal salvation of all saints in the last days—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.89
- type: DcVerse
  data:
    ref: dc.89.3
    scripture: doctrine-and-covenants
    name: D&C 89:3
    chapter: 89
    verse: 3
    ordinal: 2201
    text: Given for a principle with promise, adapted to the capacity of the weak and the weakest of all saints, who are or can be called saints.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.89
- type: DcVerse
  data:
    ref: dc.89.4
    scripture: doctrine-and-covenants
    name: D&C 89:4
    chapter: 89
    verse: 4
    ordinal: 2202
    text: 'Behold, verily, thus saith the Lord unto you: In consequence of evils and designs which do and will exist in the hearts of conspiring men in the last days, I have warned you, and forewarn you, by giving unto you this word of wisdom by revelation—'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.89
- type: DcVerse
  data:
    ref: dc.89.5
    scripture: doctrine-and-covenants
    name: D&C 89:5
    chapter: 89
    verse: 5
    ordinal: 2203
    text: That inasmuch as any man drinketh wine or strong drink among you, behold it is not good, neither meet in the sight of your Father, only in assembling yourselves together to offer up your sacraments before him.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.89
- type: DcVerse
  data:
    ref: dc.89.6
    scripture: doctrine-and-covenants
    name: D&C 89:6
    chapter: 89
    verse: 6
    ordinal: 2204
    text: And, behold, this should be wine, yea, pure wine of the grape of the vine, of your own make.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.89
- type: DcVerse
  data:
    ref: dc.89.7
    scripture: doctrine-and-covenants
    name: D&C 89:7
    chapter: 89
    verse: 7
    ordinal: 2205
    text: And, again, strong drinks are not for the belly, but for the washing of your bodies.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.89
- type: DcVerse
  data:
    ref: dc.89.8
    scripture: doctrine-and-covenants
    name: D&C 89:8
    chapter: 89
    verse: 8
    ordinal: 2206
    text: And again, tobacco is not for the body, neither for the belly, and is not good for man, but is an herb for bruises and all sick cattle, to be used with judgment and skill.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.89
- type: DcVerse
  data:
    ref: dc.89.9
    scripture: doctrine-and-covenants
    name: D&C 89:9
    chapter: 89
    verse: 9
    ordinal: 2207
    text: And again, hot drinks are not for the body or belly.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.89
- type: DcVerse
  data:
    ref: dc.89.10
    scripture: doctrine-and-covenants
    name: D&C 89:10
    chapter: 89
    verse: 10
    ordinal: 2208
    text: And again, verily I say unto you, all wholesome herbs God hath ordained for the constitution, nature, and use of man—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.89
- type: DcVerse
  data:
    ref: dc.89.11
    scripture: doctrine-and-covenants
    name: D&C 89:11
    chapter: 89
    verse: 11
    ordinal: 2209
    text: Every herb in the season thereof, and every fruit in the season thereof; all these to be used with prudence and thanksgiving.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.89
- type: DcVerse
  data:
    ref: dc.89.12
    scripture: doctrine-and-covenants
    name: D&C 89:12
    chapter: 89
    verse: 12
    ordinal: 2210
    text: Yea, flesh also of beasts and of the fowls of the air, I, the Lord, have ordained for the use of man with thanksgiving; nevertheless they are to be used sparingly;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.89
- type: DcVerse
  data:
    ref: dc.89.13
    scripture: doctrine-and-covenants
    name: D&C 89:13
    chapter: 89
    verse: 13
    ordinal: 2211
    text: And it is pleasing unto me that they should not be used, only in times of winter, or of cold, or famine.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.89
- type: DcVerse
  data:
    ref: dc.89.14
    scripture: doctrine-and-covenants
    name: D&C 89:14
    chapter: 89
    verse: 14
    ordinal: 2212
    text: All grain is ordained for the use of man and of beasts, to be the staff of life, not only for man but for the beasts of the field, and the fowls of heaven, and all wild animals that run or creep on the earth;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.89
- type: DcVerse
  data:
    ref: dc.89.15
    scripture: doctrine-and-covenants
    name: D&C 89:15
    chapter: 89
    verse: 15
    ordinal: 2213
    text: And these hath God made for the use of man only in times of famine and excess of hunger.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.89
- type: DcVerse
  data:
    ref: dc.89.16
    scripture: doctrine-and-covenants
    name: D&C 89:16
    chapter: 89
    verse: 16
    ordinal: 2214
    text: All grain is good for the food of man; as also the fruit of the vine; that which yieldeth fruit, whether in the ground or above the ground—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.89
- type: DcVerse
  data:
    ref: dc.89.17
    scripture: doctrine-and-covenants
    name: D&C 89:17
    chapter: 89
    verse: 17
    ordinal: 2215
    text: Nevertheless, wheat for man, and corn for the ox, and oats for the horse, and rye for the fowls and for swine, and for all beasts of the field, and barley for all useful animals, and for mild drinks, as also other grain.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.89
- type: DcVerse
  data:
    ref: dc.89.18
    scripture: doctrine-and-covenants
    name: D&C 89:18
    chapter: 89
    verse: 18
    ordinal: 2216
    text: And all saints who remember to keep and do these sayings, walking in obedience to the commandments, shall receive health in their navel and marrow to their bones;
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Proverbs 3:8
    kjvAllusionOsis:
    - Prov.3.8
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.89
- type: DcVerse
  data:
    ref: dc.89.19
    scripture: doctrine-and-covenants
    name: D&C 89:19
    chapter: 89
    verse: 19
    ordinal: 2217
    text: And shall find wisdom and great treasures of knowledge, even hidden treasures;
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Colossians 2:3
    kjvAllusionOsis:
    - Col.2.3
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.89
- type: DcVerse
  data:
    ref: dc.89.20
    scripture: doctrine-and-covenants
    name: D&C 89:20
    chapter: 89
    verse: 20
    ordinal: 2218
    text: And shall run and not be weary, and shall walk and not faint.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Isaiah 40:31
    kjvAllusionOsis:
    - Isa.40.31
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.89
- type: DcVerse
  data:
    ref: dc.89.21
    scripture: doctrine-and-covenants
    name: D&C 89:21
    chapter: 89
    verse: 21
    ordinal: 2219
    text: And I, the Lord, give unto them a promise, that the destroying angel shall pass by them, as the children of Israel, and not slay them. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.89
- type: DcVerse
  data:
    ref: dc.90.1
    scripture: doctrine-and-covenants
    name: D&C 90:1
    chapter: 90
    verse: 1
    ordinal: 2220
    text: Thus saith the Lord, verily, verily I say unto you my son, thy sins are forgiven thee, according to thy petition, for thy prayers and the prayers of thy brethren have come up into my ears.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.90
- type: DcVerse
  data:
    ref: dc.90.2
    scripture: doctrine-and-covenants
    name: D&C 90:2
    chapter: 90
    verse: 2
    ordinal: 2221
    text: Therefore, thou art blessed from henceforth that bear the keys of the kingdom given unto you; which kingdom is coming forth for the last time.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.90
- type: DcVerse
  data:
    ref: dc.90.3
    scripture: doctrine-and-covenants
    name: D&C 90:3
    chapter: 90
    verse: 3
    ordinal: 2222
    text: Verily I say unto you, the keys of this kingdom shall never be taken from you, while thou art in the world, neither in the world to come;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.90
- type: DcVerse
  data:
    ref: dc.90.4
    scripture: doctrine-and-covenants
    name: D&C 90:4
    chapter: 90
    verse: 4
    ordinal: 2223
    text: Nevertheless, through you shall the oracles be given to another, yea, even unto the church.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.90
- type: DcVerse
  data:
    ref: dc.90.5
    scripture: doctrine-and-covenants
    name: D&C 90:5
    chapter: 90
    verse: 5
    ordinal: 2224
    text: And all they who receive the oracles of God, let them beware how they hold them lest they are accounted as a light thing, and are brought under condemnation thereby, and stumble and fall when the storms descend, and the winds blow, and the rains descend, and beat upon their house.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.90
- type: DcVerse
  data:
    ref: dc.90.6
    scripture: doctrine-and-covenants
    name: D&C 90:6
    chapter: 90
    verse: 6
    ordinal: 2225
    text: And again, verily I say unto thy brethren, Sidney Rigdon and Frederick G. Williams, their sins are forgiven them also, and they are accounted as equal with thee in holding the keys of this last kingdom;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.90
- type: DcVerse
  data:
    ref: dc.90.7
    scripture: doctrine-and-covenants
    name: D&C 90:7
    chapter: 90
    verse: 7
    ordinal: 2226
    text: As also through your administration the keys of the school of the prophets, which I have commanded to be organized;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.90
- type: DcVerse
  data:
    ref: dc.90.8
    scripture: doctrine-and-covenants
    name: D&C 90:8
    chapter: 90
    verse: 8
    ordinal: 2227
    text: That thereby they may be perfected in their ministry for the salvation of Zion, and of the nations of Israel, and of the Gentiles, as many as will believe;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.90
- type: DcVerse
  data:
    ref: dc.90.9
    scripture: doctrine-and-covenants
    name: D&C 90:9
    chapter: 90
    verse: 9
    ordinal: 2228
    text: That through your administration they may receive the word, and through their administration the word may go forth unto the ends of the earth, unto the Gentiles first, and then, behold, and lo, they shall turn unto the Jews.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.90
- type: DcVerse
  data:
    ref: dc.90.10
    scripture: doctrine-and-covenants
    name: D&C 90:10
    chapter: 90
    verse: 10
    ordinal: 2229
    text: And then cometh the day when the arm of the Lord shall be revealed in power in convincing the nations, the heathen nations, the house of Joseph, of the gospel of their salvation.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.90
- type: DcVerse
  data:
    ref: dc.90.11
    scripture: doctrine-and-covenants
    name: D&C 90:11
    chapter: 90
    verse: 11
    ordinal: 2230
    text: For it shall come to pass in that day, that every man shall hear the fulness of the gospel in his own tongue, and in his own language, through those who are ordained unto this power, by the administration of the Comforter, shed forth upon them for the revelation of Jesus Christ.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.90
- type: DcVerse
  data:
    ref: dc.90.12
    scripture: doctrine-and-covenants
    name: D&C 90:12
    chapter: 90
    verse: 12
    ordinal: 2231
    text: And now, verily I say unto you, I give unto you a commandment that you continue in the ministry and presidency.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.90
- type: DcVerse
  data:
    ref: dc.90.13
    scripture: doctrine-and-covenants
    name: D&C 90:13
    chapter: 90
    verse: 13
    ordinal: 2232
    text: And when you have finished the translation of the prophets, you shall from thenceforth preside over the affairs of the church and the school;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.90
- type: DcVerse
  data:
    ref: dc.90.14
    scripture: doctrine-and-covenants
    name: D&C 90:14
    chapter: 90
    verse: 14
    ordinal: 2233
    text: And from time to time, as shall be manifested by the Comforter, receive revelations to unfold the mysteries of the kingdom;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.90
- type: DcVerse
  data:
    ref: dc.90.15
    scripture: doctrine-and-covenants
    name: D&C 90:15
    chapter: 90
    verse: 15
    ordinal: 2234
    text: And set in order the churches, and study and learn, and become acquainted with all good books, and with languages, tongues, and people.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.90
- type: DcVerse
  data:
    ref: dc.90.16
    scripture: doctrine-and-covenants
    name: D&C 90:16
    chapter: 90
    verse: 16
    ordinal: 2235
    text: And this shall be your business and mission in all your lives, to preside in council, and set in order all the affairs of this church and kingdom.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.90
- type: DcVerse
  data:
    ref: dc.90.17
    scripture: doctrine-and-covenants
    name: D&C 90:17
    chapter: 90
    verse: 17
    ordinal: 2236
    text: Be not ashamed, neither confounded; but be admonished in all your high-mindedness and pride, for it bringeth a snare upon your souls.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.90
- type: DcVerse
  data:
    ref: dc.90.18
    scripture: doctrine-and-covenants
    name: D&C 90:18
    chapter: 90
    verse: 18
    ordinal: 2237
    text: Set in order your houses; keep slothfulness and uncleanness far from you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.90
- type: DcVerse
  data:
    ref: dc.90.19
    scripture: doctrine-and-covenants
    name: D&C 90:19
    chapter: 90
    verse: 19
    ordinal: 2238
    text: Now, verily I say unto you, let there be a place provided, as soon as it is possible, for the family of thy counselor and scribe, even Frederick G. Williams.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.90
- type: DcVerse
  data:
    ref: dc.90.20
    scripture: doctrine-and-covenants
    name: D&C 90:20
    chapter: 90
    verse: 20
    ordinal: 2239
    text: And let mine aged servant, Joseph Smith, Sen., continue with his family upon the place where he now lives; and let it not be sold until the mouth of the Lord shall name.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.90
- type: DcVerse
  data:
    ref: dc.90.21
    scripture: doctrine-and-covenants
    name: D&C 90:21
    chapter: 90
    verse: 21
    ordinal: 2240
    text: And let my counselor, even Sidney Rigdon, remain where he now resides until the mouth of the Lord shall name.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.90
- type: DcVerse
  data:
    ref: dc.90.22
    scripture: doctrine-and-covenants
    name: D&C 90:22
    chapter: 90
    verse: 22
    ordinal: 2241
    text: And let the bishop search diligently to obtain an agent, and let him be a man who has got riches in store—a man of God, and of strong faith—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.90
- type: DcVerse
  data:
    ref: dc.90.23
    scripture: doctrine-and-covenants
    name: D&C 90:23
    chapter: 90
    verse: 23
    ordinal: 2242
    text: That thereby he may be enabled to discharge every debt; that the storehouse of the Lord may not be brought into disrepute before the eyes of the people.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.90
- type: DcVerse
  data:
    ref: dc.90.24
    scripture: doctrine-and-covenants
    name: D&C 90:24
    chapter: 90
    verse: 24
    ordinal: 2243
    text: Search diligently, pray always, and be believing, and all things shall work together for your good, if ye walk uprightly and remember the covenant wherewith ye have covenanted one with another.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.90
- type: DcVerse
  data:
    ref: dc.90.25
    scripture: doctrine-and-covenants
    name: D&C 90:25
    chapter: 90
    verse: 25
    ordinal: 2244
    text: Let your families be small, especially mine aged servant Joseph Smith's, Sen., as pertaining to those who do not belong to your families;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.90
- type: DcVerse
  data:
    ref: dc.90.26
    scripture: doctrine-and-covenants
    name: D&C 90:26
    chapter: 90
    verse: 26
    ordinal: 2245
    text: That those things that are provided for you, to bring to pass my work, be not taken from you and given to those that are not worthy—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.90
- type: DcVerse
  data:
    ref: dc.90.27
    scripture: doctrine-and-covenants
    name: D&C 90:27
    chapter: 90
    verse: 27
    ordinal: 2246
    text: And thereby you be hindered in accomplishing those things which I have commanded you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.90
- type: DcVerse
  data:
    ref: dc.90.28
    scripture: doctrine-and-covenants
    name: D&C 90:28
    chapter: 90
    verse: 28
    ordinal: 2247
    text: And again, verily I say unto you, it is my will that my handmaid Vienna Jaques should receive money to bear her expenses, and go up unto the land of Zion;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.90
- type: DcVerse
  data:
    ref: dc.90.29
    scripture: doctrine-and-covenants
    name: D&C 90:29
    chapter: 90
    verse: 29
    ordinal: 2248
    text: And the residue of the money may be consecrated unto me, and she be rewarded in mine own due time.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.90
- type: DcVerse
  data:
    ref: dc.90.30
    scripture: doctrine-and-covenants
    name: D&C 90:30
    chapter: 90
    verse: 30
    ordinal: 2249
    text: Verily I say unto you, that it is meet in mine eyes that she should go up unto the land of Zion, and receive an inheritance from the hand of the bishop;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.90
- type: DcVerse
  data:
    ref: dc.90.31
    scripture: doctrine-and-covenants
    name: D&C 90:31
    chapter: 90
    verse: 31
    ordinal: 2250
    text: That she may settle down in peace inasmuch as she is faithful, and not be idle in her days from thenceforth.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.90
- type: DcVerse
  data:
    ref: dc.90.32
    scripture: doctrine-and-covenants
    name: D&C 90:32
    chapter: 90
    verse: 32
    ordinal: 2251
    text: And behold, verily I say unto you, that ye shall write this commandment, and say unto your brethren in Zion, in love greeting, that I have called you also to preside over Zion in mine own due time.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.90
- type: DcVerse
  data:
    ref: dc.90.33
    scripture: doctrine-and-covenants
    name: D&C 90:33
    chapter: 90
    verse: 33
    ordinal: 2252
    text: Therefore, let them cease wearying me concerning this matter.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.90
- type: DcVerse
  data:
    ref: dc.90.34
    scripture: doctrine-and-covenants
    name: D&C 90:34
    chapter: 90
    verse: 34
    ordinal: 2253
    text: Behold, I say unto you that your brethren in Zion begin to repent, and the angels rejoice over them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.90
- type: DcVerse
  data:
    ref: dc.90.35
    scripture: doctrine-and-covenants
    name: D&C 90:35
    chapter: 90
    verse: 35
    ordinal: 2254
    text: Nevertheless, I am not well pleased with many things; and I am not well pleased with my servant William E. McLellin, neither with my servant Sidney Gilbert; and the bishop also, and others have many things to repent of.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.90
- type: DcVerse
  data:
    ref: dc.90.36
    scripture: doctrine-and-covenants
    name: D&C 90:36
    chapter: 90
    verse: 36
    ordinal: 2255
    text: But verily I say unto you, that I, the Lord, will contend with Zion, and plead with her strong ones, and chasten her until she overcomes and is clean before me.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.90
- type: DcVerse
  data:
    ref: dc.90.37
    scripture: doctrine-and-covenants
    name: D&C 90:37
    chapter: 90
    verse: 37
    ordinal: 2256
    text: For she shall not be removed out of her place. I, the Lord, have spoken it. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.90
- type: DcVerse
  data:
    ref: dc.91.1
    scripture: doctrine-and-covenants
    name: D&C 91:1
    chapter: 91
    verse: 1
    ordinal: 2257
    text: Verily, thus saith the Lord unto you concerning the Apocrypha—There are many things contained therein that are true, and it is mostly translated correctly;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.91
- type: DcVerse
  data:
    ref: dc.91.2
    scripture: doctrine-and-covenants
    name: D&C 91:2
    chapter: 91
    verse: 2
    ordinal: 2258
    text: There are many things contained therein that are not true, which are interpolations by the hands of men.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.91
- type: DcVerse
  data:
    ref: dc.91.3
    scripture: doctrine-and-covenants
    name: D&C 91:3
    chapter: 91
    verse: 3
    ordinal: 2259
    text: Verily, I say unto you, that it is not needful that the Apocrypha should be translated.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.91
- type: DcVerse
  data:
    ref: dc.91.4
    scripture: doctrine-and-covenants
    name: D&C 91:4
    chapter: 91
    verse: 4
    ordinal: 2260
    text: Therefore, whoso readeth it, let him understand, for the Spirit manifesteth truth;
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Matthew 24:15
    kjvAllusionOsis:
    - Matt.24.15
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.91
- type: DcVerse
  data:
    ref: dc.91.5
    scripture: doctrine-and-covenants
    name: D&C 91:5
    chapter: 91
    verse: 5
    ordinal: 2261
    text: And whoso is enlightened by the Spirit shall obtain benefit therefrom;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.91
- type: DcVerse
  data:
    ref: dc.91.6
    scripture: doctrine-and-covenants
    name: D&C 91:6
    chapter: 91
    verse: 6
    ordinal: 2262
    text: And whoso receiveth not by the Spirit, cannot be benefited. Therefore it is not needful that it should be translated. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.91
- type: DcVerse
  data:
    ref: dc.92.1
    scripture: doctrine-and-covenants
    name: D&C 92:1
    chapter: 92
    verse: 1
    ordinal: 2263
    text: Verily, thus saith the Lord, I give unto the united order, organized agreeable to the commandment previously given, a revelation and commandment concerning my servant Frederick G. Williams, that ye shall receive him into the order. What I say unto one I say unto all.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.92
- type: DcVerse
  data:
    ref: dc.92.2
    scripture: doctrine-and-covenants
    name: D&C 92:2
    chapter: 92
    verse: 2
    ordinal: 2264
    text: And again, I say unto you my servant Frederick G. Williams, you shall be a lively member in this order; and inasmuch as you are faithful in keeping all former commandments you shall be blessed forever. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.92
- type: DcVerse
  data:
    ref: dc.93.1
    scripture: doctrine-and-covenants
    name: D&C 93:1
    chapter: 93
    verse: 1
    ordinal: 2265
    text: 'Verily, thus saith the Lord: It shall come to pass that every soul who forsaketh his sins and cometh unto me, and calleth on my name, and obeyeth my voice, and keepeth my commandments, shall see my face and know that I am;'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.93
- type: DcVerse
  data:
    ref: dc.93.2
    scripture: doctrine-and-covenants
    name: D&C 93:2
    chapter: 93
    verse: 2
    ordinal: 2266
    text: And that I am the true light that lighteth every man that cometh into the world;
    translation: 2013 edition
    original: ''
    kjvRefs:
    - John 1:9
    kjvOsis:
    - John.1.9
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.93
- type: DcVerse
  data:
    ref: dc.93.3
    scripture: doctrine-and-covenants
    name: D&C 93:3
    chapter: 93
    verse: 3
    ordinal: 2267
    text: And that I am in the Father, and the Father in me, and the Father and I are one—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.93
- type: DcVerse
  data:
    ref: dc.93.4
    scripture: doctrine-and-covenants
    name: D&C 93:4
    chapter: 93
    verse: 4
    ordinal: 2268
    text: The Father because he gave me of his fulness, and the Son because I was in the world and made flesh my tabernacle, and dwelt among the sons of men.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.93
- type: DcVerse
  data:
    ref: dc.93.5
    scripture: doctrine-and-covenants
    name: D&C 93:5
    chapter: 93
    verse: 5
    ordinal: 2269
    text: I was in the world and received of my Father, and the works of him were plainly manifest.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.93
- type: DcVerse
  data:
    ref: dc.93.6
    scripture: doctrine-and-covenants
    name: D&C 93:6
    chapter: 93
    verse: 6
    ordinal: 2270
    text: And John saw and bore record of the fulness of my glory, and the fulness of John's record is hereafter to be revealed.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.93
- type: DcVerse
  data:
    ref: dc.93.7
    scripture: doctrine-and-covenants
    name: D&C 93:7
    chapter: 93
    verse: 7
    ordinal: 2271
    text: 'And he bore record, saying: I saw his glory, that he was in the beginning, before the world was;'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.93
- type: DcVerse
  data:
    ref: dc.93.8
    scripture: doctrine-and-covenants
    name: D&C 93:8
    chapter: 93
    verse: 8
    ordinal: 2272
    text: Therefore, in the beginning the Word was, for he was the Word, even the messenger of salvation—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.93
- type: DcVerse
  data:
    ref: dc.93.9
    scripture: doctrine-and-covenants
    name: D&C 93:9
    chapter: 93
    verse: 9
    ordinal: 2273
    text: The light and the Redeemer of the world; the Spirit of truth, who came into the world, because the world was made by him, and in him was the life of men and the light of men.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.93
- type: DcVerse
  data:
    ref: dc.93.10
    scripture: doctrine-and-covenants
    name: D&C 93:10
    chapter: 93
    verse: 10
    ordinal: 2274
    text: The worlds were made by him; men were made by him; all things were made by him, and through him, and of him.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.93
- type: DcVerse
  data:
    ref: dc.93.11
    scripture: doctrine-and-covenants
    name: D&C 93:11
    chapter: 93
    verse: 11
    ordinal: 2275
    text: And I, John, bear record that I beheld his glory, as the glory of the Only Begotten of the Father, full of grace and truth, even the Spirit of truth, which came and dwelt in the flesh, and dwelt among us.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - John 1:14
    kjvAllusionOsis:
    - John.1.14
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.93
- type: DcVerse
  data:
    ref: dc.93.12
    scripture: doctrine-and-covenants
    name: D&C 93:12
    chapter: 93
    verse: 12
    ordinal: 2276
    text: And I, John, saw that he received not of the fulness at the first, but received grace for grace;
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - John 1:16
    kjvAllusionOsis:
    - John.1.16
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.93
- type: DcVerse
  data:
    ref: dc.93.13
    scripture: doctrine-and-covenants
    name: D&C 93:13
    chapter: 93
    verse: 13
    ordinal: 2277
    text: And he received not of the fulness at first, but continued from grace to grace, until he received a fulness;
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - John 1:16
    kjvAllusionOsis:
    - John.1.16
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.93
- type: DcVerse
  data:
    ref: dc.93.14
    scripture: doctrine-and-covenants
    name: D&C 93:14
    chapter: 93
    verse: 14
    ordinal: 2278
    text: And thus he was called the Son of God, because he received not of the fulness at the first.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.93
- type: DcVerse
  data:
    ref: dc.93.15
    scripture: doctrine-and-covenants
    name: D&C 93:15
    chapter: 93
    verse: 15
    ordinal: 2279
    text: 'And I, John, bear record, and lo, the heavens were opened, and the Holy Ghost descended upon him in the form of a dove, and sat upon him, and there came a voice out of heaven saying: This is my beloved Son.'
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Luke 3:22
    kjvAllusionOsis:
    - Luke.3.22
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.93
- type: DcVerse
  data:
    ref: dc.93.16
    scripture: doctrine-and-covenants
    name: D&C 93:16
    chapter: 93
    verse: 16
    ordinal: 2280
    text: And I, John, bear record that he received a fulness of the glory of the Father;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.93
- type: DcVerse
  data:
    ref: dc.93.17
    scripture: doctrine-and-covenants
    name: D&C 93:17
    chapter: 93
    verse: 17
    ordinal: 2281
    text: And he received all power, both in heaven and on earth, and the glory of the Father was with him, for he dwelt in him.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.93
- type: DcVerse
  data:
    ref: dc.93.18
    scripture: doctrine-and-covenants
    name: D&C 93:18
    chapter: 93
    verse: 18
    ordinal: 2282
    text: And it shall come to pass, that if you are faithful you shall receive the fulness of the record of John.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.93
- type: DcVerse
  data:
    ref: dc.93.19
    scripture: doctrine-and-covenants
    name: D&C 93:19
    chapter: 93
    verse: 19
    ordinal: 2283
    text: I give unto you these sayings that you may understand and know how to worship, and know what you worship, that you may come unto the Father in my name, and in due time receive of his fulness.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.93
- type: DcVerse
  data:
    ref: dc.93.20
    scripture: doctrine-and-covenants
    name: D&C 93:20
    chapter: 93
    verse: 20
    ordinal: 2284
    text: For if you keep my commandments you shall receive of his fulness, and be glorified in me as I am in the Father; therefore, I say unto you, you shall receive grace for grace.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.93
- type: DcVerse
  data:
    ref: dc.93.21
    scripture: doctrine-and-covenants
    name: D&C 93:21
    chapter: 93
    verse: 21
    ordinal: 2285
    text: And now, verily I say unto you, I was in the beginning with the Father, and am the Firstborn;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.93
- type: DcVerse
  data:
    ref: dc.93.22
    scripture: doctrine-and-covenants
    name: D&C 93:22
    chapter: 93
    verse: 22
    ordinal: 2286
    text: And all those who are begotten through me are partakers of the glory of the same, and are the church of the Firstborn.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.93
- type: DcVerse
  data:
    ref: dc.93.23
    scripture: doctrine-and-covenants
    name: D&C 93:23
    chapter: 93
    verse: 23
    ordinal: 2287
    text: Ye were also in the beginning with the Father; that which is Spirit, even the Spirit of truth;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.93
- type: DcVerse
  data:
    ref: dc.93.24
    scripture: doctrine-and-covenants
    name: D&C 93:24
    chapter: 93
    verse: 24
    ordinal: 2288
    text: And truth is knowledge of things as they are, and as they were, and as they are to come;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.93
- type: DcVerse
  data:
    ref: dc.93.25
    scripture: doctrine-and-covenants
    name: D&C 93:25
    chapter: 93
    verse: 25
    ordinal: 2289
    text: And whatsoever is more or less than this is the spirit of that wicked one who was a liar from the beginning.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.93
- type: DcVerse
  data:
    ref: dc.93.26
    scripture: doctrine-and-covenants
    name: D&C 93:26
    chapter: 93
    verse: 26
    ordinal: 2290
    text: 'The Spirit of truth is of God. I am the Spirit of truth, and John bore record of me, saying: He received a fulness of truth, yea, even of all truth;'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.93
- type: DcVerse
  data:
    ref: dc.93.27
    scripture: doctrine-and-covenants
    name: D&C 93:27
    chapter: 93
    verse: 27
    ordinal: 2291
    text: And no man receiveth a fulness unless he keepeth his commandments.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.93
- type: DcVerse
  data:
    ref: dc.93.28
    scripture: doctrine-and-covenants
    name: D&C 93:28
    chapter: 93
    verse: 28
    ordinal: 2292
    text: He that keepeth his commandments receiveth truth and light, until he is glorified in truth and knoweth all things.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - 1 John 2:4
    kjvAllusionOsis:
    - 1John.2.4
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.93
- type: DcVerse
  data:
    ref: dc.93.29
    scripture: doctrine-and-covenants
    name: D&C 93:29
    chapter: 93
    verse: 29
    ordinal: 2293
    text: Man was also in the beginning with God. Intelligence, or the light of truth, was not created or made, neither indeed can be.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.93
- type: DcVerse
  data:
    ref: dc.93.30
    scripture: doctrine-and-covenants
    name: D&C 93:30
    chapter: 93
    verse: 30
    ordinal: 2294
    text: All truth is independent in that sphere in which God has placed it, to act for itself, as all intelligence also; otherwise there is no existence.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.93
- type: DcVerse
  data:
    ref: dc.93.31
    scripture: doctrine-and-covenants
    name: D&C 93:31
    chapter: 93
    verse: 31
    ordinal: 2295
    text: Behold, here is the agency of man, and here is the condemnation of man; because that which was from the beginning is plainly manifest unto them, and they receive not the light.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.93
- type: DcVerse
  data:
    ref: dc.93.32
    scripture: doctrine-and-covenants
    name: D&C 93:32
    chapter: 93
    verse: 32
    ordinal: 2296
    text: And every man whose spirit receiveth not the light is under condemnation.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.93
- type: DcVerse
  data:
    ref: dc.93.33
    scripture: doctrine-and-covenants
    name: D&C 93:33
    chapter: 93
    verse: 33
    ordinal: 2297
    text: For man is spirit. The elements are eternal, and spirit and element, inseparably connected, receive a fulness of joy;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.93
- type: DcVerse
  data:
    ref: dc.93.34
    scripture: doctrine-and-covenants
    name: D&C 93:34
    chapter: 93
    verse: 34
    ordinal: 2298
    text: And when separated, man cannot receive a fulness of joy.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.93
- type: DcVerse
  data:
    ref: dc.93.35
    scripture: doctrine-and-covenants
    name: D&C 93:35
    chapter: 93
    verse: 35
    ordinal: 2299
    text: The elements are the tabernacle of God; yea, man is the tabernacle of God, even temples; and whatsoever temple is defiled, God shall destroy that temple.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.93
- type: DcVerse
  data:
    ref: dc.93.36
    scripture: doctrine-and-covenants
    name: D&C 93:36
    chapter: 93
    verse: 36
    ordinal: 2300
    text: The glory of God is intelligence, or, in other words, light and truth.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.93
- type: DcVerse
  data:
    ref: dc.93.37
    scripture: doctrine-and-covenants
    name: D&C 93:37
    chapter: 93
    verse: 37
    ordinal: 2301
    text: Light and truth forsake that evil one.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.93
- type: DcVerse
  data:
    ref: dc.93.38
    scripture: doctrine-and-covenants
    name: D&C 93:38
    chapter: 93
    verse: 38
    ordinal: 2302
    text: Every spirit of man was innocent in the beginning; and God having redeemed man from the fall, men became again, in their infant state, innocent before God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.93
- type: DcVerse
  data:
    ref: dc.93.39
    scripture: doctrine-and-covenants
    name: D&C 93:39
    chapter: 93
    verse: 39
    ordinal: 2303
    text: And that wicked one cometh and taketh away light and truth, through disobedience, from the children of men, and because of the tradition of their fathers.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.93
- type: DcVerse
  data:
    ref: dc.93.40
    scripture: doctrine-and-covenants
    name: D&C 93:40
    chapter: 93
    verse: 40
    ordinal: 2304
    text: But I have commanded you to bring up your children in light and truth.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.93
- type: DcVerse
  data:
    ref: dc.93.41
    scripture: doctrine-and-covenants
    name: D&C 93:41
    chapter: 93
    verse: 41
    ordinal: 2305
    text: But verily I say unto you, my servant Frederick G. Williams, you have continued under this condemnation;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.93
- type: DcVerse
  data:
    ref: dc.93.42
    scripture: doctrine-and-covenants
    name: D&C 93:42
    chapter: 93
    verse: 42
    ordinal: 2306
    text: You have not taught your children light and truth, according to the commandments; and that wicked one hath power, as yet, over you, and this is the cause of your affliction.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.93
- type: DcVerse
  data:
    ref: dc.93.43
    scripture: doctrine-and-covenants
    name: D&C 93:43
    chapter: 93
    verse: 43
    ordinal: 2307
    text: And now a commandment I give unto you—if you will be delivered you shall set in order your own house, for there are many things that are not right in your house.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.93
- type: DcVerse
  data:
    ref: dc.93.44
    scripture: doctrine-and-covenants
    name: D&C 93:44
    chapter: 93
    verse: 44
    ordinal: 2308
    text: Verily, I say unto my servant Sidney Rigdon, that in some things he hath not kept the commandments concerning his children; therefore, first set in order thy house.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.93
- type: DcVerse
  data:
    ref: dc.93.45
    scripture: doctrine-and-covenants
    name: D&C 93:45
    chapter: 93
    verse: 45
    ordinal: 2309
    text: Verily, I say unto my servant Joseph Smith, Jun., or in other words, I will call you friends, for you are my friends, and ye shall have an inheritance with me—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.93
- type: DcVerse
  data:
    ref: dc.93.46
    scripture: doctrine-and-covenants
    name: D&C 93:46
    chapter: 93
    verse: 46
    ordinal: 2310
    text: I called you servants for the world's sake, and ye are their servants for my sake—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.93
- type: DcVerse
  data:
    ref: dc.93.47
    scripture: doctrine-and-covenants
    name: D&C 93:47
    chapter: 93
    verse: 47
    ordinal: 2311
    text: And now, verily I say unto Joseph Smith, Jun.—You have not kept the commandments, and must needs stand rebuked before the Lord;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.93
- type: DcVerse
  data:
    ref: dc.93.48
    scripture: doctrine-and-covenants
    name: D&C 93:48
    chapter: 93
    verse: 48
    ordinal: 2312
    text: Your family must needs repent and forsake some things, and give more earnest heed unto your sayings, or be removed out of their place.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.93
- type: DcVerse
  data:
    ref: dc.93.49
    scripture: doctrine-and-covenants
    name: D&C 93:49
    chapter: 93
    verse: 49
    ordinal: 2313
    text: What I say unto one I say unto all; pray always lest that wicked one have power in you, and remove you out of your place.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.93
- type: DcVerse
  data:
    ref: dc.93.50
    scripture: doctrine-and-covenants
    name: D&C 93:50
    chapter: 93
    verse: 50
    ordinal: 2314
    text: My servant Newel K. Whitney also, a bishop of my church, hath need to be chastened, and set in order his family, and see that they are more diligent and concerned at home, and pray always, or they shall be removed out of their place.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.93
- type: DcVerse
  data:
    ref: dc.93.51
    scripture: doctrine-and-covenants
    name: D&C 93:51
    chapter: 93
    verse: 51
    ordinal: 2315
    text: Now, I say unto you, my friends, let my servant Sidney Rigdon go on his journey, and make haste, and also proclaim the acceptable year of the Lord, and the gospel of salvation, as I shall give him utterance; and by your prayer of faith with one consent I will uphold him.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.93
- type: DcVerse
  data:
    ref: dc.93.52
    scripture: doctrine-and-covenants
    name: D&C 93:52
    chapter: 93
    verse: 52
    ordinal: 2316
    text: And let my servants Joseph Smith, Jun., and Frederick G. Williams make haste also, and it shall be given them even according to the prayer of faith; and inasmuch as you keep my sayings you shall not be confounded in this world, nor in the world to come.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.93
- type: DcVerse
  data:
    ref: dc.93.53
    scripture: doctrine-and-covenants
    name: D&C 93:53
    chapter: 93
    verse: 53
    ordinal: 2317
    text: And, verily I say unto you, that it is my will that you should hasten to translate my scriptures, and to obtain a knowledge of history, and of countries, and of kingdoms, of laws of God and man, and all this for the salvation of Zion. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.93
- type: DcVerse
  data:
    ref: dc.94.1
    scripture: doctrine-and-covenants
    name: D&C 94:1
    chapter: 94
    verse: 1
    ordinal: 2318
    text: And again, verily I say unto you, my friends, a commandment I give unto you, that ye shall commence a work of laying out and preparing a beginning and foundation of the city of the stake of Zion, here in the land of Kirtland, beginning at my house.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.94
- type: DcVerse
  data:
    ref: dc.94.2
    scripture: doctrine-and-covenants
    name: D&C 94:2
    chapter: 94
    verse: 2
    ordinal: 2319
    text: And behold, it must be done according to the pattern which I have given unto you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.94
- type: DcVerse
  data:
    ref: dc.94.3
    scripture: doctrine-and-covenants
    name: D&C 94:3
    chapter: 94
    verse: 3
    ordinal: 2320
    text: And let the first lot on the south be consecrated unto me for the building of a house for the presidency, for the work of the presidency, in obtaining revelations; and for the work of the ministry of the presidency, in all things pertaining to the church and kingdom.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.94
- type: DcVerse
  data:
    ref: dc.94.4
    scripture: doctrine-and-covenants
    name: D&C 94:4
    chapter: 94
    verse: 4
    ordinal: 2321
    text: Verily I say unto you, that it shall be built fifty-five by sixty-five feet in the width thereof and in the length thereof, in the inner court.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.94
- type: DcVerse
  data:
    ref: dc.94.5
    scripture: doctrine-and-covenants
    name: D&C 94:5
    chapter: 94
    verse: 5
    ordinal: 2322
    text: And there shall be a lower court and a higher court, according to the pattern which shall be given unto you hereafter.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.94
- type: DcVerse
  data:
    ref: dc.94.6
    scripture: doctrine-and-covenants
    name: D&C 94:6
    chapter: 94
    verse: 6
    ordinal: 2323
    text: And it shall be dedicated unto the Lord from the foundation thereof, according to the order of the priesthood, according to the pattern which shall be given unto you hereafter.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.94
- type: DcVerse
  data:
    ref: dc.94.7
    scripture: doctrine-and-covenants
    name: D&C 94:7
    chapter: 94
    verse: 7
    ordinal: 2324
    text: And it shall be wholly dedicated unto the Lord for the work of the presidency.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.94
- type: DcVerse
  data:
    ref: dc.94.8
    scripture: doctrine-and-covenants
    name: D&C 94:8
    chapter: 94
    verse: 8
    ordinal: 2325
    text: And ye shall not suffer any unclean thing to come in unto it; and my glory shall be there, and my presence shall be there.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.94
- type: DcVerse
  data:
    ref: dc.94.9
    scripture: doctrine-and-covenants
    name: D&C 94:9
    chapter: 94
    verse: 9
    ordinal: 2326
    text: But if there shall come into it any unclean thing, my glory shall not be there; and my presence shall not come into it.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.94
- type: DcVerse
  data:
    ref: dc.94.10
    scripture: doctrine-and-covenants
    name: D&C 94:10
    chapter: 94
    verse: 10
    ordinal: 2327
    text: And again, verily I say unto you, the second lot on the south shall be dedicated unto me for the building of a house unto me, for the work of the printing of the translation of my scriptures, and all things whatsoever I shall command you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.94
- type: DcVerse
  data:
    ref: dc.94.11
    scripture: doctrine-and-covenants
    name: D&C 94:11
    chapter: 94
    verse: 11
    ordinal: 2328
    text: And it shall be fifty-five by sixty-five feet in the width thereof and the length thereof, in the inner court; and there shall be a lower and a higher court.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.94
- type: DcVerse
  data:
    ref: dc.94.12
    scripture: doctrine-and-covenants
    name: D&C 94:12
    chapter: 94
    verse: 12
    ordinal: 2329
    text: And this house shall be wholly dedicated unto the Lord from the foundation thereof, for the work of the printing, in all things whatsoever I shall command you, to be holy, undefiled, according to the pattern in all things as it shall be given unto you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.94
- type: DcVerse
  data:
    ref: dc.94.13
    scripture: doctrine-and-covenants
    name: D&C 94:13
    chapter: 94
    verse: 13
    ordinal: 2330
    text: And on the third lot shall my servant Hyrum Smith receive his inheritance.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.94
- type: DcVerse
  data:
    ref: dc.94.14
    scripture: doctrine-and-covenants
    name: D&C 94:14
    chapter: 94
    verse: 14
    ordinal: 2331
    text: And on the first and second lots on the north shall my servants Reynolds Cahoon and Jared Carter receive their inheritances—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.94
- type: DcVerse
  data:
    ref: dc.94.15
    scripture: doctrine-and-covenants
    name: D&C 94:15
    chapter: 94
    verse: 15
    ordinal: 2332
    text: That they may do the work which I have appointed unto them, to be a committee to build mine houses, according to the commandment, which I, the Lord God, have given unto you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.94
- type: DcVerse
  data:
    ref: dc.94.16
    scripture: doctrine-and-covenants
    name: D&C 94:16
    chapter: 94
    verse: 16
    ordinal: 2333
    text: These two houses are not to be built until I give unto you a commandment concerning them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.94
- type: DcVerse
  data:
    ref: dc.94.17
    scripture: doctrine-and-covenants
    name: D&C 94:17
    chapter: 94
    verse: 17
    ordinal: 2334
    text: And now I give unto you no more at this time. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.94
- type: DcVerse
  data:
    ref: dc.95.1
    scripture: doctrine-and-covenants
    name: D&C 95:1
    chapter: 95
    verse: 1
    ordinal: 2335
    text: Verily, thus saith the Lord unto you whom I love, and whom I love I also chasten that their sins may be forgiven, for with the chastisement I prepare a way for their deliverance in all things out of temptation, and I have loved you—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.95
- type: DcVerse
  data:
    ref: dc.95.2
    scripture: doctrine-and-covenants
    name: D&C 95:2
    chapter: 95
    verse: 2
    ordinal: 2336
    text: Wherefore, ye must needs be chastened and stand rebuked before my face;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.95
- type: DcVerse
  data:
    ref: dc.95.3
    scripture: doctrine-and-covenants
    name: D&C 95:3
    chapter: 95
    verse: 3
    ordinal: 2337
    text: For ye have sinned against me a very grievous sin, in that ye have not considered the great commandment in all things, that I have given unto you concerning the building of mine house;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.95
- type: DcVerse
  data:
    ref: dc.95.4
    scripture: doctrine-and-covenants
    name: D&C 95:4
    chapter: 95
    verse: 4
    ordinal: 2338
    text: For the preparation wherewith I design to prepare mine apostles to prune my vineyard for the last time, that I may bring to pass my strange act, that I may pour out my Spirit upon all flesh—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.95
- type: DcVerse
  data:
    ref: dc.95.5
    scripture: doctrine-and-covenants
    name: D&C 95:5
    chapter: 95
    verse: 5
    ordinal: 2339
    text: But behold, verily I say unto you, that there are many who have been ordained among you, whom I have called but few of them are chosen.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Matthew 22:14
    kjvAllusionOsis:
    - Matt.22.14
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.95
- type: DcVerse
  data:
    ref: dc.95.6
    scripture: doctrine-and-covenants
    name: D&C 95:6
    chapter: 95
    verse: 6
    ordinal: 2340
    text: They who are not chosen have sinned a very grievous sin, in that they are walking in darkness at noon-day.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.95
- type: DcVerse
  data:
    ref: dc.95.7
    scripture: doctrine-and-covenants
    name: D&C 95:7
    chapter: 95
    verse: 7
    ordinal: 2341
    text: And for this cause I gave unto you a commandment that you should call your solemn assembly, that your fastings and your mourning might come up into the ears of the Lord of Sabaoth, which is by interpretation, the creator of the first day, the beginning and the end.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.95
- type: DcVerse
  data:
    ref: dc.95.8
    scripture: doctrine-and-covenants
    name: D&C 95:8
    chapter: 95
    verse: 8
    ordinal: 2342
    text: Yea, verily I say unto you, I gave unto you a commandment that you should build a house, in the which house I design to endow those whom I have chosen with power from on high;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.95
- type: DcVerse
  data:
    ref: dc.95.9
    scripture: doctrine-and-covenants
    name: D&C 95:9
    chapter: 95
    verse: 9
    ordinal: 2343
    text: For this is the promise of the Father unto you; therefore I command you to tarry, even as mine apostles at Jerusalem.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.95
- type: DcVerse
  data:
    ref: dc.95.10
    scripture: doctrine-and-covenants
    name: D&C 95:10
    chapter: 95
    verse: 10
    ordinal: 2344
    text: Nevertheless, my servants sinned a very grievous sin; and contentions arose in the school of the prophets; which was very grievous unto me, saith your Lord; therefore I sent them forth to be chastened.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.95
- type: DcVerse
  data:
    ref: dc.95.11
    scripture: doctrine-and-covenants
    name: D&C 95:11
    chapter: 95
    verse: 11
    ordinal: 2345
    text: Verily I say unto you, it is my will that you should build a house. If you keep my commandments you shall have power to build it.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.95
- type: DcVerse
  data:
    ref: dc.95.12
    scripture: doctrine-and-covenants
    name: D&C 95:12
    chapter: 95
    verse: 12
    ordinal: 2346
    text: If you keep not my commandments, the love of the Father shall not continue with you, therefore you shall walk in darkness.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - John 14:15
    kjvAllusionOsis:
    - John.14.15
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.95
- type: DcVerse
  data:
    ref: dc.95.13
    scripture: doctrine-and-covenants
    name: D&C 95:13
    chapter: 95
    verse: 13
    ordinal: 2347
    text: Now here is wisdom, and the mind of the Lord—let the house be built, not after the manner of the world, for I give not unto you that ye shall live after the manner of the world;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.95
- type: DcVerse
  data:
    ref: dc.95.14
    scripture: doctrine-and-covenants
    name: D&C 95:14
    chapter: 95
    verse: 14
    ordinal: 2348
    text: Therefore, let it be built after the manner which I shall show unto three of you, whom ye shall appoint and ordain unto this power.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.95
- type: DcVerse
  data:
    ref: dc.95.15
    scripture: doctrine-and-covenants
    name: D&C 95:15
    chapter: 95
    verse: 15
    ordinal: 2349
    text: And the size thereof shall be fifty and five feet in width, and let it be sixty-five feet in length, in the inner court thereof.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.95
- type: DcVerse
  data:
    ref: dc.95.16
    scripture: doctrine-and-covenants
    name: D&C 95:16
    chapter: 95
    verse: 16
    ordinal: 2350
    text: And let the lower part of the inner court be dedicated unto me for your sacrament offering, and for your preaching, and your fasting, and your praying, and the offering up of your most holy desires unto me, saith your Lord.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.95
- type: DcVerse
  data:
    ref: dc.95.17
    scripture: doctrine-and-covenants
    name: D&C 95:17
    chapter: 95
    verse: 17
    ordinal: 2351
    text: And let the higher part of the inner court be dedicated unto me for the school of mine apostles, saith Son Ahman; or, in other words, Alphus; or, in other words, Omegus; even Jesus Christ your Lord. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.95
- type: DcVerse
  data:
    ref: dc.96.1
    scripture: doctrine-and-covenants
    name: D&C 96:1
    chapter: 96
    verse: 1
    ordinal: 2352
    text: Behold, I say unto you, here is wisdom, whereby ye may know how to act concerning this matter, for it is expedient in me that this stake that I have set for the strength of Zion should be made strong.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.96
- type: DcVerse
  data:
    ref: dc.96.2
    scripture: doctrine-and-covenants
    name: D&C 96:2
    chapter: 96
    verse: 2
    ordinal: 2353
    text: Therefore, let my servant Newel K. Whitney take charge of the place which is named among you, upon which I design to build mine holy house.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.96
- type: DcVerse
  data:
    ref: dc.96.3
    scripture: doctrine-and-covenants
    name: D&C 96:3
    chapter: 96
    verse: 3
    ordinal: 2354
    text: And again, let it be divided into lots, according to wisdom, for the benefit of those who seek inheritances, as it shall be determined in council among you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.96
- type: DcVerse
  data:
    ref: dc.96.4
    scripture: doctrine-and-covenants
    name: D&C 96:4
    chapter: 96
    verse: 4
    ordinal: 2355
    text: Therefore, take heed that ye see to this matter, and that portion that is necessary to benefit mine order, for the purpose of bringing forth my word to the children of men.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.96
- type: DcVerse
  data:
    ref: dc.96.5
    scripture: doctrine-and-covenants
    name: D&C 96:5
    chapter: 96
    verse: 5
    ordinal: 2356
    text: For behold, verily I say unto you, this is the most expedient in me, that my word should go forth unto the children of men, for the purpose of subduing the hearts of the children of men for your good. Even so. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.96
- type: DcVerse
  data:
    ref: dc.96.6
    scripture: doctrine-and-covenants
    name: D&C 96:6
    chapter: 96
    verse: 6
    ordinal: 2357
    text: And again, verily I say unto you, it is wisdom and expedient in me, that my servant John Johnson whose offering I have accepted, and whose prayers I have heard, unto whom I give a promise of eternal life inasmuch as he keepeth my commandments from henceforth—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.96
- type: DcVerse
  data:
    ref: dc.96.7
    scripture: doctrine-and-covenants
    name: D&C 96:7
    chapter: 96
    verse: 7
    ordinal: 2358
    text: For he is a descendant of Joseph and a partaker of the blessings of the promise made unto his fathers—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.96
- type: DcVerse
  data:
    ref: dc.96.8
    scripture: doctrine-and-covenants
    name: D&C 96:8
    chapter: 96
    verse: 8
    ordinal: 2359
    text: Verily I say unto you, it is expedient in me that he should become a member of the order, that he may assist in bringing forth my word unto the children of men.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.96
- type: DcVerse
  data:
    ref: dc.96.9
    scripture: doctrine-and-covenants
    name: D&C 96:9
    chapter: 96
    verse: 9
    ordinal: 2360
    text: Therefore ye shall ordain him unto this blessing, and he shall seek diligently to take away incumbrances that are upon the house named among you, that he may dwell therein. Even so. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.96
- type: DcVerse
  data:
    ref: dc.97.1
    scripture: doctrine-and-covenants
    name: D&C 97:1
    chapter: 97
    verse: 1
    ordinal: 2361
    text: Verily I say unto you my friends, I speak unto you with my voice, even the voice of my Spirit, that I may show unto you my will concerning your brethren in the land of Zion, many of whom are truly humble and are seeking diligently to learn wisdom and to find truth.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.97
- type: DcVerse
  data:
    ref: dc.97.2
    scripture: doctrine-and-covenants
    name: D&C 97:2
    chapter: 97
    verse: 2
    ordinal: 2362
    text: Verily, verily I say unto you, blessed are such, for they shall obtain; for I, the Lord, show mercy unto all the meek, and upon all whomsoever I will, that I may be justified when I shall bring them unto judgment.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Isaiah 30:18
    kjvAllusionOsis:
    - Isa.30.18
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.97
- type: DcVerse
  data:
    ref: dc.97.3
    scripture: doctrine-and-covenants
    name: D&C 97:3
    chapter: 97
    verse: 3
    ordinal: 2363
    text: Behold, I say unto you, concerning the school in Zion, I, the Lord, am well pleased that there should be a school in Zion, and also with my servant Parley P. Pratt, for he abideth in me.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.97
- type: DcVerse
  data:
    ref: dc.97.4
    scripture: doctrine-and-covenants
    name: D&C 97:4
    chapter: 97
    verse: 4
    ordinal: 2364
    text: And inasmuch as he continueth to abide in me he shall continue to preside over the school in the land of Zion until I shall give unto him other commandments.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.97
- type: DcVerse
  data:
    ref: dc.97.5
    scripture: doctrine-and-covenants
    name: D&C 97:5
    chapter: 97
    verse: 5
    ordinal: 2365
    text: And I will bless him with a multiplicity of blessings, in expounding all scriptures and mysteries to the edification of the school, and of the church in Zion.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.97
- type: DcVerse
  data:
    ref: dc.97.6
    scripture: doctrine-and-covenants
    name: D&C 97:6
    chapter: 97
    verse: 6
    ordinal: 2366
    text: And to the residue of the school, I, the Lord, am willing to show mercy; nevertheless, there are those that must needs be chastened, and their works shall be made known.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.97
- type: DcVerse
  data:
    ref: dc.97.7
    scripture: doctrine-and-covenants
    name: D&C 97:7
    chapter: 97
    verse: 7
    ordinal: 2367
    text: The ax is laid at the root of the trees; and every tree that bringeth not forth good fruit shall be hewn down and cast into the fire. I, the Lord, have spoken it.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Luke 3:9
    kjvOsis:
    - Luke.3.9
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.97
- type: DcVerse
  data:
    ref: dc.97.8
    scripture: doctrine-and-covenants
    name: D&C 97:8
    chapter: 97
    verse: 8
    ordinal: 2368
    text: Verily I say unto you, all among them who know their hearts are honest, and are broken, and their spirits contrite, and are willing to observe their covenants by sacrifice—yea, every sacrifice which I, the Lord, shall command—they are accepted of me.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.97
- type: DcVerse
  data:
    ref: dc.97.9
    scripture: doctrine-and-covenants
    name: D&C 97:9
    chapter: 97
    verse: 9
    ordinal: 2369
    text: For I, the Lord, will cause them to bring forth as a very fruitful tree which is planted in a goodly land, by a pure stream, that yieldeth much precious fruit.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.97
- type: DcVerse
  data:
    ref: dc.97.10
    scripture: doctrine-and-covenants
    name: D&C 97:10
    chapter: 97
    verse: 10
    ordinal: 2370
    text: Verily I say unto you, that it is my will that a house should be built unto me in the land of Zion, like unto the pattern which I have given you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.97
- type: DcVerse
  data:
    ref: dc.97.11
    scripture: doctrine-and-covenants
    name: D&C 97:11
    chapter: 97
    verse: 11
    ordinal: 2371
    text: Yea, let it be built speedily, by the tithing of my people.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.97
- type: DcVerse
  data:
    ref: dc.97.12
    scripture: doctrine-and-covenants
    name: D&C 97:12
    chapter: 97
    verse: 12
    ordinal: 2372
    text: Behold, this is the tithing and the sacrifice which I, the Lord, require at their hands, that there may be a house built unto me for the salvation of Zion—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.97
- type: DcVerse
  data:
    ref: dc.97.13
    scripture: doctrine-and-covenants
    name: D&C 97:13
    chapter: 97
    verse: 13
    ordinal: 2373
    text: For a place of thanksgiving for all saints, and for a place of instruction for all those who are called to the work of the ministry in all their several callings and offices;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.97
- type: DcVerse
  data:
    ref: dc.97.14
    scripture: doctrine-and-covenants
    name: D&C 97:14
    chapter: 97
    verse: 14
    ordinal: 2374
    text: That they may be perfected in the understanding of their ministry, in theory, in principle, and in doctrine, in all things pertaining to the kingdom of God on the earth, the keys of which kingdom have been conferred upon you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.97
- type: DcVerse
  data:
    ref: dc.97.15
    scripture: doctrine-and-covenants
    name: D&C 97:15
    chapter: 97
    verse: 15
    ordinal: 2375
    text: And inasmuch as my people build a house unto me in the name of the Lord, and do not suffer any unclean thing to come into it, that it be not defiled, my glory shall rest upon it;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.97
- type: DcVerse
  data:
    ref: dc.97.16
    scripture: doctrine-and-covenants
    name: D&C 97:16
    chapter: 97
    verse: 16
    ordinal: 2376
    text: Yea, and my presence shall be there, for I will come into it, and all the pure in heart that shall come into it shall see God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.97
- type: DcVerse
  data:
    ref: dc.97.17
    scripture: doctrine-and-covenants
    name: D&C 97:17
    chapter: 97
    verse: 17
    ordinal: 2377
    text: But if it be defiled I will not come into it, and my glory shall not be there; for I will not come into unholy temples.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.97
- type: DcVerse
  data:
    ref: dc.97.18
    scripture: doctrine-and-covenants
    name: D&C 97:18
    chapter: 97
    verse: 18
    ordinal: 2378
    text: And, now, behold, if Zion do these things she shall prosper, and spread herself and become very glorious, very great, and very terrible.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.97
- type: DcVerse
  data:
    ref: dc.97.19
    scripture: doctrine-and-covenants
    name: D&C 97:19
    chapter: 97
    verse: 19
    ordinal: 2379
    text: 'And the nations of the earth shall honor her, and shall say: Surely Zion is the city of our God, and surely Zion cannot fall, neither be moved out of her place, for God is there, and the hand of the Lord is there;'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.97
- type: DcVerse
  data:
    ref: dc.97.20
    scripture: doctrine-and-covenants
    name: D&C 97:20
    chapter: 97
    verse: 20
    ordinal: 2380
    text: And he hath sworn by the power of his might to be her salvation and her high tower.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.97
- type: DcVerse
  data:
    ref: dc.97.21
    scripture: doctrine-and-covenants
    name: D&C 97:21
    chapter: 97
    verse: 21
    ordinal: 2381
    text: Therefore, verily, thus saith the Lord, let Zion rejoice, for this is Zion—THE PURE IN HEART; therefore, let Zion rejoice, while all the wicked shall mourn.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.97
- type: DcVerse
  data:
    ref: dc.97.22
    scripture: doctrine-and-covenants
    name: D&C 97:22
    chapter: 97
    verse: 22
    ordinal: 2382
    text: For behold, and lo, vengeance cometh speedily upon the ungodly as the whirlwind; and who shall escape it?
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.97
- type: DcVerse
  data:
    ref: dc.97.23
    scripture: doctrine-and-covenants
    name: D&C 97:23
    chapter: 97
    verse: 23
    ordinal: 2383
    text: The Lord's scourge shall pass over by night and by day, and the report thereof shall vex all people; yea, it shall not be stayed until the Lord come;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.97
- type: DcVerse
  data:
    ref: dc.97.24
    scripture: doctrine-and-covenants
    name: D&C 97:24
    chapter: 97
    verse: 24
    ordinal: 2384
    text: For the indignation of the Lord is kindled against their abominations and all their wicked works.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.97
- type: DcVerse
  data:
    ref: dc.97.25
    scripture: doctrine-and-covenants
    name: D&C 97:25
    chapter: 97
    verse: 25
    ordinal: 2385
    text: Nevertheless, Zion shall escape if she observe to do all things whatsoever I have commanded her.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.97
- type: DcVerse
  data:
    ref: dc.97.26
    scripture: doctrine-and-covenants
    name: D&C 97:26
    chapter: 97
    verse: 26
    ordinal: 2386
    text: But if she observe not to do whatsoever I have commanded her, I will visit her according to all her works, with sore affliction, with pestilence, with plague, with sword, with vengeance, with devouring fire.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.97
- type: DcVerse
  data:
    ref: dc.97.27
    scripture: doctrine-and-covenants
    name: D&C 97:27
    chapter: 97
    verse: 27
    ordinal: 2387
    text: Nevertheless, let it be read this once to her ears, that I, the Lord, have accepted of her offering; and if she sin no more none of these things shall come upon her;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.97
- type: DcVerse
  data:
    ref: dc.97.28
    scripture: doctrine-and-covenants
    name: D&C 97:28
    chapter: 97
    verse: 28
    ordinal: 2388
    text: And I will bless her with blessings, and multiply a multiplicity of blessings upon her, and upon her generations forever and ever, saith the Lord your God. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.97
- type: DcVerse
  data:
    ref: dc.98.1
    scripture: doctrine-and-covenants
    name: D&C 98:1
    chapter: 98
    verse: 1
    ordinal: 2389
    text: Verily I say unto you my friends, fear not, let your hearts be comforted; yea, rejoice evermore, and in everything give thanks;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.98
- type: DcVerse
  data:
    ref: dc.98.2
    scripture: doctrine-and-covenants
    name: D&C 98:2
    chapter: 98
    verse: 2
    ordinal: 2390
    text: Waiting patiently on the Lord, for your prayers have entered into the ears of the Lord of Sabaoth, and are recorded with this seal and testament—the Lord hath sworn and decreed that they shall be granted.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.98
- type: DcVerse
  data:
    ref: dc.98.3
    scripture: doctrine-and-covenants
    name: D&C 98:3
    chapter: 98
    verse: 3
    ordinal: 2391
    text: Therefore, he giveth this promise unto you, with an immutable covenant that they shall be fulfilled; and all things wherewith you have been afflicted shall work together for your good, and to my name's glory, saith the Lord.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.98
- type: DcVerse
  data:
    ref: dc.98.4
    scripture: doctrine-and-covenants
    name: D&C 98:4
    chapter: 98
    verse: 4
    ordinal: 2392
    text: And now, verily I say unto you concerning the laws of the land, it is my will that my people should observe to do all things whatsoever I command them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.98
- type: DcVerse
  data:
    ref: dc.98.5
    scripture: doctrine-and-covenants
    name: D&C 98:5
    chapter: 98
    verse: 5
    ordinal: 2393
    text: And that law of the land which is constitutional, supporting that principle of freedom in maintaining rights and privileges, belongs to all mankind, and is justifiable before me.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.98
- type: DcVerse
  data:
    ref: dc.98.6
    scripture: doctrine-and-covenants
    name: D&C 98:6
    chapter: 98
    verse: 6
    ordinal: 2394
    text: Therefore, I, the Lord, justify you, and your brethren of my church, in befriending that law which is the constitutional law of the land;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.98
- type: DcVerse
  data:
    ref: dc.98.7
    scripture: doctrine-and-covenants
    name: D&C 98:7
    chapter: 98
    verse: 7
    ordinal: 2395
    text: And as pertaining to law of man, whatsoever is more or less than this, cometh of evil.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.98
- type: DcVerse
  data:
    ref: dc.98.8
    scripture: doctrine-and-covenants
    name: D&C 98:8
    chapter: 98
    verse: 8
    ordinal: 2396
    text: I, the Lord God, make you free, therefore ye are free indeed; and the law also maketh you free.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - John 8:36
    kjvAllusionOsis:
    - John.8.36
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.98
- type: DcVerse
  data:
    ref: dc.98.9
    scripture: doctrine-and-covenants
    name: D&C 98:9
    chapter: 98
    verse: 9
    ordinal: 2397
    text: Nevertheless, when the wicked rule the people mourn.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Proverbs 29:2
    kjvAllusionOsis:
    - Prov.29.2
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.98
- type: DcVerse
  data:
    ref: dc.98.10
    scripture: doctrine-and-covenants
    name: D&C 98:10
    chapter: 98
    verse: 10
    ordinal: 2398
    text: Wherefore, honest men and wise men should be sought for diligently, and good men and wise men ye should observe to uphold; otherwise whatsoever is less than these cometh of evil.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.98
- type: DcVerse
  data:
    ref: dc.98.11
    scripture: doctrine-and-covenants
    name: D&C 98:11
    chapter: 98
    verse: 11
    ordinal: 2399
    text: And I give unto you a commandment, that ye shall forsake all evil and cleave unto all good, that ye shall live by every word which proceedeth forth out of the mouth of God.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Matthew 4:4
    kjvAllusionOsis:
    - Matt.4.4
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.98
- type: DcVerse
  data:
    ref: dc.98.12
    scripture: doctrine-and-covenants
    name: D&C 98:12
    chapter: 98
    verse: 12
    ordinal: 2400
    text: For he will give unto the faithful line upon line, precept upon precept; and I will try you and prove you herewith.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.98
- type: DcVerse
  data:
    ref: dc.98.13
    scripture: doctrine-and-covenants
    name: D&C 98:13
    chapter: 98
    verse: 13
    ordinal: 2401
    text: And whoso layeth down his life in my cause, for my name's sake, shall find it again, even life eternal.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.98
- type: DcVerse
  data:
    ref: dc.98.14
    scripture: doctrine-and-covenants
    name: D&C 98:14
    chapter: 98
    verse: 14
    ordinal: 2402
    text: Therefore, be not afraid of your enemies, for I have decreed in my heart, saith the Lord, that I will prove you in all things, whether you will abide in my covenant, even unto death, that you may be found worthy.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.98
- type: DcVerse
  data:
    ref: dc.98.15
    scripture: doctrine-and-covenants
    name: D&C 98:15
    chapter: 98
    verse: 15
    ordinal: 2403
    text: For if ye will not abide in my covenant ye are not worthy of me.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.98
- type: DcVerse
  data:
    ref: dc.98.16
    scripture: doctrine-and-covenants
    name: D&C 98:16
    chapter: 98
    verse: 16
    ordinal: 2404
    text: Therefore, renounce war and proclaim peace, and seek diligently to turn the hearts of the children to their fathers, and the hearts of the fathers to the children;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.98
- type: DcVerse
  data:
    ref: dc.98.17
    scripture: doctrine-and-covenants
    name: D&C 98:17
    chapter: 98
    verse: 17
    ordinal: 2405
    text: And again, the hearts of the Jews unto the prophets, and the prophets unto the Jews; lest I come and smite the whole earth with a curse, and all flesh be consumed before me.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Malachi 4:6
    kjvAllusionOsis:
    - Mal.4.6
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.98
- type: DcVerse
  data:
    ref: dc.98.18
    scripture: doctrine-and-covenants
    name: D&C 98:18
    chapter: 98
    verse: 18
    ordinal: 2406
    text: Let not your hearts be troubled; for in my Father's house are many mansions, and I have prepared a place for you; and where my Father and I am, there ye shall be also.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.98
- type: DcVerse
  data:
    ref: dc.98.19
    scripture: doctrine-and-covenants
    name: D&C 98:19
    chapter: 98
    verse: 19
    ordinal: 2407
    text: Behold, I, the Lord, am not well pleased with many who are in the church at Kirtland;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.98
- type: DcVerse
  data:
    ref: dc.98.20
    scripture: doctrine-and-covenants
    name: D&C 98:20
    chapter: 98
    verse: 20
    ordinal: 2408
    text: For they do not forsake their sins, and their wicked ways, the pride of their hearts, and their covetousness, and all their detestable things, and observe the words of wisdom and eternal life which I have given unto them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.98
- type: DcVerse
  data:
    ref: dc.98.21
    scripture: doctrine-and-covenants
    name: D&C 98:21
    chapter: 98
    verse: 21
    ordinal: 2409
    text: Verily I say unto you, that I, the Lord, will chasten them and will do whatsoever I list, if they do not repent and observe all things whatsoever I have said unto them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.98
- type: DcVerse
  data:
    ref: dc.98.22
    scripture: doctrine-and-covenants
    name: D&C 98:22
    chapter: 98
    verse: 22
    ordinal: 2410
    text: And again I say unto you, if ye observe to do whatsoever I command you, I, the Lord, will turn away all wrath and indignation from you, and the gates of hell shall not prevail against you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.98
- type: DcVerse
  data:
    ref: dc.98.23
    scripture: doctrine-and-covenants
    name: D&C 98:23
    chapter: 98
    verse: 23
    ordinal: 2411
    text: Now, I speak unto you concerning your families—if men will smite you, or your families, once, and ye bear it patiently and revile not against them, neither seek revenge, ye shall be rewarded;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.98
- type: DcVerse
  data:
    ref: dc.98.24
    scripture: doctrine-and-covenants
    name: D&C 98:24
    chapter: 98
    verse: 24
    ordinal: 2412
    text: But if ye bear it not patiently, it shall be accounted unto you as being meted out as a just measure unto you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.98
- type: DcVerse
  data:
    ref: dc.98.25
    scripture: doctrine-and-covenants
    name: D&C 98:25
    chapter: 98
    verse: 25
    ordinal: 2413
    text: And again, if your enemy shall smite you the second time, and you revile not against your enemy, and bear it patiently, your reward shall be an hundred-fold.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.98
- type: DcVerse
  data:
    ref: dc.98.26
    scripture: doctrine-and-covenants
    name: D&C 98:26
    chapter: 98
    verse: 26
    ordinal: 2414
    text: And again, if he shall smite you the third time, and ye bear it patiently, your reward shall be doubled unto you four-fold;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.98
- type: DcVerse
  data:
    ref: dc.98.27
    scripture: doctrine-and-covenants
    name: D&C 98:27
    chapter: 98
    verse: 27
    ordinal: 2415
    text: And these three testimonies shall stand against your enemy if he repent not, and shall not be blotted out.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.98
- type: DcVerse
  data:
    ref: dc.98.28
    scripture: doctrine-and-covenants
    name: D&C 98:28
    chapter: 98
    verse: 28
    ordinal: 2416
    text: And now, verily I say unto you, if that enemy shall escape my vengeance, that he be not brought into judgment before me, then ye shall see to it that ye warn him in my name, that he come no more upon you, neither upon your family, even your children's children unto the third and fourth generation.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.98
- type: DcVerse
  data:
    ref: dc.98.29
    scripture: doctrine-and-covenants
    name: D&C 98:29
    chapter: 98
    verse: 29
    ordinal: 2417
    text: And then, if he shall come upon you or your children, or your children's children unto the third and fourth generation, I have delivered thine enemy into thine hands;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.98
- type: DcVerse
  data:
    ref: dc.98.30
    scripture: doctrine-and-covenants
    name: D&C 98:30
    chapter: 98
    verse: 30
    ordinal: 2418
    text: And then if thou wilt spare him, thou shalt be rewarded for thy righteousness; and also thy children and thy children's children unto the third and fourth generation.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.98
- type: DcVerse
  data:
    ref: dc.98.31
    scripture: doctrine-and-covenants
    name: D&C 98:31
    chapter: 98
    verse: 31
    ordinal: 2419
    text: Nevertheless, thine enemy is in thine hands; and if thou rewardest him according to his works thou art justified; if he has sought thy life, and thy life is endangered by him, thine enemy is in thine hands and thou art justified.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.98
- type: DcVerse
  data:
    ref: dc.98.32
    scripture: doctrine-and-covenants
    name: D&C 98:32
    chapter: 98
    verse: 32
    ordinal: 2420
    text: Behold, this is the law I gave unto my servant Nephi, and thy fathers, Joseph, and Jacob, and Isaac, and Abraham, and all mine ancient prophets and apostles.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.98
- type: DcVerse
  data:
    ref: dc.98.33
    scripture: doctrine-and-covenants
    name: D&C 98:33
    chapter: 98
    verse: 33
    ordinal: 2421
    text: And again, this is the law that I gave unto mine ancients, that they should not go out unto battle against any nation, kindred, tongue, or people, save I, the Lord, commanded them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.98
- type: DcVerse
  data:
    ref: dc.98.34
    scripture: doctrine-and-covenants
    name: D&C 98:34
    chapter: 98
    verse: 34
    ordinal: 2422
    text: And if any nation, tongue, or people should proclaim war against them, they should first lift a standard of peace unto that people, nation, or tongue;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.98
- type: DcVerse
  data:
    ref: dc.98.35
    scripture: doctrine-and-covenants
    name: D&C 98:35
    chapter: 98
    verse: 35
    ordinal: 2423
    text: And if that people did not accept the offering of peace, neither the second nor the third time, they should bring these testimonies before the Lord;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.98
- type: DcVerse
  data:
    ref: dc.98.36
    scripture: doctrine-and-covenants
    name: D&C 98:36
    chapter: 98
    verse: 36
    ordinal: 2424
    text: Then I, the Lord, would give unto them a commandment, and justify them in going out to battle against that nation, tongue, or people.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.98
- type: DcVerse
  data:
    ref: dc.98.37
    scripture: doctrine-and-covenants
    name: D&C 98:37
    chapter: 98
    verse: 37
    ordinal: 2425
    text: And I, the Lord, would fight their battles, and their children's battles, and their children's children's, until they had avenged themselves on all their enemies, to the third and fourth generation.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.98
- type: DcVerse
  data:
    ref: dc.98.38
    scripture: doctrine-and-covenants
    name: D&C 98:38
    chapter: 98
    verse: 38
    ordinal: 2426
    text: Behold, this is an ensample unto all people, saith the Lord your God, for justification before me.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.98
- type: DcVerse
  data:
    ref: dc.98.39
    scripture: doctrine-and-covenants
    name: D&C 98:39
    chapter: 98
    verse: 39
    ordinal: 2427
    text: And again, verily I say unto you, if after thine enemy has come upon thee the first time, he repent and come unto thee praying thy forgiveness, thou shalt forgive him, and shalt hold it no more as a testimony against thine enemy—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.98
- type: DcVerse
  data:
    ref: dc.98.40
    scripture: doctrine-and-covenants
    name: D&C 98:40
    chapter: 98
    verse: 40
    ordinal: 2428
    text: And so on unto the second and third time; and as oft as thine enemy repenteth of the trespass wherewith he has trespassed against thee, thou shalt forgive him, until seventy times seven.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.98
- type: DcVerse
  data:
    ref: dc.98.41
    scripture: doctrine-and-covenants
    name: D&C 98:41
    chapter: 98
    verse: 41
    ordinal: 2429
    text: And if he trespass against thee and repent not the first time, nevertheless thou shalt forgive him.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Luke 17:4
    kjvAllusionOsis:
    - Luke.17.4
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.98
- type: DcVerse
  data:
    ref: dc.98.42
    scripture: doctrine-and-covenants
    name: D&C 98:42
    chapter: 98
    verse: 42
    ordinal: 2430
    text: And if he trespass against thee the second time, and repent not, nevertheless thou shalt forgive him.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Luke 17:4
    kjvAllusionOsis:
    - Luke.17.4
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.98
- type: DcVerse
  data:
    ref: dc.98.43
    scripture: doctrine-and-covenants
    name: D&C 98:43
    chapter: 98
    verse: 43
    ordinal: 2431
    text: And if he trespass against thee the third time, and repent not, thou shalt also forgive him.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Luke 17:4
    kjvAllusionOsis:
    - Luke.17.4
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.98
- type: DcVerse
  data:
    ref: dc.98.44
    scripture: doctrine-and-covenants
    name: D&C 98:44
    chapter: 98
    verse: 44
    ordinal: 2432
    text: But if he trespass against thee the fourth time thou shalt not forgive him, but shalt bring these testimonies before the Lord; and they shall not be blotted out until he repent and reward thee four-fold in all things wherewith he has trespassed against thee.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.98
- type: DcVerse
  data:
    ref: dc.98.45
    scripture: doctrine-and-covenants
    name: D&C 98:45
    chapter: 98
    verse: 45
    ordinal: 2433
    text: And if he do this, thou shalt forgive him with all thine heart; and if he do not this, I, the Lord, will avenge thee of thine enemy an hundred-fold;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.98
- type: DcVerse
  data:
    ref: dc.98.46
    scripture: doctrine-and-covenants
    name: D&C 98:46
    chapter: 98
    verse: 46
    ordinal: 2434
    text: And upon his children, and upon his children's children of all them that hate me, unto the third and fourth generation.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Deuteronomy 5:9
    kjvAllusionOsis:
    - Deut.5.9
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.98
- type: DcVerse
  data:
    ref: dc.98.47
    scripture: doctrine-and-covenants
    name: D&C 98:47
    chapter: 98
    verse: 47
    ordinal: 2435
    text: But if the children shall repent, or the children's children, and turn to the Lord their God, with all their hearts and with all their might, mind, and strength, and restore four-fold for all their trespasses wherewith they have trespassed, or wherewith their fathers have trespassed, or their fathers' fathers, then thine indignation shall be turned away;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.98
- type: DcVerse
  data:
    ref: dc.98.48
    scripture: doctrine-and-covenants
    name: D&C 98:48
    chapter: 98
    verse: 48
    ordinal: 2436
    text: And vengeance shall no more come upon them, saith the Lord thy God, and their trespasses shall never be brought any more as a testimony before the Lord against them. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.98
- type: DcVerse
  data:
    ref: dc.99.1
    scripture: doctrine-and-covenants
    name: D&C 99:1
    chapter: 99
    verse: 1
    ordinal: 2437
    text: Behold, thus saith the Lord unto my servant John Murdock—thou art called to go into the eastern countries from house to house, from village to village, and from city to city, to proclaim mine everlasting gospel unto the inhabitants thereof, in the midst of persecution and wickedness.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.99
- type: DcVerse
  data:
    ref: dc.99.2
    scripture: doctrine-and-covenants
    name: D&C 99:2
    chapter: 99
    verse: 2
    ordinal: 2438
    text: And who receiveth you receiveth me; and you shall have power to declare my word in the demonstration of my Holy Spirit.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.99
- type: DcVerse
  data:
    ref: dc.99.3
    scripture: doctrine-and-covenants
    name: D&C 99:3
    chapter: 99
    verse: 3
    ordinal: 2439
    text: And who receiveth you as a little child, receiveth my kingdom; and blessed are they, for they shall obtain mercy.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Matthew 5:7
    kjvAllusionOsis:
    - Matt.5.7
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.99
- type: DcVerse
  data:
    ref: dc.99.4
    scripture: doctrine-and-covenants
    name: D&C 99:4
    chapter: 99
    verse: 4
    ordinal: 2440
    text: And whoso rejecteth you shall be rejected of my Father and his house; and you shall cleanse your feet in the secret places by the way for a testimony against them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.99
- type: DcVerse
  data:
    ref: dc.99.5
    scripture: doctrine-and-covenants
    name: D&C 99:5
    chapter: 99
    verse: 5
    ordinal: 2441
    text: And behold, and lo, I come quickly to judgment, to convince all of their ungodly deeds which they have committed against me, as it is written of me in the volume of the book.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Psalms 40:7
    kjvAllusionOsis:
    - Ps.40.7
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.99
- type: DcVerse
  data:
    ref: dc.99.6
    scripture: doctrine-and-covenants
    name: D&C 99:6
    chapter: 99
    verse: 6
    ordinal: 2442
    text: And now, verily I say unto you, that it is not expedient that you should go until your children are provided for, and sent up kindly unto the bishop of Zion.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.99
- type: DcVerse
  data:
    ref: dc.99.7
    scripture: doctrine-and-covenants
    name: D&C 99:7
    chapter: 99
    verse: 7
    ordinal: 2443
    text: And after a few years, if thou desirest of me, thou mayest go up also unto the goodly land, to possess thine inheritance;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.99
- type: DcVerse
  data:
    ref: dc.99.8
    scripture: doctrine-and-covenants
    name: D&C 99:8
    chapter: 99
    verse: 8
    ordinal: 2444
    text: Otherwise thou shalt continue proclaiming my gospel until thou be taken. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.99
- type: DcVerse
  data:
    ref: dc.100.1
    scripture: doctrine-and-covenants
    name: D&C 100:1
    chapter: 100
    verse: 1
    ordinal: 2445
    text: Verily, thus saith the Lord unto you, my friends Sidney and Joseph, your families are well; they are in mine hands, and I will do with them as seemeth me good; for in me there is all power.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.100
- type: DcVerse
  data:
    ref: dc.100.2
    scripture: doctrine-and-covenants
    name: D&C 100:2
    chapter: 100
    verse: 2
    ordinal: 2446
    text: Therefore, follow me, and listen to the counsel which I shall give unto you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.100
- type: DcVerse
  data:
    ref: dc.100.3
    scripture: doctrine-and-covenants
    name: D&C 100:3
    chapter: 100
    verse: 3
    ordinal: 2447
    text: Behold, and lo, I have much people in this place, in the regions round about; and an effectual door shall be opened in the regions round about in this eastern land.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.100
- type: DcVerse
  data:
    ref: dc.100.4
    scripture: doctrine-and-covenants
    name: D&C 100:4
    chapter: 100
    verse: 4
    ordinal: 2448
    text: Therefore, I, the Lord, have suffered you to come unto this place; for thus it was expedient in me for the salvation of souls.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.100
- type: DcVerse
  data:
    ref: dc.100.5
    scripture: doctrine-and-covenants
    name: D&C 100:5
    chapter: 100
    verse: 5
    ordinal: 2449
    text: Therefore, verily I say unto you, lift up your voices unto this people; speak the thoughts that I shall put into your hearts, and you shall not be confounded before men;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.100
- type: DcVerse
  data:
    ref: dc.100.6
    scripture: doctrine-and-covenants
    name: D&C 100:6
    chapter: 100
    verse: 6
    ordinal: 2450
    text: For it shall be given you in the very hour, yea, in the very moment, what ye shall say.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.100
- type: DcVerse
  data:
    ref: dc.100.7
    scripture: doctrine-and-covenants
    name: D&C 100:7
    chapter: 100
    verse: 7
    ordinal: 2451
    text: But a commandment I give unto you, that ye shall declare whatsoever thing ye declare in my name, in solemnity of heart, in the spirit of meekness, in all things.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.100
- type: DcVerse
  data:
    ref: dc.100.8
    scripture: doctrine-and-covenants
    name: D&C 100:8
    chapter: 100
    verse: 8
    ordinal: 2452
    text: And I give unto you this promise, that inasmuch as ye do this the Holy Ghost shall be shed forth in bearing record unto all things whatsoever ye shall say.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.100
- type: DcVerse
  data:
    ref: dc.100.9
    scripture: doctrine-and-covenants
    name: D&C 100:9
    chapter: 100
    verse: 9
    ordinal: 2453
    text: And it is expedient in me that you, my servant Sidney, should be a spokesman unto this people; yea, verily, I will ordain you unto this calling, even to be a spokesman unto my servant Joseph.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.100
- type: DcVerse
  data:
    ref: dc.100.10
    scripture: doctrine-and-covenants
    name: D&C 100:10
    chapter: 100
    verse: 10
    ordinal: 2454
    text: And I will give unto him power to be mighty in testimony.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.100
- type: DcVerse
  data:
    ref: dc.100.11
    scripture: doctrine-and-covenants
    name: D&C 100:11
    chapter: 100
    verse: 11
    ordinal: 2455
    text: And I will give unto thee power to be mighty in expounding all scriptures, that thou mayest be a spokesman unto him, and he shall be a revelator unto thee, that thou mayest know the certainty of all things pertaining to the things of my kingdom on the earth.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.100
- type: DcVerse
  data:
    ref: dc.100.12
    scripture: doctrine-and-covenants
    name: D&C 100:12
    chapter: 100
    verse: 12
    ordinal: 2456
    text: Therefore, continue your journey and let your hearts rejoice; for behold, and lo, I am with you even unto the end.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.100
- type: DcVerse
  data:
    ref: dc.100.13
    scripture: doctrine-and-covenants
    name: D&C 100:13
    chapter: 100
    verse: 13
    ordinal: 2457
    text: And now I give unto you a word concerning Zion. Zion shall be redeemed, although she is chastened for a little season.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.100
- type: DcVerse
  data:
    ref: dc.100.14
    scripture: doctrine-and-covenants
    name: D&C 100:14
    chapter: 100
    verse: 14
    ordinal: 2458
    text: Thy brethren, my servants Orson Hyde and John Gould, are in my hands; and inasmuch as they keep my commandments they shall be saved.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.100
- type: DcVerse
  data:
    ref: dc.100.15
    scripture: doctrine-and-covenants
    name: D&C 100:15
    chapter: 100
    verse: 15
    ordinal: 2459
    text: Therefore, let your hearts be comforted; for all things shall work together for good to them that walk uprightly, and to the sanctification of the church.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.100
- type: DcVerse
  data:
    ref: dc.100.16
    scripture: doctrine-and-covenants
    name: D&C 100:16
    chapter: 100
    verse: 16
    ordinal: 2460
    text: For I will raise up unto myself a pure people, that will serve me in righteousness;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.100
- type: DcVerse
  data:
    ref: dc.100.17
    scripture: doctrine-and-covenants
    name: D&C 100:17
    chapter: 100
    verse: 17
    ordinal: 2461
    text: And all that call upon the name of the Lord, and keep his commandments, shall be saved. Even so. Amen.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Romans 10:13
    kjvAllusionOsis:
    - Rom.10.13
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.100
- type: DcVerse
  data:
    ref: dc.101.1
    scripture: doctrine-and-covenants
    name: D&C 101:1
    chapter: 101
    verse: 1
    ordinal: 2462
    text: Verily I say unto you, concerning your brethren who have been afflicted, and persecuted, and cast out from the land of their inheritance—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.2
    scripture: doctrine-and-covenants
    name: D&C 101:2
    chapter: 101
    verse: 2
    ordinal: 2463
    text: I, the Lord, have suffered the affliction to come upon them, wherewith they have been afflicted, in consequence of their transgressions;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.3
    scripture: doctrine-and-covenants
    name: D&C 101:3
    chapter: 101
    verse: 3
    ordinal: 2464
    text: Yet I will own them, and they shall be mine in that day when I shall come to make up my jewels.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.4
    scripture: doctrine-and-covenants
    name: D&C 101:4
    chapter: 101
    verse: 4
    ordinal: 2465
    text: Therefore, they must needs be chastened and tried, even as Abraham, who was commanded to offer up his only son.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.5
    scripture: doctrine-and-covenants
    name: D&C 101:5
    chapter: 101
    verse: 5
    ordinal: 2466
    text: For all those who will not endure chastening, but deny me, cannot be sanctified.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.6
    scripture: doctrine-and-covenants
    name: D&C 101:6
    chapter: 101
    verse: 6
    ordinal: 2467
    text: Behold, I say unto you, there were jarrings, and contentions, and envyings, and strifes, and lustful and covetous desires among them; therefore by these things they polluted their inheritances.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.7
    scripture: doctrine-and-covenants
    name: D&C 101:7
    chapter: 101
    verse: 7
    ordinal: 2468
    text: They were slow to hearken unto the voice of the Lord their God; therefore, the Lord their God is slow to hearken unto their prayers, to answer them in the day of their trouble.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.8
    scripture: doctrine-and-covenants
    name: D&C 101:8
    chapter: 101
    verse: 8
    ordinal: 2469
    text: In the day of their peace they esteemed lightly my counsel; but, in the day of their trouble, of necessity they feel after me.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.9
    scripture: doctrine-and-covenants
    name: D&C 101:9
    chapter: 101
    verse: 9
    ordinal: 2470
    text: Verily I say unto you, notwithstanding their sins, my bowels are filled with compassion towards them. I will not utterly cast them off; and in the day of wrath I will remember mercy.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.10
    scripture: doctrine-and-covenants
    name: D&C 101:10
    chapter: 101
    verse: 10
    ordinal: 2471
    text: I have sworn, and the decree hath gone forth by a former commandment which I have given unto you, that I would let fall the sword of mine indignation in behalf of my people; and even as I have said, it shall come to pass.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.11
    scripture: doctrine-and-covenants
    name: D&C 101:11
    chapter: 101
    verse: 11
    ordinal: 2472
    text: Mine indignation is soon to be poured out without measure upon all nations; and this will I do when the cup of their iniquity is full.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.12
    scripture: doctrine-and-covenants
    name: D&C 101:12
    chapter: 101
    verse: 12
    ordinal: 2473
    text: And in that day all who are found upon the watch-tower, or in other words, all mine Israel, shall be saved.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.13
    scripture: doctrine-and-covenants
    name: D&C 101:13
    chapter: 101
    verse: 13
    ordinal: 2474
    text: And they that have been scattered shall be gathered.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.14
    scripture: doctrine-and-covenants
    name: D&C 101:14
    chapter: 101
    verse: 14
    ordinal: 2475
    text: And all they who have mourned shall be comforted.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.15
    scripture: doctrine-and-covenants
    name: D&C 101:15
    chapter: 101
    verse: 15
    ordinal: 2476
    text: And all they who have given their lives for my name shall be crowned.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.16
    scripture: doctrine-and-covenants
    name: D&C 101:16
    chapter: 101
    verse: 16
    ordinal: 2477
    text: Therefore, let your hearts be comforted concerning Zion; for all flesh is in mine hands; be still and know that I am God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.17
    scripture: doctrine-and-covenants
    name: D&C 101:17
    chapter: 101
    verse: 17
    ordinal: 2478
    text: Zion shall not be moved out of her place, notwithstanding her children are scattered.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.18
    scripture: doctrine-and-covenants
    name: D&C 101:18
    chapter: 101
    verse: 18
    ordinal: 2479
    text: They that remain, and are pure in heart, shall return, and come to their inheritances, they and their children, with songs of everlasting joy, to build up the waste places of Zion—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.19
    scripture: doctrine-and-covenants
    name: D&C 101:19
    chapter: 101
    verse: 19
    ordinal: 2480
    text: And all these things that the prophets might be fulfilled.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Matthew 26:56
    kjvAllusionOsis:
    - Matt.26.56
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.20
    scripture: doctrine-and-covenants
    name: D&C 101:20
    chapter: 101
    verse: 20
    ordinal: 2481
    text: And, behold, there is none other place appointed than that which I have appointed; neither shall there be any other place appointed than that which I have appointed, for the work of the gathering of my saints—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.21
    scripture: doctrine-and-covenants
    name: D&C 101:21
    chapter: 101
    verse: 21
    ordinal: 2482
    text: Until the day cometh when there is found no more room for them; and then I have other places which I will appoint unto them, and they shall be called stakes, for the curtains or the strength of Zion.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.22
    scripture: doctrine-and-covenants
    name: D&C 101:22
    chapter: 101
    verse: 22
    ordinal: 2483
    text: Behold, it is my will, that all they who call on my name, and worship me according to mine everlasting gospel, should gather together, and stand in holy places;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.23
    scripture: doctrine-and-covenants
    name: D&C 101:23
    chapter: 101
    verse: 23
    ordinal: 2484
    text: And prepare for the revelation which is to come, when the veil of the covering of my temple, in my tabernacle, which hideth the earth, shall be taken off, and all flesh shall see me together.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.24
    scripture: doctrine-and-covenants
    name: D&C 101:24
    chapter: 101
    verse: 24
    ordinal: 2485
    text: And every corruptible thing, both of man, or of the beasts of the field, or of the fowls of the heavens, or of the fish of the sea, that dwells upon all the face of the earth, shall be consumed;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.25
    scripture: doctrine-and-covenants
    name: D&C 101:25
    chapter: 101
    verse: 25
    ordinal: 2486
    text: And also that of element shall melt with fervent heat; and all things shall become new, that my knowledge and glory may dwell upon all the earth.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.26
    scripture: doctrine-and-covenants
    name: D&C 101:26
    chapter: 101
    verse: 26
    ordinal: 2487
    text: And in that day the enmity of man, and the enmity of beasts, yea, the enmity of all flesh, shall cease from before my face.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.27
    scripture: doctrine-and-covenants
    name: D&C 101:27
    chapter: 101
    verse: 27
    ordinal: 2488
    text: And in that day whatsoever any man shall ask, it shall be given unto him.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.28
    scripture: doctrine-and-covenants
    name: D&C 101:28
    chapter: 101
    verse: 28
    ordinal: 2489
    text: And in that day Satan shall not have power to tempt any man.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.29
    scripture: doctrine-and-covenants
    name: D&C 101:29
    chapter: 101
    verse: 29
    ordinal: 2490
    text: And there shall be no sorrow because there is no death.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.30
    scripture: doctrine-and-covenants
    name: D&C 101:30
    chapter: 101
    verse: 30
    ordinal: 2491
    text: In that day an infant shall not die until he is old; and his life shall be as the age of a tree;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.31
    scripture: doctrine-and-covenants
    name: D&C 101:31
    chapter: 101
    verse: 31
    ordinal: 2492
    text: And when he dies he shall not sleep, that is to say in the earth, but shall be changed in the twinkling of an eye, and shall be caught up, and his rest shall be glorious.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.32
    scripture: doctrine-and-covenants
    name: D&C 101:32
    chapter: 101
    verse: 32
    ordinal: 2493
    text: Yea, verily I say unto you, in that day when the Lord shall come, he shall reveal all things—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.33
    scripture: doctrine-and-covenants
    name: D&C 101:33
    chapter: 101
    verse: 33
    ordinal: 2494
    text: Things which have passed, and hidden things which no man knew, things of the earth, by which it was made, and the purpose and the end thereof—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.34
    scripture: doctrine-and-covenants
    name: D&C 101:34
    chapter: 101
    verse: 34
    ordinal: 2495
    text: Things most precious, things that are above, and things that are beneath, things that are in the earth, and upon the earth, and in heaven.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.35
    scripture: doctrine-and-covenants
    name: D&C 101:35
    chapter: 101
    verse: 35
    ordinal: 2496
    text: And all they who suffer persecution for my name, and endure in faith, though they are called to lay down their lives for my sake yet shall they partake of all this glory.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.36
    scripture: doctrine-and-covenants
    name: D&C 101:36
    chapter: 101
    verse: 36
    ordinal: 2497
    text: Wherefore, fear not even unto death; for in this world your joy is not full, but in me your joy is full.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.37
    scripture: doctrine-and-covenants
    name: D&C 101:37
    chapter: 101
    verse: 37
    ordinal: 2498
    text: Therefore, care not for the body, neither the life of the body; but care for the soul, and for the life of the soul.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.38
    scripture: doctrine-and-covenants
    name: D&C 101:38
    chapter: 101
    verse: 38
    ordinal: 2499
    text: And seek the face of the Lord always, that in patience ye may possess your souls, and ye shall have eternal life.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Luke 21:19
    kjvAllusionOsis:
    - Luke.21.19
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.39
    scripture: doctrine-and-covenants
    name: D&C 101:39
    chapter: 101
    verse: 39
    ordinal: 2500
    text: When men are called unto mine everlasting gospel, and covenant with an everlasting covenant, they are accounted as the salt of the earth and the savor of men;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.40
    scripture: doctrine-and-covenants
    name: D&C 101:40
    chapter: 101
    verse: 40
    ordinal: 2501
    text: They are called to be the savor of men; therefore, if that salt of the earth lose its savor, behold, it is thenceforth good for nothing only to be cast out and trodden under the feet of men.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Matthew 5:13
    kjvAllusionOsis:
    - Matt.5.13
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.41
    scripture: doctrine-and-covenants
    name: D&C 101:41
    chapter: 101
    verse: 41
    ordinal: 2502
    text: Behold, here is wisdom concerning the children of Zion, even many, but not all; they were found transgressors, therefore they must needs be chastened—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.42
    scripture: doctrine-and-covenants
    name: D&C 101:42
    chapter: 101
    verse: 42
    ordinal: 2503
    text: He that exalteth himself shall be abased, and he that abaseth himself shall be exalted.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Luke 14:11
    kjvOsis:
    - Luke.14.11
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.43
    scripture: doctrine-and-covenants
    name: D&C 101:43
    chapter: 101
    verse: 43
    ordinal: 2504
    text: And now, I will show unto you a parable, that you may know my will concerning the redemption of Zion.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.44
    scripture: doctrine-and-covenants
    name: D&C 101:44
    chapter: 101
    verse: 44
    ordinal: 2505
    text: 'A certain nobleman had a spot of land, very choice; and he said unto his servants: Go ye unto my vineyard, even upon this very choice piece of land, and plant twelve olive trees;'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.45
    scripture: doctrine-and-covenants
    name: D&C 101:45
    chapter: 101
    verse: 45
    ordinal: 2506
    text: And set watchmen round about them, and build a tower, that one may overlook the land round about, to be a watchman upon the tower, that mine olive trees may not be broken down when the enemy shall come to spoil and take upon themselves the fruit of my vineyard.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.46
    scripture: doctrine-and-covenants
    name: D&C 101:46
    chapter: 101
    verse: 46
    ordinal: 2507
    text: Now, the servants of the nobleman went and did as their lord commanded them, and planted the olive trees, and built a hedge round about, and set watchmen, and began to build a tower.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.47
    scripture: doctrine-and-covenants
    name: D&C 101:47
    chapter: 101
    verse: 47
    ordinal: 2508
    text: 'And while they were yet laying the foundation thereof, they began to say among themselves: And what need hath my lord of this tower?'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.48
    scripture: doctrine-and-covenants
    name: D&C 101:48
    chapter: 101
    verse: 48
    ordinal: 2509
    text: 'And consulted for a long time, saying among themselves: What need hath my lord of this tower, seeing this is a time of peace?'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.49
    scripture: doctrine-and-covenants
    name: D&C 101:49
    chapter: 101
    verse: 49
    ordinal: 2510
    text: Might not this money be given to the exchangers? For there is no need of these things.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.50
    scripture: doctrine-and-covenants
    name: D&C 101:50
    chapter: 101
    verse: 50
    ordinal: 2511
    text: And while they were at variance one with another they became very slothful, and they hearkened not unto the commandments of their lord.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.51
    scripture: doctrine-and-covenants
    name: D&C 101:51
    chapter: 101
    verse: 51
    ordinal: 2512
    text: And the enemy came by night, and broke down the hedge; and the servants of the nobleman arose and were affrighted, and fled; and the enemy destroyed their works, and broke down the olive trees.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.52
    scripture: doctrine-and-covenants
    name: D&C 101:52
    chapter: 101
    verse: 52
    ordinal: 2513
    text: Now, behold, the nobleman, the lord of the vineyard, called upon his servants, and said unto them, Why! what is the cause of this great evil?
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.53
    scripture: doctrine-and-covenants
    name: D&C 101:53
    chapter: 101
    verse: 53
    ordinal: 2514
    text: Ought ye not to have done even as I commanded you, and—after ye had planted the vineyard, and built the hedge round about, and set watchmen upon the walls thereof—built the tower also, and set a watchman upon the tower, and watched for my vineyard, and not have fallen asleep, lest the enemy should come upon you?
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.54
    scripture: doctrine-and-covenants
    name: D&C 101:54
    chapter: 101
    verse: 54
    ordinal: 2515
    text: And behold, the watchman upon the tower would have seen the enemy while he was yet afar off; and then ye could have made ready and kept the enemy from breaking down the hedge thereof, and saved my vineyard from the hands of the destroyer.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.55
    scripture: doctrine-and-covenants
    name: D&C 101:55
    chapter: 101
    verse: 55
    ordinal: 2516
    text: 'And the lord of the vineyard said unto one of his servants: Go and gather together the residue of my servants, and take all the strength of mine house, which are my warriors, my young men, and they that are of middle age also among all my servants, who are the strength of mine house, save those only whom I have appointed to tarry;'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.56
    scripture: doctrine-and-covenants
    name: D&C 101:56
    chapter: 101
    verse: 56
    ordinal: 2517
    text: And go ye straightway unto the land of my vineyard, and redeem my vineyard; for it is mine; I have bought it with money.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.57
    scripture: doctrine-and-covenants
    name: D&C 101:57
    chapter: 101
    verse: 57
    ordinal: 2518
    text: Therefore, get ye straightway unto my land; break down the walls of mine enemies; throw down their tower, and scatter their watchmen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.58
    scripture: doctrine-and-covenants
    name: D&C 101:58
    chapter: 101
    verse: 58
    ordinal: 2519
    text: And inasmuch as they gather together against you, avenge me of mine enemies, that by and by I may come with the residue of mine house and possess the land.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.59
    scripture: doctrine-and-covenants
    name: D&C 101:59
    chapter: 101
    verse: 59
    ordinal: 2520
    text: 'And the servant said unto his lord: When shall these things be?'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.60
    scripture: doctrine-and-covenants
    name: D&C 101:60
    chapter: 101
    verse: 60
    ordinal: 2521
    text: 'And he said unto his servant: When I will; go ye straightway, and do all things whatsoever I have commanded you;'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.61
    scripture: doctrine-and-covenants
    name: D&C 101:61
    chapter: 101
    verse: 61
    ordinal: 2522
    text: And this shall be my seal and blessing upon you—a faithful and wise steward in the midst of mine house, a ruler in my kingdom.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.62
    scripture: doctrine-and-covenants
    name: D&C 101:62
    chapter: 101
    verse: 62
    ordinal: 2523
    text: And his servant went straightway, and did all things whatsoever his lord commanded him; and after many days all things were fulfilled.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.63
    scripture: doctrine-and-covenants
    name: D&C 101:63
    chapter: 101
    verse: 63
    ordinal: 2524
    text: Again, verily I say unto you, I will show unto you wisdom in me concerning all the churches, inasmuch as they are willing to be guided in a right and proper way for their salvation—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.64
    scripture: doctrine-and-covenants
    name: D&C 101:64
    chapter: 101
    verse: 64
    ordinal: 2525
    text: That the work of the gathering together of my saints may continue, that I may build them up unto my name upon holy places; for the time of harvest is come, and my word must needs be fulfilled.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.65
    scripture: doctrine-and-covenants
    name: D&C 101:65
    chapter: 101
    verse: 65
    ordinal: 2526
    text: Therefore, I must gather together my people, according to the parable of the wheat and the tares, that the wheat may be secured in the garners to possess eternal life, and be crowned with celestial glory, when I shall come in the kingdom of my Father to reward every man according as his work shall be;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.66
    scripture: doctrine-and-covenants
    name: D&C 101:66
    chapter: 101
    verse: 66
    ordinal: 2527
    text: While the tares shall be bound in bundles, and their bands made strong, that they may be burned with unquenchable fire.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.67
    scripture: doctrine-and-covenants
    name: D&C 101:67
    chapter: 101
    verse: 67
    ordinal: 2528
    text: Therefore, a commandment I give unto all the churches, that they shall continue to gather together unto the places which I have appointed.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.68
    scripture: doctrine-and-covenants
    name: D&C 101:68
    chapter: 101
    verse: 68
    ordinal: 2529
    text: Nevertheless, as I have said unto you in a former commandment, let not your gathering be in haste, nor by flight; but let all things be prepared before you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.69
    scripture: doctrine-and-covenants
    name: D&C 101:69
    chapter: 101
    verse: 69
    ordinal: 2530
    text: And in order that all things be prepared before you, observe the commandment which I have given concerning these things—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.70
    scripture: doctrine-and-covenants
    name: D&C 101:70
    chapter: 101
    verse: 70
    ordinal: 2531
    text: Which saith, or teacheth, to purchase all the lands with money, which can be purchased for money, in the region round about the land which I have appointed to be the land of Zion, for the beginning of the gathering of my saints;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.71
    scripture: doctrine-and-covenants
    name: D&C 101:71
    chapter: 101
    verse: 71
    ordinal: 2532
    text: All the land which can be purchased in Jackson county, and the counties round about, and leave the residue in mine hand.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.72
    scripture: doctrine-and-covenants
    name: D&C 101:72
    chapter: 101
    verse: 72
    ordinal: 2533
    text: Now, verily I say unto you, let all the churches gather together all their moneys; let these things be done in their time, but not in haste; and observe to have all things prepared before you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.73
    scripture: doctrine-and-covenants
    name: D&C 101:73
    chapter: 101
    verse: 73
    ordinal: 2534
    text: And let honorable men be appointed, even wise men, and send them to purchase these lands.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.74
    scripture: doctrine-and-covenants
    name: D&C 101:74
    chapter: 101
    verse: 74
    ordinal: 2535
    text: And the churches in the eastern countries, when they are built up, if they will hearken unto this counsel they may buy lands and gather together upon them; and in this way they may establish Zion.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.75
    scripture: doctrine-and-covenants
    name: D&C 101:75
    chapter: 101
    verse: 75
    ordinal: 2536
    text: There is even now already in store sufficient, yea, even an abundance, to redeem Zion, and establish her waste places, no more to be thrown down, were the churches, who call themselves after my name, willing to hearken to my voice.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.76
    scripture: doctrine-and-covenants
    name: D&C 101:76
    chapter: 101
    verse: 76
    ordinal: 2537
    text: And again I say unto you, those who have been scattered by their enemies, it is my will that they should continue to importune for redress, and redemption, by the hands of those who are placed as rulers and are in authority over you—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.77
    scripture: doctrine-and-covenants
    name: D&C 101:77
    chapter: 101
    verse: 77
    ordinal: 2538
    text: According to the laws and constitution of the people, which I have suffered to be established, and should be maintained for the rights and protection of all flesh, according to just and holy principles;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.78
    scripture: doctrine-and-covenants
    name: D&C 101:78
    chapter: 101
    verse: 78
    ordinal: 2539
    text: That every man may act in doctrine and principle pertaining to futurity, according to the moral agency which I have given unto him, that every man may be accountable for his own sins in the day of judgment.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.79
    scripture: doctrine-and-covenants
    name: D&C 101:79
    chapter: 101
    verse: 79
    ordinal: 2540
    text: Therefore, it is not right that any man should be in bondage one to another.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.80
    scripture: doctrine-and-covenants
    name: D&C 101:80
    chapter: 101
    verse: 80
    ordinal: 2541
    text: And for this purpose have I established the Constitution of this land, by the hands of wise men whom I raised up unto this very purpose, and redeemed the land by the shedding of blood.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.81
    scripture: doctrine-and-covenants
    name: D&C 101:81
    chapter: 101
    verse: 81
    ordinal: 2542
    text: Now, unto what shall I liken the children of Zion? I will liken them unto the parable of the woman and the unjust judge, for men ought always to pray and not to faint, which saith—
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Luke 18:1
    kjvAllusionOsis:
    - Luke.18.1
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.82
    scripture: doctrine-and-covenants
    name: D&C 101:82
    chapter: 101
    verse: 82
    ordinal: 2543
    text: There was in a city a judge which feared not God, neither regarded man.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Luke 18:2
    kjvOsis:
    - Luke.18.2
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.83
    scripture: doctrine-and-covenants
    name: D&C 101:83
    chapter: 101
    verse: 83
    ordinal: 2544
    text: 'And there was a widow in that city, and she came unto him, saying: Avenge me of mine adversary.'
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Luke 18:3
    kjvOsis:
    - Luke.18.3
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.84
    scripture: doctrine-and-covenants
    name: D&C 101:84
    chapter: 101
    verse: 84
    ordinal: 2545
    text: 'And he would not for a while, but afterward he said within himself: Though I fear not God, nor regard man, yet because this widow troubleth me I will avenge her, lest by her continual coming she weary me.'
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Luke 18:5
    kjvAllusionOsis:
    - Luke.18.5
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.85
    scripture: doctrine-and-covenants
    name: D&C 101:85
    chapter: 101
    verse: 85
    ordinal: 2546
    text: Thus will I liken the children of Zion.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.86
    scripture: doctrine-and-covenants
    name: D&C 101:86
    chapter: 101
    verse: 86
    ordinal: 2547
    text: Let them importune at the feet of the judge;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.87
    scripture: doctrine-and-covenants
    name: D&C 101:87
    chapter: 101
    verse: 87
    ordinal: 2548
    text: And if he heed them not, let them importune at the feet of the governor;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.88
    scripture: doctrine-and-covenants
    name: D&C 101:88
    chapter: 101
    verse: 88
    ordinal: 2549
    text: And if the governor heed them not, let them importune at the feet of the president;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.89
    scripture: doctrine-and-covenants
    name: D&C 101:89
    chapter: 101
    verse: 89
    ordinal: 2550
    text: And if the president heed them not, then will the Lord arise and come forth out of his hiding place, and in his fury vex the nation;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.90
    scripture: doctrine-and-covenants
    name: D&C 101:90
    chapter: 101
    verse: 90
    ordinal: 2551
    text: And in his hot displeasure, and in his fierce anger, in his time, will cut off those wicked, unfaithful, and unjust stewards, and appoint them their portion among hypocrites, and unbelievers;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.91
    scripture: doctrine-and-covenants
    name: D&C 101:91
    chapter: 101
    verse: 91
    ordinal: 2552
    text: Even in outer darkness, where there is weeping, and wailing, and gnashing of teeth.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Matthew 8:12
    kjvAllusionOsis:
    - Matt.8.12
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.92
    scripture: doctrine-and-covenants
    name: D&C 101:92
    chapter: 101
    verse: 92
    ordinal: 2553
    text: Pray ye, therefore, that their ears may be opened unto your cries, that I may be merciful unto them, that these things may not come upon them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.93
    scripture: doctrine-and-covenants
    name: D&C 101:93
    chapter: 101
    verse: 93
    ordinal: 2554
    text: What I have said unto you must needs be, that all men may be left without excuse;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.94
    scripture: doctrine-and-covenants
    name: D&C 101:94
    chapter: 101
    verse: 94
    ordinal: 2555
    text: That wise men and rulers may hear and know that which they have never considered;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.95
    scripture: doctrine-and-covenants
    name: D&C 101:95
    chapter: 101
    verse: 95
    ordinal: 2556
    text: That I may proceed to bring to pass my act, my strange act, and perform my work, my strange work, that men may discern between the righteous and the wicked, saith your God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.96
    scripture: doctrine-and-covenants
    name: D&C 101:96
    chapter: 101
    verse: 96
    ordinal: 2557
    text: And again, I say unto you, it is contrary to my commandment and my will that my servant Sidney Gilbert should sell my storehouse, which I have appointed unto my people, into the hands of mine enemies.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.97
    scripture: doctrine-and-covenants
    name: D&C 101:97
    chapter: 101
    verse: 97
    ordinal: 2558
    text: Let not that which I have appointed be polluted by mine enemies, by the consent of those who call themselves after my name;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.98
    scripture: doctrine-and-covenants
    name: D&C 101:98
    chapter: 101
    verse: 98
    ordinal: 2559
    text: For this is a very sore and grievous sin against me, and against my people, in consequence of those things which I have decreed and which are soon to befall the nations.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.99
    scripture: doctrine-and-covenants
    name: D&C 101:99
    chapter: 101
    verse: 99
    ordinal: 2560
    text: Therefore, it is my will that my people should claim, and hold claim upon that which I have appointed unto them, though they should not be permitted to dwell thereon.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.100
    scripture: doctrine-and-covenants
    name: D&C 101:100
    chapter: 101
    verse: 100
    ordinal: 2561
    text: Nevertheless, I do not say they shall not dwell thereon; for inasmuch as they bring forth fruit and works meet for my kingdom they shall dwell thereon.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.101.101
    scripture: doctrine-and-covenants
    name: D&C 101:101
    chapter: 101
    verse: 101
    ordinal: 2562
    text: They shall build, and another shall not inherit it; they shall plant vineyards, and they shall eat the fruit thereof. Even so. Amen.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Isaiah 65:21
    kjvAllusionOsis:
    - Isa.65.21
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.101
- type: DcVerse
  data:
    ref: dc.102.1
    scripture: doctrine-and-covenants
    name: D&C 102:1
    chapter: 102
    verse: 1
    ordinal: 2563
    text: This day a general council of twenty-four high priests assembled at the house of Joseph Smith, Jun., by revelation, and proceeded to organize the high council of the church of Christ, which was to consist of twelve high priests, and one or three presidents as the case might require.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.102
- type: DcVerse
  data:
    ref: dc.102.2
    scripture: doctrine-and-covenants
    name: D&C 102:2
    chapter: 102
    verse: 2
    ordinal: 2564
    text: The high council was appointed by revelation for the purpose of settling important difficulties which might arise in the church, which could not be settled by the church or the bishop's council to the satisfaction of the parties.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.102
- type: DcVerse
  data:
    ref: dc.102.3
    scripture: doctrine-and-covenants
    name: D&C 102:3
    chapter: 102
    verse: 3
    ordinal: 2565
    text: Joseph Smith, Jun., Sidney Rigdon and Frederick G. Williams were acknowledged presidents by the voice of the council; and Joseph Smith, Sen., John Smith, Joseph Coe, John Johnson, Martin Harris, John S. Carter, Jared Carter, Oliver Cowdery, Samuel H. Smith, Orson Hyde, Sylvester Smith, and Luke Johnson, high priests, were chosen to be a standing council for the church, by the unanimous voice of the council.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.102
- type: DcVerse
  data:
    ref: dc.102.4
    scripture: doctrine-and-covenants
    name: D&C 102:4
    chapter: 102
    verse: 4
    ordinal: 2566
    text: The above-named councilors were then asked whether they accepted their appointments, and whether they would act in that office according to the law of heaven, to which they all answered that they accepted their appointments, and would fill their offices according to the grace of God bestowed upon them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.102
- type: DcVerse
  data:
    ref: dc.102.5
    scripture: doctrine-and-covenants
    name: D&C 102:5
    chapter: 102
    verse: 5
    ordinal: 2567
    text: 'The number composing the council, who voted in the name and for the church in appointing the above-named councilors were forty-three, as follows: nine high priests, seventeen elders, four priests, and thirteen members.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.102
- type: DcVerse
  data:
    ref: dc.102.6
    scripture: doctrine-and-covenants
    name: D&C 102:6
    chapter: 102
    verse: 6
    ordinal: 2568
    text: 'Voted: that the high council cannot have power to act without seven of the above-named councilors, or their regularly appointed successors are present.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.102
- type: DcVerse
  data:
    ref: dc.102.7
    scripture: doctrine-and-covenants
    name: D&C 102:7
    chapter: 102
    verse: 7
    ordinal: 2569
    text: These seven shall have power to appoint other high priests, whom they may consider worthy and capable to act in the place of absent councilors.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.102
- type: DcVerse
  data:
    ref: dc.102.8
    scripture: doctrine-and-covenants
    name: D&C 102:8
    chapter: 102
    verse: 8
    ordinal: 2570
    text: 'Voted: that whenever any vacancy shall occur by the death, removal from office for transgression, or removal from the bounds of this church government, of any one of the above-named councilors, it shall be filled by the nomination of the president or presidents, and sanctioned by the voice of a general council of high priests, convened for that purpose, to act in the name of the church.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.102
- type: DcVerse
  data:
    ref: dc.102.9
    scripture: doctrine-and-covenants
    name: D&C 102:9
    chapter: 102
    verse: 9
    ordinal: 2571
    text: The president of the church, who is also the president of the council, is appointed by revelation, and acknowledged in his administration by the voice of the church.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.102
- type: DcVerse
  data:
    ref: dc.102.10
    scripture: doctrine-and-covenants
    name: D&C 102:10
    chapter: 102
    verse: 10
    ordinal: 2572
    text: And it is according to the dignity of his office that he should preside over the council of the church; and it is his privilege to be assisted by two other presidents, appointed after the same manner that he himself was appointed.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.102
- type: DcVerse
  data:
    ref: dc.102.11
    scripture: doctrine-and-covenants
    name: D&C 102:11
    chapter: 102
    verse: 11
    ordinal: 2573
    text: And in case of the absence of one or both of those who are appointed to assist him, he has power to preside over the council without an assistant; and in case he himself is absent, the other presidents have power to preside in his stead, both or either of them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.102
- type: DcVerse
  data:
    ref: dc.102.12
    scripture: doctrine-and-covenants
    name: D&C 102:12
    chapter: 102
    verse: 12
    ordinal: 2574
    text: Whenever a high council of the church of Christ is regularly organized, according to the foregoing pattern, it shall be the duty of the twelve councilors to cast lots by numbers, and thereby ascertain who of the twelve shall speak first, commencing with number one and so in succession to number twelve.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.102
- type: DcVerse
  data:
    ref: dc.102.13
    scripture: doctrine-and-covenants
    name: D&C 102:13
    chapter: 102
    verse: 13
    ordinal: 2575
    text: Whenever this council convenes to act upon any case, the twelve councilors shall consider whether it is a difficult one or not; if it is not, two only of the councilors shall speak upon it, according to the form above written.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.102
- type: DcVerse
  data:
    ref: dc.102.14
    scripture: doctrine-and-covenants
    name: D&C 102:14
    chapter: 102
    verse: 14
    ordinal: 2576
    text: But if it is thought to be difficult, four shall be appointed; and if more difficult, six; but in no case shall more than six be appointed to speak.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.102
- type: DcVerse
  data:
    ref: dc.102.15
    scripture: doctrine-and-covenants
    name: D&C 102:15
    chapter: 102
    verse: 15
    ordinal: 2577
    text: The accused, in all cases, has a right to one-half of the council, to prevent insult or injustice.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.102
- type: DcVerse
  data:
    ref: dc.102.16
    scripture: doctrine-and-covenants
    name: D&C 102:16
    chapter: 102
    verse: 16
    ordinal: 2578
    text: And the councilors appointed to speak before the council are to present the case, after the evidence is examined, in its true light before the council; and every man is to speak according to equity and justice.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.102
- type: DcVerse
  data:
    ref: dc.102.17
    scripture: doctrine-and-covenants
    name: D&C 102:17
    chapter: 102
    verse: 17
    ordinal: 2579
    text: Those councilors who draw even numbers, that is, 2, 4, 6, 8, 10, and 12, are the individuals who are to stand up in behalf of the accused, and prevent insult and injustice.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.102
- type: DcVerse
  data:
    ref: dc.102.18
    scripture: doctrine-and-covenants
    name: D&C 102:18
    chapter: 102
    verse: 18
    ordinal: 2580
    text: In all cases the accuser and the accused shall have a privilege of speaking for themselves before the council, after the evidences are heard and the councilors who are appointed to speak on the case have finished their remarks.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.102
- type: DcVerse
  data:
    ref: dc.102.19
    scripture: doctrine-and-covenants
    name: D&C 102:19
    chapter: 102
    verse: 19
    ordinal: 2581
    text: After the evidences are heard, the councilors, accuser and accused have spoken, the president shall give a decision according to the understanding which he shall have of the case, and call upon the twelve councilors to sanction the same by their vote.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.102
- type: DcVerse
  data:
    ref: dc.102.20
    scripture: doctrine-and-covenants
    name: D&C 102:20
    chapter: 102
    verse: 20
    ordinal: 2582
    text: But should the remaining councilors, who have not spoken, or any one of them, after hearing the evidences and pleadings impartially, discover an error in the decision of the president, they can manifest it, and the case shall have a re-hearing.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.102
- type: DcVerse
  data:
    ref: dc.102.21
    scripture: doctrine-and-covenants
    name: D&C 102:21
    chapter: 102
    verse: 21
    ordinal: 2583
    text: And if, after a careful re-hearing, any additional light is shown upon the case, the decision shall be altered accordingly.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.102
- type: DcVerse
  data:
    ref: dc.102.22
    scripture: doctrine-and-covenants
    name: D&C 102:22
    chapter: 102
    verse: 22
    ordinal: 2584
    text: But in case no additional light is given, the first decision shall stand, the majority of the council having power to determine the same.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.102
- type: DcVerse
  data:
    ref: dc.102.23
    scripture: doctrine-and-covenants
    name: D&C 102:23
    chapter: 102
    verse: 23
    ordinal: 2585
    text: In case of difficulty respecting doctrine or principle, if there is not a sufficiency written to make the case clear to the minds of the council, the president may inquire and obtain the mind of the Lord by revelation.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.102
- type: DcVerse
  data:
    ref: dc.102.24
    scripture: doctrine-and-covenants
    name: D&C 102:24
    chapter: 102
    verse: 24
    ordinal: 2586
    text: The high priests, when abroad, have power to call and organize a council after the manner of the foregoing, to settle difficulties, when the parties or either of them shall request it.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.102
- type: DcVerse
  data:
    ref: dc.102.25
    scripture: doctrine-and-covenants
    name: D&C 102:25
    chapter: 102
    verse: 25
    ordinal: 2587
    text: And the said council of high priests shall have power to appoint one of their own number to preside over such council for the time being.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.102
- type: DcVerse
  data:
    ref: dc.102.26
    scripture: doctrine-and-covenants
    name: D&C 102:26
    chapter: 102
    verse: 26
    ordinal: 2588
    text: It shall be the duty of said council to transmit, immediately, a copy of their proceedings, with a full statement of the testimony accompanying their decision, to the high council of the seat of the First Presidency of the Church.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.102
- type: DcVerse
  data:
    ref: dc.102.27
    scripture: doctrine-and-covenants
    name: D&C 102:27
    chapter: 102
    verse: 27
    ordinal: 2589
    text: Should the parties or either of them be dissatisfied with the decision of said council, they may appeal to the high council of the seat of the First Presidency of the Church, and have a re-hearing, which case shall there be conducted, according to the former pattern written, as though no such decision had been made.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.102
- type: DcVerse
  data:
    ref: dc.102.28
    scripture: doctrine-and-covenants
    name: D&C 102:28
    chapter: 102
    verse: 28
    ordinal: 2590
    text: This council of high priests abroad is only to be called on the most difficult cases of church matters; and no common or ordinary case is to be sufficient to call such council.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.102
- type: DcVerse
  data:
    ref: dc.102.29
    scripture: doctrine-and-covenants
    name: D&C 102:29
    chapter: 102
    verse: 29
    ordinal: 2591
    text: The traveling or located high priests abroad have power to say whether it is necessary to call such a council or not.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.102
- type: DcVerse
  data:
    ref: dc.102.30
    scripture: doctrine-and-covenants
    name: D&C 102:30
    chapter: 102
    verse: 30
    ordinal: 2592
    text: There is a distinction between the high council or traveling high priests abroad, and the traveling high council composed of the twelve apostles, in their decisions.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.102
- type: DcVerse
  data:
    ref: dc.102.31
    scripture: doctrine-and-covenants
    name: D&C 102:31
    chapter: 102
    verse: 31
    ordinal: 2593
    text: From the decision of the former there can be an appeal; but from the decision of the latter there cannot.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.102
- type: DcVerse
  data:
    ref: dc.102.32
    scripture: doctrine-and-covenants
    name: D&C 102:32
    chapter: 102
    verse: 32
    ordinal: 2594
    text: The latter can only be called in question by the general authorities of the church in case of transgression.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.102
- type: DcVerse
  data:
    ref: dc.102.33
    scripture: doctrine-and-covenants
    name: D&C 102:33
    chapter: 102
    verse: 33
    ordinal: 2595
    text: 'Resolved: that the president or presidents of the seat of the First Presidency of the Church shall have power to determine whether any such case, as may be appealed, is justly entitled to a re-hearing, after examining the appeal and the evidences and statements accompanying it.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.102
- type: DcVerse
  data:
    ref: dc.102.34
    scripture: doctrine-and-covenants
    name: D&C 102:34
    chapter: 102
    verse: 34
    ordinal: 2596
    text: 'The twelve councilors then proceeded to cast lots or ballot, to ascertain who should speak first, and the following was the result, namely: 1, Oliver Cowdery; 2, Joseph Coe; 3, Samuel H. Smith; 4, Luke Johnson; 5, John S. Carter; 6, Sylvester Smith; 7, John Johnson; 8, Orson Hyde; 9, Jared Carter; 10, Joseph Smith, Sen.; 11, John Smith; 12, Martin Harris. After prayer the conference adjourned.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.102
- type: DcVerse
  data:
    ref: dc.103.1
    scripture: doctrine-and-covenants
    name: D&C 103:1
    chapter: 103
    verse: 1
    ordinal: 2597
    text: Verily I say unto you, my friends, behold, I will give unto you a revelation and commandment, that you may know how to act in the discharge of your duties concerning the salvation and redemption of your brethren, who have been scattered on the land of Zion;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.103
- type: DcVerse
  data:
    ref: dc.103.2
    scripture: doctrine-and-covenants
    name: D&C 103:2
    chapter: 103
    verse: 2
    ordinal: 2598
    text: Being driven and smitten by the hands of mine enemies, on whom I will pour out my wrath without measure in mine own time.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.103
- type: DcVerse
  data:
    ref: dc.103.3
    scripture: doctrine-and-covenants
    name: D&C 103:3
    chapter: 103
    verse: 3
    ordinal: 2599
    text: For I have suffered them thus far, that they might fill up the measure of their iniquities, that their cup might be full;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.103
- type: DcVerse
  data:
    ref: dc.103.4
    scripture: doctrine-and-covenants
    name: D&C 103:4
    chapter: 103
    verse: 4
    ordinal: 2600
    text: And that those who call themselves after my name might be chastened for a little season with a sore and grievous chastisement, because they did not hearken altogether unto the precepts and commandments which I gave unto them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.103
- type: DcVerse
  data:
    ref: dc.103.5
    scripture: doctrine-and-covenants
    name: D&C 103:5
    chapter: 103
    verse: 5
    ordinal: 2601
    text: But verily I say unto you, that I have decreed a decree which my people shall realize, inasmuch as they hearken from this very hour unto the counsel which I, the Lord their God, shall give unto them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.103
- type: DcVerse
  data:
    ref: dc.103.6
    scripture: doctrine-and-covenants
    name: D&C 103:6
    chapter: 103
    verse: 6
    ordinal: 2602
    text: Behold they shall, for I have decreed it, begin to prevail against mine enemies from this very hour.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.103
- type: DcVerse
  data:
    ref: dc.103.7
    scripture: doctrine-and-covenants
    name: D&C 103:7
    chapter: 103
    verse: 7
    ordinal: 2603
    text: And by hearkening to observe all the words which I, the Lord their God, shall speak unto them, they shall never cease to prevail until the kingdoms of the world are subdued under my feet, and the earth is given unto the saints, to possess it forever and ever.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.103
- type: DcVerse
  data:
    ref: dc.103.8
    scripture: doctrine-and-covenants
    name: D&C 103:8
    chapter: 103
    verse: 8
    ordinal: 2604
    text: But inasmuch as they keep not my commandments, and hearken not to observe all my words, the kingdoms of the world shall prevail against them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.103
- type: DcVerse
  data:
    ref: dc.103.9
    scripture: doctrine-and-covenants
    name: D&C 103:9
    chapter: 103
    verse: 9
    ordinal: 2605
    text: For they were set to be a light unto the world, and to be the saviors of men;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.103
- type: DcVerse
  data:
    ref: dc.103.10
    scripture: doctrine-and-covenants
    name: D&C 103:10
    chapter: 103
    verse: 10
    ordinal: 2606
    text: And inasmuch as they are not the saviors of men, they are as salt that has lost its savor, and is thenceforth good for nothing but to be cast out and trodden under foot of men.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Matthew 5:13
    kjvAllusionOsis:
    - Matt.5.13
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.103
- type: DcVerse
  data:
    ref: dc.103.11
    scripture: doctrine-and-covenants
    name: D&C 103:11
    chapter: 103
    verse: 11
    ordinal: 2607
    text: But verily I say unto you, I have decreed that your brethren which have been scattered shall return to the lands of their inheritances, and shall build up the waste places of Zion.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.103
- type: DcVerse
  data:
    ref: dc.103.12
    scripture: doctrine-and-covenants
    name: D&C 103:12
    chapter: 103
    verse: 12
    ordinal: 2608
    text: For after much tribulation, as I have said unto you in a former commandment, cometh the blessing.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.103
- type: DcVerse
  data:
    ref: dc.103.13
    scripture: doctrine-and-covenants
    name: D&C 103:13
    chapter: 103
    verse: 13
    ordinal: 2609
    text: Behold, this is the blessing which I have promised after your tribulations, and the tribulations of your brethren—your redemption, and the redemption of your brethren, even their restoration to the land of Zion, to be established, no more to be thrown down.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.103
- type: DcVerse
  data:
    ref: dc.103.14
    scripture: doctrine-and-covenants
    name: D&C 103:14
    chapter: 103
    verse: 14
    ordinal: 2610
    text: Nevertheless, if they pollute their inheritances they shall be thrown down; for I will not spare them if they pollute their inheritances.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.103
- type: DcVerse
  data:
    ref: dc.103.15
    scripture: doctrine-and-covenants
    name: D&C 103:15
    chapter: 103
    verse: 15
    ordinal: 2611
    text: Behold, I say unto you, the redemption of Zion must needs come by power;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.103
- type: DcVerse
  data:
    ref: dc.103.16
    scripture: doctrine-and-covenants
    name: D&C 103:16
    chapter: 103
    verse: 16
    ordinal: 2612
    text: Therefore, I will raise up unto my people a man, who shall lead them like as Moses led the children of Israel.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.103
- type: DcVerse
  data:
    ref: dc.103.17
    scripture: doctrine-and-covenants
    name: D&C 103:17
    chapter: 103
    verse: 17
    ordinal: 2613
    text: For ye are the children of Israel, and of the seed of Abraham, and ye must needs be led out of bondage by power, and with a stretched-out arm.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.103
- type: DcVerse
  data:
    ref: dc.103.18
    scripture: doctrine-and-covenants
    name: D&C 103:18
    chapter: 103
    verse: 18
    ordinal: 2614
    text: And as your fathers were led at the first, even so shall the redemption of Zion be.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.103
- type: DcVerse
  data:
    ref: dc.103.19
    scripture: doctrine-and-covenants
    name: D&C 103:19
    chapter: 103
    verse: 19
    ordinal: 2615
    text: 'Therefore, let not your hearts faint, for I say not unto you as I said unto your fathers: Mine angel shall go up before you, but not my presence.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.103
- type: DcVerse
  data:
    ref: dc.103.20
    scripture: doctrine-and-covenants
    name: D&C 103:20
    chapter: 103
    verse: 20
    ordinal: 2616
    text: 'But I say unto you: Mine angels shall go up before you, and also my presence, and in time ye shall possess the goodly land.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.103
- type: DcVerse
  data:
    ref: dc.103.21
    scripture: doctrine-and-covenants
    name: D&C 103:21
    chapter: 103
    verse: 21
    ordinal: 2617
    text: Verily, verily I say unto you, that my servant Joseph Smith, Jun., is the man to whom I likened the servant to whom the Lord of the vineyard spake in the parable which I have given unto you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.103
- type: DcVerse
  data:
    ref: dc.103.22
    scripture: doctrine-and-covenants
    name: D&C 103:22
    chapter: 103
    verse: 22
    ordinal: 2618
    text: Therefore let my servant Joseph Smith, Jun., say unto the strength of my house, my young men and the middle aged—Gather yourselves together unto the land of Zion, upon the land which I have bought with money that has been consecrated unto me.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.103
- type: DcVerse
  data:
    ref: dc.103.23
    scripture: doctrine-and-covenants
    name: D&C 103:23
    chapter: 103
    verse: 23
    ordinal: 2619
    text: And let all the churches send up wise men with their moneys, and purchase lands even as I have commanded them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.103
- type: DcVerse
  data:
    ref: dc.103.24
    scripture: doctrine-and-covenants
    name: D&C 103:24
    chapter: 103
    verse: 24
    ordinal: 2620
    text: And inasmuch as mine enemies come against you to drive you from my goodly land, which I have consecrated to be the land of Zion, even from your own lands after these testimonies, which ye have brought before me against them, ye shall curse them;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.103
- type: DcVerse
  data:
    ref: dc.103.25
    scripture: doctrine-and-covenants
    name: D&C 103:25
    chapter: 103
    verse: 25
    ordinal: 2621
    text: And whomsoever ye curse, I will curse, and ye shall avenge me of mine enemies.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.103
- type: DcVerse
  data:
    ref: dc.103.26
    scripture: doctrine-and-covenants
    name: D&C 103:26
    chapter: 103
    verse: 26
    ordinal: 2622
    text: And my presence shall be with you even in avenging me of mine enemies, unto the third and fourth generation of them that hate me.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.103
- type: DcVerse
  data:
    ref: dc.103.27
    scripture: doctrine-and-covenants
    name: D&C 103:27
    chapter: 103
    verse: 27
    ordinal: 2623
    text: Let no man be afraid to lay down his life for my sake; for whoso layeth down his life for my sake shall find it again.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.103
- type: DcVerse
  data:
    ref: dc.103.28
    scripture: doctrine-and-covenants
    name: D&C 103:28
    chapter: 103
    verse: 28
    ordinal: 2624
    text: And whoso is not willing to lay down his life for my sake is not my disciple.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.103
- type: DcVerse
  data:
    ref: dc.103.29
    scripture: doctrine-and-covenants
    name: D&C 103:29
    chapter: 103
    verse: 29
    ordinal: 2625
    text: It is my will that my servant Sidney Rigdon shall lift up his voice in the congregations in the eastern countries, in preparing the churches to keep the commandments which I have given unto them concerning the restoration and redemption of Zion.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.103
- type: DcVerse
  data:
    ref: dc.103.30
    scripture: doctrine-and-covenants
    name: D&C 103:30
    chapter: 103
    verse: 30
    ordinal: 2626
    text: It is my will that my servant Parley P. Pratt and my servant Lyman Wight should not return to the land of their brethren, until they have obtained companies to go up unto the land of Zion, by tens, or by twenties, or by fifties, or by an hundred, until they have obtained to the number of five hundred of the strength of my house.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.103
- type: DcVerse
  data:
    ref: dc.103.31
    scripture: doctrine-and-covenants
    name: D&C 103:31
    chapter: 103
    verse: 31
    ordinal: 2627
    text: Behold this is my will; ask and ye shall receive; but men do not always do my will.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.103
- type: DcVerse
  data:
    ref: dc.103.32
    scripture: doctrine-and-covenants
    name: D&C 103:32
    chapter: 103
    verse: 32
    ordinal: 2628
    text: Therefore, if you cannot obtain five hundred, seek diligently that peradventure you may obtain three hundred.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.103
- type: DcVerse
  data:
    ref: dc.103.33
    scripture: doctrine-and-covenants
    name: D&C 103:33
    chapter: 103
    verse: 33
    ordinal: 2629
    text: And if ye cannot obtain three hundred, seek diligently that peradventure ye may obtain one hundred.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.103
- type: DcVerse
  data:
    ref: dc.103.34
    scripture: doctrine-and-covenants
    name: D&C 103:34
    chapter: 103
    verse: 34
    ordinal: 2630
    text: But verily I say unto you, a commandment I give unto you, that ye shall not go up unto the land of Zion until you have obtained a hundred of the strength of my house, to go up with you unto the land of Zion.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.103
- type: DcVerse
  data:
    ref: dc.103.35
    scripture: doctrine-and-covenants
    name: D&C 103:35
    chapter: 103
    verse: 35
    ordinal: 2631
    text: Therefore, as I said unto you, ask and ye shall receive; pray earnestly that peradventure my servant Joseph Smith, Jun., may go with you, and preside in the midst of my people, and organize my kingdom upon the consecrated land, and establish the children of Zion upon the laws and commandments which have been and which shall be given unto you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.103
- type: DcVerse
  data:
    ref: dc.103.36
    scripture: doctrine-and-covenants
    name: D&C 103:36
    chapter: 103
    verse: 36
    ordinal: 2632
    text: All victory and glory is brought to pass unto you through your diligence, faithfulness, and prayers of faith.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.103
- type: DcVerse
  data:
    ref: dc.103.37
    scripture: doctrine-and-covenants
    name: D&C 103:37
    chapter: 103
    verse: 37
    ordinal: 2633
    text: Let my servant Parley P. Pratt journey with my servant Joseph Smith, Jun.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.103
- type: DcVerse
  data:
    ref: dc.103.38
    scripture: doctrine-and-covenants
    name: D&C 103:38
    chapter: 103
    verse: 38
    ordinal: 2634
    text: Let my servant Lyman Wight journey with my servant Sidney Rigdon.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.103
- type: DcVerse
  data:
    ref: dc.103.39
    scripture: doctrine-and-covenants
    name: D&C 103:39
    chapter: 103
    verse: 39
    ordinal: 2635
    text: Let my servant Hyrum Smith journey with my servant Frederick G. Williams.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.103
- type: DcVerse
  data:
    ref: dc.103.40
    scripture: doctrine-and-covenants
    name: D&C 103:40
    chapter: 103
    verse: 40
    ordinal: 2636
    text: Let my servant Orson Hyde journey with my servant Orson Pratt, whithersoever my servant Joseph Smith, Jun., shall counsel them, in obtaining the fulfilment of these commandments which I have given unto you, and leave the residue in my hands. Even so. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.103
- type: DcVerse
  data:
    ref: dc.104.1
    scripture: doctrine-and-covenants
    name: D&C 104:1
    chapter: 104
    verse: 1
    ordinal: 2637
    text: Verily I say unto you, my friends, I give unto you counsel, and a commandment, concerning all the properties which belong to the order which I commanded to be organized and established, to be a united order, and an everlasting order for the benefit of my church, and for the salvation of men until I come—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.2
    scripture: doctrine-and-covenants
    name: D&C 104:2
    chapter: 104
    verse: 2
    ordinal: 2638
    text: With promise immutable and unchangeable, that inasmuch as those whom I commanded were faithful they should be blessed with a multiplicity of blessings;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.3
    scripture: doctrine-and-covenants
    name: D&C 104:3
    chapter: 104
    verse: 3
    ordinal: 2639
    text: But inasmuch as they were not faithful they were nigh unto cursing.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.4
    scripture: doctrine-and-covenants
    name: D&C 104:4
    chapter: 104
    verse: 4
    ordinal: 2640
    text: Therefore, inasmuch as some of my servants have not kept the commandment, but have broken the covenant through covetousness, and with feigned words, I have cursed them with a very sore and grievous curse.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.5
    scripture: doctrine-and-covenants
    name: D&C 104:5
    chapter: 104
    verse: 5
    ordinal: 2641
    text: For I, the Lord, have decreed in my heart, that inasmuch as any man belonging to the order shall be found a transgressor, or, in other words, shall break the covenant with which ye are bound, he shall be cursed in his life, and shall be trodden down by whom I will;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.6
    scripture: doctrine-and-covenants
    name: D&C 104:6
    chapter: 104
    verse: 6
    ordinal: 2642
    text: For I, the Lord, am not to be mocked in these things—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.7
    scripture: doctrine-and-covenants
    name: D&C 104:7
    chapter: 104
    verse: 7
    ordinal: 2643
    text: And all this that the innocent among you may not be condemned with the unjust; and that the guilty among you may not escape; because I, the Lord, have promised unto you a crown of glory at my right hand.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.8
    scripture: doctrine-and-covenants
    name: D&C 104:8
    chapter: 104
    verse: 8
    ordinal: 2644
    text: Therefore, inasmuch as you are found transgressors, you cannot escape my wrath in your lives.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.9
    scripture: doctrine-and-covenants
    name: D&C 104:9
    chapter: 104
    verse: 9
    ordinal: 2645
    text: Inasmuch as ye are cut off for transgression, ye cannot escape the buffetings of Satan until the day of redemption.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.10
    scripture: doctrine-and-covenants
    name: D&C 104:10
    chapter: 104
    verse: 10
    ordinal: 2646
    text: And I now give unto you power from this very hour, that if any man among you, of the order, is found a transgressor and repenteth not of the evil, that ye shall deliver him over unto the buffetings of Satan; and he shall not have power to bring evil upon you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.11
    scripture: doctrine-and-covenants
    name: D&C 104:11
    chapter: 104
    verse: 11
    ordinal: 2647
    text: It is wisdom in me; therefore, a commandment I give unto you, that ye shall organize yourselves and appoint every man his stewardship;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.12
    scripture: doctrine-and-covenants
    name: D&C 104:12
    chapter: 104
    verse: 12
    ordinal: 2648
    text: That every man may give an account unto me of the stewardship which is appointed unto him.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.13
    scripture: doctrine-and-covenants
    name: D&C 104:13
    chapter: 104
    verse: 13
    ordinal: 2649
    text: For it is expedient that I, the Lord, should make every man accountable, as a steward over earthly blessings, which I have made and prepared for my creatures.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.14
    scripture: doctrine-and-covenants
    name: D&C 104:14
    chapter: 104
    verse: 14
    ordinal: 2650
    text: I, the Lord, stretched out the heavens, and built the earth, my very handiwork; and all things therein are mine.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.15
    scripture: doctrine-and-covenants
    name: D&C 104:15
    chapter: 104
    verse: 15
    ordinal: 2651
    text: And it is my purpose to provide for my saints, for all things are mine.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.16
    scripture: doctrine-and-covenants
    name: D&C 104:16
    chapter: 104
    verse: 16
    ordinal: 2652
    text: But it must needs be done in mine own way; and behold this is the way that I, the Lord, have decreed to provide for my saints, that the poor shall be exalted, in that the rich are made low.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.17
    scripture: doctrine-and-covenants
    name: D&C 104:17
    chapter: 104
    verse: 17
    ordinal: 2653
    text: For the earth is full, and there is enough and to spare; yea, I prepared all things, and have given unto the children of men to be agents unto themselves.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.18
    scripture: doctrine-and-covenants
    name: D&C 104:18
    chapter: 104
    verse: 18
    ordinal: 2654
    text: Therefore, if any man shall take of the abundance which I have made, and impart not his portion, according to the law of my gospel, unto the poor and the needy, he shall, with the wicked, lift up his eyes in hell, being in torment.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.19
    scripture: doctrine-and-covenants
    name: D&C 104:19
    chapter: 104
    verse: 19
    ordinal: 2655
    text: And now, verily I say unto you, concerning the properties of the order—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.20
    scripture: doctrine-and-covenants
    name: D&C 104:20
    chapter: 104
    verse: 20
    ordinal: 2656
    text: Let my servant Sidney Rigdon have appointed unto him the place where he now resides, and the lot of the tannery for his stewardship, for his support while he is laboring in my vineyard, even as I will, when I shall command him.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.21
    scripture: doctrine-and-covenants
    name: D&C 104:21
    chapter: 104
    verse: 21
    ordinal: 2657
    text: And let all things be done according to the counsel of the order, and united consent or voice of the order, which dwell in the land of Kirtland.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.22
    scripture: doctrine-and-covenants
    name: D&C 104:22
    chapter: 104
    verse: 22
    ordinal: 2658
    text: And this stewardship and blessing, I, the Lord, confer upon my servant Sidney Rigdon for a blessing upon him, and his seed after him;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.23
    scripture: doctrine-and-covenants
    name: D&C 104:23
    chapter: 104
    verse: 23
    ordinal: 2659
    text: And I will multiply blessings upon him, inasmuch as he will be humble before me.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.24
    scripture: doctrine-and-covenants
    name: D&C 104:24
    chapter: 104
    verse: 24
    ordinal: 2660
    text: And again, let my servant Martin Harris have appointed unto him, for his stewardship, the lot of land which my servant John Johnson obtained in exchange for his former inheritance, for him and his seed after him;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.25
    scripture: doctrine-and-covenants
    name: D&C 104:25
    chapter: 104
    verse: 25
    ordinal: 2661
    text: And inasmuch as he is faithful, I will multiply blessings upon him and his seed after him.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.26
    scripture: doctrine-and-covenants
    name: D&C 104:26
    chapter: 104
    verse: 26
    ordinal: 2662
    text: And let my servant Martin Harris devote his moneys for the proclaiming of my words, according as my servant Joseph Smith, Jun., shall direct.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.27
    scripture: doctrine-and-covenants
    name: D&C 104:27
    chapter: 104
    verse: 27
    ordinal: 2663
    text: And again, let my servant Frederick G. Williams have the place upon which he now dwells.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.28
    scripture: doctrine-and-covenants
    name: D&C 104:28
    chapter: 104
    verse: 28
    ordinal: 2664
    text: And let my servant Oliver Cowdery have the lot which is set off joining the house, which is to be for the printing office, which is lot number one, and also the lot upon which his father resides.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.29
    scripture: doctrine-and-covenants
    name: D&C 104:29
    chapter: 104
    verse: 29
    ordinal: 2665
    text: And let my servants Frederick G. Williams and Oliver Cowdery have the printing office and all things that pertain unto it.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.30
    scripture: doctrine-and-covenants
    name: D&C 104:30
    chapter: 104
    verse: 30
    ordinal: 2666
    text: And this shall be their stewardship which shall be appointed unto them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.31
    scripture: doctrine-and-covenants
    name: D&C 104:31
    chapter: 104
    verse: 31
    ordinal: 2667
    text: And inasmuch as they are faithful, behold I will bless, and multiply blessings upon them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.32
    scripture: doctrine-and-covenants
    name: D&C 104:32
    chapter: 104
    verse: 32
    ordinal: 2668
    text: And this is the beginning of the stewardship which I have appointed them, for them and their seed after them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.33
    scripture: doctrine-and-covenants
    name: D&C 104:33
    chapter: 104
    verse: 33
    ordinal: 2669
    text: And, inasmuch as they are faithful, I will multiply blessings upon them and their seed after them, even a multiplicity of blessings.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.34
    scripture: doctrine-and-covenants
    name: D&C 104:34
    chapter: 104
    verse: 34
    ordinal: 2670
    text: And again, let my servant John Johnson have the house in which he lives, and the inheritance, all save the ground which has been reserved for the building of my houses, which pertains to that inheritance, and those lots which have been named for my servant Oliver Cowdery.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.35
    scripture: doctrine-and-covenants
    name: D&C 104:35
    chapter: 104
    verse: 35
    ordinal: 2671
    text: And inasmuch as he is faithful, I will multiply blessings upon him.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.36
    scripture: doctrine-and-covenants
    name: D&C 104:36
    chapter: 104
    verse: 36
    ordinal: 2672
    text: And it is my will that he should sell the lots that are laid off for the building up of the city of my saints, inasmuch as it shall be made known to him by the voice of the Spirit, and according to the counsel of the order, and by the voice of the order.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.37
    scripture: doctrine-and-covenants
    name: D&C 104:37
    chapter: 104
    verse: 37
    ordinal: 2673
    text: And this is the beginning of the stewardship which I have appointed unto him, for a blessing unto him and his seed after him.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.38
    scripture: doctrine-and-covenants
    name: D&C 104:38
    chapter: 104
    verse: 38
    ordinal: 2674
    text: And inasmuch as he is faithful, I will multiply a multiplicity of blessings upon him.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.39
    scripture: doctrine-and-covenants
    name: D&C 104:39
    chapter: 104
    verse: 39
    ordinal: 2675
    text: And again, let my servant Newel K. Whitney have appointed unto him the houses and lot where he now resides, and the lot and building on which the mercantile establishment stands, and also the lot which is on the corner south of the mercantile establishment, and also the lot on which the ashery is situated.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.40
    scripture: doctrine-and-covenants
    name: D&C 104:40
    chapter: 104
    verse: 40
    ordinal: 2676
    text: And all this I have appointed unto my servant Newel K. Whitney for his stewardship, for a blessing upon him and his seed after him, for the benefit of the mercantile establishment of my order which I have established for my stake in the land of Kirtland.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.41
    scripture: doctrine-and-covenants
    name: D&C 104:41
    chapter: 104
    verse: 41
    ordinal: 2677
    text: Yea, verily, this is the stewardship which I have appointed unto my servant N. K. Whitney, even this whole mercantile establishment, him and his agent, and his seed after him.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.42
    scripture: doctrine-and-covenants
    name: D&C 104:42
    chapter: 104
    verse: 42
    ordinal: 2678
    text: And inasmuch as he is faithful in keeping my commandments, which I have given unto him, I will multiply blessings upon him and his seed after him, even a multiplicity of blessings.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.43
    scripture: doctrine-and-covenants
    name: D&C 104:43
    chapter: 104
    verse: 43
    ordinal: 2679
    text: And again, let my servant Joseph Smith, Jun., have appointed unto him the lot which is laid off for the building of my house, which is forty rods long and twelve wide, and also the inheritance upon which his father now resides;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.44
    scripture: doctrine-and-covenants
    name: D&C 104:44
    chapter: 104
    verse: 44
    ordinal: 2680
    text: And this is the beginning of the stewardship which I have appointed unto him, for a blessing upon him, and upon his father.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.45
    scripture: doctrine-and-covenants
    name: D&C 104:45
    chapter: 104
    verse: 45
    ordinal: 2681
    text: For behold, I have reserved an inheritance for his father, for his support; therefore he shall be reckoned in the house of my servant Joseph Smith, Jun.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.46
    scripture: doctrine-and-covenants
    name: D&C 104:46
    chapter: 104
    verse: 46
    ordinal: 2682
    text: And I will multiply blessings upon the house of my servant Joseph Smith, Jun., inasmuch as he is faithful, even a multiplicity of blessings.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.47
    scripture: doctrine-and-covenants
    name: D&C 104:47
    chapter: 104
    verse: 47
    ordinal: 2683
    text: And now, a commandment I give unto you concerning Zion, that you shall no longer be bound as a united order to your brethren of Zion, only on this wise—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.48
    scripture: doctrine-and-covenants
    name: D&C 104:48
    chapter: 104
    verse: 48
    ordinal: 2684
    text: After you are organized, you shall be called the United Order of the Stake of Zion, the City of Kirtland. And your brethren, after they are organized, shall be called the United Order of the City of Zion.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.49
    scripture: doctrine-and-covenants
    name: D&C 104:49
    chapter: 104
    verse: 49
    ordinal: 2685
    text: And they shall be organized in their own names, and in their own name; and they shall do their business in their own name, and in their own names;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.50
    scripture: doctrine-and-covenants
    name: D&C 104:50
    chapter: 104
    verse: 50
    ordinal: 2686
    text: And you shall do your business in your own name, and in your own names.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.51
    scripture: doctrine-and-covenants
    name: D&C 104:51
    chapter: 104
    verse: 51
    ordinal: 2687
    text: And this I have commanded to be done for your salvation, and also for their salvation, in consequence of their being driven out and that which is to come.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.52
    scripture: doctrine-and-covenants
    name: D&C 104:52
    chapter: 104
    verse: 52
    ordinal: 2688
    text: The covenants being broken through transgression, by covetousness and feigned words—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.53
    scripture: doctrine-and-covenants
    name: D&C 104:53
    chapter: 104
    verse: 53
    ordinal: 2689
    text: Therefore, you are dissolved as a united order with your brethren, that you are not bound only up to this hour unto them, only on this wise, as I said, by loan as shall be agreed by this order in council, as your circumstances will admit and the voice of the council direct.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.54
    scripture: doctrine-and-covenants
    name: D&C 104:54
    chapter: 104
    verse: 54
    ordinal: 2690
    text: And again, a commandment I give unto you concerning your stewardship which I have appointed unto you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.55
    scripture: doctrine-and-covenants
    name: D&C 104:55
    chapter: 104
    verse: 55
    ordinal: 2691
    text: Behold, all these properties are mine, or else your faith is vain, and ye are found hypocrites, and the covenants which ye have made unto me are broken;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.56
    scripture: doctrine-and-covenants
    name: D&C 104:56
    chapter: 104
    verse: 56
    ordinal: 2692
    text: And if the properties are mine, then ye are stewards; otherwise ye are no stewards.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.57
    scripture: doctrine-and-covenants
    name: D&C 104:57
    chapter: 104
    verse: 57
    ordinal: 2693
    text: But, verily I say unto you, I have appointed unto you to be stewards over mine house, even stewards indeed.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.58
    scripture: doctrine-and-covenants
    name: D&C 104:58
    chapter: 104
    verse: 58
    ordinal: 2694
    text: And for this purpose I have commanded you to organize yourselves, even to print my words, the fulness of my scriptures, the revelations which I have given unto you, and which I shall, hereafter, from time to time give unto you—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.59
    scripture: doctrine-and-covenants
    name: D&C 104:59
    chapter: 104
    verse: 59
    ordinal: 2695
    text: For the purpose of building up my church and kingdom on the earth, and to prepare my people for the time when I shall dwell with them, which is nigh at hand.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.60
    scripture: doctrine-and-covenants
    name: D&C 104:60
    chapter: 104
    verse: 60
    ordinal: 2696
    text: And ye shall prepare for yourselves a place for a treasury, and consecrate it unto my name.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.61
    scripture: doctrine-and-covenants
    name: D&C 104:61
    chapter: 104
    verse: 61
    ordinal: 2697
    text: And ye shall appoint one among you to keep the treasury, and he shall be ordained unto this blessing.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.62
    scripture: doctrine-and-covenants
    name: D&C 104:62
    chapter: 104
    verse: 62
    ordinal: 2698
    text: And there shall be a seal upon the treasury, and all the sacred things shall be delivered into the treasury; and no man among you shall call it his own, or any part of it, for it shall belong to you all with one accord.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.63
    scripture: doctrine-and-covenants
    name: D&C 104:63
    chapter: 104
    verse: 63
    ordinal: 2699
    text: And I give it unto you from this very hour; and now see to it, that ye go to and make use of the stewardship which I have appointed unto you, exclusive of the sacred things, for the purpose of printing these sacred things as I have said.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.64
    scripture: doctrine-and-covenants
    name: D&C 104:64
    chapter: 104
    verse: 64
    ordinal: 2700
    text: And the avails of the sacred things shall be had in the treasury, and a seal shall be upon it; and it shall not be used or taken out of the treasury by any one, neither shall the seal be loosed which shall be placed upon it, only by the voice of the order, or by commandment.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.65
    scripture: doctrine-and-covenants
    name: D&C 104:65
    chapter: 104
    verse: 65
    ordinal: 2701
    text: And thus shall ye preserve the avails of the sacred things in the treasury, for sacred and holy purposes.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.66
    scripture: doctrine-and-covenants
    name: D&C 104:66
    chapter: 104
    verse: 66
    ordinal: 2702
    text: And this shall be called the sacred treasury of the Lord; and a seal shall be kept upon it that it may be holy and consecrated unto the Lord.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.67
    scripture: doctrine-and-covenants
    name: D&C 104:67
    chapter: 104
    verse: 67
    ordinal: 2703
    text: And again, there shall be another treasury prepared, and a treasurer appointed to keep the treasury, and a seal shall be placed upon it;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.68
    scripture: doctrine-and-covenants
    name: D&C 104:68
    chapter: 104
    verse: 68
    ordinal: 2704
    text: And all moneys that you receive in your stewardships, by improving upon the properties which I have appointed unto you, in houses, or in lands, or in cattle, or in all things save it be the holy and sacred writings, which I have reserved unto myself for holy and sacred purposes, shall be cast into the treasury as fast as you receive moneys, by hundreds, or by fifties, or by twenties, or by tens, or by fives.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.69
    scripture: doctrine-and-covenants
    name: D&C 104:69
    chapter: 104
    verse: 69
    ordinal: 2705
    text: Or in other words, if any man among you obtain five dollars let him cast them into the treasury; or if he obtain ten, or twenty, or fifty, or an hundred, let him do likewise;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.70
    scripture: doctrine-and-covenants
    name: D&C 104:70
    chapter: 104
    verse: 70
    ordinal: 2706
    text: And let not any among you say that it is his own; for it shall not be called his, nor any part of it.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.71
    scripture: doctrine-and-covenants
    name: D&C 104:71
    chapter: 104
    verse: 71
    ordinal: 2707
    text: And there shall not any part of it be used, or taken out of the treasury, only by the voice and common consent of the order.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.72
    scripture: doctrine-and-covenants
    name: D&C 104:72
    chapter: 104
    verse: 72
    ordinal: 2708
    text: 'And this shall be the voice and common consent of the order—that any man among you say to the treasurer: I have need of this to help me in my stewardship—'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.73
    scripture: doctrine-and-covenants
    name: D&C 104:73
    chapter: 104
    verse: 73
    ordinal: 2709
    text: If it be five dollars, or if it be ten dollars, or twenty, or fifty, or a hundred, the treasurer shall give unto him the sum which he requires to help him in his stewardship—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.74
    scripture: doctrine-and-covenants
    name: D&C 104:74
    chapter: 104
    verse: 74
    ordinal: 2710
    text: Until he be found a transgressor, and it is manifest before the council of the order plainly that he is an unfaithful and an unwise steward.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.75
    scripture: doctrine-and-covenants
    name: D&C 104:75
    chapter: 104
    verse: 75
    ordinal: 2711
    text: But so long as he is in full fellowship, and is faithful and wise in his stewardship, this shall be his token unto the treasurer that the treasurer shall not withhold.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.76
    scripture: doctrine-and-covenants
    name: D&C 104:76
    chapter: 104
    verse: 76
    ordinal: 2712
    text: But in case of transgression, the treasurer shall be subject unto the council and voice of the order.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.77
    scripture: doctrine-and-covenants
    name: D&C 104:77
    chapter: 104
    verse: 77
    ordinal: 2713
    text: And in case the treasurer is found an unfaithful and an unwise steward, he shall be subject to the council and voice of the order, and shall be removed out of his place, and another shall be appointed in his stead.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.78
    scripture: doctrine-and-covenants
    name: D&C 104:78
    chapter: 104
    verse: 78
    ordinal: 2714
    text: And again, verily I say unto you, concerning your debts—behold it is my will that you shall pay all your debts.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.79
    scripture: doctrine-and-covenants
    name: D&C 104:79
    chapter: 104
    verse: 79
    ordinal: 2715
    text: And it is my will that you shall humble yourselves before me, and obtain this blessing by your diligence and humility and the prayer of faith.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.80
    scripture: doctrine-and-covenants
    name: D&C 104:80
    chapter: 104
    verse: 80
    ordinal: 2716
    text: And inasmuch as you are diligent and humble, and exercise the prayer of faith, behold, I will soften the hearts of those to whom you are in debt, until I shall send means unto you for your deliverance.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.81
    scripture: doctrine-and-covenants
    name: D&C 104:81
    chapter: 104
    verse: 81
    ordinal: 2717
    text: Therefore write speedily to New York and write according to that which shall be dictated by my Spirit; and I will soften the hearts of those to whom you are in debt, that it shall be taken away out of their minds to bring affliction upon you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.82
    scripture: doctrine-and-covenants
    name: D&C 104:82
    chapter: 104
    verse: 82
    ordinal: 2718
    text: And inasmuch as ye are humble and faithful and call upon my name, behold, I will give you the victory.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.83
    scripture: doctrine-and-covenants
    name: D&C 104:83
    chapter: 104
    verse: 83
    ordinal: 2719
    text: I give unto you a promise, that you shall be delivered this once out of your bondage.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.84
    scripture: doctrine-and-covenants
    name: D&C 104:84
    chapter: 104
    verse: 84
    ordinal: 2720
    text: Inasmuch as you obtain a chance to loan money by hundreds, or thousands, even until you shall loan enough to deliver yourself from bondage, it is your privilege.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.85
    scripture: doctrine-and-covenants
    name: D&C 104:85
    chapter: 104
    verse: 85
    ordinal: 2721
    text: And pledge the properties which I have put into your hands, this once, by giving your names by common consent or otherwise, as it shall seem good unto you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.104.86
    scripture: doctrine-and-covenants
    name: D&C 104:86
    chapter: 104
    verse: 86
    ordinal: 2722
    text: I give unto you this privilege, this once; and behold, if you proceed to do the things which I have laid before you, according to my commandments, all these things are mine, and ye are my stewards, and the master will not suffer his house to be broken up. Even so. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.104
- type: DcVerse
  data:
    ref: dc.105.1
    scripture: doctrine-and-covenants
    name: D&C 105:1
    chapter: 105
    verse: 1
    ordinal: 2723
    text: Verily I say unto you who have assembled yourselves together that you may learn my will concerning the redemption of mine afflicted people—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.105
- type: DcVerse
  data:
    ref: dc.105.2
    scripture: doctrine-and-covenants
    name: D&C 105:2
    chapter: 105
    verse: 2
    ordinal: 2724
    text: Behold, I say unto you, were it not for the transgressions of my people, speaking concerning the church and not individuals, they might have been redeemed even now.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.105
- type: DcVerse
  data:
    ref: dc.105.3
    scripture: doctrine-and-covenants
    name: D&C 105:3
    chapter: 105
    verse: 3
    ordinal: 2725
    text: But behold, they have not learned to be obedient to the things which I required at their hands, but are full of all manner of evil, and do not impart of their substance, as becometh saints, to the poor and afflicted among them;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.105
- type: DcVerse
  data:
    ref: dc.105.4
    scripture: doctrine-and-covenants
    name: D&C 105:4
    chapter: 105
    verse: 4
    ordinal: 2726
    text: And are not united according to the union required by the law of the celestial kingdom;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.105
- type: DcVerse
  data:
    ref: dc.105.5
    scripture: doctrine-and-covenants
    name: D&C 105:5
    chapter: 105
    verse: 5
    ordinal: 2727
    text: And Zion cannot be built up unless it is by the principles of the law of the celestial kingdom; otherwise I cannot receive her unto myself.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.105
- type: DcVerse
  data:
    ref: dc.105.6
    scripture: doctrine-and-covenants
    name: D&C 105:6
    chapter: 105
    verse: 6
    ordinal: 2728
    text: And my people must needs be chastened until they learn obedience, if it must needs be, by the things which they suffer.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.105
- type: DcVerse
  data:
    ref: dc.105.7
    scripture: doctrine-and-covenants
    name: D&C 105:7
    chapter: 105
    verse: 7
    ordinal: 2729
    text: I speak not concerning those who are appointed to lead my people, who are the first elders of my church, for they are not all under this condemnation;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.105
- type: DcVerse
  data:
    ref: dc.105.8
    scripture: doctrine-and-covenants
    name: D&C 105:8
    chapter: 105
    verse: 8
    ordinal: 2730
    text: 'But I speak concerning my churches abroad—there are many who will say: Where is their God? Behold, he will deliver them in time of trouble, otherwise we will not go up unto Zion, and will keep our moneys.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.105
- type: DcVerse
  data:
    ref: dc.105.9
    scripture: doctrine-and-covenants
    name: D&C 105:9
    chapter: 105
    verse: 9
    ordinal: 2731
    text: Therefore, in consequence of the transgressions of my people, it is expedient in me that mine elders should wait for a little season for the redemption of Zion—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.105
- type: DcVerse
  data:
    ref: dc.105.10
    scripture: doctrine-and-covenants
    name: D&C 105:10
    chapter: 105
    verse: 10
    ordinal: 2732
    text: That they themselves may be prepared, and that my people may be taught more perfectly, and have experience, and know more perfectly concerning their duty, and the things which I require at their hands.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.105
- type: DcVerse
  data:
    ref: dc.105.11
    scripture: doctrine-and-covenants
    name: D&C 105:11
    chapter: 105
    verse: 11
    ordinal: 2733
    text: And this cannot be brought to pass until mine elders are endowed with power from on high.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.105
- type: DcVerse
  data:
    ref: dc.105.12
    scripture: doctrine-and-covenants
    name: D&C 105:12
    chapter: 105
    verse: 12
    ordinal: 2734
    text: For behold, I have prepared a great endowment and blessing to be poured out upon them, inasmuch as they are faithful and continue in humility before me.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.105
- type: DcVerse
  data:
    ref: dc.105.13
    scripture: doctrine-and-covenants
    name: D&C 105:13
    chapter: 105
    verse: 13
    ordinal: 2735
    text: Therefore it is expedient in me that mine elders should wait for a little season, for the redemption of Zion.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.105
- type: DcVerse
  data:
    ref: dc.105.14
    scripture: doctrine-and-covenants
    name: D&C 105:14
    chapter: 105
    verse: 14
    ordinal: 2736
    text: For behold, I do not require at their hands to fight the battles of Zion; for, as I said in a former commandment, even so will I fulfil—I will fight your battles.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.105
- type: DcVerse
  data:
    ref: dc.105.15
    scripture: doctrine-and-covenants
    name: D&C 105:15
    chapter: 105
    verse: 15
    ordinal: 2737
    text: Behold, the destroyer I have sent forth to destroy and lay waste mine enemies; and not many years hence they shall not be left to pollute mine heritage, and to blaspheme my name upon the lands which I have consecrated for the gathering together of my saints.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.105
- type: DcVerse
  data:
    ref: dc.105.16
    scripture: doctrine-and-covenants
    name: D&C 105:16
    chapter: 105
    verse: 16
    ordinal: 2738
    text: Behold, I have commanded my servant Joseph Smith, Jun., to say unto the strength of my house, even my warriors, my young men, and middle-aged, to gather together for the redemption of my people, and throw down the towers of mine enemies, and scatter their watchmen;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.105
- type: DcVerse
  data:
    ref: dc.105.17
    scripture: doctrine-and-covenants
    name: D&C 105:17
    chapter: 105
    verse: 17
    ordinal: 2739
    text: But the strength of mine house have not hearkened unto my words.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.105
- type: DcVerse
  data:
    ref: dc.105.18
    scripture: doctrine-and-covenants
    name: D&C 105:18
    chapter: 105
    verse: 18
    ordinal: 2740
    text: But inasmuch as there are those who have hearkened unto my words, I have prepared a blessing and an endowment for them, if they continue faithful.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.105
- type: DcVerse
  data:
    ref: dc.105.19
    scripture: doctrine-and-covenants
    name: D&C 105:19
    chapter: 105
    verse: 19
    ordinal: 2741
    text: I have heard their prayers, and will accept their offering; and it is expedient in me that they should be brought thus far for a trial of their faith.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.105
- type: DcVerse
  data:
    ref: dc.105.20
    scripture: doctrine-and-covenants
    name: D&C 105:20
    chapter: 105
    verse: 20
    ordinal: 2742
    text: And now, verily I say unto you, a commandment I give unto you, that as many as have come up hither, that can stay in the region round about, let them stay;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.105
- type: DcVerse
  data:
    ref: dc.105.21
    scripture: doctrine-and-covenants
    name: D&C 105:21
    chapter: 105
    verse: 21
    ordinal: 2743
    text: And those that cannot stay, who have families in the east, let them tarry for a little season, inasmuch as my servant Joseph shall appoint unto them;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.105
- type: DcVerse
  data:
    ref: dc.105.22
    scripture: doctrine-and-covenants
    name: D&C 105:22
    chapter: 105
    verse: 22
    ordinal: 2744
    text: For I will counsel him concerning this matter, and all things whatsoever he shall appoint unto them shall be fulfilled.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.105
- type: DcVerse
  data:
    ref: dc.105.23
    scripture: doctrine-and-covenants
    name: D&C 105:23
    chapter: 105
    verse: 23
    ordinal: 2745
    text: And let all my people who dwell in the regions round about be very faithful, and prayerful, and humble before me, and reveal not the things which I have revealed unto them, until it is wisdom in me that they should be revealed.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.105
- type: DcVerse
  data:
    ref: dc.105.24
    scripture: doctrine-and-covenants
    name: D&C 105:24
    chapter: 105
    verse: 24
    ordinal: 2746
    text: Talk not of judgments, neither boast of faith nor of mighty works, but carefully gather together, as much in one region as can be, consistently with the feelings of the people;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.105
- type: DcVerse
  data:
    ref: dc.105.25
    scripture: doctrine-and-covenants
    name: D&C 105:25
    chapter: 105
    verse: 25
    ordinal: 2747
    text: 'And behold, I will give unto you favor and grace in their eyes, that you may rest in peace and safety, while you are saying unto the people: Execute judgment and justice for us according to law, and redress us of our wrongs.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.105
- type: DcVerse
  data:
    ref: dc.105.26
    scripture: doctrine-and-covenants
    name: D&C 105:26
    chapter: 105
    verse: 26
    ordinal: 2748
    text: Now, behold, I say unto you, my friends, in this way you may find favor in the eyes of the people, until the army of Israel becomes very great.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.105
- type: DcVerse
  data:
    ref: dc.105.27
    scripture: doctrine-and-covenants
    name: D&C 105:27
    chapter: 105
    verse: 27
    ordinal: 2749
    text: And I will soften the hearts of the people, as I did the heart of Pharaoh, from time to time, until my servant Joseph Smith, Jun., and mine elders, whom I have appointed, shall have time to gather up the strength of my house,
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.105
- type: DcVerse
  data:
    ref: dc.105.28
    scripture: doctrine-and-covenants
    name: D&C 105:28
    chapter: 105
    verse: 28
    ordinal: 2750
    text: And to have sent wise men, to fulfil that which I have commanded concerning the purchasing of all the lands in Jackson county that can be purchased, and in the adjoining counties round about.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.105
- type: DcVerse
  data:
    ref: dc.105.29
    scripture: doctrine-and-covenants
    name: D&C 105:29
    chapter: 105
    verse: 29
    ordinal: 2751
    text: For it is my will that these lands should be purchased; and after they are purchased that my saints should possess them according to the laws of consecration which I have given.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.105
- type: DcVerse
  data:
    ref: dc.105.30
    scripture: doctrine-and-covenants
    name: D&C 105:30
    chapter: 105
    verse: 30
    ordinal: 2752
    text: And after these lands are purchased, I will hold the armies of Israel guiltless in taking possession of their own lands, which they have previously purchased with their moneys, and of throwing down the towers of mine enemies that may be upon them, and scattering their watchmen, and avenging me of mine enemies unto the third and fourth generation of them that hate me.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.105
- type: DcVerse
  data:
    ref: dc.105.31
    scripture: doctrine-and-covenants
    name: D&C 105:31
    chapter: 105
    verse: 31
    ordinal: 2753
    text: But first let my army become very great, and let it be sanctified before me, that it may become fair as the sun, and clear as the moon, and that her banners may be terrible unto all nations;
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Song of Solomon 6:10
    kjvAllusionOsis:
    - Song.6.10
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.105
- type: DcVerse
  data:
    ref: dc.105.32
    scripture: doctrine-and-covenants
    name: D&C 105:32
    chapter: 105
    verse: 32
    ordinal: 2754
    text: That the kingdoms of this world may be constrained to acknowledge that the kingdom of Zion is in very deed the kingdom of our God and his Christ; therefore, let us become subject unto her laws.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.105
- type: DcVerse
  data:
    ref: dc.105.33
    scripture: doctrine-and-covenants
    name: D&C 105:33
    chapter: 105
    verse: 33
    ordinal: 2755
    text: Verily I say unto you, it is expedient in me that the first elders of my church should receive their endowment from on high in my house, which I have commanded to be built unto my name in the land of Kirtland.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.105
- type: DcVerse
  data:
    ref: dc.105.34
    scripture: doctrine-and-covenants
    name: D&C 105:34
    chapter: 105
    verse: 34
    ordinal: 2756
    text: And let those commandments which I have given concerning Zion and her law be executed and fulfilled, after her redemption.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.105
- type: DcVerse
  data:
    ref: dc.105.35
    scripture: doctrine-and-covenants
    name: D&C 105:35
    chapter: 105
    verse: 35
    ordinal: 2757
    text: There has been a day of calling, but the time has come for a day of choosing; and let those be chosen that are worthy.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.105
- type: DcVerse
  data:
    ref: dc.105.36
    scripture: doctrine-and-covenants
    name: D&C 105:36
    chapter: 105
    verse: 36
    ordinal: 2758
    text: And it shall be manifest unto my servant, by the voice of the Spirit, those that are chosen; and they shall be sanctified;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.105
- type: DcVerse
  data:
    ref: dc.105.37
    scripture: doctrine-and-covenants
    name: D&C 105:37
    chapter: 105
    verse: 37
    ordinal: 2759
    text: And inasmuch as they follow the counsel which they receive, they shall have power after many days to accomplish all things pertaining to Zion.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.105
- type: DcVerse
  data:
    ref: dc.105.38
    scripture: doctrine-and-covenants
    name: D&C 105:38
    chapter: 105
    verse: 38
    ordinal: 2760
    text: And again I say unto you, sue for peace, not only to the people that have smitten you, but also to all people;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.105
- type: DcVerse
  data:
    ref: dc.105.39
    scripture: doctrine-and-covenants
    name: D&C 105:39
    chapter: 105
    verse: 39
    ordinal: 2761
    text: And lift up an ensign of peace, and make a proclamation of peace unto the ends of the earth;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.105
- type: DcVerse
  data:
    ref: dc.105.40
    scripture: doctrine-and-covenants
    name: D&C 105:40
    chapter: 105
    verse: 40
    ordinal: 2762
    text: And make proposals for peace unto those who have smitten you, according to the voice of the Spirit which is in you, and all things shall work together for your good.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.105
- type: DcVerse
  data:
    ref: dc.105.41
    scripture: doctrine-and-covenants
    name: D&C 105:41
    chapter: 105
    verse: 41
    ordinal: 2763
    text: Therefore, be faithful; and behold, and lo, I am with you even unto the end. Even so. Amen.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Matthew 28:20
    kjvAllusionOsis:
    - Matt.28.20
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.105
- type: DcVerse
  data:
    ref: dc.106.1
    scripture: doctrine-and-covenants
    name: D&C 106:1
    chapter: 106
    verse: 1
    ordinal: 2764
    text: It is my will that my servant Warren A. Cowdery should be appointed and ordained a presiding high priest over my church, in the land of Freedom and the regions round about;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.106
- type: DcVerse
  data:
    ref: dc.106.2
    scripture: doctrine-and-covenants
    name: D&C 106:2
    chapter: 106
    verse: 2
    ordinal: 2765
    text: And should preach my everlasting gospel, and lift up his voice and warn the people, not only in his own place, but in the adjoining counties;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.106
- type: DcVerse
  data:
    ref: dc.106.3
    scripture: doctrine-and-covenants
    name: D&C 106:3
    chapter: 106
    verse: 3
    ordinal: 2766
    text: And devote his whole time to this high and holy calling, which I now give unto him, seeking diligently the kingdom of heaven and its righteousness, and all things necessary shall be added thereunto; for the laborer is worthy of his hire.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.106
- type: DcVerse
  data:
    ref: dc.106.4
    scripture: doctrine-and-covenants
    name: D&C 106:4
    chapter: 106
    verse: 4
    ordinal: 2767
    text: And again, verily I say unto you, the coming of the Lord draweth nigh, and it overtaketh the world as a thief in the night—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.106
- type: DcVerse
  data:
    ref: dc.106.5
    scripture: doctrine-and-covenants
    name: D&C 106:5
    chapter: 106
    verse: 5
    ordinal: 2768
    text: Therefore, gird up your loins, that you may be the children of light, and that day shall not overtake you as a thief.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - 1 Thessalonians 5:4
    kjvAllusionOsis:
    - 1Thess.5.4
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.106
- type: DcVerse
  data:
    ref: dc.106.6
    scripture: doctrine-and-covenants
    name: D&C 106:6
    chapter: 106
    verse: 6
    ordinal: 2769
    text: And again, verily I say unto you, there was joy in heaven when my servant Warren bowed to my scepter, and separated himself from the crafts of men;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.106
- type: DcVerse
  data:
    ref: dc.106.7
    scripture: doctrine-and-covenants
    name: D&C 106:7
    chapter: 106
    verse: 7
    ordinal: 2770
    text: Therefore, blessed is my servant Warren, for I will have mercy on him; and, notwithstanding the vanity of his heart, I will lift him up inasmuch as he will humble himself before me.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.106
- type: DcVerse
  data:
    ref: dc.106.8
    scripture: doctrine-and-covenants
    name: D&C 106:8
    chapter: 106
    verse: 8
    ordinal: 2771
    text: And I will give him grace and assurance wherewith he may stand; and if he continue to be a faithful witness and a light unto the church I have prepared a crown for him in the mansions of my Father. Even so. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.106
- type: DcVerse
  data:
    ref: dc.107.1
    scripture: doctrine-and-covenants
    name: D&C 107:1
    chapter: 107
    verse: 1
    ordinal: 2772
    text: There are, in the church, two priesthoods, namely, the Melchizedek and Aaronic, including the Levitical Priesthood.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.2
    scripture: doctrine-and-covenants
    name: D&C 107:2
    chapter: 107
    verse: 2
    ordinal: 2773
    text: Why the first is called the Melchizedek Priesthood is because Melchizedek was such a great high priest.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.3
    scripture: doctrine-and-covenants
    name: D&C 107:3
    chapter: 107
    verse: 3
    ordinal: 2774
    text: Before his day it was called the Holy Priesthood, after the Order of the Son of God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.4
    scripture: doctrine-and-covenants
    name: D&C 107:4
    chapter: 107
    verse: 4
    ordinal: 2775
    text: But out of respect or reverence to the name of the Supreme Being, to avoid the too frequent repetition of his name, they, the church, in ancient days, called that priesthood after Melchizedek, or the Melchizedek Priesthood.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.5
    scripture: doctrine-and-covenants
    name: D&C 107:5
    chapter: 107
    verse: 5
    ordinal: 2776
    text: All other authorities or offices in the church are appendages to this priesthood.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.6
    scripture: doctrine-and-covenants
    name: D&C 107:6
    chapter: 107
    verse: 6
    ordinal: 2777
    text: But there are two divisions or grand heads—one is the Melchizedek Priesthood, and the other is the Aaronic or Levitical Priesthood.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.7
    scripture: doctrine-and-covenants
    name: D&C 107:7
    chapter: 107
    verse: 7
    ordinal: 2778
    text: The office of an elder comes under the priesthood of Melchizedek.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.8
    scripture: doctrine-and-covenants
    name: D&C 107:8
    chapter: 107
    verse: 8
    ordinal: 2779
    text: The Melchizedek Priesthood holds the right of presidency, and has power and authority over all the offices in the church in all ages of the world, to administer in spiritual things.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.9
    scripture: doctrine-and-covenants
    name: D&C 107:9
    chapter: 107
    verse: 9
    ordinal: 2780
    text: The Presidency of the High Priesthood, after the order of Melchizedek, have a right to officiate in all the offices in the church.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.10
    scripture: doctrine-and-covenants
    name: D&C 107:10
    chapter: 107
    verse: 10
    ordinal: 2781
    text: High priests after the order of the Melchizedek Priesthood have a right to officiate in their own standing, under the direction of the presidency, in administering spiritual things, and also in the office of an elder, priest (of the Levitical order), teacher, deacon, and member.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.11
    scripture: doctrine-and-covenants
    name: D&C 107:11
    chapter: 107
    verse: 11
    ordinal: 2782
    text: An elder has a right to officiate in his stead when the high priest is not present.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.12
    scripture: doctrine-and-covenants
    name: D&C 107:12
    chapter: 107
    verse: 12
    ordinal: 2783
    text: The high priest and elder are to administer in spiritual things, agreeable to the covenants and commandments of the church; and they have a right to officiate in all these offices of the church when there are no higher authorities present.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.13
    scripture: doctrine-and-covenants
    name: D&C 107:13
    chapter: 107
    verse: 13
    ordinal: 2784
    text: The second priesthood is called the Priesthood of Aaron, because it was conferred upon Aaron and his seed, throughout all their generations.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.14
    scripture: doctrine-and-covenants
    name: D&C 107:14
    chapter: 107
    verse: 14
    ordinal: 2785
    text: Why it is called the lesser priesthood is because it is an appendage to the greater, or the Melchizedek Priesthood, and has power in administering outward ordinances.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.15
    scripture: doctrine-and-covenants
    name: D&C 107:15
    chapter: 107
    verse: 15
    ordinal: 2786
    text: The bishopric is the presidency of this priesthood, and holds the keys or authority of the same.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.16
    scripture: doctrine-and-covenants
    name: D&C 107:16
    chapter: 107
    verse: 16
    ordinal: 2787
    text: No man has a legal right to this office, to hold the keys of this priesthood, except he be a literal descendant of Aaron.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.17
    scripture: doctrine-and-covenants
    name: D&C 107:17
    chapter: 107
    verse: 17
    ordinal: 2788
    text: But as a high priest of the Melchizedek Priesthood has authority to officiate in all the lesser offices, he may officiate in the office of bishop when no literal descendant of Aaron can be found, provided he is called and set apart and ordained unto this power by the hands of the Presidency of the Melchizedek Priesthood.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.18
    scripture: doctrine-and-covenants
    name: D&C 107:18
    chapter: 107
    verse: 18
    ordinal: 2789
    text: The power and authority of the higher, or Melchizedek Priesthood, is to hold the keys of all the spiritual blessings of the church—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.19
    scripture: doctrine-and-covenants
    name: D&C 107:19
    chapter: 107
    verse: 19
    ordinal: 2790
    text: To have the privilege of receiving the mysteries of the kingdom of heaven, to have the heavens opened unto them, to commune with the general assembly and church of the Firstborn, and to enjoy the communion and presence of God the Father, and Jesus the mediator of the new covenant.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.20
    scripture: doctrine-and-covenants
    name: D&C 107:20
    chapter: 107
    verse: 20
    ordinal: 2791
    text: The power and authority of the lesser, or Aaronic Priesthood, is to hold the keys of the ministering of angels, and to administer in outward ordinances, the letter of the gospel, the baptism of repentance for the remission of sins, agreeable to the covenants and commandments.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.21
    scripture: doctrine-and-covenants
    name: D&C 107:21
    chapter: 107
    verse: 21
    ordinal: 2792
    text: Of necessity there are presidents, or presiding officers growing out of, or appointed of or from among those who are ordained to the several offices in these two priesthoods.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.22
    scripture: doctrine-and-covenants
    name: D&C 107:22
    chapter: 107
    verse: 22
    ordinal: 2793
    text: Of the Melchizedek Priesthood, three Presiding High Priests, chosen by the body, appointed and ordained to that office, and upheld by the confidence, faith, and prayer of the church, form a quorum of the Presidency of the Church.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.23
    scripture: doctrine-and-covenants
    name: D&C 107:23
    chapter: 107
    verse: 23
    ordinal: 2794
    text: The twelve traveling councilors are called to be the Twelve Apostles, or special witnesses of the name of Christ in all the world—thus differing from other officers in the church in the duties of their calling.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.24
    scripture: doctrine-and-covenants
    name: D&C 107:24
    chapter: 107
    verse: 24
    ordinal: 2795
    text: And they form a quorum, equal in authority and power to the three presidents previously mentioned.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.25
    scripture: doctrine-and-covenants
    name: D&C 107:25
    chapter: 107
    verse: 25
    ordinal: 2796
    text: The Seventy are also called to preach the gospel, and to be especial witnesses unto the Gentiles and in all the world—thus differing from other officers in the church in the duties of their calling.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.26
    scripture: doctrine-and-covenants
    name: D&C 107:26
    chapter: 107
    verse: 26
    ordinal: 2797
    text: And they form a quorum, equal in authority to that of the Twelve special witnesses or Apostles just named.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.27
    scripture: doctrine-and-covenants
    name: D&C 107:27
    chapter: 107
    verse: 27
    ordinal: 2798
    text: And every decision made by either of these quorums must be by the unanimous voice of the same; that is, every member in each quorum must be agreed to its decisions, in order to make their decisions of the same power or validity one with the other—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.28
    scripture: doctrine-and-covenants
    name: D&C 107:28
    chapter: 107
    verse: 28
    ordinal: 2799
    text: A majority may form a quorum when circumstances render it impossible to be otherwise—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.29
    scripture: doctrine-and-covenants
    name: D&C 107:29
    chapter: 107
    verse: 29
    ordinal: 2800
    text: Unless this is the case, their decisions are not entitled to the same blessings which the decisions of a quorum of three presidents were anciently, who were ordained after the order of Melchizedek, and were righteous and holy men.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.30
    scripture: doctrine-and-covenants
    name: D&C 107:30
    chapter: 107
    verse: 30
    ordinal: 2801
    text: The decisions of these quorums, or either of them, are to be made in all righteousness, in holiness, and lowliness of heart, meekness and long-suffering, and in faith, and virtue, and knowledge, temperance, patience, godliness, brotherly kindness and charity;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.31
    scripture: doctrine-and-covenants
    name: D&C 107:31
    chapter: 107
    verse: 31
    ordinal: 2802
    text: Because the promise is, if these things abound in them they shall not be unfruitful in the knowledge of the Lord.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - 2 Peter 1:8
    kjvAllusionOsis:
    - 2Pet.1.8
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.32
    scripture: doctrine-and-covenants
    name: D&C 107:32
    chapter: 107
    verse: 32
    ordinal: 2803
    text: And in case that any decision of these quorums is made in unrighteousness, it may be brought before a general assembly of the several quorums, which constitute the spiritual authorities of the church; otherwise there can be no appeal from their decision.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.33
    scripture: doctrine-and-covenants
    name: D&C 107:33
    chapter: 107
    verse: 33
    ordinal: 2804
    text: The Twelve are a Traveling Presiding High Council, to officiate in the name of the Lord, under the direction of the Presidency of the Church, agreeable to the institution of heaven; to build up the church, and regulate all the affairs of the same in all nations, first unto the Gentiles and secondly unto the Jews.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.34
    scripture: doctrine-and-covenants
    name: D&C 107:34
    chapter: 107
    verse: 34
    ordinal: 2805
    text: The Seventy are to act in the name of the Lord, under the direction of the Twelve or the traveling high council, in building up the church and regulating all the affairs of the same in all nations, first unto the Gentiles and then to the Jews—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.35
    scripture: doctrine-and-covenants
    name: D&C 107:35
    chapter: 107
    verse: 35
    ordinal: 2806
    text: The Twelve being sent out, holding the keys, to open the door by the proclamation of the gospel of Jesus Christ, and first unto the Gentiles and then unto the Jews.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.36
    scripture: doctrine-and-covenants
    name: D&C 107:36
    chapter: 107
    verse: 36
    ordinal: 2807
    text: The standing high councils, at the stakes of Zion, form a quorum equal in authority in the affairs of the church, in all their decisions, to the quorum of the presidency, or to the traveling high council.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.37
    scripture: doctrine-and-covenants
    name: D&C 107:37
    chapter: 107
    verse: 37
    ordinal: 2808
    text: The high council in Zion form a quorum equal in authority in the affairs of the church, in all their decisions, to the councils of the Twelve at the stakes of Zion.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.38
    scripture: doctrine-and-covenants
    name: D&C 107:38
    chapter: 107
    verse: 38
    ordinal: 2809
    text: It is the duty of the traveling high council to call upon the Seventy, when they need assistance, to fill the several calls for preaching and administering the gospel, instead of any others.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.39
    scripture: doctrine-and-covenants
    name: D&C 107:39
    chapter: 107
    verse: 39
    ordinal: 2810
    text: It is the duty of the Twelve, in all large branches of the church, to ordain evangelical ministers, as they shall be designated unto them by revelation—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.40
    scripture: doctrine-and-covenants
    name: D&C 107:40
    chapter: 107
    verse: 40
    ordinal: 2811
    text: The order of this priesthood was confirmed to be handed down from father to son, and rightly belongs to the literal descendants of the chosen seed, to whom the promises were made.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.41
    scripture: doctrine-and-covenants
    name: D&C 107:41
    chapter: 107
    verse: 41
    ordinal: 2812
    text: 'This order was instituted in the days of Adam, and came down by lineage in the following manner:'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.42
    scripture: doctrine-and-covenants
    name: D&C 107:42
    chapter: 107
    verse: 42
    ordinal: 2813
    text: From Adam to Seth, who was ordained by Adam at the age of sixty-nine years, and was blessed by him three years previous to his (Adam's) death, and received the promise of God by his father, that his posterity should be the chosen of the Lord, and that they should be preserved unto the end of the earth;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.43
    scripture: doctrine-and-covenants
    name: D&C 107:43
    chapter: 107
    verse: 43
    ordinal: 2814
    text: Because he (Seth) was a perfect man, and his likeness was the express likeness of his father, insomuch that he seemed to be like unto his father in all things, and could be distinguished from him only by his age.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.44
    scripture: doctrine-and-covenants
    name: D&C 107:44
    chapter: 107
    verse: 44
    ordinal: 2815
    text: Enos was ordained at the age of one hundred and thirty-four years and four months, by the hand of Adam.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.45
    scripture: doctrine-and-covenants
    name: D&C 107:45
    chapter: 107
    verse: 45
    ordinal: 2816
    text: God called upon Cainan in the wilderness in the fortieth year of his age; and he met Adam in journeying to the place Shedolamak. He was eighty-seven years old when he received his ordination.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.46
    scripture: doctrine-and-covenants
    name: D&C 107:46
    chapter: 107
    verse: 46
    ordinal: 2817
    text: Mahalaleel was four hundred and ninety-six years and seven days old when he was ordained by the hand of Adam, who also blessed him.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.47
    scripture: doctrine-and-covenants
    name: D&C 107:47
    chapter: 107
    verse: 47
    ordinal: 2818
    text: Jared was two hundred years old when he was ordained under the hand of Adam, who also blessed him.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.48
    scripture: doctrine-and-covenants
    name: D&C 107:48
    chapter: 107
    verse: 48
    ordinal: 2819
    text: Enoch was twenty-five years old when he was ordained under the hand of Adam; and he was sixty-five and Adam blessed him.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.49
    scripture: doctrine-and-covenants
    name: D&C 107:49
    chapter: 107
    verse: 49
    ordinal: 2820
    text: And he saw the Lord, and he walked with him, and was before his face continually; and he walked with God three hundred and sixty-five years, making him four hundred and thirty years old when he was translated.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.50
    scripture: doctrine-and-covenants
    name: D&C 107:50
    chapter: 107
    verse: 50
    ordinal: 2821
    text: Methuselah was one hundred years old when he was ordained under the hand of Adam.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.51
    scripture: doctrine-and-covenants
    name: D&C 107:51
    chapter: 107
    verse: 51
    ordinal: 2822
    text: Lamech was thirty-two years old when he was ordained under the hand of Seth.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.52
    scripture: doctrine-and-covenants
    name: D&C 107:52
    chapter: 107
    verse: 52
    ordinal: 2823
    text: Noah was ten years old when he was ordained under the hand of Methuselah.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.53
    scripture: doctrine-and-covenants
    name: D&C 107:53
    chapter: 107
    verse: 53
    ordinal: 2824
    text: Three years previous to the death of Adam, he called Seth, Enos, Cainan, Mahalaleel, Jared, Enoch, and Methuselah, who were all high priests, with the residue of his posterity who were righteous, into the valley of Adam-ondi-Ahman, and there bestowed upon them his last blessing.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.54
    scripture: doctrine-and-covenants
    name: D&C 107:54
    chapter: 107
    verse: 54
    ordinal: 2825
    text: And the Lord appeared unto them, and they rose up and blessed Adam, and called him Michael, the prince, the archangel.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.55
    scripture: doctrine-and-covenants
    name: D&C 107:55
    chapter: 107
    verse: 55
    ordinal: 2826
    text: 'And the Lord administered comfort unto Adam, and said unto him: I have set thee to be at the head; a multitude of nations shall come of thee, and thou art a prince over them forever.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.56
    scripture: doctrine-and-covenants
    name: D&C 107:56
    chapter: 107
    verse: 56
    ordinal: 2827
    text: And Adam stood up in the midst of the congregation; and, notwithstanding he was bowed down with age, being full of the Holy Ghost, predicted whatsoever should befall his posterity unto the latest generation.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.57
    scripture: doctrine-and-covenants
    name: D&C 107:57
    chapter: 107
    verse: 57
    ordinal: 2828
    text: These things were all written in the book of Enoch, and are to be testified of in due time.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - 1 Timothy 2:6
    kjvAllusionOsis:
    - 1Tim.2.6
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.58
    scripture: doctrine-and-covenants
    name: D&C 107:58
    chapter: 107
    verse: 58
    ordinal: 2829
    text: 'It is the duty of the Twelve, also, to ordain and set in order all the other officers of the church, agreeable to the revelation which says:'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.59
    scripture: doctrine-and-covenants
    name: D&C 107:59
    chapter: 107
    verse: 59
    ordinal: 2830
    text: To the church of Christ in the land of Zion, in addition to the church laws respecting church business—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.60
    scripture: doctrine-and-covenants
    name: D&C 107:60
    chapter: 107
    verse: 60
    ordinal: 2831
    text: Verily, I say unto you, saith the Lord of Hosts, there must needs be presiding elders to preside over those who are of the office of an elder;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.61
    scripture: doctrine-and-covenants
    name: D&C 107:61
    chapter: 107
    verse: 61
    ordinal: 2832
    text: And also priests to preside over those who are of the office of a priest;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.62
    scripture: doctrine-and-covenants
    name: D&C 107:62
    chapter: 107
    verse: 62
    ordinal: 2833
    text: And also teachers to preside over those who are of the office of a teacher, in like manner, and also the deacons—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.63
    scripture: doctrine-and-covenants
    name: D&C 107:63
    chapter: 107
    verse: 63
    ordinal: 2834
    text: Wherefore, from deacon to teacher, and from teacher to priest, and from priest to elder, severally as they are appointed, according to the covenants and commandments of the church.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.64
    scripture: doctrine-and-covenants
    name: D&C 107:64
    chapter: 107
    verse: 64
    ordinal: 2835
    text: Then comes the High Priesthood, which is the greatest of all.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.65
    scripture: doctrine-and-covenants
    name: D&C 107:65
    chapter: 107
    verse: 65
    ordinal: 2836
    text: Wherefore, it must needs be that one be appointed of the High Priesthood to preside over the priesthood, and he shall be called President of the High Priesthood of the Church;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.66
    scripture: doctrine-and-covenants
    name: D&C 107:66
    chapter: 107
    verse: 66
    ordinal: 2837
    text: Or, in other words, the Presiding High Priest over the High Priesthood of the Church.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.67
    scripture: doctrine-and-covenants
    name: D&C 107:67
    chapter: 107
    verse: 67
    ordinal: 2838
    text: From the same comes the administering of ordinances and blessings upon the church, by the laying on of the hands.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.68
    scripture: doctrine-and-covenants
    name: D&C 107:68
    chapter: 107
    verse: 68
    ordinal: 2839
    text: Wherefore, the office of a bishop is not equal unto it; for the office of a bishop is in administering all temporal things;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.69
    scripture: doctrine-and-covenants
    name: D&C 107:69
    chapter: 107
    verse: 69
    ordinal: 2840
    text: Nevertheless a bishop must be chosen from the High Priesthood, unless he is a literal descendant of Aaron;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.70
    scripture: doctrine-and-covenants
    name: D&C 107:70
    chapter: 107
    verse: 70
    ordinal: 2841
    text: For unless he is a literal descendant of Aaron he cannot hold the keys of that priesthood.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.71
    scripture: doctrine-and-covenants
    name: D&C 107:71
    chapter: 107
    verse: 71
    ordinal: 2842
    text: Nevertheless, a high priest, that is, after the order of Melchizedek, may be set apart unto the ministering of temporal things, having a knowledge of them by the Spirit of truth;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.72
    scripture: doctrine-and-covenants
    name: D&C 107:72
    chapter: 107
    verse: 72
    ordinal: 2843
    text: And also to be a judge in Israel, to do the business of the church, to sit in judgment upon transgressors upon testimony as it shall be laid before him according to the laws, by the assistance of his counselors, whom he has chosen or will choose among the elders of the church.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.73
    scripture: doctrine-and-covenants
    name: D&C 107:73
    chapter: 107
    verse: 73
    ordinal: 2844
    text: This is the duty of a bishop who is not a literal descendant of Aaron, but has been ordained to the High Priesthood after the order of Melchizedek.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.74
    scripture: doctrine-and-covenants
    name: D&C 107:74
    chapter: 107
    verse: 74
    ordinal: 2845
    text: Thus shall he be a judge, even a common judge among the inhabitants of Zion, or in a stake of Zion, or in any branch of the church where he shall be set apart unto this ministry, until the borders of Zion are enlarged and it becomes necessary to have other bishops or judges in Zion or elsewhere.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.75
    scripture: doctrine-and-covenants
    name: D&C 107:75
    chapter: 107
    verse: 75
    ordinal: 2846
    text: And inasmuch as there are other bishops appointed they shall act in the same office.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.76
    scripture: doctrine-and-covenants
    name: D&C 107:76
    chapter: 107
    verse: 76
    ordinal: 2847
    text: But a literal descendant of Aaron has a legal right to the presidency of this priesthood, to the keys of this ministry, to act in the office of bishop independently, without counselors, except in a case where a President of the High Priesthood, after the order of Melchizedek, is tried, to sit as a judge in Israel.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.77
    scripture: doctrine-and-covenants
    name: D&C 107:77
    chapter: 107
    verse: 77
    ordinal: 2848
    text: 'And the decision of either of these councils, agreeable to the commandment which says:'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.78
    scripture: doctrine-and-covenants
    name: D&C 107:78
    chapter: 107
    verse: 78
    ordinal: 2849
    text: Again, verily, I say unto you, the most important business of the church, and the most difficult cases of the church, inasmuch as there is not satisfaction upon the decision of the bishop or judges, it shall be handed over and carried up unto the council of the church, before the Presidency of the High Priesthood.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.79
    scripture: doctrine-and-covenants
    name: D&C 107:79
    chapter: 107
    verse: 79
    ordinal: 2850
    text: And the Presidency of the council of the High Priesthood shall have power to call other high priests, even twelve, to assist as counselors; and thus the Presidency of the High Priesthood and its counselors shall have power to decide upon testimony according to the laws of the church.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.80
    scripture: doctrine-and-covenants
    name: D&C 107:80
    chapter: 107
    verse: 80
    ordinal: 2851
    text: And after this decision it shall be had in remembrance no more before the Lord; for this is the highest council of the church of God, and a final decision upon controversies in spiritual matters.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.81
    scripture: doctrine-and-covenants
    name: D&C 107:81
    chapter: 107
    verse: 81
    ordinal: 2852
    text: There is not any person belonging to the church who is exempt from this council of the church.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.82
    scripture: doctrine-and-covenants
    name: D&C 107:82
    chapter: 107
    verse: 82
    ordinal: 2853
    text: And inasmuch as a President of the High Priesthood shall transgress, he shall be had in remembrance before the common council of the church, who shall be assisted by twelve counselors of the High Priesthood;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.83
    scripture: doctrine-and-covenants
    name: D&C 107:83
    chapter: 107
    verse: 83
    ordinal: 2854
    text: And their decision upon his head shall be an end of controversy concerning him.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.84
    scripture: doctrine-and-covenants
    name: D&C 107:84
    chapter: 107
    verse: 84
    ordinal: 2855
    text: Thus, none shall be exempted from the justice and the laws of God, that all things may be done in order and in solemnity before him, according to truth and righteousness.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.85
    scripture: doctrine-and-covenants
    name: D&C 107:85
    chapter: 107
    verse: 85
    ordinal: 2856
    text: And again, verily I say unto you, the duty of a president over the office of a deacon is to preside over twelve deacons, to sit in council with them, and to teach them their duty, edifying one another, as it is given according to the covenants.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.86
    scripture: doctrine-and-covenants
    name: D&C 107:86
    chapter: 107
    verse: 86
    ordinal: 2857
    text: And also the duty of the president over the office of the teachers is to preside over twenty-four of the teachers, and to sit in council with them, teaching them the duties of their office, as given in the covenants.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.87
    scripture: doctrine-and-covenants
    name: D&C 107:87
    chapter: 107
    verse: 87
    ordinal: 2858
    text: Also the duty of the president over the Priesthood of Aaron is to preside over forty-eight priests, and sit in council with them, to teach them the duties of their office, as is given in the covenants—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.88
    scripture: doctrine-and-covenants
    name: D&C 107:88
    chapter: 107
    verse: 88
    ordinal: 2859
    text: This president is to be a bishop; for this is one of the duties of this priesthood.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.89
    scripture: doctrine-and-covenants
    name: D&C 107:89
    chapter: 107
    verse: 89
    ordinal: 2860
    text: Again, the duty of the president over the office of elders is to preside over ninety-six elders, and to sit in council with them, and to teach them according to the covenants.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.90
    scripture: doctrine-and-covenants
    name: D&C 107:90
    chapter: 107
    verse: 90
    ordinal: 2861
    text: This presidency is a distinct one from that of the seventy, and is designed for those who do not travel into all the world.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.91
    scripture: doctrine-and-covenants
    name: D&C 107:91
    chapter: 107
    verse: 91
    ordinal: 2862
    text: And again, the duty of the President of the office of the High Priesthood is to preside over the whole church, and to be like unto Moses—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.92
    scripture: doctrine-and-covenants
    name: D&C 107:92
    chapter: 107
    verse: 92
    ordinal: 2863
    text: Behold, here is wisdom; yea, to be a seer, a revelator, a translator, and a prophet, having all the gifts of God which he bestows upon the head of the church.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.93
    scripture: doctrine-and-covenants
    name: D&C 107:93
    chapter: 107
    verse: 93
    ordinal: 2864
    text: And it is according to the vision showing the order of the Seventy, that they should have seven presidents to preside over them, chosen out of the number of the seventy;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.94
    scripture: doctrine-and-covenants
    name: D&C 107:94
    chapter: 107
    verse: 94
    ordinal: 2865
    text: And the seventh president of these presidents is to preside over the six;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.95
    scripture: doctrine-and-covenants
    name: D&C 107:95
    chapter: 107
    verse: 95
    ordinal: 2866
    text: And these seven presidents are to choose other seventy besides the first seventy to whom they belong, and are to preside over them;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.96
    scripture: doctrine-and-covenants
    name: D&C 107:96
    chapter: 107
    verse: 96
    ordinal: 2867
    text: And also other seventy, until seven times seventy, if the labor in the vineyard of necessity requires it.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.97
    scripture: doctrine-and-covenants
    name: D&C 107:97
    chapter: 107
    verse: 97
    ordinal: 2868
    text: And these seventy are to be traveling ministers, unto the Gentiles first and also unto the Jews.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.98
    scripture: doctrine-and-covenants
    name: D&C 107:98
    chapter: 107
    verse: 98
    ordinal: 2869
    text: Whereas other officers of the church, who belong not unto the Twelve, neither to the Seventy, are not under the responsibility to travel among all nations, but are to travel as their circumstances shall allow, notwithstanding they may hold as high and responsible offices in the church.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.99
    scripture: doctrine-and-covenants
    name: D&C 107:99
    chapter: 107
    verse: 99
    ordinal: 2870
    text: Wherefore, now let every man learn his duty, and to act in the office in which he is appointed, in all diligence.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.107.100
    scripture: doctrine-and-covenants
    name: D&C 107:100
    chapter: 107
    verse: 100
    ordinal: 2871
    text: He that is slothful shall not be counted worthy to stand, and he that learns not his duty and shows himself not approved shall not be counted worthy to stand. Even so. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.107
- type: DcVerse
  data:
    ref: dc.108.1
    scripture: doctrine-and-covenants
    name: D&C 108:1
    chapter: 108
    verse: 1
    ordinal: 2872
    text: 'Verily thus saith the Lord unto you, my servant Lyman: Your sins are forgiven you, because you have obeyed my voice in coming up hither this morning to receive counsel of him whom I have appointed.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.108
- type: DcVerse
  data:
    ref: dc.108.2
    scripture: doctrine-and-covenants
    name: D&C 108:2
    chapter: 108
    verse: 2
    ordinal: 2873
    text: Therefore, let your soul be at rest concerning your spiritual standing, and resist no more my voice.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.108
- type: DcVerse
  data:
    ref: dc.108.3
    scripture: doctrine-and-covenants
    name: D&C 108:3
    chapter: 108
    verse: 3
    ordinal: 2874
    text: And arise up and be more careful henceforth in observing your vows, which you have made and do make, and you shall be blessed with exceeding great blessings.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.108
- type: DcVerse
  data:
    ref: dc.108.4
    scripture: doctrine-and-covenants
    name: D&C 108:4
    chapter: 108
    verse: 4
    ordinal: 2875
    text: Wait patiently until the solemn assembly shall be called of my servants, then you shall be remembered with the first of mine elders, and receive right by ordination with the rest of mine elders whom I have chosen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.108
- type: DcVerse
  data:
    ref: dc.108.5
    scripture: doctrine-and-covenants
    name: D&C 108:5
    chapter: 108
    verse: 5
    ordinal: 2876
    text: Behold, this is the promise of the Father unto you if you continue faithful.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.108
- type: DcVerse
  data:
    ref: dc.108.6
    scripture: doctrine-and-covenants
    name: D&C 108:6
    chapter: 108
    verse: 6
    ordinal: 2877
    text: And it shall be fulfilled upon you in that day that you shall have right to preach my gospel wheresoever I shall send you, from henceforth from that time.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.108
- type: DcVerse
  data:
    ref: dc.108.7
    scripture: doctrine-and-covenants
    name: D&C 108:7
    chapter: 108
    verse: 7
    ordinal: 2878
    text: Therefore, strengthen your brethren in all your conversation, in all your prayers, in all your exhortations, and in all your doings.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.108
- type: DcVerse
  data:
    ref: dc.108.8
    scripture: doctrine-and-covenants
    name: D&C 108:8
    chapter: 108
    verse: 8
    ordinal: 2879
    text: And behold, and lo, I am with you to bless you and deliver you forever. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.108
- type: DcVerse
  data:
    ref: dc.109.1
    scripture: doctrine-and-covenants
    name: D&C 109:1
    chapter: 109
    verse: 1
    ordinal: 2880
    text: Thanks be to thy name, O Lord God of Israel, who keepest covenant and showest mercy unto thy servants who walk uprightly before thee, with all their hearts—
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - 2 Chronicles 6:14
    kjvAllusionOsis:
    - 2Chr.6.14
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.2
    scripture: doctrine-and-covenants
    name: D&C 109:2
    chapter: 109
    verse: 2
    ordinal: 2881
    text: Thou who hast commanded thy servants to build a house to thy name in this place [Kirtland].
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.3
    scripture: doctrine-and-covenants
    name: D&C 109:3
    chapter: 109
    verse: 3
    ordinal: 2882
    text: And now thou beholdest, O Lord, that thy servants have done according to thy commandment.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.4
    scripture: doctrine-and-covenants
    name: D&C 109:4
    chapter: 109
    verse: 4
    ordinal: 2883
    text: And now we ask thee, Holy Father, in the name of Jesus Christ, the Son of thy bosom, in whose name alone salvation can be administered to the children of men, we ask thee, O Lord, to accept of this house, the workmanship of the hands of us, thy servants, which thou didst command us to build.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.5
    scripture: doctrine-and-covenants
    name: D&C 109:5
    chapter: 109
    verse: 5
    ordinal: 2884
    text: For thou knowest that we have done this work through great tribulation; and out of our poverty we have given of our substance to build a house to thy name, that the Son of Man might have a place to manifest himself to his people.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.6
    scripture: doctrine-and-covenants
    name: D&C 109:6
    chapter: 109
    verse: 6
    ordinal: 2885
    text: And as thou hast said in a revelation, given to us, calling us thy friends, saying—Call your solemn assembly, as I have commanded you;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.7
    scripture: doctrine-and-covenants
    name: D&C 109:7
    chapter: 109
    verse: 7
    ordinal: 2886
    text: And as all have not faith, seek ye diligently and teach one another words of wisdom; yea, seek ye out of the best books words of wisdom, seek learning even by study and also by faith;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.8
    scripture: doctrine-and-covenants
    name: D&C 109:8
    chapter: 109
    verse: 8
    ordinal: 2887
    text: Organize yourselves; prepare every needful thing, and establish a house, even a house of prayer, a house of fasting, a house of faith, a house of learning, a house of glory, a house of order, a house of God;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.9
    scripture: doctrine-and-covenants
    name: D&C 109:9
    chapter: 109
    verse: 9
    ordinal: 2888
    text: That your incomings may be in the name of the Lord, that your outgoings may be in the name of the Lord, that all your salutations may be in the name of the Lord, with uplifted hands unto the Most High—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.10
    scripture: doctrine-and-covenants
    name: D&C 109:10
    chapter: 109
    verse: 10
    ordinal: 2889
    text: And now, Holy Father, we ask thee to assist us, thy people, with thy grace, in calling our solemn assembly, that it may be done to thine honor and to thy divine acceptance;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.11
    scripture: doctrine-and-covenants
    name: D&C 109:11
    chapter: 109
    verse: 11
    ordinal: 2890
    text: And in a manner that we may be found worthy, in thy sight, to secure a fulfilment of the promises which thou hast made unto us, thy people, in the revelations given unto us;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.12
    scripture: doctrine-and-covenants
    name: D&C 109:12
    chapter: 109
    verse: 12
    ordinal: 2891
    text: That thy glory may rest down upon thy people, and upon this thy house, which we now dedicate to thee, that it may be sanctified and consecrated to be holy, and that thy holy presence may be continually in this house;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.13
    scripture: doctrine-and-covenants
    name: D&C 109:13
    chapter: 109
    verse: 13
    ordinal: 2892
    text: And that all people who shall enter upon the threshold of the Lord's house may feel thy power, and feel constrained to acknowledge that thou hast sanctified it, and that it is thy house, a place of thy holiness.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.14
    scripture: doctrine-and-covenants
    name: D&C 109:14
    chapter: 109
    verse: 14
    ordinal: 2893
    text: And do thou grant, Holy Father, that all those who shall worship in this house may be taught words of wisdom out of the best books, and that they may seek learning even by study, and also by faith, as thou hast said;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.15
    scripture: doctrine-and-covenants
    name: D&C 109:15
    chapter: 109
    verse: 15
    ordinal: 2894
    text: And that they may grow up in thee, and receive a fulness of the Holy Ghost, and be organized according to thy laws, and be prepared to obtain every needful thing;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.16
    scripture: doctrine-and-covenants
    name: D&C 109:16
    chapter: 109
    verse: 16
    ordinal: 2895
    text: And that this house may be a house of prayer, a house of fasting, a house of faith, a house of glory and of God, even thy house;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.17
    scripture: doctrine-and-covenants
    name: D&C 109:17
    chapter: 109
    verse: 17
    ordinal: 2896
    text: That all the incomings of thy people, into this house, may be in the name of the Lord;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.18
    scripture: doctrine-and-covenants
    name: D&C 109:18
    chapter: 109
    verse: 18
    ordinal: 2897
    text: That all their outgoings from this house may be in the name of the Lord;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.19
    scripture: doctrine-and-covenants
    name: D&C 109:19
    chapter: 109
    verse: 19
    ordinal: 2898
    text: And that all their salutations may be in the name of the Lord, with holy hands, uplifted to the Most High;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.20
    scripture: doctrine-and-covenants
    name: D&C 109:20
    chapter: 109
    verse: 20
    ordinal: 2899
    text: And that no unclean thing shall be permitted to come into thy house to pollute it;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.21
    scripture: doctrine-and-covenants
    name: D&C 109:21
    chapter: 109
    verse: 21
    ordinal: 2900
    text: And when thy people transgress, any of them, they may speedily repent and return unto thee, and find favor in thy sight, and be restored to the blessings which thou hast ordained to be poured out upon those who shall reverence thee in thy house.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.22
    scripture: doctrine-and-covenants
    name: D&C 109:22
    chapter: 109
    verse: 22
    ordinal: 2901
    text: And we ask thee, Holy Father, that thy servants may go forth from this house armed with thy power, and that thy name may be upon them, and thy glory be round about them, and thine angels have charge over them;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.23
    scripture: doctrine-and-covenants
    name: D&C 109:23
    chapter: 109
    verse: 23
    ordinal: 2902
    text: And from this place they may bear exceedingly great and glorious tidings, in truth, unto the ends of the earth, that they may know that this is thy work, and that thou hast put forth thy hand, to fulfil that which thou hast spoken by the mouths of the prophets, concerning the last days.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.24
    scripture: doctrine-and-covenants
    name: D&C 109:24
    chapter: 109
    verse: 24
    ordinal: 2903
    text: We ask thee, Holy Father, to establish the people that shall worship, and honorably hold a name and standing in this thy house, to all generations and for eternity;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.25
    scripture: doctrine-and-covenants
    name: D&C 109:25
    chapter: 109
    verse: 25
    ordinal: 2904
    text: That no weapon formed against them shall prosper; that he who diggeth a pit for them shall fall into the same himself;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.26
    scripture: doctrine-and-covenants
    name: D&C 109:26
    chapter: 109
    verse: 26
    ordinal: 2905
    text: That no combination of wickedness shall have power to rise up and prevail over thy people upon whom thy name shall be put in this house;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.27
    scripture: doctrine-and-covenants
    name: D&C 109:27
    chapter: 109
    verse: 27
    ordinal: 2906
    text: And if any people shall rise against this people, that thine anger be kindled against them;
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Numbers 12:9
    kjvAllusionOsis:
    - Num.12.9
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.28
    scripture: doctrine-and-covenants
    name: D&C 109:28
    chapter: 109
    verse: 28
    ordinal: 2907
    text: And if they shall smite this people thou wilt smite them; thou wilt fight for thy people as thou didst in the day of battle, that they may be delivered from the hands of all their enemies.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.29
    scripture: doctrine-and-covenants
    name: D&C 109:29
    chapter: 109
    verse: 29
    ordinal: 2908
    text: We ask thee, Holy Father, to confound, and astonish, and to bring to shame and confusion, all those who have spread lying reports abroad, over the world, against thy servant or servants, if they will not repent, when the everlasting gospel shall be proclaimed in their ears;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.30
    scripture: doctrine-and-covenants
    name: D&C 109:30
    chapter: 109
    verse: 30
    ordinal: 2909
    text: And that all their works may be brought to naught, and be swept away by the hail, and by the judgments which thou wilt send upon them in thine anger, that there may be an end to lyings and slanders against thy people.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.31
    scripture: doctrine-and-covenants
    name: D&C 109:31
    chapter: 109
    verse: 31
    ordinal: 2910
    text: For thou knowest, O Lord, that thy servants have been innocent before thee in bearing record of thy name, for which they have suffered these things.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.32
    scripture: doctrine-and-covenants
    name: D&C 109:32
    chapter: 109
    verse: 32
    ordinal: 2911
    text: Therefore we plead before thee for a full and complete deliverance from under this yoke;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.33
    scripture: doctrine-and-covenants
    name: D&C 109:33
    chapter: 109
    verse: 33
    ordinal: 2912
    text: Break it off, O Lord; break it off from the necks of thy servants, by thy power, that we may rise up in the midst of this generation and do thy work.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.34
    scripture: doctrine-and-covenants
    name: D&C 109:34
    chapter: 109
    verse: 34
    ordinal: 2913
    text: O Jehovah, have mercy upon this people, and as all men sin, forgive the transgressions of thy people, and let them be blotted out forever.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.35
    scripture: doctrine-and-covenants
    name: D&C 109:35
    chapter: 109
    verse: 35
    ordinal: 2914
    text: Let the anointing of thy ministers be sealed upon them with power from on high.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.36
    scripture: doctrine-and-covenants
    name: D&C 109:36
    chapter: 109
    verse: 36
    ordinal: 2915
    text: Let it be fulfilled upon them, as upon those on the day of Pentecost; let the gift of tongues be poured out upon thy people, even cloven tongues as of fire, and the interpretation thereof.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.37
    scripture: doctrine-and-covenants
    name: D&C 109:37
    chapter: 109
    verse: 37
    ordinal: 2916
    text: And let thy house be filled, as with a rushing mighty wind, with thy glory.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Acts 2:2
    kjvAllusionOsis:
    - Acts.2.2
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.38
    scripture: doctrine-and-covenants
    name: D&C 109:38
    chapter: 109
    verse: 38
    ordinal: 2917
    text: Put upon thy servants the testimony of the covenant, that when they go out and proclaim thy word they may seal up the law, and prepare the hearts of thy saints for all those judgments thou art about to send, in thy wrath, upon the inhabitants of the earth, because of their transgressions, that thy people may not faint in the day of trouble.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.39
    scripture: doctrine-and-covenants
    name: D&C 109:39
    chapter: 109
    verse: 39
    ordinal: 2918
    text: And whatsoever city thy servants shall enter, and the people of that city receive their testimony, let thy peace and thy salvation be upon that city; that they may gather out of that city the righteous, that they may come forth to Zion, or to her stakes, the places of thine appointment, with songs of everlasting joy;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.40
    scripture: doctrine-and-covenants
    name: D&C 109:40
    chapter: 109
    verse: 40
    ordinal: 2919
    text: And until this be accomplished, let not thy judgments fall upon that city.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.41
    scripture: doctrine-and-covenants
    name: D&C 109:41
    chapter: 109
    verse: 41
    ordinal: 2920
    text: And whatsoever city thy servants shall enter, and the people of that city receive not the testimony of thy servants, and thy servants warn them to save themselves from this untoward generation, let it be upon that city according to that which thou hast spoken by the mouths of thy prophets.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.42
    scripture: doctrine-and-covenants
    name: D&C 109:42
    chapter: 109
    verse: 42
    ordinal: 2921
    text: But deliver thou, O Jehovah, we beseech thee, thy servants from their hands, and cleanse them from their blood.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.43
    scripture: doctrine-and-covenants
    name: D&C 109:43
    chapter: 109
    verse: 43
    ordinal: 2922
    text: O Lord, we delight not in the destruction of our fellow men; their souls are precious before thee;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.44
    scripture: doctrine-and-covenants
    name: D&C 109:44
    chapter: 109
    verse: 44
    ordinal: 2923
    text: 'But thy word must be fulfilled. Help thy servants to say, with thy grace assisting them: Thy will be done, O Lord, and not ours.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.45
    scripture: doctrine-and-covenants
    name: D&C 109:45
    chapter: 109
    verse: 45
    ordinal: 2924
    text: We know that thou hast spoken by the mouth of thy prophets terrible things concerning the wicked, in the last days—that thou wilt pour out thy judgments, without measure;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.46
    scripture: doctrine-and-covenants
    name: D&C 109:46
    chapter: 109
    verse: 46
    ordinal: 2925
    text: Therefore, O Lord, deliver thy people from the calamity of the wicked; enable thy servants to seal up the law, and bind up the testimony, that they may be prepared against the day of burning.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.47
    scripture: doctrine-and-covenants
    name: D&C 109:47
    chapter: 109
    verse: 47
    ordinal: 2926
    text: We ask thee, Holy Father, to remember those who have been driven by the inhabitants of Jackson county, Missouri, from the lands of their inheritance, and break off, O Lord, this yoke of affliction that has been put upon them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.48
    scripture: doctrine-and-covenants
    name: D&C 109:48
    chapter: 109
    verse: 48
    ordinal: 2927
    text: Thou knowest, O Lord, that they have been greatly oppressed and afflicted by wicked men; and our hearts flow out with sorrow because of their grievous burdens.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.49
    scripture: doctrine-and-covenants
    name: D&C 109:49
    chapter: 109
    verse: 49
    ordinal: 2928
    text: O Lord, how long wilt thou suffer this people to bear this affliction, and the cries of their innocent ones to ascend up in thine ears, and their blood come up in testimony before thee, and not make a display of thy testimony in their behalf?
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.50
    scripture: doctrine-and-covenants
    name: D&C 109:50
    chapter: 109
    verse: 50
    ordinal: 2929
    text: Have mercy, O Lord, upon the wicked mob, who have driven thy people, that they may cease to spoil, that they may repent of their sins if repentance is to be found;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.51
    scripture: doctrine-and-covenants
    name: D&C 109:51
    chapter: 109
    verse: 51
    ordinal: 2930
    text: But if they will not, make bare thine arm, O Lord, and redeem that which thou didst appoint a Zion unto thy people.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.52
    scripture: doctrine-and-covenants
    name: D&C 109:52
    chapter: 109
    verse: 52
    ordinal: 2931
    text: And if it cannot be otherwise, that the cause of thy people may not fail before thee may thine anger be kindled, and thine indignation fall upon them, that they may be wasted away, both root and branch, from under heaven;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.53
    scripture: doctrine-and-covenants
    name: D&C 109:53
    chapter: 109
    verse: 53
    ordinal: 2932
    text: But inasmuch as they will repent, thou art gracious and merciful, and wilt turn away thy wrath when thou lookest upon the face of thine Anointed.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.54
    scripture: doctrine-and-covenants
    name: D&C 109:54
    chapter: 109
    verse: 54
    ordinal: 2933
    text: Have mercy, O Lord, upon all the nations of the earth; have mercy upon the rulers of our land; may those principles, which were so honorably and nobly defended, namely, the Constitution of our land, by our fathers, be established forever.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.55
    scripture: doctrine-and-covenants
    name: D&C 109:55
    chapter: 109
    verse: 55
    ordinal: 2934
    text: Remember the kings, the princes, the nobles, and the great ones of the earth, and all people, and the churches, all the poor, the needy, and afflicted ones of the earth;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.56
    scripture: doctrine-and-covenants
    name: D&C 109:56
    chapter: 109
    verse: 56
    ordinal: 2935
    text: That their hearts may be softened when thy servants shall go out from thy house, O Jehovah, to bear testimony of thy name; that their prejudices may give way before the truth, and thy people may obtain favor in the sight of all;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.57
    scripture: doctrine-and-covenants
    name: D&C 109:57
    chapter: 109
    verse: 57
    ordinal: 2936
    text: That all the ends of the earth may know that we, thy servants, have heard thy voice, and that thou hast sent us;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.58
    scripture: doctrine-and-covenants
    name: D&C 109:58
    chapter: 109
    verse: 58
    ordinal: 2937
    text: That from among all these, thy servants, the sons of Jacob, may gather out the righteous to build a holy city to thy name, as thou hast commanded them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.59
    scripture: doctrine-and-covenants
    name: D&C 109:59
    chapter: 109
    verse: 59
    ordinal: 2938
    text: We ask thee to appoint unto Zion other stakes besides this one which thou hast appointed, that the gathering of thy people may roll on in great power and majesty, that thy work may be cut short in righteousness.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.60
    scripture: doctrine-and-covenants
    name: D&C 109:60
    chapter: 109
    verse: 60
    ordinal: 2939
    text: Now these words, O Lord, we have spoken before thee, concerning the revelations and commandments which thou hast given unto us, who are identified with the Gentiles.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.61
    scripture: doctrine-and-covenants
    name: D&C 109:61
    chapter: 109
    verse: 61
    ordinal: 2940
    text: But thou knowest that thou hast a great love for the children of Jacob, who have been scattered upon the mountains for a long time, in a cloudy and dark day.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.62
    scripture: doctrine-and-covenants
    name: D&C 109:62
    chapter: 109
    verse: 62
    ordinal: 2941
    text: We therefore ask thee to have mercy upon the children of Jacob, that Jerusalem, from this hour, may begin to be redeemed;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.63
    scripture: doctrine-and-covenants
    name: D&C 109:63
    chapter: 109
    verse: 63
    ordinal: 2942
    text: And the yoke of bondage may begin to be broken off from the house of David;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.64
    scripture: doctrine-and-covenants
    name: D&C 109:64
    chapter: 109
    verse: 64
    ordinal: 2943
    text: And the children of Judah may begin to return to the lands which thou didst give to Abraham, their father.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.65
    scripture: doctrine-and-covenants
    name: D&C 109:65
    chapter: 109
    verse: 65
    ordinal: 2944
    text: And cause that the remnants of Jacob, who have been cursed and smitten because of their transgression, be converted from their wild and savage condition to the fulness of the everlasting gospel;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.66
    scripture: doctrine-and-covenants
    name: D&C 109:66
    chapter: 109
    verse: 66
    ordinal: 2945
    text: That they may lay down their weapons of bloodshed, and cease their rebellions.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.67
    scripture: doctrine-and-covenants
    name: D&C 109:67
    chapter: 109
    verse: 67
    ordinal: 2946
    text: And may all the scattered remnants of Israel, who have been driven to the ends of the earth, come to a knowledge of the truth, believe in the Messiah, and be redeemed from oppression, and rejoice before thee.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.68
    scripture: doctrine-and-covenants
    name: D&C 109:68
    chapter: 109
    verse: 68
    ordinal: 2947
    text: O Lord, remember thy servant, Joseph Smith, Jun., and all his afflictions and persecutions—how he has covenanted with Jehovah, and vowed to thee, O Mighty God of Jacob—and the commandments which thou hast given unto him, and that he hath sincerely striven to do thy will.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.69
    scripture: doctrine-and-covenants
    name: D&C 109:69
    chapter: 109
    verse: 69
    ordinal: 2948
    text: Have mercy, O Lord, upon his wife and children, that they may be exalted in thy presence, and preserved by thy fostering hand.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.70
    scripture: doctrine-and-covenants
    name: D&C 109:70
    chapter: 109
    verse: 70
    ordinal: 2949
    text: Have mercy upon all their immediate connections, that their prejudices may be broken up and swept away as with a flood; that they may be converted and redeemed with Israel, and know that thou art God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.71
    scripture: doctrine-and-covenants
    name: D&C 109:71
    chapter: 109
    verse: 71
    ordinal: 2950
    text: Remember, O Lord, the presidents, even all the presidents of thy church, that thy right hand may exalt them, with all their families, and their immediate connections, that their names may be perpetuated and had in everlasting remembrance from generation to generation.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.72
    scripture: doctrine-and-covenants
    name: D&C 109:72
    chapter: 109
    verse: 72
    ordinal: 2951
    text: Remember all thy church, O Lord, with all their families, and all their immediate connections, with all their sick and afflicted ones, with all the poor and meek of the earth; that the kingdom, which thou hast set up without hands, may become a great mountain and fill the whole earth;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.73
    scripture: doctrine-and-covenants
    name: D&C 109:73
    chapter: 109
    verse: 73
    ordinal: 2952
    text: That thy church may come forth out of the wilderness of darkness, and shine forth fair as the moon, clear as the sun, and terrible as an army with banners;
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Song of Solomon 6:10
    kjvAllusionOsis:
    - Song.6.10
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.74
    scripture: doctrine-and-covenants
    name: D&C 109:74
    chapter: 109
    verse: 74
    ordinal: 2953
    text: And be adorned as a bride for that day when thou shalt unveil the heavens, and cause the mountains to flow down at thy presence, and the valleys to be exalted, the rough places made smooth; that thy glory may fill the earth;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.75
    scripture: doctrine-and-covenants
    name: D&C 109:75
    chapter: 109
    verse: 75
    ordinal: 2954
    text: That when the trump shall sound for the dead, we shall be caught up in the cloud to meet thee, that we may ever be with the Lord;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.76
    scripture: doctrine-and-covenants
    name: D&C 109:76
    chapter: 109
    verse: 76
    ordinal: 2955
    text: That our garments may be pure, that we may be clothed upon with robes of righteousness, with palms in our hands, and crowns of glory upon our heads, and reap eternal joy for all our sufferings.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.77
    scripture: doctrine-and-covenants
    name: D&C 109:77
    chapter: 109
    verse: 77
    ordinal: 2956
    text: O Lord God Almighty, hear us in these our petitions, and answer us from heaven, thy holy habitation, where thou sittest enthroned, with glory, honor, power, majesty, might, dominion, truth, justice, judgment, mercy, and an infinity of fulness, from everlasting to everlasting.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.78
    scripture: doctrine-and-covenants
    name: D&C 109:78
    chapter: 109
    verse: 78
    ordinal: 2957
    text: O hear, O hear, O hear us, O Lord! And answer these petitions, and accept the dedication of this house unto thee, the work of our hands, which we have built unto thy name;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.79
    scripture: doctrine-and-covenants
    name: D&C 109:79
    chapter: 109
    verse: 79
    ordinal: 2958
    text: And also this church, to put upon it thy name. And help us by the power of thy Spirit, that we may mingle our voices with those bright, shining seraphs around thy throne, with acclamations of praise, singing Hosanna to God and the Lamb!
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.109.80
    scripture: doctrine-and-covenants
    name: D&C 109:80
    chapter: 109
    verse: 80
    ordinal: 2959
    text: And let these, thine anointed ones, be clothed with salvation, and thy saints shout aloud for joy. Amen, and Amen.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Psalms 132:9
    kjvAllusionOsis:
    - Ps.132.9
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.109
- type: DcVerse
  data:
    ref: dc.110.1
    scripture: doctrine-and-covenants
    name: D&C 110:1
    chapter: 110
    verse: 1
    ordinal: 2960
    text: The veil was taken from our minds, and the eyes of our understanding were opened.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.110
- type: DcVerse
  data:
    ref: dc.110.2
    scripture: doctrine-and-covenants
    name: D&C 110:2
    chapter: 110
    verse: 2
    ordinal: 2961
    text: We saw the Lord standing upon the breastwork of the pulpit, before us; and under his feet was a paved work of pure gold, in color like amber.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.110
- type: DcVerse
  data:
    ref: dc.110.3
    scripture: doctrine-and-covenants
    name: D&C 110:3
    chapter: 110
    verse: 3
    ordinal: 2962
    text: 'His eyes were as a flame of fire; the hair of his head was white like the pure snow; his countenance shone above the brightness of the sun; and his voice was as the sound of the rushing of great waters, even the voice of Jehovah, saying:'
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Revelation 1:14
    kjvAllusionOsis:
    - Rev.1.14
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.110
- type: DcVerse
  data:
    ref: dc.110.4
    scripture: doctrine-and-covenants
    name: D&C 110:4
    chapter: 110
    verse: 4
    ordinal: 2963
    text: I am the first and the last; I am he who liveth, I am he who was slain; I am your advocate with the Father.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.110
- type: DcVerse
  data:
    ref: dc.110.5
    scripture: doctrine-and-covenants
    name: D&C 110:5
    chapter: 110
    verse: 5
    ordinal: 2964
    text: Behold, your sins are forgiven you; you are clean before me; therefore, lift up your heads and rejoice.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.110
- type: DcVerse
  data:
    ref: dc.110.6
    scripture: doctrine-and-covenants
    name: D&C 110:6
    chapter: 110
    verse: 6
    ordinal: 2965
    text: Let the hearts of your brethren rejoice, and let the hearts of all my people rejoice, who have, with their might, built this house to my name.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.110
- type: DcVerse
  data:
    ref: dc.110.7
    scripture: doctrine-and-covenants
    name: D&C 110:7
    chapter: 110
    verse: 7
    ordinal: 2966
    text: For behold, I have accepted this house, and my name shall be here; and I will manifest myself to my people in mercy in this house.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.110
- type: DcVerse
  data:
    ref: dc.110.8
    scripture: doctrine-and-covenants
    name: D&C 110:8
    chapter: 110
    verse: 8
    ordinal: 2967
    text: Yea, I will appear unto my servants, and speak unto them with mine own voice, if my people will keep my commandments, and do not pollute this holy house.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.110
- type: DcVerse
  data:
    ref: dc.110.9
    scripture: doctrine-and-covenants
    name: D&C 110:9
    chapter: 110
    verse: 9
    ordinal: 2968
    text: Yea the hearts of thousands and tens of thousands shall greatly rejoice in consequence of the blessings which shall be poured out, and the endowment with which my servants have been endowed in this house.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.110
- type: DcVerse
  data:
    ref: dc.110.10
    scripture: doctrine-and-covenants
    name: D&C 110:10
    chapter: 110
    verse: 10
    ordinal: 2969
    text: And the fame of this house shall spread to foreign lands; and this is the beginning of the blessing which shall be poured out upon the heads of my people. Even so. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.110
- type: DcVerse
  data:
    ref: dc.110.11
    scripture: doctrine-and-covenants
    name: D&C 110:11
    chapter: 110
    verse: 11
    ordinal: 2970
    text: After this vision closed, the heavens were again opened unto us; and Moses appeared before us, and committed unto us the keys of the gathering of Israel from the four parts of the earth, and the leading of the ten tribes from the land of the north.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.110
- type: DcVerse
  data:
    ref: dc.110.12
    scripture: doctrine-and-covenants
    name: D&C 110:12
    chapter: 110
    verse: 12
    ordinal: 2971
    text: After this, Elias appeared, and committed the dispensation of the gospel of Abraham, saying that in us and our seed all generations after us should be blessed.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.110
- type: DcVerse
  data:
    ref: dc.110.13
    scripture: doctrine-and-covenants
    name: D&C 110:13
    chapter: 110
    verse: 13
    ordinal: 2972
    text: 'After this vision had closed, another great and glorious vision burst upon us; for Elijah the prophet, who was taken to heaven without tasting death, stood before us, and said:'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.110
- type: DcVerse
  data:
    ref: dc.110.14
    scripture: doctrine-and-covenants
    name: D&C 110:14
    chapter: 110
    verse: 14
    ordinal: 2973
    text: Behold, the time has fully come, which was spoken of by the mouth of Malachi—testifying that he [Elijah] should be sent, before the great and dreadful day of the Lord come—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.110
- type: DcVerse
  data:
    ref: dc.110.15
    scripture: doctrine-and-covenants
    name: D&C 110:15
    chapter: 110
    verse: 15
    ordinal: 2974
    text: To turn the hearts of the fathers to the children, and the children to the fathers, lest the whole earth be smitten with a curse—
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Malachi 4:6
    kjvAllusionOsis:
    - Mal.4.6
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.110
- type: DcVerse
  data:
    ref: dc.110.16
    scripture: doctrine-and-covenants
    name: D&C 110:16
    chapter: 110
    verse: 16
    ordinal: 2975
    text: Therefore, the keys of this dispensation are committed into your hands; and by this ye may know that the great and dreadful day of the Lord is near, even at the doors.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.110
- type: DcVerse
  data:
    ref: dc.111.1
    scripture: doctrine-and-covenants
    name: D&C 111:1
    chapter: 111
    verse: 1
    ordinal: 2976
    text: I, the Lord your God, am not displeased with your coming this journey, notwithstanding your follies.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.111
- type: DcVerse
  data:
    ref: dc.111.2
    scripture: doctrine-and-covenants
    name: D&C 111:2
    chapter: 111
    verse: 2
    ordinal: 2977
    text: I have much treasure in this city for you, for the benefit of Zion, and many people in this city, whom I will gather out in due time for the benefit of Zion, through your instrumentality.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.111
- type: DcVerse
  data:
    ref: dc.111.3
    scripture: doctrine-and-covenants
    name: D&C 111:3
    chapter: 111
    verse: 3
    ordinal: 2978
    text: Therefore, it is expedient that you should form acquaintance with men in this city, as you shall be led, and as it shall be given you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.111
- type: DcVerse
  data:
    ref: dc.111.4
    scripture: doctrine-and-covenants
    name: D&C 111:4
    chapter: 111
    verse: 4
    ordinal: 2979
    text: And it shall come to pass in due time that I will give this city into your hands, that you shall have power over it, insomuch that they shall not discover your secret parts; and its wealth pertaining to gold and silver shall be yours.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.111
- type: DcVerse
  data:
    ref: dc.111.5
    scripture: doctrine-and-covenants
    name: D&C 111:5
    chapter: 111
    verse: 5
    ordinal: 2980
    text: Concern not yourselves about your debts, for I will give you power to pay them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.111
- type: DcVerse
  data:
    ref: dc.111.6
    scripture: doctrine-and-covenants
    name: D&C 111:6
    chapter: 111
    verse: 6
    ordinal: 2981
    text: Concern not yourselves about Zion, for I will deal mercifully with her.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.111
- type: DcVerse
  data:
    ref: dc.111.7
    scripture: doctrine-and-covenants
    name: D&C 111:7
    chapter: 111
    verse: 7
    ordinal: 2982
    text: Tarry in this place, and in the regions round about;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.111
- type: DcVerse
  data:
    ref: dc.111.8
    scripture: doctrine-and-covenants
    name: D&C 111:8
    chapter: 111
    verse: 8
    ordinal: 2983
    text: And the place where it is my will that you should tarry, for the main, shall be signalized unto you by the peace and power of my Spirit, that shall flow unto you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.111
- type: DcVerse
  data:
    ref: dc.111.9
    scripture: doctrine-and-covenants
    name: D&C 111:9
    chapter: 111
    verse: 9
    ordinal: 2984
    text: This place you may obtain by hire. And inquire diligently concerning the more ancient inhabitants and founders of this city;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.111
- type: DcVerse
  data:
    ref: dc.111.10
    scripture: doctrine-and-covenants
    name: D&C 111:10
    chapter: 111
    verse: 10
    ordinal: 2985
    text: For there are more treasures than one for you in this city.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.111
- type: DcVerse
  data:
    ref: dc.111.11
    scripture: doctrine-and-covenants
    name: D&C 111:11
    chapter: 111
    verse: 11
    ordinal: 2986
    text: Therefore, be ye as wise as serpents and yet without sin; and I will order all things for your good, as fast as ye are able to receive them. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.111
- type: DcVerse
  data:
    ref: dc.112.1
    scripture: doctrine-and-covenants
    name: D&C 112:1
    chapter: 112
    verse: 1
    ordinal: 2987
    text: 'Verily thus saith the Lord unto you my servant Thomas: I have heard thy prayers; and thine alms have come up as a memorial before me, in behalf of those, thy brethren, who were chosen to bear testimony of my name and to send it abroad among all nations, kindreds, tongues, and people, and ordained through the instrumentality of my servants.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.112
- type: DcVerse
  data:
    ref: dc.112.2
    scripture: doctrine-and-covenants
    name: D&C 112:2
    chapter: 112
    verse: 2
    ordinal: 2988
    text: Verily I say unto you, there have been some few things in thine heart and with thee with which I, the Lord, was not well pleased.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.112
- type: DcVerse
  data:
    ref: dc.112.3
    scripture: doctrine-and-covenants
    name: D&C 112:3
    chapter: 112
    verse: 3
    ordinal: 2989
    text: Nevertheless, inasmuch as thou hast abased thyself thou shalt be exalted; therefore, all thy sins are forgiven thee.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.112
- type: DcVerse
  data:
    ref: dc.112.4
    scripture: doctrine-and-covenants
    name: D&C 112:4
    chapter: 112
    verse: 4
    ordinal: 2990
    text: Let thy heart be of good cheer before my face; and thou shalt bear record of my name, not only unto the Gentiles, but also unto the Jews; and thou shalt send forth my word unto the ends of the earth.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.112
- type: DcVerse
  data:
    ref: dc.112.5
    scripture: doctrine-and-covenants
    name: D&C 112:5
    chapter: 112
    verse: 5
    ordinal: 2991
    text: Contend thou, therefore, morning by morning; and day after day let thy warning voice go forth; and when the night cometh let not the inhabitants of the earth slumber, because of thy speech.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.112
- type: DcVerse
  data:
    ref: dc.112.6
    scripture: doctrine-and-covenants
    name: D&C 112:6
    chapter: 112
    verse: 6
    ordinal: 2992
    text: Let thy habitation be known in Zion, and remove not thy house; for I, the Lord, have a great work for thee to do, in publishing my name among the children of men.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.112
- type: DcVerse
  data:
    ref: dc.112.7
    scripture: doctrine-and-covenants
    name: D&C 112:7
    chapter: 112
    verse: 7
    ordinal: 2993
    text: Therefore, gird up thy loins for the work. Let thy feet be shod also, for thou art chosen, and thy path lieth among the mountains, and among many nations.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.112
- type: DcVerse
  data:
    ref: dc.112.8
    scripture: doctrine-and-covenants
    name: D&C 112:8
    chapter: 112
    verse: 8
    ordinal: 2994
    text: And by thy word many high ones shall be brought low, and by thy word many low ones shall be exalted.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.112
- type: DcVerse
  data:
    ref: dc.112.9
    scripture: doctrine-and-covenants
    name: D&C 112:9
    chapter: 112
    verse: 9
    ordinal: 2995
    text: Thy voice shall be a rebuke unto the transgressor; and at thy rebuke let the tongue of the slanderer cease its perverseness.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.112
- type: DcVerse
  data:
    ref: dc.112.10
    scripture: doctrine-and-covenants
    name: D&C 112:10
    chapter: 112
    verse: 10
    ordinal: 2996
    text: Be thou humble; and the Lord thy God shall lead thee by the hand, and give thee answer to thy prayers.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.112
- type: DcVerse
  data:
    ref: dc.112.11
    scripture: doctrine-and-covenants
    name: D&C 112:11
    chapter: 112
    verse: 11
    ordinal: 2997
    text: I know thy heart, and have heard thy prayers concerning thy brethren. Be not partial towards them in love above many others, but let thy love be for them as for thyself; and let thy love abound unto all men, and unto all who love my name.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.112
- type: DcVerse
  data:
    ref: dc.112.12
    scripture: doctrine-and-covenants
    name: D&C 112:12
    chapter: 112
    verse: 12
    ordinal: 2998
    text: And pray for thy brethren of the Twelve. Admonish them sharply for my name's sake, and let them be admonished for all their sins, and be ye faithful before me unto my name.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.112
- type: DcVerse
  data:
    ref: dc.112.13
    scripture: doctrine-and-covenants
    name: D&C 112:13
    chapter: 112
    verse: 13
    ordinal: 2999
    text: And after their temptations, and much tribulation, behold, I, the Lord, will feel after them, and if they harden not their hearts, and stiffen not their necks against me, they shall be converted, and I will heal them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.112
- type: DcVerse
  data:
    ref: dc.112.14
    scripture: doctrine-and-covenants
    name: D&C 112:14
    chapter: 112
    verse: 14
    ordinal: 3000
    text: 'Now, I say unto you, and what I say unto you, I say unto all the Twelve: Arise and gird up your loins, take up your cross, follow me, and feed my sheep.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.112
