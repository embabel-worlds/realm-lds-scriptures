    scripture: doctrine-and-covenants
    name: D&C 18:34
    chapter: 18
    verse: 34
    ordinal: 351
    text: These words are not of men nor of man, but of me; wherefore, you shall testify they are of me and not of man;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.18
- type: DcVerse
  data:
    ref: dc.18.35
    scripture: doctrine-and-covenants
    name: D&C 18:35
    chapter: 18
    verse: 35
    ordinal: 352
    text: For it is my voice which speaketh them unto you; for they are given by my Spirit unto you, and by my power you can read them one to another; and save it were by my power you could not have them;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.18
- type: DcVerse
  data:
    ref: dc.18.36
    scripture: doctrine-and-covenants
    name: D&C 18:36
    chapter: 18
    verse: 36
    ordinal: 353
    text: Wherefore, you can testify that you have heard my voice, and know my words.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.18
- type: DcVerse
