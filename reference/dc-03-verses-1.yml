- type: DcVerse
  data:
    ref: dc.34.1
    scripture: doctrine-and-covenants
    name: D&C 34:1
    chapter: 34
    verse: 1
    ordinal: 681
    text: My son Orson, hearken and hear and behold what I, the Lord God, shall say unto you, even Jesus Christ your Redeemer;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.34
- type: DcVerse
  data:
    ref: dc.34.2
    scripture: doctrine-and-covenants
    name: D&C 34:2
    chapter: 34
    verse: 2
    ordinal: 682
    text: The light and the life of the world, a light which shineth in darkness and the darkness comprehendeth it not;
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - John 1:5
    kjvAllusionOsis:
    - John.1.5
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.34
- type: DcVerse
  data:
    ref: dc.34.3
    scripture: doctrine-and-covenants
    name: D&C 34:3
    chapter: 34
    verse: 3
    ordinal: 683
    text: Who so loved the world that he gave his own life, that as many as would believe might become the sons of God. Wherefore you are my son;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.34
- type: DcVerse
  data:
    ref: dc.34.4
    scripture: doctrine-and-covenants
    name: D&C 34:4
    chapter: 34
    verse: 4
    ordinal: 684
    text: And blessed are you because you have believed;
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - John 20:29
    kjvAllusionOsis:
    - John.20.29
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.34
- type: DcVerse
  data:
    ref: dc.34.5
    scripture: doctrine-and-covenants
    name: D&C 34:5
    chapter: 34
    verse: 5
    ordinal: 685
    text: And more blessed are you because you are called of me to preach my gospel—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.34
- type: DcVerse
  data:
    ref: dc.34.6
    scripture: doctrine-and-covenants
    name: D&C 34:6
    chapter: 34
    verse: 6
    ordinal: 686
    text: To lift up your voice as with the sound of a trump, both long and loud, and cry repentance unto a crooked and perverse generation, preparing the way of the Lord for his second coming.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.34
- type: DcVerse
  data:
    ref: dc.34.7
    scripture: doctrine-and-covenants
    name: D&C 34:7
    chapter: 34
    verse: 7
    ordinal: 687
    text: For behold, verily, verily, I say unto you, the time is soon at hand that I shall come in a cloud with power and great glory.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.34
- type: DcVerse
  data:
    ref: dc.34.8
    scripture: doctrine-and-covenants
    name: D&C 34:8
    chapter: 34
    verse: 8
    ordinal: 688
    text: And it shall be a great day at the time of my coming, for all nations shall tremble.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.34
- type: DcVerse
  data:
    ref: dc.34.9
    scripture: doctrine-and-covenants
    name: D&C 34:9
    chapter: 34
    verse: 9
    ordinal: 689
    text: But before that great day shall come, the sun shall be darkened, and the moon be turned into blood; and the stars shall refuse their shining, and some shall fall, and great destructions await the wicked.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Joel 3:15
    kjvAllusionOsis:
    - Joel.3.15
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.34
- type: DcVerse
  data:
    ref: dc.34.10
    scripture: doctrine-and-covenants
    name: D&C 34:10
    chapter: 34
    verse: 10
    ordinal: 690
    text: Wherefore, lift up your voice and spare not, for the Lord God hath spoken; therefore prophesy, and it shall be given by the power of the Holy Ghost.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.34
- type: DcVerse
  data:
    ref: dc.34.11
    scripture: doctrine-and-covenants
    name: D&C 34:11
    chapter: 34
    verse: 11
    ordinal: 691
    text: And if you are faithful, behold, I am with you until I come—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.34
- type: DcVerse
  data:
    ref: dc.34.12
    scripture: doctrine-and-covenants
    name: D&C 34:12
    chapter: 34
    verse: 12
    ordinal: 692
    text: And verily, verily, I say unto you, I come quickly. I am your Lord and your Redeemer. Even so. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.34
- type: DcVerse
  data:
    ref: dc.35.1
    scripture: doctrine-and-covenants
    name: D&C 35:1
    chapter: 35
    verse: 1
    ordinal: 693
    text: Listen to the voice of the Lord your God, even Alpha and Omega, the beginning and the end, whose course is one eternal round, the same today as yesterday, and forever.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.35
- type: DcVerse
  data:
    ref: dc.35.2
    scripture: doctrine-and-covenants
    name: D&C 35:2
    chapter: 35
    verse: 2
    ordinal: 694
    text: I am Jesus Christ, the Son of God, who was crucified for the sins of the world, even as many as will believe on my name, that they may become the sons of God, even one in me as I am one in the Father, as the Father is one in me, that we may be one.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.35
- type: DcVerse
  data:
    ref: dc.35.3
    scripture: doctrine-and-covenants
    name: D&C 35:3
    chapter: 35
    verse: 3
    ordinal: 695
    text: Behold, verily, verily, I say unto my servant Sidney, I have looked upon thee and thy works. I have heard thy prayers, and prepared thee for a greater work.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.35
- type: DcVerse
  data:
    ref: dc.35.4
    scripture: doctrine-and-covenants
    name: D&C 35:4
    chapter: 35
    verse: 4
    ordinal: 696
    text: Thou art blessed, for thou shalt do great things. Behold thou wast sent forth, even as John, to prepare the way before me, and before Elijah which should come, and thou knewest it not.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.35
- type: DcVerse
  data:
    ref: dc.35.5
    scripture: doctrine-and-covenants
    name: D&C 35:5
    chapter: 35
    verse: 5
    ordinal: 697
    text: Thou didst baptize by water unto repentance, but they received not the Holy Ghost;
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Mark 1:8
    kjvAllusionOsis:
    - Mark.1.8
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.35
- type: DcVerse
  data:
    ref: dc.35.6
    scripture: doctrine-and-covenants
    name: D&C 35:6
    chapter: 35
    verse: 6
    ordinal: 698
    text: But now I give unto thee a commandment, that thou shalt baptize by water, and they shall receive the Holy Ghost by the laying on of the hands, even as the apostles of old.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.35
- type: DcVerse
  data:
    ref: dc.35.7
    scripture: doctrine-and-covenants
    name: D&C 35:7
    chapter: 35
    verse: 7
    ordinal: 699
    text: And it shall come to pass that there shall be a great work in the land, even among the Gentiles, for their folly and their abominations shall be made manifest in the eyes of all people.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.35
- type: DcVerse
  data:
    ref: dc.35.8
    scripture: doctrine-and-covenants
    name: D&C 35:8
    chapter: 35
    verse: 8
    ordinal: 700
    text: For I am God, and mine arm is not shortened; and I will show miracles, signs, and wonders, unto all those who believe on my name.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.35
- type: DcVerse
  data:
    ref: dc.35.9
    scripture: doctrine-and-covenants
    name: D&C 35:9
    chapter: 35
    verse: 9
    ordinal: 701
    text: And whoso shall ask it in my name in faith, they shall cast out devils; they shall heal the sick; they shall cause the blind to receive their sight, and the deaf to hear, and the dumb to speak, and the lame to walk.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.35
- type: DcVerse
  data:
    ref: dc.35.10
    scripture: doctrine-and-covenants
    name: D&C 35:10
    chapter: 35
    verse: 10
    ordinal: 702
    text: And the time speedily cometh that great things are to be shown forth unto the children of men;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.35
- type: DcVerse
  data:
    ref: dc.35.11
    scripture: doctrine-and-covenants
    name: D&C 35:11
    chapter: 35
    verse: 11
    ordinal: 703
    text: But without faith shall not anything be shown forth except desolations upon Babylon, the same which has made all nations drink of the wine of the wrath of her fornication.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Revelation 14:8
    kjvAllusionOsis:
    - Rev.14.8
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.35
- type: DcVerse
  data:
    ref: dc.35.12
    scripture: doctrine-and-covenants
    name: D&C 35:12
    chapter: 35
    verse: 12
    ordinal: 704
    text: And there are none that doeth good except those who are ready to receive the fulness of my gospel, which I have sent forth unto this generation.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.35
- type: DcVerse
  data:
    ref: dc.35.13
    scripture: doctrine-and-covenants
    name: D&C 35:13
    chapter: 35
    verse: 13
    ordinal: 705
    text: Wherefore, I call upon the weak things of the world, those who are unlearned and despised, to thresh the nations by the power of my Spirit;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.35
- type: DcVerse
  data:
    ref: dc.35.14
    scripture: doctrine-and-covenants
    name: D&C 35:14
    chapter: 35
    verse: 14
    ordinal: 706
    text: And their arm shall be my arm, and I will be their shield and their buckler; and I will gird up their loins, and they shall fight manfully for me; and their enemies shall be under their feet; and I will let fall the sword in their behalf, and by the fire of mine indignation will I preserve them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.35
- type: DcVerse
  data:
    ref: dc.35.15
    scripture: doctrine-and-covenants
    name: D&C 35:15
    chapter: 35
    verse: 15
    ordinal: 707
    text: And the poor and the meek shall have the gospel preached unto them, and they shall be looking forth for the time of my coming, for it is nigh at hand—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.35
- type: DcVerse
  data:
    ref: dc.35.16
    scripture: doctrine-and-covenants
    name: D&C 35:16
    chapter: 35
    verse: 16
    ordinal: 708
    text: And they shall learn the parable of the fig tree, for even now already summer is nigh.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Matthew 24:32
    kjvAllusionOsis:
    - Matt.24.32
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.35
- type: DcVerse
  data:
    ref: dc.35.17
    scripture: doctrine-and-covenants
    name: D&C 35:17
    chapter: 35
    verse: 17
    ordinal: 709
    text: And I have sent forth the fulness of my gospel by the hand of my servant Joseph; and in weakness have I blessed him;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.35
- type: DcVerse
  data:
    ref: dc.35.18
    scripture: doctrine-and-covenants
    name: D&C 35:18
    chapter: 35
    verse: 18
    ordinal: 710
    text: And I have given unto him the keys of the mystery of those things which have been sealed, even things which were from the foundation of the world, and the things which shall come from this time until the time of my coming, if he abide in me, and if not, another will I plant in his stead.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.35
- type: DcVerse
  data:
    ref: dc.35.19
    scripture: doctrine-and-covenants
    name: D&C 35:19
    chapter: 35
    verse: 19
    ordinal: 711
    text: Wherefore, watch over him that his faith fail not, and it shall be given by the Comforter, the Holy Ghost, that knoweth all things.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.35
- type: DcVerse
  data:
    ref: dc.35.20
    scripture: doctrine-and-covenants
    name: D&C 35:20
    chapter: 35
    verse: 20
    ordinal: 712
    text: And a commandment I give unto thee—that thou shalt write for him; and the scriptures shall be given, even as they are in mine own bosom, to the salvation of mine own elect;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.35
- type: DcVerse
  data:
    ref: dc.35.21
    scripture: doctrine-and-covenants
    name: D&C 35:21
    chapter: 35
    verse: 21
    ordinal: 713
    text: For they will hear my voice, and shall see me, and shall not be asleep, and shall abide the day of my coming; for they shall be purified, even as I am pure.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.35
- type: DcVerse
  data:
    ref: dc.35.22
    scripture: doctrine-and-covenants
    name: D&C 35:22
    chapter: 35
    verse: 22
    ordinal: 714
    text: And now I say unto you, tarry with him, and he shall journey with you; forsake him not, and surely these things shall be fulfilled.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.35
- type: DcVerse
  data:
    ref: dc.35.23
    scripture: doctrine-and-covenants
    name: D&C 35:23
    chapter: 35
    verse: 23
    ordinal: 715
    text: And inasmuch as ye do not write, behold, it shall be given unto him to prophesy; and thou shalt preach my gospel and call on the holy prophets to prove his words, as they shall be given him.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.35
- type: DcVerse
  data:
    ref: dc.35.24
    scripture: doctrine-and-covenants
    name: D&C 35:24
    chapter: 35
    verse: 24
    ordinal: 716
    text: Keep all the commandments and covenants by which ye are bound; and I will cause the heavens to shake for your good, and Satan shall tremble and Zion shall rejoice upon the hills and flourish;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.35
- type: DcVerse
  data:
    ref: dc.35.25
    scripture: doctrine-and-covenants
    name: D&C 35:25
    chapter: 35
    verse: 25
    ordinal: 717
    text: And Israel shall be saved in mine own due time; and by the keys which I have given shall they be led, and no more be confounded at all.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.35
- type: DcVerse
  data:
    ref: dc.35.26
    scripture: doctrine-and-covenants
    name: D&C 35:26
    chapter: 35
    verse: 26
    ordinal: 718
    text: Lift up your hearts and be glad, your redemption draweth nigh.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Luke 21:28
    kjvAllusionOsis:
    - Luke.21.28
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.35
- type: DcVerse
  data:
    ref: dc.35.27
    scripture: doctrine-and-covenants
    name: D&C 35:27
    chapter: 35
    verse: 27
    ordinal: 719
    text: Fear not, little flock, the kingdom is yours until I come. Behold, I come quickly. Even so. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.35
- type: DcVerse
  data:
    ref: dc.36.1
    scripture: doctrine-and-covenants
    name: D&C 36:1
    chapter: 36
    verse: 1
    ordinal: 720
    text: 'Thus saith the Lord God, the Mighty One of Israel: Behold, I say unto you, my servant Edward, that you are blessed, and your sins are forgiven you, and you are called to preach my gospel as with the voice of a trump;'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.36
- type: DcVerse
  data:
    ref: dc.36.2
    scripture: doctrine-and-covenants
    name: D&C 36:2
    chapter: 36
    verse: 2
    ordinal: 721
    text: And I will lay my hand upon you by the hand of my servant Sidney Rigdon, and you shall receive my Spirit, the Holy Ghost, even the Comforter, which shall teach you the peaceable things of the kingdom;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.36
- type: DcVerse
  data:
    ref: dc.36.3
    scripture: doctrine-and-covenants
    name: D&C 36:3
    chapter: 36
    verse: 3
    ordinal: 722
    text: 'And you shall declare it with a loud voice, saying: Hosanna, blessed be the name of the most high God.'
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - 1 Kings 8:55
    kjvAllusionOsis:
    - 1Kgs.8.55
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.36
- type: DcVerse
  data:
    ref: dc.36.4
    scripture: doctrine-and-covenants
    name: D&C 36:4
    chapter: 36
    verse: 4
    ordinal: 723
    text: And now this calling and commandment give I unto you concerning all men—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.36
- type: DcVerse
  data:
    ref: dc.36.5
    scripture: doctrine-and-covenants
    name: D&C 36:5
    chapter: 36
    verse: 5
    ordinal: 724
    text: That as many as shall come before my servants Sidney Rigdon and Joseph Smith, Jun., embracing this calling and commandment, shall be ordained and sent forth to preach the everlasting gospel among the nations—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.36
- type: DcVerse
  data:
    ref: dc.36.6
    scripture: doctrine-and-covenants
    name: D&C 36:6
    chapter: 36
    verse: 6
    ordinal: 725
    text: 'Crying repentance, saying: Save yourselves from this untoward generation, and come forth out of the fire, hating even the garments spotted with the flesh.'
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Jude 1:23
    kjvAllusionOsis:
    - Jude.1.23
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.36
- type: DcVerse
  data:
    ref: dc.36.7
    scripture: doctrine-and-covenants
    name: D&C 36:7
    chapter: 36
    verse: 7
    ordinal: 726
    text: And this commandment shall be given unto the elders of my church, that every man which will embrace it with singleness of heart may be ordained and sent forth, even as I have spoken.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.36
- type: DcVerse
  data:
    ref: dc.36.8
    scripture: doctrine-and-covenants
    name: D&C 36:8
    chapter: 36
    verse: 8
    ordinal: 727
    text: I am Jesus Christ, the Son of God; wherefore, gird up your loins and I will suddenly come to my temple. Even so. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.36
- type: DcVerse
  data:
    ref: dc.37.1
    scripture: doctrine-and-covenants
    name: D&C 37:1
    chapter: 37
    verse: 1
    ordinal: 728
    text: Behold, I say unto you that it is not expedient in me that ye should translate any more until ye shall go to the Ohio, and this because of the enemy and for your sakes.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.37
- type: DcVerse
  data:
    ref: dc.37.2
    scripture: doctrine-and-covenants
    name: D&C 37:2
    chapter: 37
    verse: 2
    ordinal: 729
    text: And again, I say unto you that ye shall not go until ye have preached my gospel in those parts, and have strengthened up the church whithersoever it is found, and more especially in Colesville; for, behold, they pray unto me in much faith.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.37
- type: DcVerse
  data:
    ref: dc.37.3
    scripture: doctrine-and-covenants
    name: D&C 37:3
    chapter: 37
    verse: 3
    ordinal: 730
    text: And again, a commandment I give unto the church, that it is expedient in me that they should assemble together at the Ohio, against the time that my servant Oliver Cowdery shall return unto them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.37
- type: DcVerse
  data:
    ref: dc.37.4
    scripture: doctrine-and-covenants
    name: D&C 37:4
    chapter: 37
    verse: 4
    ordinal: 731
    text: Behold, here is wisdom, and let every man choose for himself until I come. Even so. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.37
- type: DcVerse
  data:
    ref: dc.38.1
    scripture: doctrine-and-covenants
    name: D&C 38:1
    chapter: 38
    verse: 1
    ordinal: 732
    text: Thus saith the Lord your God, even Jesus Christ, the Great I AM, Alpha and Omega, the beginning and the end, the same which looked upon the wide expanse of eternity, and all the seraphic hosts of heaven, before the world was made;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.38
- type: DcVerse
  data:
    ref: dc.38.2
    scripture: doctrine-and-covenants
    name: D&C 38:2
    chapter: 38
    verse: 2
    ordinal: 733
    text: The same which knoweth all things, for all things are present before mine eyes;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.38
- type: DcVerse
  data:
    ref: dc.38.3
    scripture: doctrine-and-covenants
    name: D&C 38:3
    chapter: 38
    verse: 3
    ordinal: 734
    text: I am the same which spake, and the world was made, and all things came by me.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.38
- type: DcVerse
  data:
    ref: dc.38.4
    scripture: doctrine-and-covenants
    name: D&C 38:4
    chapter: 38
    verse: 4
    ordinal: 735
    text: I am the same which have taken the Zion of Enoch into mine own bosom; and verily, I say, even as many as have believed in my name, for I am Christ, and in mine own name, by the virtue of the blood which I have spilt, have I pleaded before the Father for them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.38
- type: DcVerse
  data:
    ref: dc.38.5
    scripture: doctrine-and-covenants
    name: D&C 38:5
    chapter: 38
    verse: 5
    ordinal: 736
    text: But behold, the residue of the wicked have I kept in chains of darkness until the judgment of the great day, which shall come at the end of the earth;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.38
- type: DcVerse
  data:
    ref: dc.38.6
    scripture: doctrine-and-covenants
    name: D&C 38:6
    chapter: 38
    verse: 6
    ordinal: 737
    text: And even so will I cause the wicked to be kept, that will not hear my voice but harden their hearts, and wo, wo, wo, is their doom.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.38
- type: DcVerse
  data:
    ref: dc.38.7
    scripture: doctrine-and-covenants
    name: D&C 38:7
    chapter: 38
    verse: 7
    ordinal: 738
    text: But behold, verily, verily, I say unto you that mine eyes are upon you. I am in your midst and ye cannot see me;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.38
- type: DcVerse
  data:
    ref: dc.38.8
    scripture: doctrine-and-covenants
    name: D&C 38:8
    chapter: 38
    verse: 8
    ordinal: 739
    text: But the day soon cometh that ye shall see me, and know that I am; for the veil of darkness shall soon be rent, and he that is not purified shall not abide the day.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.38
- type: DcVerse
  data:
    ref: dc.38.9
    scripture: doctrine-and-covenants
    name: D&C 38:9
    chapter: 38
    verse: 9
    ordinal: 740
    text: Wherefore, gird up your loins and be prepared. Behold, the kingdom is yours, and the enemy shall not overcome.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.38
- type: DcVerse
  data:
    ref: dc.38.10
    scripture: doctrine-and-covenants
    name: D&C 38:10
    chapter: 38
    verse: 10
    ordinal: 741
    text: Verily I say unto you, ye are clean, but not all; and there is none else with whom I am well pleased;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.38
- type: DcVerse
  data:
    ref: dc.38.11
    scripture: doctrine-and-covenants
    name: D&C 38:11
    chapter: 38
    verse: 11
    ordinal: 742
    text: For all flesh is corrupted before me; and the powers of darkness prevail upon the earth, among the children of men, in the presence of all the hosts of heaven—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.38
- type: DcVerse
  data:
    ref: dc.38.12
    scripture: doctrine-and-covenants
    name: D&C 38:12
    chapter: 38
    verse: 12
    ordinal: 743
    text: Which causeth silence to reign, and all eternity is pained, and the angels are waiting the great command to reap down the earth, to gather the tares that they may be burned; and, behold, the enemy is combined.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.38
- type: DcVerse
  data:
    ref: dc.38.13
    scripture: doctrine-and-covenants
    name: D&C 38:13
    chapter: 38
    verse: 13
    ordinal: 744
    text: And now I show unto you a mystery, a thing which is had in secret chambers, to bring to pass even your destruction in process of time, and ye knew it not;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.38
- type: DcVerse
  data:
    ref: dc.38.14
    scripture: doctrine-and-covenants
    name: D&C 38:14
    chapter: 38
    verse: 14
    ordinal: 745
    text: But now I tell it unto you, and ye are blessed, not because of your iniquity, neither your hearts of unbelief; for verily some of you are guilty before me, but I will be merciful unto your weakness.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.38
- type: DcVerse
  data:
    ref: dc.38.15
    scripture: doctrine-and-covenants
    name: D&C 38:15
    chapter: 38
    verse: 15
    ordinal: 746
    text: Therefore, be ye strong from henceforth; fear not, for the kingdom is yours.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.38
- type: DcVerse
  data:
    ref: dc.38.16
    scripture: doctrine-and-covenants
    name: D&C 38:16
    chapter: 38
    verse: 16
    ordinal: 747
    text: And for your salvation I give unto you a commandment, for I have heard your prayers, and the poor have complained before me, and the rich have I made, and all flesh is mine, and I am no respecter of persons.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.38
- type: DcVerse
  data:
    ref: dc.38.17
    scripture: doctrine-and-covenants
    name: D&C 38:17
    chapter: 38
    verse: 17
    ordinal: 748
    text: And I have made the earth rich, and behold it is my footstool, wherefore, again I will stand upon it.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.38
- type: DcVerse
  data:
    ref: dc.38.18
    scripture: doctrine-and-covenants
    name: D&C 38:18
    chapter: 38
    verse: 18
    ordinal: 749
    text: And I hold forth and deign to give unto you greater riches, even a land of promise, a land flowing with milk and honey, upon which there shall be no curse when the Lord cometh;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.38
- type: DcVerse
  data:
    ref: dc.38.19
    scripture: doctrine-and-covenants
    name: D&C 38:19
    chapter: 38
    verse: 19
    ordinal: 750
    text: And I will give it unto you for the land of your inheritance, if you seek it with all your hearts.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.38
- type: DcVerse
  data:
    ref: dc.38.20
    scripture: doctrine-and-covenants
    name: D&C 38:20
    chapter: 38
    verse: 20
    ordinal: 751
    text: And this shall be my covenant with you, ye shall have it for the land of your inheritance, and for the inheritance of your children forever, while the earth shall stand, and ye shall possess it again in eternity, no more to pass away.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.38
- type: DcVerse
  data:
    ref: dc.38.21
    scripture: doctrine-and-covenants
    name: D&C 38:21
    chapter: 38
    verse: 21
    ordinal: 752
    text: But, verily I say unto you that in time ye shall have no king nor ruler, for I will be your king and watch over you.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Matthew 24:47
    kjvAllusionOsis:
    - Matt.24.47
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.38
- type: DcVerse
  data:
    ref: dc.38.22
    scripture: doctrine-and-covenants
    name: D&C 38:22
    chapter: 38
    verse: 22
    ordinal: 753
    text: Wherefore, hear my voice and follow me, and you shall be a free people, and ye shall have no laws but my laws when I come, for I am your lawgiver, and what can stay my hand?
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.38
- type: DcVerse
  data:
    ref: dc.38.23
    scripture: doctrine-and-covenants
    name: D&C 38:23
    chapter: 38
    verse: 23
    ordinal: 754
    text: But, verily I say unto you, teach one another according to the office wherewith I have appointed you;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.38
- type: DcVerse
  data:
    ref: dc.38.24
    scripture: doctrine-and-covenants
    name: D&C 38:24
    chapter: 38
    verse: 24
    ordinal: 755
    text: And let every man esteem his brother as himself, and practice virtue and holiness before me.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.38
- type: DcVerse
  data:
    ref: dc.38.25
    scripture: doctrine-and-covenants
    name: D&C 38:25
    chapter: 38
    verse: 25
    ordinal: 756
    text: And again I say unto you, let every man esteem his brother as himself.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.38
- type: DcVerse
  data:
    ref: dc.38.26
    scripture: doctrine-and-covenants
    name: D&C 38:26
    chapter: 38
    verse: 26
    ordinal: 757
    text: 'For what man among you having twelve sons, and is no respecter of them, and they serve him obediently, and he saith unto the one: Be thou clothed in robes and sit thou here; and to the other: Be thou clothed in rags and sit thou there—and looketh upon his sons and saith I am just?'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.38
- type: DcVerse
  data:
    ref: dc.38.27
    scripture: doctrine-and-covenants
    name: D&C 38:27
    chapter: 38
    verse: 27
    ordinal: 758
    text: Behold, this I have given unto you as a parable, and it is even as I am. I say unto you, be one; and if ye are not one ye are not mine.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.38
- type: DcVerse
  data:
    ref: dc.38.28
    scripture: doctrine-and-covenants
    name: D&C 38:28
    chapter: 38
    verse: 28
    ordinal: 759
    text: And again, I say unto you that the enemy in the secret chambers seeketh your lives.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.38
- type: DcVerse
  data:
    ref: dc.38.29
    scripture: doctrine-and-covenants
    name: D&C 38:29
    chapter: 38
    verse: 29
    ordinal: 760
    text: Ye hear of wars in far countries, and you say that there will soon be great wars in far countries, but ye know not the hearts of men in your own land.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.38
- type: DcVerse
  data:
    ref: dc.38.30
    scripture: doctrine-and-covenants
    name: D&C 38:30
    chapter: 38
    verse: 30
    ordinal: 761
    text: I tell you these things because of your prayers; wherefore, treasure up wisdom in your bosoms, lest the wickedness of men reveal these things unto you by their wickedness, in a manner which shall speak in your ears with a voice louder than that which shall shake the earth; but if ye are prepared ye shall not fear.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.38
- type: DcVerse
  data:
    ref: dc.38.31
    scripture: doctrine-and-covenants
    name: D&C 38:31
    chapter: 38
    verse: 31
    ordinal: 762
    text: And that ye might escape the power of the enemy, and be gathered unto me a righteous people, without spot and blameless—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.38
- type: DcVerse
  data:
    ref: dc.38.32
    scripture: doctrine-and-covenants
    name: D&C 38:32
    chapter: 38
    verse: 32
    ordinal: 763
    text: Wherefore, for this cause I gave unto you the commandment that ye should go to the Ohio; and there I will give unto you my law; and there you shall be endowed with power from on high;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.38
- type: DcVerse
  data:
    ref: dc.38.33
    scripture: doctrine-and-covenants
    name: D&C 38:33
    chapter: 38
    verse: 33
    ordinal: 764
    text: And from thence, whosoever I will shall go forth among all nations, and it shall be told them what they shall do; for I have a great work laid up in store, for Israel shall be saved, and I will lead them whithersoever I will, and no power shall stay my hand.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.38
- type: DcVerse
  data:
    ref: dc.38.34
    scripture: doctrine-and-covenants
    name: D&C 38:34
    chapter: 38
    verse: 34
    ordinal: 765
    text: And now, I give unto the church in these parts a commandment, that certain men among them shall be appointed, and they shall be appointed by the voice of the church;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.38
- type: DcVerse
  data:
    ref: dc.38.35
    scripture: doctrine-and-covenants
    name: D&C 38:35
    chapter: 38
    verse: 35
    ordinal: 766
    text: And they shall look to the poor and the needy, and administer to their relief that they shall not suffer; and send them forth to the place which I have commanded them;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.38
- type: DcVerse
  data:
    ref: dc.38.36
    scripture: doctrine-and-covenants
    name: D&C 38:36
    chapter: 38
    verse: 36
    ordinal: 767
    text: And this shall be their work, to govern the affairs of the property of this church.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.38
- type: DcVerse
  data:
    ref: dc.38.37
    scripture: doctrine-and-covenants
    name: D&C 38:37
    chapter: 38
    verse: 37
    ordinal: 768
    text: And they that have farms that cannot be sold, let them be left or rented as seemeth them good.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.38
- type: DcVerse
  data:
    ref: dc.38.38
    scripture: doctrine-and-covenants
    name: D&C 38:38
    chapter: 38
    verse: 38
    ordinal: 769
    text: See that all things are preserved; and when men are endowed with power from on high and sent forth, all these things shall be gathered unto the bosom of the church.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.38
- type: DcVerse
  data:
    ref: dc.38.39
    scripture: doctrine-and-covenants
    name: D&C 38:39
    chapter: 38
    verse: 39
    ordinal: 770
    text: And if ye seek the riches which it is the will of the Father to give unto you, ye shall be the richest of all people, for ye shall have the riches of eternity; and it must needs be that the riches of the earth are mine to give; but beware of pride, lest ye become as the Nephites of old.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.38
- type: DcVerse
  data:
    ref: dc.38.40
    scripture: doctrine-and-covenants
    name: D&C 38:40
    chapter: 38
    verse: 40
    ordinal: 771
    text: And again, I say unto you, I give unto you a commandment, that every man, both elder, priest, teacher, and also member, go to with his might, with the labor of his hands, to prepare and accomplish the things which I have commanded.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.38
- type: DcVerse
  data:
    ref: dc.38.41
    scripture: doctrine-and-covenants
    name: D&C 38:41
    chapter: 38
    verse: 41
    ordinal: 772
    text: And let your preaching be the warning voice, every man to his neighbor, in mildness and in meekness.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.38
- type: DcVerse
  data:
    ref: dc.38.42
    scripture: doctrine-and-covenants
    name: D&C 38:42
    chapter: 38
    verse: 42
    ordinal: 773
    text: And go ye out from among the wicked. Save yourselves. Be ye clean that bear the vessels of the Lord. Even so. Amen.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Isaiah 52:11
    kjvAllusionOsis:
    - Isa.52.11
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.38
- type: DcVerse
  data:
    ref: dc.39.1
    scripture: doctrine-and-covenants
    name: D&C 39:1
    chapter: 39
    verse: 1
    ordinal: 774
    text: Hearken and listen to the voice of him who is from all eternity to all eternity, the Great I AM, even Jesus Christ—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.39
- type: DcVerse
  data:
    ref: dc.39.2
    scripture: doctrine-and-covenants
    name: D&C 39:2
    chapter: 39
    verse: 2
    ordinal: 775
    text: The light and the life of the world; a light which shineth in darkness and the darkness comprehendeth it not;
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - John 1:5
    kjvAllusionOsis:
    - John.1.5
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.39
- type: DcVerse
  data:
    ref: dc.39.3
    scripture: doctrine-and-covenants
    name: D&C 39:3
    chapter: 39
    verse: 3
    ordinal: 776
    text: The same which came in the meridian of time unto mine own, and mine own received me not;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.39
- type: DcVerse
  data:
    ref: dc.39.4
    scripture: doctrine-and-covenants
    name: D&C 39:4
    chapter: 39
    verse: 4
    ordinal: 777
    text: But to as many as received me, gave I power to become my sons; and even so will I give unto as many as will receive me, power to become my sons.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - John 1:12
    kjvAllusionOsis:
    - John.1.12
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.39
- type: DcVerse
  data:
    ref: dc.39.5
    scripture: doctrine-and-covenants
    name: D&C 39:5
    chapter: 39
    verse: 5
    ordinal: 778
    text: And verily, verily, I say unto you, he that receiveth my gospel receiveth me; and he that receiveth not my gospel receiveth not me.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - John 13:20
    kjvAllusionOsis:
    - John.13.20
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.39
- type: DcVerse
  data:
    ref: dc.39.6
    scripture: doctrine-and-covenants
    name: D&C 39:6
    chapter: 39
    verse: 6
    ordinal: 779
    text: And this is my gospel—repentance and baptism by water, and then cometh the baptism of fire and the Holy Ghost, even the Comforter, which showeth all things, and teacheth the peaceable things of the kingdom.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.39
- type: DcVerse
  data:
    ref: dc.39.7
    scripture: doctrine-and-covenants
    name: D&C 39:7
    chapter: 39
    verse: 7
    ordinal: 780
    text: And now, behold, I say unto you, my servant James, I have looked upon thy works and I know thee.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.39
- type: DcVerse
  data:
    ref: dc.39.8
    scripture: doctrine-and-covenants
    name: D&C 39:8
    chapter: 39
    verse: 8
    ordinal: 781
    text: And verily I say unto thee, thine heart is now right before me at this time; and, behold, I have bestowed great blessings upon thy head;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.39
- type: DcVerse
  data:
    ref: dc.39.9
    scripture: doctrine-and-covenants
    name: D&C 39:9
    chapter: 39
    verse: 9
    ordinal: 782
    text: Nevertheless, thou hast seen great sorrow, for thou hast rejected me many times because of pride and the cares of the world.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.39
- type: DcVerse
  data:
    ref: dc.39.10
    scripture: doctrine-and-covenants
    name: D&C 39:10
    chapter: 39
    verse: 10
    ordinal: 783
    text: 'But, behold, the days of thy deliverance are come, if thou wilt hearken to my voice, which saith unto thee: Arise and be baptized, and wash away your sins, calling on my name, and you shall receive my Spirit, and a blessing so great as you never have known.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.39
- type: DcVerse
  data:
    ref: dc.39.11
    scripture: doctrine-and-covenants
    name: D&C 39:11
    chapter: 39
    verse: 11
    ordinal: 784
    text: And if thou do this, I have prepared thee for a greater work. Thou shalt preach the fulness of my gospel, which I have sent forth in these last days, the covenant which I have sent forth to recover my people, which are of the house of Israel.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.39
- type: DcVerse
  data:
    ref: dc.39.12
    scripture: doctrine-and-covenants
    name: D&C 39:12
    chapter: 39
    verse: 12
    ordinal: 785
    text: And it shall come to pass that power shall rest upon thee; thou shalt have great faith, and I will be with thee and go before thy face.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.39
- type: DcVerse
  data:
    ref: dc.39.13
    scripture: doctrine-and-covenants
    name: D&C 39:13
    chapter: 39
    verse: 13
    ordinal: 786
    text: Thou art called to labor in my vineyard, and to build up my church, and to bring forth Zion, that it may rejoice upon the hills and flourish.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.39
- type: DcVerse
  data:
    ref: dc.39.14
    scripture: doctrine-and-covenants
    name: D&C 39:14
    chapter: 39
    verse: 14
    ordinal: 787
    text: Behold, verily, verily, I say unto thee, thou art not called to go into the eastern countries, but thou art called to go to the Ohio.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.39
- type: DcVerse
  data:
    ref: dc.39.15
    scripture: doctrine-and-covenants
    name: D&C 39:15
    chapter: 39
    verse: 15
    ordinal: 788
    text: And inasmuch as my people shall assemble themselves at the Ohio, I have kept in store a blessing such as is not known among the children of men, and it shall be poured forth upon their heads. And from thence men shall go forth into all nations.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.39
- type: DcVerse
  data:
    ref: dc.39.16
    scripture: doctrine-and-covenants
    name: D&C 39:16
    chapter: 39
    verse: 16
    ordinal: 789
    text: Behold, verily, verily, I say unto you, that the people in Ohio call upon me in much faith, thinking I will stay my hand in judgment upon the nations, but I cannot deny my word.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.39
- type: DcVerse
  data:
    ref: dc.39.17
    scripture: doctrine-and-covenants
    name: D&C 39:17
    chapter: 39
    verse: 17
    ordinal: 790
    text: Wherefore lay to with your might and call faithful laborers into my vineyard, that it may be pruned for the last time.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.39
- type: DcVerse
  data:
    ref: dc.39.18
    scripture: doctrine-and-covenants
    name: D&C 39:18
    chapter: 39
    verse: 18
    ordinal: 791
    text: And inasmuch as they do repent and receive the fulness of my gospel, and become sanctified, I will stay mine hand in judgment.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.39
- type: DcVerse
  data:
    ref: dc.39.19
    scripture: doctrine-and-covenants
    name: D&C 39:19
    chapter: 39
    verse: 19
    ordinal: 792
    text: 'Wherefore, go forth, crying with a loud voice, saying: The kingdom of heaven is at hand; crying: Hosanna! blessed be the name of the Most High God.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.39
- type: DcVerse
  data:
    ref: dc.39.20
    scripture: doctrine-and-covenants
    name: D&C 39:20
    chapter: 39
    verse: 20
    ordinal: 793
    text: Go forth baptizing with water, preparing the way before my face for the time of my coming;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.39
- type: DcVerse
  data:
    ref: dc.39.21
    scripture: doctrine-and-covenants
    name: D&C 39:21
    chapter: 39
    verse: 21
    ordinal: 794
    text: For the time is at hand; the day or the hour no man knoweth; but it surely shall come.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Matthew 24:36
    kjvAllusionOsis:
    - Matt.24.36
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.39
- type: DcVerse
  data:
    ref: dc.39.22
    scripture: doctrine-and-covenants
    name: D&C 39:22
    chapter: 39
    verse: 22
    ordinal: 795
    text: And he that receiveth these things receiveth me; and they shall be gathered unto me in time and in eternity.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.39
- type: DcVerse
  data:
    ref: dc.39.23
    scripture: doctrine-and-covenants
    name: D&C 39:23
    chapter: 39
    verse: 23
    ordinal: 796
    text: And again, it shall come to pass that on as many as ye shall baptize with water, ye shall lay your hands, and they shall receive the gift of the Holy Ghost, and shall be looking forth for the signs of my coming, and shall know me.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.39
- type: DcVerse
  data:
    ref: dc.39.24
    scripture: doctrine-and-covenants
    name: D&C 39:24
    chapter: 39
    verse: 24
    ordinal: 797
    text: Behold, I come quickly. Even so. Amen.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Revelation 22:20
    kjvAllusionOsis:
    - Rev.22.20
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.39
- type: DcVerse
  data:
    ref: dc.40.1
    scripture: doctrine-and-covenants
    name: D&C 40:1
    chapter: 40
    verse: 1
    ordinal: 798
    text: Behold, verily I say unto you, that the heart of my servant James Covel was right before me, for he covenanted with me that he would obey my word.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.40
- type: DcVerse
  data:
    ref: dc.40.2
    scripture: doctrine-and-covenants
    name: D&C 40:2
    chapter: 40
    verse: 2
    ordinal: 799
    text: And he received the word with gladness, but straightway Satan tempted him; and the fear of persecution and the cares of the world caused him to reject the word.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.40
- type: DcVerse
  data:
    ref: dc.40.3
    scripture: doctrine-and-covenants
    name: D&C 40:3
    chapter: 40
    verse: 3
    ordinal: 800
    text: Wherefore he broke my covenant, and it remaineth with me to do with him as seemeth me good. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.40
- type: DcVerse
  data:
    ref: dc.41.1
    scripture: doctrine-and-covenants
    name: D&C 41:1
    chapter: 41
    verse: 1
    ordinal: 801
    text: Hearken and hear, O ye my people, saith the Lord and your God, ye whom I delight to bless with the greatest of all blessings, ye that hear me; and ye that hear me not will I curse, that have professed my name, with the heaviest of all cursings.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.41
- type: DcVerse
  data:
    ref: dc.41.2
    scripture: doctrine-and-covenants
    name: D&C 41:2
    chapter: 41
    verse: 2
    ordinal: 802
    text: Hearken, O ye elders of my church whom I have called, behold I give unto you a commandment, that ye shall assemble yourselves together to agree upon my word;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.41
- type: DcVerse
  data:
    ref: dc.41.3
    scripture: doctrine-and-covenants
    name: D&C 41:3
    chapter: 41
    verse: 3
    ordinal: 803
    text: And by the prayer of your faith ye shall receive my law, that ye may know how to govern my church and have all things right before me.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.41
- type: DcVerse
  data:
    ref: dc.41.4
    scripture: doctrine-and-covenants
    name: D&C 41:4
    chapter: 41
    verse: 4
    ordinal: 804
    text: And I will be your ruler when I come; and behold, I come quickly, and ye shall see that my law is kept.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.41
- type: DcVerse
  data:
    ref: dc.41.5
    scripture: doctrine-and-covenants
    name: D&C 41:5
    chapter: 41
    verse: 5
    ordinal: 805
    text: He that receiveth my law and doeth it, the same is my disciple; and he that saith he receiveth it and doeth it not, the same is not my disciple, and shall be cast out from among you;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.41
- type: DcVerse
  data:
    ref: dc.41.6
    scripture: doctrine-and-covenants
    name: D&C 41:6
    chapter: 41
    verse: 6
    ordinal: 806
    text: For it is not meet that the things which belong to the children of the kingdom should be given to them that are not worthy, or to dogs, or the pearls to be cast before swine.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.41
- type: DcVerse
  data:
    ref: dc.41.7
    scripture: doctrine-and-covenants
    name: D&C 41:7
    chapter: 41
    verse: 7
    ordinal: 807
    text: And again, it is meet that my servant Joseph Smith, Jun., should have a house built, in which to live and translate.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.41
- type: DcVerse
  data:
    ref: dc.41.8
    scripture: doctrine-and-covenants
    name: D&C 41:8
    chapter: 41
    verse: 8
    ordinal: 808
    text: And again, it is meet that my servant Sidney Rigdon should live as seemeth him good, inasmuch as he keepeth my commandments.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.41
- type: DcVerse
  data:
    ref: dc.41.9
    scripture: doctrine-and-covenants
    name: D&C 41:9
    chapter: 41
    verse: 9
    ordinal: 809
    text: And again, I have called my servant Edward Partridge; and I give a commandment, that he should be appointed by the voice of the church, and ordained a bishop unto the church, to leave his merchandise and to spend all his time in the labors of the church;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.41
- type: DcVerse
  data:
    ref: dc.41.10
    scripture: doctrine-and-covenants
    name: D&C 41:10
    chapter: 41
    verse: 10
    ordinal: 810
    text: To see to all things as it shall be appointed unto him in my laws in the day that I shall give them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.41
- type: DcVerse
  data:
    ref: dc.41.11
    scripture: doctrine-and-covenants
    name: D&C 41:11
    chapter: 41
    verse: 11
    ordinal: 811
    text: And this because his heart is pure before me, for he is like unto Nathanael of old, in whom there is no guile.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.41
- type: DcVerse
  data:
    ref: dc.41.12
    scripture: doctrine-and-covenants
    name: D&C 41:12
    chapter: 41
    verse: 12
    ordinal: 812
    text: These words are given unto you, and they are pure before me; wherefore, beware how you hold them, for they are to be answered upon your souls in the day of judgment. Even so. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.41
- type: DcVerse
  data:
    ref: dc.42.1
    scripture: doctrine-and-covenants
    name: D&C 42:1
    chapter: 42
    verse: 1
    ordinal: 813
    text: Hearken, O ye elders of my church, who have assembled yourselves together in my name, even Jesus Christ the Son of the living God, the Savior of the world; inasmuch as ye believe on my name and keep my commandments.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.2
    scripture: doctrine-and-covenants
    name: D&C 42:2
    chapter: 42
    verse: 2
    ordinal: 814
    text: Again I say unto you, hearken and hear and obey the law which I shall give unto you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.3
    scripture: doctrine-and-covenants
    name: D&C 42:3
    chapter: 42
    verse: 3
    ordinal: 815
    text: For verily I say, as ye have assembled yourselves together according to the commandment wherewith I commanded you, and are agreed as touching this one thing, and have asked the Father in my name, even so ye shall receive.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.4
    scripture: doctrine-and-covenants
    name: D&C 42:4
    chapter: 42
    verse: 4
    ordinal: 816
    text: Behold, verily I say unto you, I give unto you this first commandment, that ye shall go forth in my name, every one of you, excepting my servants Joseph Smith, Jun., and Sidney Rigdon.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.5
    scripture: doctrine-and-covenants
    name: D&C 42:5
    chapter: 42
    verse: 5
    ordinal: 817
    text: And I give unto them a commandment that they shall go forth for a little season, and it shall be given by the power of the Spirit when they shall return.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.6
    scripture: doctrine-and-covenants
    name: D&C 42:6
    chapter: 42
    verse: 6
    ordinal: 818
    text: And ye shall go forth in the power of my Spirit, preaching my gospel, two by two, in my name, lifting up your voices as with the sound of a trump, declaring my word like unto angels of God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.7
    scripture: doctrine-and-covenants
    name: D&C 42:7
    chapter: 42
    verse: 7
    ordinal: 819
    text: 'And ye shall go forth baptizing with water, saying: Repent ye, repent ye, for the kingdom of heaven is at hand.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.8
    scripture: doctrine-and-covenants
    name: D&C 42:8
    chapter: 42
    verse: 8
    ordinal: 820
    text: And from this place ye shall go forth into the regions westward; and inasmuch as ye shall find them that will receive you ye shall build up my church in every region—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.9
    scripture: doctrine-and-covenants
    name: D&C 42:9
    chapter: 42
    verse: 9
    ordinal: 821
    text: Until the time shall come when it shall be revealed unto you from on high, when the city of the New Jerusalem shall be prepared, that ye may be gathered in one, that ye may be my people and I will be your God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.10
    scripture: doctrine-and-covenants
    name: D&C 42:10
    chapter: 42
    verse: 10
    ordinal: 822
    text: And again, I say unto you, that my servant Edward Partridge shall stand in the office whereunto I have appointed him. And it shall come to pass, that if he transgress another shall be appointed in his stead. Even so. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.11
    scripture: doctrine-and-covenants
    name: D&C 42:11
    chapter: 42
    verse: 11
    ordinal: 823
    text: Again I say unto you, that it shall not be given to any one to go forth to preach my gospel, or to build up my church, except he be ordained by some one who has authority, and it is known to the church that he has authority and has been regularly ordained by the heads of the church.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.12
    scripture: doctrine-and-covenants
    name: D&C 42:12
    chapter: 42
    verse: 12
    ordinal: 824
    text: And again, the elders, priests and teachers of this church shall teach the principles of my gospel, which are in the Bible and the Book of Mormon, in the which is the fulness of the gospel.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.13
    scripture: doctrine-and-covenants
    name: D&C 42:13
    chapter: 42
    verse: 13
    ordinal: 825
    text: And they shall observe the covenants and church articles to do them, and these shall be their teachings, as they shall be directed by the Spirit.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.14
    scripture: doctrine-and-covenants
    name: D&C 42:14
    chapter: 42
    verse: 14
    ordinal: 826
    text: And the Spirit shall be given unto you by the prayer of faith; and if ye receive not the Spirit ye shall not teach.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.15
    scripture: doctrine-and-covenants
    name: D&C 42:15
    chapter: 42
    verse: 15
    ordinal: 827
    text: And all this ye shall observe to do as I have commanded concerning your teaching, until the fulness of my scriptures is given.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.16
    scripture: doctrine-and-covenants
    name: D&C 42:16
    chapter: 42
    verse: 16
    ordinal: 828
    text: And as ye shall lift up your voices by the Comforter, ye shall speak and prophesy as seemeth me good;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.17
    scripture: doctrine-and-covenants
    name: D&C 42:17
    chapter: 42
    verse: 17
    ordinal: 829
    text: For, behold, the Comforter knoweth all things, and beareth record of the Father and of the Son.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.18
    scripture: doctrine-and-covenants
    name: D&C 42:18
    chapter: 42
    verse: 18
    ordinal: 830
    text: And now, behold, I speak unto the church. Thou shalt not kill; and he that kills shall not have forgiveness in this world, nor in the world to come.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.19
    scripture: doctrine-and-covenants
    name: D&C 42:19
    chapter: 42
    verse: 19
    ordinal: 831
    text: And again, I say, thou shalt not kill; but he that killeth shall die.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.20
    scripture: doctrine-and-covenants
    name: D&C 42:20
    chapter: 42
    verse: 20
    ordinal: 832
    text: Thou shalt not steal; and he that stealeth and will not repent shall be cast out.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.21
    scripture: doctrine-and-covenants
    name: D&C 42:21
    chapter: 42
    verse: 21
    ordinal: 833
    text: Thou shalt not lie; he that lieth and will not repent shall be cast out.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.22
    scripture: doctrine-and-covenants
    name: D&C 42:22
    chapter: 42
    verse: 22
    ordinal: 834
    text: Thou shalt love thy wife with all thy heart, and shalt cleave unto her and none else.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.23
    scripture: doctrine-and-covenants
    name: D&C 42:23
    chapter: 42
    verse: 23
    ordinal: 835
    text: And he that looketh upon a woman to lust after her shall deny the faith, and shall not have the Spirit; and if he repents not he shall be cast out.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.24
    scripture: doctrine-and-covenants
    name: D&C 42:24
    chapter: 42
    verse: 24
    ordinal: 836
    text: Thou shalt not commit adultery; and he that committeth adultery, and repenteth not, shall be cast out.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Exodus 20:14
    kjvAllusionOsis:
    - Exod.20.14
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.25
    scripture: doctrine-and-covenants
    name: D&C 42:25
    chapter: 42
    verse: 25
    ordinal: 837
    text: But he that has committed adultery and repents with all his heart, and forsaketh it, and doeth it no more, thou shalt forgive;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.26
    scripture: doctrine-and-covenants
    name: D&C 42:26
    chapter: 42
    verse: 26
    ordinal: 838
    text: But if he doeth it again, he shall not be forgiven, but shall be cast out.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.27
    scripture: doctrine-and-covenants
    name: D&C 42:27
    chapter: 42
    verse: 27
    ordinal: 839
    text: Thou shalt not speak evil of thy neighbor, nor do him any harm.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.28
    scripture: doctrine-and-covenants
    name: D&C 42:28
    chapter: 42
    verse: 28
    ordinal: 840
    text: Thou knowest my laws concerning these things are given in my scriptures; he that sinneth and repenteth not shall be cast out.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.29
    scripture: doctrine-and-covenants
    name: D&C 42:29
    chapter: 42
    verse: 29
    ordinal: 841
    text: If thou lovest me thou shalt serve me and keep all my commandments.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.30
    scripture: doctrine-and-covenants
    name: D&C 42:30
    chapter: 42
    verse: 30
    ordinal: 842
    text: And behold, thou wilt remember the poor, and consecrate of thy properties for their support that which thou hast to impart unto them, with a covenant and a deed which cannot be broken.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.31
    scripture: doctrine-and-covenants
    name: D&C 42:31
    chapter: 42
    verse: 31
    ordinal: 843
    text: And inasmuch as ye impart of your substance unto the poor, ye will do it unto me; and they shall be laid before the bishop of my church and his counselors, two of the elders, or high priests, such as he shall appoint or has appointed and set apart for that purpose.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.32
    scripture: doctrine-and-covenants
    name: D&C 42:32
    chapter: 42
    verse: 32
    ordinal: 844
    text: And it shall come to pass, that after they are laid before the bishop of my church, and after that he has received these testimonies concerning the consecration of the properties of my church, that they cannot be taken from the church, agreeable to my commandments, every man shall be made accountable unto me, a steward over his own property, or that which he has received by consecration, as much as is sufficient for himself and family.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.33
    scripture: doctrine-and-covenants
    name: D&C 42:33
    chapter: 42
    verse: 33
    ordinal: 845
    text: And again, if there shall be properties in the hands of the church, or any individuals of it, more than is necessary for their support after this first consecration, which is a residue to be consecrated unto the bishop, it shall be kept to administer to those who have not, from time to time, that every man who has need may be amply supplied and receive according to his wants.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.34
    scripture: doctrine-and-covenants
    name: D&C 42:34
    chapter: 42
    verse: 34
    ordinal: 846
    text: Therefore, the residue shall be kept in my storehouse, to administer to the poor and the needy, as shall be appointed by the high council of the church, and the bishop and his council;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.35
    scripture: doctrine-and-covenants
    name: D&C 42:35
    chapter: 42
    verse: 35
    ordinal: 847
    text: And for the purpose of purchasing lands for the public benefit of the church, and building houses of worship, and building up of the New Jerusalem which is hereafter to be revealed—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.36
    scripture: doctrine-and-covenants
    name: D&C 42:36
    chapter: 42
    verse: 36
    ordinal: 848
    text: That my covenant people may be gathered in one in that day when I shall come to my temple. And this I do for the salvation of my people.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.37
    scripture: doctrine-and-covenants
    name: D&C 42:37
    chapter: 42
    verse: 37
    ordinal: 849
    text: And it shall come to pass, that he that sinneth and repenteth not shall be cast out of the church, and shall not receive again that which he has consecrated unto the poor and the needy of my church, or in other words, unto me—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.38
    scripture: doctrine-and-covenants
    name: D&C 42:38
    chapter: 42
    verse: 38
    ordinal: 850
    text: For inasmuch as ye do it unto the least of these, ye do it unto me.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Matthew 25:45
    kjvAllusionOsis:
    - Matt.25.45
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.39
    scripture: doctrine-and-covenants
    name: D&C 42:39
    chapter: 42
    verse: 39
    ordinal: 851
    text: For it shall come to pass, that which I spake by the mouths of my prophets shall be fulfilled; for I will consecrate of the riches of those who embrace my gospel among the Gentiles unto the poor of my people who are of the house of Israel.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.40
    scripture: doctrine-and-covenants
    name: D&C 42:40
    chapter: 42
    verse: 40
    ordinal: 852
    text: And again, thou shalt not be proud in thy heart; let all thy garments be plain, and their beauty the beauty of the work of thine own hands;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.41
    scripture: doctrine-and-covenants
    name: D&C 42:41
    chapter: 42
    verse: 41
    ordinal: 853
    text: And let all things be done in cleanliness before me.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.42
    scripture: doctrine-and-covenants
    name: D&C 42:42
    chapter: 42
    verse: 42
    ordinal: 854
    text: Thou shalt not be idle; for he that is idle shall not eat the bread nor wear the garments of the laborer.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.43
    scripture: doctrine-and-covenants
    name: D&C 42:43
    chapter: 42
    verse: 43
    ordinal: 855
    text: And whosoever among you are sick, and have not faith to be healed, but believe, shall be nourished with all tenderness, with herbs and mild food, and that not by the hand of an enemy.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.44
    scripture: doctrine-and-covenants
    name: D&C 42:44
    chapter: 42
    verse: 44
    ordinal: 856
    text: And the elders of the church, two or more, shall be called, and shall pray for and lay their hands upon them in my name; and if they die they shall die unto me, and if they live they shall live unto me.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.45
    scripture: doctrine-and-covenants
    name: D&C 42:45
    chapter: 42
    verse: 45
    ordinal: 857
    text: Thou shalt live together in love, insomuch that thou shalt weep for the loss of them that die, and more especially for those that have not hope of a glorious resurrection.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.46
    scripture: doctrine-and-covenants
    name: D&C 42:46
    chapter: 42
    verse: 46
    ordinal: 858
    text: And it shall come to pass that those that die in me shall not taste of death, for it shall be sweet unto them;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.47
    scripture: doctrine-and-covenants
    name: D&C 42:47
    chapter: 42
    verse: 47
    ordinal: 859
    text: And they that die not in me, wo unto them, for their death is bitter.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.48
    scripture: doctrine-and-covenants
    name: D&C 42:48
    chapter: 42
    verse: 48
    ordinal: 860
    text: And again, it shall come to pass that he that hath faith in me to be healed, and is not appointed unto death, shall be healed.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.49
    scripture: doctrine-and-covenants
    name: D&C 42:49
    chapter: 42
    verse: 49
    ordinal: 861
    text: He who hath faith to see shall see.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.50
    scripture: doctrine-and-covenants
    name: D&C 42:50
    chapter: 42
    verse: 50
    ordinal: 862
    text: He who hath faith to hear shall hear.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.51
    scripture: doctrine-and-covenants
    name: D&C 42:51
    chapter: 42
    verse: 51
    ordinal: 863
    text: The lame who hath faith to leap shall leap.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.52
    scripture: doctrine-and-covenants
    name: D&C 42:52
    chapter: 42
    verse: 52
    ordinal: 864
    text: And they who have not faith to do these things, but believe in me, have power to become my sons; and inasmuch as they break not my laws thou shalt bear their infirmities.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.53
    scripture: doctrine-and-covenants
    name: D&C 42:53
    chapter: 42
    verse: 53
    ordinal: 865
    text: Thou shalt stand in the place of thy stewardship.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.54
    scripture: doctrine-and-covenants
    name: D&C 42:54
    chapter: 42
    verse: 54
    ordinal: 866
    text: Thou shalt not take thy brother's garment; thou shalt pay for that which thou shalt receive of thy brother.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.55
    scripture: doctrine-and-covenants
    name: D&C 42:55
    chapter: 42
    verse: 55
    ordinal: 867
    text: And if thou obtainest more than that which would be for thy support, thou shalt give it into my storehouse, that all things may be done according to that which I have said.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.56
    scripture: doctrine-and-covenants
    name: D&C 42:56
    chapter: 42
    verse: 56
    ordinal: 868
    text: Thou shalt ask, and my scriptures shall be given as I have appointed, and they shall be preserved in safety;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.57
    scripture: doctrine-and-covenants
    name: D&C 42:57
    chapter: 42
    verse: 57
    ordinal: 869
    text: And it is expedient that thou shouldst hold thy peace concerning them, and not teach them until ye have received them in full.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.58
    scripture: doctrine-and-covenants
    name: D&C 42:58
    chapter: 42
    verse: 58
    ordinal: 870
    text: And I give unto you a commandment that then ye shall teach them unto all men; for they shall be taught unto all nations, kindreds, tongues and people.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.59
    scripture: doctrine-and-covenants
    name: D&C 42:59
    chapter: 42
    verse: 59
    ordinal: 871
    text: Thou shalt take the things which thou hast received, which have been given unto thee in my scriptures for a law, to be my law to govern my church;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.60
    scripture: doctrine-and-covenants
    name: D&C 42:60
    chapter: 42
    verse: 60
    ordinal: 872
    text: And he that doeth according to these things shall be saved, and he that doeth them not shall be damned if he so continue.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Mark 16:16
    kjvAllusionOsis:
    - Mark.16.16
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.61
    scripture: doctrine-and-covenants
    name: D&C 42:61
    chapter: 42
    verse: 61
    ordinal: 873
    text: If thou shalt ask, thou shalt receive revelation upon revelation, knowledge upon knowledge, that thou mayest know the mysteries and peaceable things—that which bringeth joy, that which bringeth life eternal.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.62
    scripture: doctrine-and-covenants
    name: D&C 42:62
    chapter: 42
    verse: 62
    ordinal: 874
    text: Thou shalt ask, and it shall be revealed unto you in mine own due time where the New Jerusalem shall be built.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.63
    scripture: doctrine-and-covenants
    name: D&C 42:63
    chapter: 42
    verse: 63
    ordinal: 875
    text: And behold, it shall come to pass that my servants shall be sent forth to the east and to the west, to the north and to the south.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Luke 13:29
    kjvAllusionOsis:
    - Luke.13.29
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.64
    scripture: doctrine-and-covenants
    name: D&C 42:64
    chapter: 42
    verse: 64
    ordinal: 876
    text: And even now, let him that goeth to the east teach them that shall be converted to flee to the west, and this in consequence of that which is coming on the earth, and of secret combinations.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.65
    scripture: doctrine-and-covenants
    name: D&C 42:65
    chapter: 42
    verse: 65
    ordinal: 877
    text: Behold, thou shalt observe all these things, and great shall be thy reward; for unto you it is given to know the mysteries of the kingdom, but unto the world it is not given to know them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.66
    scripture: doctrine-and-covenants
    name: D&C 42:66
    chapter: 42
    verse: 66
    ordinal: 878
    text: Ye shall observe the laws which ye have received and be faithful.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.67
    scripture: doctrine-and-covenants
    name: D&C 42:67
    chapter: 42
    verse: 67
    ordinal: 879
    text: And ye shall hereafter receive church covenants, such as shall be sufficient to establish you, both here and in the New Jerusalem.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.68
    scripture: doctrine-and-covenants
    name: D&C 42:68
    chapter: 42
    verse: 68
    ordinal: 880
    text: Therefore, he that lacketh wisdom, let him ask of me, and I will give him liberally and upbraid him not.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.69
    scripture: doctrine-and-covenants
    name: D&C 42:69
    chapter: 42
    verse: 69
    ordinal: 881
    text: Lift up your hearts and rejoice, for unto you the kingdom, or in other words, the keys of the church have been given. Even so. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.70
    scripture: doctrine-and-covenants
    name: D&C 42:70
    chapter: 42
    verse: 70
    ordinal: 882
    text: The priests and teachers shall have their stewardships, even as the members.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.71
    scripture: doctrine-and-covenants
    name: D&C 42:71
    chapter: 42
    verse: 71
    ordinal: 883
    text: And the elders or high priests who are appointed to assist the bishop as counselors in all things, are to have their families supported out of the property which is consecrated to the bishop, for the good of the poor, and for other purposes, as before mentioned;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.72
    scripture: doctrine-and-covenants
    name: D&C 42:72
    chapter: 42
    verse: 72
    ordinal: 884
    text: Or they are to receive a just remuneration for all their services, either a stewardship or otherwise, as may be thought best or decided by the counselors and bishop.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.73
    scripture: doctrine-and-covenants
    name: D&C 42:73
    chapter: 42
    verse: 73
    ordinal: 885
    text: And the bishop, also, shall receive his support, or a just remuneration for all his services in the church.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.74
    scripture: doctrine-and-covenants
    name: D&C 42:74
    chapter: 42
    verse: 74
    ordinal: 886
    text: Behold, verily I say unto you, that whatever persons among you, having put away their companions for the cause of fornication, or in other words, if they shall testify before you in all lowliness of heart that this is the case, ye shall not cast them out from among you;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.75
    scripture: doctrine-and-covenants
    name: D&C 42:75
    chapter: 42
    verse: 75
    ordinal: 887
    text: But if ye shall find that any persons have left their companions for the sake of adultery, and they themselves are the offenders, and their companions are living, they shall be cast out from among you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.76
    scripture: doctrine-and-covenants
    name: D&C 42:76
    chapter: 42
    verse: 76
    ordinal: 888
    text: And again, I say unto you, that ye shall be watchful and careful, with all inquiry, that ye receive none such among you if they are married;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.77
    scripture: doctrine-and-covenants
    name: D&C 42:77
    chapter: 42
    verse: 77
    ordinal: 889
    text: And if they are not married, they shall repent of all their sins or ye shall not receive them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.78
    scripture: doctrine-and-covenants
    name: D&C 42:78
    chapter: 42
    verse: 78
    ordinal: 890
    text: And again, every person who belongeth to this church of Christ, shall observe to keep all the commandments and covenants of the church.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.79
    scripture: doctrine-and-covenants
    name: D&C 42:79
    chapter: 42
    verse: 79
    ordinal: 891
    text: And it shall come to pass, that if any persons among you shall kill they shall be delivered up and dealt with according to the laws of the land; for remember that he hath no forgiveness; and it shall be proved according to the laws of the land.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.80
    scripture: doctrine-and-covenants
    name: D&C 42:80
    chapter: 42
    verse: 80
    ordinal: 892
    text: And if any man or woman shall commit adultery, he or she shall be tried before two elders of the church, or more, and every word shall be established against him or her by two witnesses of the church, and not of the enemy; but if there are more than two witnesses it is better.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.81
    scripture: doctrine-and-covenants
    name: D&C 42:81
    chapter: 42
    verse: 81
    ordinal: 893
    text: But he or she shall be condemned by the mouth of two witnesses; and the elders shall lay the case before the church, and the church shall lift up their hands against him or her, that they may be dealt with according to the law of God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.82
    scripture: doctrine-and-covenants
    name: D&C 42:82
    chapter: 42
    verse: 82
    ordinal: 894
    text: And if it can be, it is necessary that the bishop be present also.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.83
    scripture: doctrine-and-covenants
    name: D&C 42:83
    chapter: 42
    verse: 83
    ordinal: 895
    text: And thus ye shall do in all cases which shall come before you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.84
    scripture: doctrine-and-covenants
    name: D&C 42:84
    chapter: 42
    verse: 84
    ordinal: 896
    text: And if a man or woman shall rob, he or she shall be delivered up unto the law of the land.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.85
    scripture: doctrine-and-covenants
    name: D&C 42:85
    chapter: 42
    verse: 85
    ordinal: 897
    text: And if he or she shall steal, he or she shall be delivered up unto the law of the land.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.86
    scripture: doctrine-and-covenants
    name: D&C 42:86
    chapter: 42
    verse: 86
    ordinal: 898
    text: And if he or she shall lie, he or she shall be delivered up unto the law of the land.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.87
    scripture: doctrine-and-covenants
    name: D&C 42:87
    chapter: 42
    verse: 87
    ordinal: 899
    text: And if he or she do any manner of iniquity, he or she shall be delivered up unto the law, even that of God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.88
    scripture: doctrine-and-covenants
    name: D&C 42:88
    chapter: 42
    verse: 88
    ordinal: 900
    text: And if thy brother or sister offend thee, thou shalt take him or her between him or her and thee alone; and if he or she confess thou shalt be reconciled.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.89
    scripture: doctrine-and-covenants
    name: D&C 42:89
    chapter: 42
    verse: 89
    ordinal: 901
    text: And if he or she confess not thou shalt deliver him or her up unto the church, not to the members, but to the elders. And it shall be done in a meeting, and that not before the world.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.90
    scripture: doctrine-and-covenants
    name: D&C 42:90
    chapter: 42
    verse: 90
    ordinal: 902
    text: And if thy brother or sister offend many, he or she shall be chastened before many.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.91
    scripture: doctrine-and-covenants
    name: D&C 42:91
    chapter: 42
    verse: 91
    ordinal: 903
    text: And if any one offend openly, he or she shall be rebuked openly, that he or she may be ashamed. And if he or she confess not, he or she shall be delivered up unto the law of God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.92
    scripture: doctrine-and-covenants
    name: D&C 42:92
    chapter: 42
    verse: 92
    ordinal: 904
    text: If any shall offend in secret, he or she shall be rebuked in secret, that he or she may have opportunity to confess in secret to him or her whom he or she has offended, and to God, that the church may not speak reproachfully of him or her.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.42.93
    scripture: doctrine-and-covenants
    name: D&C 42:93
    chapter: 42
    verse: 93
    ordinal: 905
    text: And thus shall ye conduct in all things.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.42
- type: DcVerse
  data:
    ref: dc.43.1
    scripture: doctrine-and-covenants
    name: D&C 43:1
    chapter: 43
    verse: 1
    ordinal: 906
    text: O hearken, ye elders of my church, and give ear to the words which I shall speak unto you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.43
- type: DcVerse
  data:
    ref: dc.43.2
    scripture: doctrine-and-covenants
    name: D&C 43:2
    chapter: 43
    verse: 2
    ordinal: 907
    text: For behold, verily, verily, I say unto you, that ye have received a commandment for a law unto my church, through him whom I have appointed unto you to receive commandments and revelations from my hand.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.43
- type: DcVerse
  data:
    ref: dc.43.3
    scripture: doctrine-and-covenants
    name: D&C 43:3
    chapter: 43
    verse: 3
    ordinal: 908
    text: And this ye shall know assuredly—that there is none other appointed unto you to receive commandments and revelations until he be taken, if he abide in me.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.43
- type: DcVerse
  data:
    ref: dc.43.4
    scripture: doctrine-and-covenants
    name: D&C 43:4
    chapter: 43
    verse: 4
    ordinal: 909
    text: But verily, verily, I say unto you, that none else shall be appointed unto this gift except it be through him; for if it be taken from him he shall not have power except to appoint another in his stead.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.43
- type: DcVerse
  data:
    ref: dc.43.5
    scripture: doctrine-and-covenants
    name: D&C 43:5
    chapter: 43
    verse: 5
    ordinal: 910
    text: And this shall be a law unto you, that ye receive not the teachings of any that shall come before you as revelations or commandments;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.43
- type: DcVerse
  data:
    ref: dc.43.6
    scripture: doctrine-and-covenants
    name: D&C 43:6
    chapter: 43
    verse: 6
    ordinal: 911
    text: And this I give unto you that you may not be deceived, that you may know they are not of me.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.43
- type: DcVerse
  data:
    ref: dc.43.7
    scripture: doctrine-and-covenants
    name: D&C 43:7
    chapter: 43
    verse: 7
    ordinal: 912
    text: For verily I say unto you, that he that is ordained of me shall come in at the gate and be ordained as I have told you before, to teach those revelations which you have received and shall receive through him whom I have appointed.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.43
- type: DcVerse
  data:
    ref: dc.43.8
    scripture: doctrine-and-covenants
    name: D&C 43:8
    chapter: 43
    verse: 8
    ordinal: 913
    text: And now, behold, I give unto you a commandment, that when ye are assembled together ye shall instruct and edify each other, that ye may know how to act and direct my church, how to act upon the points of my law and commandments, which I have given.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.43
- type: DcVerse
  data:
    ref: dc.43.9
    scripture: doctrine-and-covenants
    name: D&C 43:9
    chapter: 43
    verse: 9
    ordinal: 914
    text: And thus ye shall become instructed in the law of my church, and be sanctified by that which ye have received, and ye shall bind yourselves to act in all holiness before me—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.43
- type: DcVerse
  data:
    ref: dc.43.10
    scripture: doctrine-and-covenants
    name: D&C 43:10
    chapter: 43
    verse: 10
    ordinal: 915
    text: That inasmuch as ye do this, glory shall be added to the kingdom which ye have received. Inasmuch as ye do it not, it shall be taken, even that which ye have received.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.43
- type: DcVerse
  data:
    ref: dc.43.11
    scripture: doctrine-and-covenants
    name: D&C 43:11
    chapter: 43
    verse: 11
    ordinal: 916
    text: Purge ye out the iniquity which is among you; sanctify yourselves before me;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.43
- type: DcVerse
  data:
    ref: dc.43.12
    scripture: doctrine-and-covenants
    name: D&C 43:12
    chapter: 43
    verse: 12
    ordinal: 917
    text: And if ye desire the glories of the kingdom, appoint ye my servant Joseph Smith, Jun., and uphold him before me by the prayer of faith.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.43
- type: DcVerse
  data:
    ref: dc.43.13
    scripture: doctrine-and-covenants
    name: D&C 43:13
    chapter: 43
    verse: 13
    ordinal: 918
    text: And again, I say unto you, that if ye desire the mysteries of the kingdom, provide for him food and raiment, and whatsoever thing he needeth to accomplish the work wherewith I have commanded him;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.43
- type: DcVerse
  data:
    ref: dc.43.14
    scripture: doctrine-and-covenants
    name: D&C 43:14
    chapter: 43
    verse: 14
    ordinal: 919
    text: And if ye do it not he shall remain unto them that have received him, that I may reserve unto myself a pure people before me.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.43
- type: DcVerse
  data:
    ref: dc.43.15
    scripture: doctrine-and-covenants
    name: D&C 43:15
    chapter: 43
    verse: 15
    ordinal: 920
    text: 'Again I say, hearken ye elders of my church, whom I have appointed: Ye are not sent forth to be taught, but to teach the children of men the things which I have put into your hands by the power of my Spirit;'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.43
- type: DcVerse
  data:
    ref: dc.43.16
    scripture: doctrine-and-covenants
    name: D&C 43:16
    chapter: 43
    verse: 16
    ordinal: 921
    text: And ye are to be taught from on high. Sanctify yourselves and ye shall be endowed with power, that ye may give even as I have spoken.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.43
- type: DcVerse
  data:
    ref: dc.43.17
    scripture: doctrine-and-covenants
    name: D&C 43:17
    chapter: 43
    verse: 17
    ordinal: 922
    text: Hearken ye, for, behold, the great day of the Lord is nigh at hand.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.43
- type: DcVerse
  data:
    ref: dc.43.18
    scripture: doctrine-and-covenants
    name: D&C 43:18
    chapter: 43
    verse: 18
    ordinal: 923
    text: 'For the day cometh that the Lord shall utter his voice out of heaven; the heavens shall shake and the earth shall tremble, and the trump of God shall sound both long and loud, and shall say to the sleeping nations: Ye saints arise and live; ye sinners stay and sleep until I shall call again.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.43
- type: DcVerse
  data:
    ref: dc.43.19
    scripture: doctrine-and-covenants
    name: D&C 43:19
    chapter: 43
    verse: 19
    ordinal: 924
    text: Wherefore gird up your loins lest ye be found among the wicked.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.43
- type: DcVerse
  data:
    ref: dc.43.20
    scripture: doctrine-and-covenants
    name: D&C 43:20
    chapter: 43
    verse: 20
    ordinal: 925
    text: 'Lift up your voices and spare not. Call upon the nations to repent, both old and young, both bond and free, saying: Prepare yourselves for the great day of the Lord;'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.43
- type: DcVerse
  data:
    ref: dc.43.21
    scripture: doctrine-and-covenants
    name: D&C 43:21
    chapter: 43
    verse: 21
    ordinal: 926
    text: For if I, who am a man, do lift up my voice and call upon you to repent, and ye hate me, what will ye say when the day cometh when the thunders shall utter their voices from the ends of the earth, speaking to the ears of all that live, saying—Repent, and prepare for the great day of the Lord?
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.43
- type: DcVerse
  data:
    ref: dc.43.22
    scripture: doctrine-and-covenants
    name: D&C 43:22
    chapter: 43
    verse: 22
    ordinal: 927
    text: Yea, and again, when the lightnings shall streak forth from the east unto the west, and shall utter forth their voices unto all that live, and make the ears of all tingle that hear, saying these words—Repent ye, for the great day of the Lord is come?
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.43
- type: DcVerse
  data:
    ref: dc.43.23
    scripture: doctrine-and-covenants
    name: D&C 43:23
    chapter: 43
    verse: 23
    ordinal: 928
    text: 'And again, the Lord shall utter his voice out of heaven, saying: Hearken, O ye nations of the earth, and hear the words of that God who made you.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.43
- type: DcVerse
  data:
    ref: dc.43.24
    scripture: doctrine-and-covenants
    name: D&C 43:24
    chapter: 43
    verse: 24
    ordinal: 929
    text: O, ye nations of the earth, how often would I have gathered you together as a hen gathereth her chickens under her wings, but ye would not!
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Matthew 23:37
    kjvAllusionOsis:
    - Matt.23.37
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.43
- type: DcVerse
  data:
    ref: dc.43.25
    scripture: doctrine-and-covenants
    name: D&C 43:25
    chapter: 43
    verse: 25
    ordinal: 930
    text: How oft have I called upon you by the mouth of my servants, and by the ministering of angels, and by mine own voice, and by the voice of thunderings, and by the voice of lightnings, and by the voice of tempests, and by the voice of earthquakes, and great hailstorms, and by the voice of famines and pestilences of every kind, and by the great sound of a trump, and by the voice of judgment, and by the voice of mercy all the day long, and by the voice of glory and honor and the riches of eternal life, and would have saved you with an everlasting salvation, but ye would not!
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.43
- type: DcVerse
  data:
    ref: dc.43.26
    scripture: doctrine-and-covenants
    name: D&C 43:26
    chapter: 43
    verse: 26
    ordinal: 931
    text: Behold, the day has come, when the cup of the wrath of mine indignation is full.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.43
- type: DcVerse
  data:
    ref: dc.43.27
    scripture: doctrine-and-covenants
    name: D&C 43:27
    chapter: 43
    verse: 27
    ordinal: 932
    text: Behold, verily I say unto you, that these are the words of the Lord your God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.43
- type: DcVerse
  data:
    ref: dc.43.28
    scripture: doctrine-and-covenants
    name: D&C 43:28
    chapter: 43
    verse: 28
    ordinal: 933
    text: Wherefore, labor ye, labor ye in my vineyard for the last time—for the last time call upon the inhabitants of the earth.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.43
- type: DcVerse
  data:
    ref: dc.43.29
    scripture: doctrine-and-covenants
    name: D&C 43:29
    chapter: 43
    verse: 29
    ordinal: 934
    text: For in mine own due time will I come upon the earth in judgment, and my people shall be redeemed and shall reign with me on earth.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.43
- type: DcVerse
  data:
    ref: dc.43.30
    scripture: doctrine-and-covenants
    name: D&C 43:30
    chapter: 43
    verse: 30
    ordinal: 935
    text: For the great Millennium, of which I have spoken by the mouth of my servants, shall come.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.43
- type: DcVerse
  data:
    ref: dc.43.31
    scripture: doctrine-and-covenants
    name: D&C 43:31
    chapter: 43
    verse: 31
    ordinal: 936
    text: For Satan shall be bound, and when he is loosed again he shall only reign for a little season, and then cometh the end of the earth.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.43
- type: DcVerse
  data:
    ref: dc.43.32
    scripture: doctrine-and-covenants
    name: D&C 43:32
    chapter: 43
    verse: 32
    ordinal: 937
    text: And he that liveth in righteousness shall be changed in the twinkling of an eye, and the earth shall pass away so as by fire.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.43
- type: DcVerse
  data:
    ref: dc.43.33
    scripture: doctrine-and-covenants
    name: D&C 43:33
    chapter: 43
    verse: 33
    ordinal: 938
    text: And the wicked shall go away into unquenchable fire, and their end no man knoweth on earth, nor ever shall know, until they come before me in judgment.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.43
- type: DcVerse
  data:
    ref: dc.43.34
    scripture: doctrine-and-covenants
    name: D&C 43:34
    chapter: 43
    verse: 34
    ordinal: 939
    text: Hearken ye to these words. Behold, I am Jesus Christ, the Savior of the world. Treasure these things up in your hearts, and let the solemnities of eternity rest upon your minds.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.43
- type: DcVerse
  data:
    ref: dc.43.35
    scripture: doctrine-and-covenants
    name: D&C 43:35
    chapter: 43
    verse: 35
    ordinal: 940
    text: Be sober. Keep all my commandments. Even so. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.43
- type: DcVerse
  data:
    ref: dc.44.1
    scripture: doctrine-and-covenants
    name: D&C 44:1
    chapter: 44
    verse: 1
    ordinal: 941
    text: Behold, thus saith the Lord unto you my servants, it is expedient in me that the elders of my church should be called together, from the east and from the west, and from the north and from the south, by letter or some other way.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.44
- type: DcVerse
  data:
    ref: dc.44.2
    scripture: doctrine-and-covenants
    name: D&C 44:2
    chapter: 44
    verse: 2
    ordinal: 942
    text: And it shall come to pass, that inasmuch as they are faithful, and exercise faith in me, I will pour out my Spirit upon them in the day that they assemble themselves together.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.44
- type: DcVerse
  data:
    ref: dc.44.3
    scripture: doctrine-and-covenants
    name: D&C 44:3
    chapter: 44
    verse: 3
    ordinal: 943
    text: And it shall come to pass that they shall go forth into the regions round about, and preach repentance unto the people.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.44
- type: DcVerse
  data:
    ref: dc.44.4
    scripture: doctrine-and-covenants
    name: D&C 44:4
    chapter: 44
    verse: 4
    ordinal: 944
    text: And many shall be converted, insomuch that ye shall obtain power to organize yourselves according to the laws of man;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.44
- type: DcVerse
  data:
    ref: dc.44.5
    scripture: doctrine-and-covenants
    name: D&C 44:5
    chapter: 44
    verse: 5
    ordinal: 945
    text: That your enemies may not have power over you; that you may be preserved in all things; that you may be enabled to keep my laws; that every bond may be broken wherewith the enemy seeketh to destroy my people.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.44
- type: DcVerse
  data:
    ref: dc.44.6
    scripture: doctrine-and-covenants
    name: D&C 44:6
    chapter: 44
    verse: 6
    ordinal: 946
    text: Behold, I say unto you, that ye must visit the poor and the needy and administer to their relief, that they may be kept until all things may be done according to my law which ye have received. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.44
- type: DcVerse
  data:
    ref: dc.45.1
    scripture: doctrine-and-covenants
    name: D&C 45:1
    chapter: 45
    verse: 1
    ordinal: 947
    text: Hearken, O ye people of my church, to whom the kingdom has been given; hearken ye and give ear to him who laid the foundation of the earth, who made the heavens and all the hosts thereof, and by whom all things were made which live, and move, and have a being.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.45
- type: DcVerse
  data:
    ref: dc.45.2
    scripture: doctrine-and-covenants
    name: D&C 45:2
    chapter: 45
    verse: 2
    ordinal: 948
    text: And again I say, hearken unto my voice, lest death shall overtake you; in an hour when ye think not the summer shall be past, and the harvest ended, and your souls not saved.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.45
- type: DcVerse
  data:
    ref: dc.45.3
    scripture: doctrine-and-covenants
    name: D&C 45:3
    chapter: 45
    verse: 3
    ordinal: 949
    text: Listen to him who is the advocate with the Father, who is pleading your cause before him—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.45
- type: DcVerse
  data:
    ref: dc.45.4
    scripture: doctrine-and-covenants
    name: D&C 45:4
    chapter: 45
    verse: 4
    ordinal: 950
    text: 'Saying: Father, behold the sufferings and death of him who did no sin, in whom thou wast well pleased; behold the blood of thy Son which was shed, the blood of him whom thou gavest that thyself might be glorified;'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.45
- type: DcVerse
  data:
    ref: dc.45.5
    scripture: doctrine-and-covenants
    name: D&C 45:5
    chapter: 45
    verse: 5
    ordinal: 951
    text: Wherefore, Father, spare these my brethren that believe on my name, that they may come unto me and have everlasting life.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.45
- type: DcVerse
  data:
    ref: dc.45.6
    scripture: doctrine-and-covenants
    name: D&C 45:6
    chapter: 45
    verse: 6
    ordinal: 952
    text: Hearken, O ye people of my church, and ye elders listen together, and hear my voice while it is called today, and harden not your hearts;
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Hebrews 3:15
    kjvAllusionOsis:
    - Heb.3.15
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.45
- type: DcVerse
  data:
    ref: dc.45.7
    scripture: doctrine-and-covenants
    name: D&C 45:7
    chapter: 45
    verse: 7
    ordinal: 953
    text: For verily I say unto you that I am Alpha and Omega, the beginning and the end, the light and the life of the world—a light that shineth in darkness and the darkness comprehendeth it not.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Revelation 22:13
    kjvAllusionOsis:
    - Rev.22.13
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.45
- type: DcVerse
  data:
    ref: dc.45.8
    scripture: doctrine-and-covenants
    name: D&C 45:8
    chapter: 45
    verse: 8
    ordinal: 954
    text: I came unto mine own, and mine own received me not; but unto as many as received me gave I power to do many miracles, and to become the sons of God; and even unto them that believed on my name gave I power to obtain eternal life.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - John 1:12
    kjvAllusionOsis:
    - John.1.12
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.45
- type: DcVerse
  data:
    ref: dc.45.9
    scripture: doctrine-and-covenants
    name: D&C 45:9
    chapter: 45
    verse: 9
    ordinal: 955
    text: And even so I have sent mine everlasting covenant into the world, to be a light to the world, and to be a standard for my people, and for the Gentiles to seek to it, and to be a messenger before my face to prepare the way before me.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.45
- type: DcVerse
  data:
    ref: dc.45.10
    scripture: doctrine-and-covenants
    name: D&C 45:10
    chapter: 45
    verse: 10
    ordinal: 956
    text: Wherefore, come ye unto it, and with him that cometh I will reason as with men in days of old, and I will show unto you my strong reasoning.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.45
- type: DcVerse
  data:
    ref: dc.45.11
    scripture: doctrine-and-covenants
    name: D&C 45:11
    chapter: 45
    verse: 11
    ordinal: 957
    text: Wherefore, hearken ye together and let me show unto you even my wisdom—the wisdom of him whom ye say is the God of Enoch, and his brethren,
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.45
- type: DcVerse
  data:
    ref: dc.45.12
    scripture: doctrine-and-covenants
    name: D&C 45:12
    chapter: 45
    verse: 12
    ordinal: 958
    text: Who were separated from the earth, and were received unto myself—a city reserved until a day of righteousness shall come—a day which was sought for by all holy men, and they found it not because of wickedness and abominations;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.45
- type: DcVerse
  data:
    ref: dc.45.13
    scripture: doctrine-and-covenants
    name: D&C 45:13
    chapter: 45
    verse: 13
    ordinal: 959
    text: And confessed they were strangers and pilgrims on the earth;
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Hebrews 11:13
    kjvAllusionOsis:
    - Heb.11.13
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.45
- type: DcVerse
  data:
    ref: dc.45.14
    scripture: doctrine-and-covenants
    name: D&C 45:14
    chapter: 45
    verse: 14
    ordinal: 960
    text: But obtained a promise that they should find it and see it in their flesh.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.45
- type: DcVerse
  data:
    ref: dc.45.15
    scripture: doctrine-and-covenants
    name: D&C 45:15
    chapter: 45
    verse: 15
    ordinal: 961
    text: Wherefore, hearken and I will reason with you, and I will speak unto you and prophesy, as unto men in days of old.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.45
- type: DcVerse
  data:
    ref: dc.45.16
    scripture: doctrine-and-covenants
    name: D&C 45:16
    chapter: 45
    verse: 16
    ordinal: 962
    text: 'And I will show it plainly as I showed it unto my disciples as I stood before them in the flesh, and spake unto them, saying: As ye have asked of me concerning the signs of my coming, in the day when I shall come in my glory in the clouds of heaven, to fulfil the promises that I have made unto your fathers,'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.45
- type: DcVerse
  data:
    ref: dc.45.17
    scripture: doctrine-and-covenants
    name: D&C 45:17
    chapter: 45
    verse: 17
    ordinal: 963
    text: For as ye have looked upon the long absence of your spirits from your bodies to be a bondage, I will show unto you how the day of redemption shall come, and also the restoration of the scattered Israel.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.45
- type: DcVerse
  data:
    ref: dc.45.18
    scripture: doctrine-and-covenants
    name: D&C 45:18
    chapter: 45
    verse: 18
    ordinal: 964
    text: And now ye behold this temple which is in Jerusalem, which ye call the house of God, and your enemies say that this house shall never fall.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.45
- type: DcVerse
  data:
    ref: dc.45.19
    scripture: doctrine-and-covenants
    name: D&C 45:19
    chapter: 45
    verse: 19
    ordinal: 965
    text: But, verily I say unto you, that desolation shall come upon this generation as a thief in the night, and this people shall be destroyed and scattered among all nations.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Matthew 23:36
    kjvAllusionOsis:
    - Matt.23.36
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.45
- type: DcVerse
  data:
    ref: dc.45.20
    scripture: doctrine-and-covenants
    name: D&C 45:20
    chapter: 45
    verse: 20
    ordinal: 966
    text: And this temple which ye now see shall be thrown down that there shall not be left one stone upon another.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Luke 21:6
    kjvAllusionOsis:
    - Luke.21.6
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.45
- type: DcVerse
  data:
    ref: dc.45.21
    scripture: doctrine-and-covenants
    name: D&C 45:21
    chapter: 45
    verse: 21
    ordinal: 967
    text: And it shall come to pass, that this generation of Jews shall not pass away until every desolation which I have told you concerning them shall come to pass.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.45
- type: DcVerse
  data:
    ref: dc.45.22
    scripture: doctrine-and-covenants
    name: D&C 45:22
    chapter: 45
    verse: 22
    ordinal: 968
    text: Ye say that ye know that the end of the world cometh; ye say also that ye know that the heavens and the earth shall pass away;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.45
- type: DcVerse
  data:
    ref: dc.45.23
    scripture: doctrine-and-covenants
    name: D&C 45:23
    chapter: 45
    verse: 23
    ordinal: 969
    text: And in this ye say truly, for so it is; but these things which I have told you shall not pass away until all shall be fulfilled.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.45
- type: DcVerse
  data:
    ref: dc.45.24
    scripture: doctrine-and-covenants
    name: D&C 45:24
    chapter: 45
    verse: 24
    ordinal: 970
    text: And this I have told you concerning Jerusalem; and when that day shall come, shall a remnant be scattered among all nations;
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Ezekiel 6:8
    kjvAllusionOsis:
    - Ezek.6.8
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.45
- type: DcVerse
  data:
    ref: dc.45.25
    scripture: doctrine-and-covenants
    name: D&C 45:25
    chapter: 45
    verse: 25
    ordinal: 971
    text: But they shall be gathered again; but they shall remain until the times of the Gentiles be fulfilled.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.45
- type: DcVerse
  data:
    ref: dc.45.26
    scripture: doctrine-and-covenants
    name: D&C 45:26
    chapter: 45
    verse: 26
    ordinal: 972
    text: And in that day shall be heard of wars and rumors of wars, and the whole earth shall be in commotion, and men's hearts shall fail them, and they shall say that Christ delayeth his coming until the end of the earth.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.45
- type: DcVerse
  data:
    ref: dc.45.27
    scripture: doctrine-and-covenants
    name: D&C 45:27
    chapter: 45
    verse: 27
    ordinal: 973
    text: And the love of men shall wax cold, and iniquity shall abound.
    translation: 2013 edition
    original: ''
    kjvRefs:
    - Matthew 24:12
    kjvOsis:
    - Matt.24.12
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.45
- type: DcVerse
  data:
    ref: dc.45.28
    scripture: doctrine-and-covenants
    name: D&C 45:28
    chapter: 45
    verse: 28
    ordinal: 974
    text: And when the times of the Gentiles is come in, a light shall break forth among them that sit in darkness, and it shall be the fulness of my gospel;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.45
- type: DcVerse
  data:
    ref: dc.45.29
    scripture: doctrine-and-covenants
    name: D&C 45:29
    chapter: 45
    verse: 29
    ordinal: 975
    text: But they receive it not; for they perceive not the light, and they turn their hearts from me because of the precepts of men.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.45
- type: DcVerse
  data:
    ref: dc.45.30
    scripture: doctrine-and-covenants
    name: D&C 45:30
    chapter: 45
    verse: 30
    ordinal: 976
    text: And in that generation shall the times of the Gentiles be fulfilled.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.45
- type: DcVerse
  data:
    ref: dc.45.31
    scripture: doctrine-and-covenants
    name: D&C 45:31
    chapter: 45
    verse: 31
    ordinal: 977
    text: And there shall be men standing in that generation, that shall not pass until they shall see an overflowing scourge; for a desolating sickness shall cover the land.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.45
- type: DcVerse
  data:
    ref: dc.45.32
    scripture: doctrine-and-covenants
    name: D&C 45:32
    chapter: 45
    verse: 32
    ordinal: 978
    text: But my disciples shall stand in holy places, and shall not be moved; but among the wicked, men shall lift up their voices and curse God and die.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.45
- type: DcVerse
  data:
    ref: dc.45.33
    scripture: doctrine-and-covenants
    name: D&C 45:33
    chapter: 45
    verse: 33
    ordinal: 979
    text: And there shall be earthquakes also in divers places, and many desolations; yet men will harden their hearts against me, and they will take up the sword, one against another, and they will kill one another.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.45
- type: DcVerse
  data:
    ref: dc.45.34
    scripture: doctrine-and-covenants
    name: D&C 45:34
    chapter: 45
    verse: 34
    ordinal: 980
    text: And now, when I the Lord had spoken these words unto my disciples, they were troubled.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.45
- type: DcVerse
  data:
    ref: dc.45.35
    scripture: doctrine-and-covenants
    name: D&C 45:35
    chapter: 45
    verse: 35
    ordinal: 981
    text: 'And I said unto them: Be not troubled, for, when all these things shall come to pass, ye may know that the promises which have been made unto you shall be fulfilled.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.45
- type: DcVerse
  data:
    ref: dc.45.36
    scripture: doctrine-and-covenants
    name: D&C 45:36
    chapter: 45
    verse: 36
    ordinal: 982
    text: And when the light shall begin to break forth, it shall be with them like unto a parable which I will show you—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.45
- type: DcVerse
  data:
    ref: dc.45.37
    scripture: doctrine-and-covenants
    name: D&C 45:37
    chapter: 45
    verse: 37
    ordinal: 983
    text: Ye look and behold the fig trees, and ye see them with your eyes, and ye say when they begin to shoot forth, and their leaves are yet tender, that summer is now nigh at hand;
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Luke 21:30
    kjvAllusionOsis:
    - Luke.21.30
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.45
- type: DcVerse
  data:
    ref: dc.45.38
    scripture: doctrine-and-covenants
    name: D&C 45:38
    chapter: 45
    verse: 38
    ordinal: 984
    text: Even so it shall be in that day when they shall see all these things, then shall they know that the hour is nigh.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.45
- type: DcVerse
  data:
    ref: dc.45.39
    scripture: doctrine-and-covenants
    name: D&C 45:39
    chapter: 45
    verse: 39
    ordinal: 985
    text: And it shall come to pass that he that feareth me shall be looking forth for the great day of the Lord to come, even for the signs of the coming of the Son of Man.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.45
- type: DcVerse
  data:
    ref: dc.45.40
    scripture: doctrine-and-covenants
    name: D&C 45:40
    chapter: 45
    verse: 40
    ordinal: 986
    text: And they shall see signs and wonders, for they shall be shown forth in the heavens above, and in the earth beneath.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Acts 2:19
    kjvAllusionOsis:
    - Acts.2.19
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.45
- type: DcVerse
  data:
    ref: dc.45.41
    scripture: doctrine-and-covenants
    name: D&C 45:41
    chapter: 45
    verse: 41
    ordinal: 987
    text: And they shall behold blood, and fire, and vapors of smoke.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.45
- type: DcVerse
  data:
    ref: dc.45.42
    scripture: doctrine-and-covenants
    name: D&C 45:42
    chapter: 45
    verse: 42
    ordinal: 988
    text: And before the day of the Lord shall come, the sun shall be darkened, and the moon be turned into blood, and the stars fall from heaven.
    translation: 2013 edition
    original: ''
