      ref: dc.3
- type: DcVerse
  data:
    ref: dc.3.12
    scripture: doctrine-and-covenants
    name: D&C 3:12
    chapter: 3
    verse: 12
    ordinal: 54
    text: And when thou deliveredst up that which God had given thee sight and power to translate, thou deliveredst up that which was sacred into the hands of a wicked man,
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.3
- type: DcVerse
  data:
    ref: dc.3.13
    scripture: doctrine-and-covenants
    name: D&C 3:13
    chapter: 3
    verse: 13
    ordinal: 55
    text: Who has set at naught the counsels of God, and has broken the most sacred promises which were made before God, and has depended upon his own judgment and boasted in his own wisdom.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.3
- type: DcVerse
  data:
    ref: dc.3.14
    scripture: doctrine-and-covenants
    name: D&C 3:14
    chapter: 3
    verse: 14
    ordinal: 56
    text: And this is the reason that thou hast lost thy privileges for a season—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.3
- type: DcVerse
  data:
    ref: dc.3.15
    scripture: doctrine-and-covenants
    name: D&C 3:15
    chapter: 3
    verse: 15
    ordinal: 57
    text: For thou hast suffered the counsel of thy director to be trampled upon from the beginning.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.3
- type: DcVerse
  data:
    ref: dc.3.16
    scripture: doctrine-and-covenants
    name: D&C 3:16
    chapter: 3
    verse: 16
    ordinal: 58
    text: Nevertheless, my work shall go forth, for inasmuch as the knowledge of a Savior has come unto the world, through the testimony of the Jews, even so shall the knowledge of a Savior come unto my people—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.3
- type: DcVerse
  data:
    ref: dc.3.17
    scripture: doctrine-and-covenants
    name: D&C 3:17
    chapter: 3
    verse: 17
    ordinal: 59
    text: And to the Nephites, and the Jacobites, and the Josephites, and the Zoramites, through the testimony of their fathers—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.3
- type: DcVerse
  data:
    ref: dc.3.18
    scripture: doctrine-and-covenants
    name: D&C 3:18
    chapter: 3
    verse: 18
    ordinal: 60
    text: And this testimony shall come to the knowledge of the Lamanites, and the Lemuelites, and the Ishmaelites, who dwindled in unbelief because of the iniquity of their fathers, whom the Lord has suffered to destroy their brethren the Nephites, because of their iniquities and their abominations.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.3
- type: DcVerse
  data:
    ref: dc.3.19
    scripture: doctrine-and-covenants
    name: D&C 3:19
    chapter: 3
    verse: 19
    ordinal: 61
    text: And for this very purpose are these plates preserved, which contain these records—that the promises of the Lord might be fulfilled, which he made to his people;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.3
- type: DcVerse
  data:
    ref: dc.3.20
    scripture: doctrine-and-covenants
    name: D&C 3:20
    chapter: 3
    verse: 20
    ordinal: 62
    text: And that the Lamanites might come to the knowledge of their fathers, and that they might know the promises of the Lord, and that they may believe the gospel and rely upon the merits of Jesus Christ, and be glorified through faith in his name, and that through their repentance they might be saved. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.3
- type: DcVerse
  data:
    ref: dc.4.1
    scripture: doctrine-and-covenants
    name: D&C 4:1
    chapter: 4
    verse: 1
    ordinal: 63
    text: Now behold, a marvelous work is about to come forth among the children of men.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.4
- type: DcVerse
  data:
    ref: dc.4.2
    scripture: doctrine-and-covenants
    name: D&C 4:2
    chapter: 4
    verse: 2
    ordinal: 64
    text: Therefore, O ye that embark in the service of God, see that ye serve him with all your heart, might, mind and strength, that ye may stand blameless before God at the last day.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.4
- type: DcVerse
  data:
    ref: dc.4.3
    scripture: doctrine-and-covenants
    name: D&C 4:3
    chapter: 4
    verse: 3
    ordinal: 65
    text: Therefore, if ye have desires to serve God ye are called to the work;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.4
- type: DcVerse
  data:
    ref: dc.4.4
    scripture: doctrine-and-covenants
    name: D&C 4:4
    chapter: 4
    verse: 4
    ordinal: 66
    text: For behold the field is white already to harvest; and lo, he that thrusteth in his sickle with his might, the same layeth up in store that he perisheth not, but bringeth salvation to his soul;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.4
- type: DcVerse
  data:
    ref: dc.4.5
    scripture: doctrine-and-covenants
    name: D&C 4:5
    chapter: 4
    verse: 5
    ordinal: 67
    text: And faith, hope, charity and love, with an eye single to the glory of God, qualify him for the work.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.4
- type: DcVerse
  data:
    ref: dc.4.6
    scripture: doctrine-and-covenants
    name: D&C 4:6
    chapter: 4
    verse: 6
    ordinal: 68
    text: Remember faith, virtue, knowledge, temperance, patience, brotherly kindness, godliness, charity, humility, diligence.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - 2 Peter 1:7
    kjvAllusionOsis:
    - 2Pet.1.7
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.4
- type: DcVerse
  data:
    ref: dc.4.7
    scripture: doctrine-and-covenants
    name: D&C 4:7
    chapter: 4
    verse: 7
    ordinal: 69
    text: Ask, and ye shall receive; knock, and it shall be opened unto you. Amen.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Matthew 7:7
    kjvAllusionOsis:
    - Matt.7.7
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.4
- type: DcVerse
  data:
    ref: dc.5.1
    scripture: doctrine-and-covenants
    name: D&C 5:1
    chapter: 5
    verse: 1
    ordinal: 70
    text: Behold, I say unto you, that as my servant Martin Harris has desired a witness at my hand, that you, my servant Joseph Smith, Jun., have got the plates of which you have testified and borne record that you have received of me;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.5
- type: DcVerse
  data:
    ref: dc.5.2
    scripture: doctrine-and-covenants
    name: D&C 5:2
    chapter: 5
    verse: 2
    ordinal: 71
    text: 'And now, behold, this shall you say unto him—he who spake unto you, said unto you: I, the Lord, am God, and have given these things unto you, my servant Joseph Smith, Jun., and have commanded you that you should stand as a witness of these things;'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.5
- type: DcVerse
  data:
    ref: dc.5.3
    scripture: doctrine-and-covenants
    name: D&C 5:3
    chapter: 5
    verse: 3
    ordinal: 72
    text: And I have caused you that you should enter into a covenant with me, that you should not show them except to those persons to whom I commanded you; and you have no power over them except I grant it unto you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.5
- type: DcVerse
  data:
    ref: dc.5.4
    scripture: doctrine-and-covenants
    name: D&C 5:4
    chapter: 5
    verse: 4
    ordinal: 73
    text: And you have a gift to translate the plates; and this is the first gift that I bestowed upon you; and I have commanded that you should pretend to no other gift until my purpose is fulfilled in this; for I will grant unto you no other gift until it is finished.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.5
- type: DcVerse
  data:
    ref: dc.5.5
    scripture: doctrine-and-covenants
    name: D&C 5:5
    chapter: 5
    verse: 5
    ordinal: 74
    text: Verily, I say unto you, that woe shall come unto the inhabitants of the earth if they will not hearken unto my words;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.5
- type: DcVerse
  data:
    ref: dc.5.6
    scripture: doctrine-and-covenants
    name: D&C 5:6
    chapter: 5
    verse: 6
    ordinal: 75
    text: For hereafter you shall be ordained and go forth and deliver my words unto the children of men.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.5
- type: DcVerse
  data:
    ref: dc.5.7
    scripture: doctrine-and-covenants
    name: D&C 5:7
    chapter: 5
    verse: 7
    ordinal: 76
    text: Behold, if they will not believe my words, they would not believe you, my servant Joseph, if it were possible that you should show them all these things which I have committed unto you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.5
- type: DcVerse
  data:
    ref: dc.5.8
    scripture: doctrine-and-covenants
    name: D&C 5:8
    chapter: 5
    verse: 8
    ordinal: 77
    text: Oh, this unbelieving and stiffnecked generation—mine anger is kindled against them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.5
- type: DcVerse
  data:
    ref: dc.5.9
    scripture: doctrine-and-covenants
    name: D&C 5:9
    chapter: 5
    verse: 9
    ordinal: 78
    text: Behold, verily I say unto you, I have reserved those things which I have entrusted unto you, my servant Joseph, for a wise purpose in me, and it shall be made known unto future generations;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.5
- type: DcVerse
  data:
    ref: dc.5.10
    scripture: doctrine-and-covenants
    name: D&C 5:10
    chapter: 5
    verse: 10
    ordinal: 79
    text: But this generation shall have my word through you;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.5
- type: DcVerse
  data:
    ref: dc.5.11
    scripture: doctrine-and-covenants
    name: D&C 5:11
    chapter: 5
    verse: 11
    ordinal: 80
    text: And in addition to your testimony, the testimony of three of my servants, whom I shall call and ordain, unto whom I will show these things, and they shall go forth with my words that are given through you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.5
- type: DcVerse
  data:
    ref: dc.5.12
    scripture: doctrine-and-covenants
    name: D&C 5:12
    chapter: 5
    verse: 12
    ordinal: 81
    text: Yea, they shall know of a surety that these things are true, for from heaven will I declare it unto them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.5
- type: DcVerse
  data:
    ref: dc.5.13
    scripture: doctrine-and-covenants
    name: D&C 5:13
    chapter: 5
    verse: 13
    ordinal: 82
    text: I will give them power that they may behold and view these things as they are;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.5
- type: DcVerse
  data:
    ref: dc.5.14
    scripture: doctrine-and-covenants
    name: D&C 5:14
    chapter: 5
    verse: 14
    ordinal: 83
    text: And to none else will I grant this power, to receive this same testimony among this generation, in this the beginning of the rising up and the coming forth of my church out of the wilderness—clear as the moon, and fair as the sun, and terrible as an army with banners.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Song of Solomon 6:10
    kjvAllusionOsis:
    - Song.6.10
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.5
- type: DcVerse
  data:
    ref: dc.5.15
    scripture: doctrine-and-covenants
    name: D&C 5:15
    chapter: 5
    verse: 15
    ordinal: 84
    text: And the testimony of three witnesses will I send forth of my word.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.5
- type: DcVerse
  data:
    ref: dc.5.16
    scripture: doctrine-and-covenants
    name: D&C 5:16
    chapter: 5
    verse: 16
    ordinal: 85
    text: And behold, whosoever believeth on my words, them will I visit with the manifestation of my Spirit; and they shall be born of me, even of water and of the Spirit—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.5
- type: DcVerse
  data:
    ref: dc.5.17
    scripture: doctrine-and-covenants
    name: D&C 5:17
    chapter: 5
    verse: 17
    ordinal: 86
    text: And you must wait yet a little while, for ye are not yet ordained—
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Hebrews 10:37
    kjvAllusionOsis:
    - Heb.10.37
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.5
- type: DcVerse
  data:
    ref: dc.5.18
    scripture: doctrine-and-covenants
    name: D&C 5:18
    chapter: 5
    verse: 18
    ordinal: 87
    text: And their testimony shall also go forth unto the condemnation of this generation if they harden their hearts against them;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.5
- type: DcVerse
  data:
    ref: dc.5.19
    scripture: doctrine-and-covenants
    name: D&C 5:19
    chapter: 5
    verse: 19
    ordinal: 88
    text: For a desolating scourge shall go forth among the inhabitants of the earth, and shall continue to be poured out from time to time, if they repent not, until the earth is empty, and the inhabitants thereof are consumed away and utterly destroyed by the brightness of my coming.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.5
- type: DcVerse
  data:
    ref: dc.5.20
    scripture: doctrine-and-covenants
    name: D&C 5:20
    chapter: 5
    verse: 20
    ordinal: 89
    text: Behold, I tell you these things, even as I also told the people of the destruction of Jerusalem; and my word shall be verified at this time as it hath hitherto been verified.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.5
- type: DcVerse
  data:
    ref: dc.5.21
    scripture: doctrine-and-covenants
    name: D&C 5:21
    chapter: 5
    verse: 21
    ordinal: 90
    text: And now I command you, my servant Joseph, to repent and walk more uprightly before me, and to yield to the persuasions of men no more;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.5
- type: DcVerse
  data:
    ref: dc.5.22
    scripture: doctrine-and-covenants
    name: D&C 5:22
    chapter: 5
    verse: 22
    ordinal: 91
    text: And that you be firm in keeping the commandments wherewith I have commanded you; and if you do this, behold I grant unto you eternal life, even if you should be slain.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.5
- type: DcVerse
  data:
    ref: dc.5.23
    scripture: doctrine-and-covenants
    name: D&C 5:23
    chapter: 5
    verse: 23
    ordinal: 92
    text: And now, again, I speak unto you, my servant Joseph, concerning the man that desires the witness—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.5
- type: DcVerse
  data:
    ref: dc.5.24
    scripture: doctrine-and-covenants
    name: D&C 5:24
    chapter: 5
    verse: 24
    ordinal: 93
    text: Behold, I say unto him, he exalts himself and does not humble himself sufficiently before me; but if he will bow down before me, and humble himself in mighty prayer and faith, in the sincerity of his heart, then will I grant unto him a view of the things which he desires to see.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.5
- type: DcVerse
  data:
    ref: dc.5.25
    scripture: doctrine-and-covenants
    name: D&C 5:25
    chapter: 5
    verse: 25
    ordinal: 94
    text: 'And then he shall say unto the people of this generation: Behold, I have seen the things which the Lord hath shown unto Joseph Smith, Jun., and I know of a surety that they are true, for I have seen them, for they have been shown unto me by the power of God and not of man.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.5
- type: DcVerse
  data:
    ref: dc.5.26
    scripture: doctrine-and-covenants
    name: D&C 5:26
    chapter: 5
    verse: 26
    ordinal: 95
    text: 'And I the Lord command him, my servant Martin Harris, that he shall say no more unto them concerning these things, except he shall say: I have seen them, and they have been shown unto me by the power of God; and these are the words which he shall say.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.5
- type: DcVerse
  data:
    ref: dc.5.27
    scripture: doctrine-and-covenants
    name: D&C 5:27
    chapter: 5
    verse: 27
    ordinal: 96
    text: But if he deny this he will break the covenant which he has before covenanted with me, and behold, he is condemned.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.5
- type: DcVerse
  data:
    ref: dc.5.28
    scripture: doctrine-and-covenants
    name: D&C 5:28
    chapter: 5
    verse: 28
    ordinal: 97
    text: And now, except he humble himself and acknowledge unto me the things that he has done which are wrong, and covenant with me that he will keep my commandments, and exercise faith in me, behold, I say unto him, he shall have no such views, for I will grant unto him no views of the things of which I have spoken.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.5
- type: DcVerse
  data:
    ref: dc.5.29
    scripture: doctrine-and-covenants
    name: D&C 5:29
    chapter: 5
    verse: 29
    ordinal: 98
    text: And if this be the case, I command you, my servant Joseph, that you shall say unto him, that he shall do no more, nor trouble me any more concerning this matter.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.5
- type: DcVerse
  data:
    ref: dc.5.30
    scripture: doctrine-and-covenants
    name: D&C 5:30
    chapter: 5
    verse: 30
    ordinal: 99
    text: And if this be the case, behold, I say unto thee Joseph, when thou hast translated a few more pages thou shalt stop for a season, even until I command thee again; then thou mayest translate again.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.5
- type: DcVerse
  data:
    ref: dc.5.31
    scripture: doctrine-and-covenants
    name: D&C 5:31
    chapter: 5
    verse: 31
    ordinal: 100
    text: And except thou do this, behold, thou shalt have no more gift, and I will take away the things which I have entrusted with thee.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.5
- type: DcVerse
  data:
    ref: dc.5.32
    scripture: doctrine-and-covenants
    name: D&C 5:32
    chapter: 5
    verse: 32
    ordinal: 101
    text: And now, because I foresee the lying in wait to destroy thee, yea, I foresee that if my servant Martin Harris humbleth not himself and receive a witness from my hand, that he will fall into transgression;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.5
- type: DcVerse
  data:
    ref: dc.5.33
    scripture: doctrine-and-covenants
    name: D&C 5:33
    chapter: 5
    verse: 33
    ordinal: 102
    text: And there are many that lie in wait to destroy thee from off the face of the earth; and for this cause, that thy days may be prolonged, I have given unto thee these commandments.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.5
- type: DcVerse
  data:
    ref: dc.5.34
    scripture: doctrine-and-covenants
    name: D&C 5:34
    chapter: 5
    verse: 34
    ordinal: 103
    text: 'Yea, for this cause I have said: Stop, and stand still until I command thee, and I will provide means whereby thou mayest accomplish the thing which I have commanded thee.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.5
- type: DcVerse
  data:
    ref: dc.5.35
    scripture: doctrine-and-covenants
    name: D&C 5:35
    chapter: 5
    verse: 35
    ordinal: 104
    text: And if thou art faithful in keeping my commandments, thou shalt be lifted up at the last day. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.5
- type: DcVerse
  data:
    ref: dc.6.1
    scripture: doctrine-and-covenants
    name: D&C 6:1
    chapter: 6
    verse: 1
    ordinal: 105
    text: A great and marvelous work is about to come forth unto the children of men.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.6
- type: DcVerse
  data:
    ref: dc.6.2
    scripture: doctrine-and-covenants
    name: D&C 6:2
    chapter: 6
    verse: 2
    ordinal: 106
    text: Behold, I am God; give heed unto my word, which is quick and powerful, sharper than a two-edged sword, to the dividing asunder of both joints and marrow; therefore give heed unto my words.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Hebrews 4:12
    kjvAllusionOsis:
    - Heb.4.12
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.6
- type: DcVerse
  data:
    ref: dc.6.3
    scripture: doctrine-and-covenants
    name: D&C 6:3
    chapter: 6
    verse: 3
    ordinal: 107
    text: Behold, the field is white already to harvest; therefore, whoso desireth to reap, let him thrust in his sickle with his might, and reap while the day lasts, that he may treasure up for his soul everlasting salvation in the kingdom of God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.6
- type: DcVerse
  data:
    ref: dc.6.4
    scripture: doctrine-and-covenants
    name: D&C 6:4
    chapter: 6
    verse: 4
    ordinal: 108
    text: Yea, whosoever will thrust in his sickle and reap, the same is called of God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.6
- type: DcVerse
  data:
    ref: dc.6.5
    scripture: doctrine-and-covenants
    name: D&C 6:5
    chapter: 6
    verse: 5
    ordinal: 109
    text: Therefore, if you will ask of me you shall receive; if you will knock it shall be opened unto you.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Matthew 7:7
    kjvAllusionOsis:
    - Matt.7.7
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.6
- type: DcVerse
  data:
    ref: dc.6.6
    scripture: doctrine-and-covenants
    name: D&C 6:6
    chapter: 6
    verse: 6
    ordinal: 110
    text: Now, as you have asked, behold, I say unto you, keep my commandments, and seek to bring forth and establish the cause of Zion;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.6
- type: DcVerse
  data:
    ref: dc.6.7
    scripture: doctrine-and-covenants
    name: D&C 6:7
    chapter: 6
    verse: 7
    ordinal: 111
    text: Seek not for riches but for wisdom, and behold, the mysteries of God shall be unfolded unto you, and then shall you be made rich. Behold, he that hath eternal life is rich.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.6
- type: DcVerse
  data:
    ref: dc.6.8
    scripture: doctrine-and-covenants
    name: D&C 6:8
    chapter: 6
    verse: 8
    ordinal: 112
    text: Verily, verily, I say unto you, even as you desire of me so it shall be unto you; and if you desire, you shall be the means of doing much good in this generation.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.6
- type: DcVerse
  data:
    ref: dc.6.9
    scripture: doctrine-and-covenants
    name: D&C 6:9
    chapter: 6
    verse: 9
    ordinal: 113
    text: Say nothing but repentance unto this generation; keep my commandments, and assist to bring forth my work, according to my commandments, and you shall be blessed.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.6
- type: DcVerse
  data:
    ref: dc.6.10
    scripture: doctrine-and-covenants
    name: D&C 6:10
    chapter: 6
    verse: 10
    ordinal: 114
    text: Behold thou hast a gift, and blessed art thou because of thy gift. Remember it is sacred and cometh from above—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.6
- type: DcVerse
  data:
    ref: dc.6.11
    scripture: doctrine-and-covenants
    name: D&C 6:11
    chapter: 6
    verse: 11
    ordinal: 115
    text: And if thou wilt inquire, thou shalt know mysteries which are great and marvelous; therefore thou shalt exercise thy gift, that thou mayest find out mysteries, that thou mayest bring many to the knowledge of the truth, yea, convince them of the error of their ways.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.6
- type: DcVerse
  data:
    ref: dc.6.12
    scripture: doctrine-and-covenants
    name: D&C 6:12
    chapter: 6
    verse: 12
    ordinal: 116
    text: Make not thy gift known unto any save it be those who are of thy faith. Trifle not with sacred things.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.6
- type: DcVerse
  data:
    ref: dc.6.13
    scripture: doctrine-and-covenants
    name: D&C 6:13
    chapter: 6
    verse: 13
    ordinal: 117
    text: If thou wilt do good, yea, and hold out faithful to the end, thou shalt be saved in the kingdom of God, which is the greatest of all the gifts of God; for there is no gift greater than the gift of salvation.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.6
- type: DcVerse
  data:
    ref: dc.6.14
    scripture: doctrine-and-covenants
    name: D&C 6:14
    chapter: 6
    verse: 14
    ordinal: 118
    text: Verily, verily, I say unto thee, blessed art thou for what thou hast done; for thou hast inquired of me, and behold, as often as thou hast inquired thou hast received instruction of my Spirit. If it had not been so, thou wouldst not have come to the place where thou art at this time.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.6
- type: DcVerse
  data:
    ref: dc.6.15
    scripture: doctrine-and-covenants
    name: D&C 6:15
    chapter: 6
    verse: 15
    ordinal: 119
    text: Behold, thou knowest that thou hast inquired of me and I did enlighten thy mind; and now I tell thee these things that thou mayest know that thou hast been enlightened by the Spirit of truth;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.6
- type: DcVerse
  data:
    ref: dc.6.16
    scripture: doctrine-and-covenants
    name: D&C 6:16
    chapter: 6
    verse: 16
    ordinal: 120
    text: Yea, I tell thee, that thou mayest know that there is none else save God that knowest thy thoughts and the intents of thy heart.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.6
- type: DcVerse
  data:
    ref: dc.6.17
    scripture: doctrine-and-covenants
    name: D&C 6:17
    chapter: 6
    verse: 17
    ordinal: 121
    text: I tell thee these things as a witness unto thee—that the words or the work which thou hast been writing are true.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.6
- type: DcVerse
  data:
    ref: dc.6.18
    scripture: doctrine-and-covenants
    name: D&C 6:18
    chapter: 6
    verse: 18
    ordinal: 122
    text: Therefore be diligent; stand by my servant Joseph, faithfully, in whatsoever difficult circumstances he may be for the word's sake.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.6
- type: DcVerse
  data:
    ref: dc.6.19
    scripture: doctrine-and-covenants
    name: D&C 6:19
    chapter: 6
    verse: 19
    ordinal: 123
    text: Admonish him in his faults, and also receive admonition of him. Be patient; be sober; be temperate; have patience, faith, hope and charity.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Titus 2:2
    kjvAllusionOsis:
    - Titus.2.2
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.6
- type: DcVerse
  data:
    ref: dc.6.20
    scripture: doctrine-and-covenants
    name: D&C 6:20
    chapter: 6
    verse: 20
    ordinal: 124
    text: Behold, thou art Oliver, and I have spoken unto thee because of thy desires; therefore treasure up these words in thy heart. Be faithful and diligent in keeping the commandments of God, and I will encircle thee in the arms of my love.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.6
- type: DcVerse
  data:
    ref: dc.6.21
    scripture: doctrine-and-covenants
    name: D&C 6:21
    chapter: 6
    verse: 21
    ordinal: 125
    text: Behold, I am Jesus Christ, the Son of God. I am the same that came unto mine own, and mine own received me not. I am the light which shineth in darkness, and the darkness comprehendeth it not.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.6
- type: DcVerse
  data:
    ref: dc.6.22
    scripture: doctrine-and-covenants
    name: D&C 6:22
    chapter: 6
    verse: 22
    ordinal: 126
    text: Verily, verily, I say unto you, if you desire a further witness, cast your mind upon the night that you cried unto me in your heart, that you might know concerning the truth of these things.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.6
- type: DcVerse
  data:
    ref: dc.6.23
    scripture: doctrine-and-covenants
    name: D&C 6:23
    chapter: 6
    verse: 23
    ordinal: 127
    text: Did I not speak peace to your mind concerning the matter? What greater witness can you have than from God?
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.6
- type: DcVerse
  data:
    ref: dc.6.24
    scripture: doctrine-and-covenants
    name: D&C 6:24
    chapter: 6
    verse: 24
    ordinal: 128
    text: And now, behold, you have received a witness; for if I have told you things which no man knoweth have you not received a witness?
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.6
- type: DcVerse
  data:
    ref: dc.6.25
    scripture: doctrine-and-covenants
    name: D&C 6:25
    chapter: 6
    verse: 25
    ordinal: 129
    text: And, behold, I grant unto you a gift, if you desire of me, to translate, even as my servant Joseph.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.6
- type: DcVerse
  data:
    ref: dc.6.26
    scripture: doctrine-and-covenants
    name: D&C 6:26
    chapter: 6
    verse: 26
    ordinal: 130
    text: Verily, verily, I say unto you, that there are records which contain much of my gospel, which have been kept back because of the wickedness of the people;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.6
- type: DcVerse
  data:
    ref: dc.6.27
    scripture: doctrine-and-covenants
    name: D&C 6:27
    chapter: 6
    verse: 27
    ordinal: 131
    text: And now I command you, that if you have good desires—a desire to lay up treasures for yourself in heaven—then shall you assist in bringing to light, with your gift, those parts of my scriptures which have been hidden because of iniquity.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.6
- type: DcVerse
  data:
    ref: dc.6.28
    scripture: doctrine-and-covenants
    name: D&C 6:28
    chapter: 6
    verse: 28
    ordinal: 132
    text: And now, behold, I give unto you, and also unto my servant Joseph, the keys of this gift, which shall bring to light this ministry; and in the mouth of two or three witnesses shall every word be established.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - 2 Corinthians 13:1
    kjvAllusionOsis:
    - 2Cor.13.1
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.6
- type: DcVerse
  data:
    ref: dc.6.29
    scripture: doctrine-and-covenants
    name: D&C 6:29
    chapter: 6
    verse: 29
    ordinal: 133
    text: Verily, verily, I say unto you, if they reject my words, and this part of my gospel and ministry, blessed are ye, for they can do no more unto you than unto me.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.6
- type: DcVerse
  data:
    ref: dc.6.30
    scripture: doctrine-and-covenants
    name: D&C 6:30
    chapter: 6
    verse: 30
    ordinal: 134
    text: And even if they do unto you even as they have done unto me, blessed are ye, for you shall dwell with me in glory.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.6
- type: DcVerse
  data:
    ref: dc.6.31
    scripture: doctrine-and-covenants
    name: D&C 6:31
    chapter: 6
    verse: 31
    ordinal: 135
    text: But if they reject not my words, which shall be established by the testimony which shall be given, blessed are they, and then shall ye have joy in the fruit of your labors.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.6
- type: DcVerse
  data:
    ref: dc.6.32
    scripture: doctrine-and-covenants
    name: D&C 6:32
    chapter: 6
    verse: 32
    ordinal: 136
    text: Verily, verily, I say unto you, as I said unto my disciples, where two or three are gathered together in my name, as touching one thing, behold, there will I be in the midst of them—even so am I in the midst of you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.6
- type: DcVerse
  data:
    ref: dc.6.33
    scripture: doctrine-and-covenants
    name: D&C 6:33
    chapter: 6
    verse: 33
    ordinal: 137
    text: Fear not to do good, my sons, for whatsoever ye sow, that shall ye also reap; therefore, if ye sow good ye shall also reap good for your reward.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.6
- type: DcVerse
  data:
    ref: dc.6.34
    scripture: doctrine-and-covenants
    name: D&C 6:34
    chapter: 6
    verse: 34
    ordinal: 138
    text: Therefore, fear not, little flock; do good; let earth and hell combine against you, for if ye are built upon my rock, they cannot prevail.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.6
- type: DcVerse
  data:
    ref: dc.6.35
    scripture: doctrine-and-covenants
    name: D&C 6:35
    chapter: 6
    verse: 35
    ordinal: 139
    text: Behold, I do not condemn you; go your ways and sin no more; perform with soberness the work which I have commanded you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.6
- type: DcVerse
  data:
    ref: dc.6.36
    scripture: doctrine-and-covenants
    name: D&C 6:36
    chapter: 6
    verse: 36
    ordinal: 140
    text: Look unto me in every thought; doubt not, fear not.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.6
- type: DcVerse
  data:
    ref: dc.6.37
    scripture: doctrine-and-covenants
    name: D&C 6:37
    chapter: 6
    verse: 37
    ordinal: 141
    text: Behold the wounds which pierced my side, and also the prints of the nails in my hands and feet; be faithful, keep my commandments, and ye shall inherit the kingdom of heaven. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.6
- type: DcVerse
  data:
    ref: dc.7.1
    scripture: doctrine-and-covenants
    name: D&C 7:1
    chapter: 7
    verse: 1
    ordinal: 142
    text: 'And the Lord said unto me: John, my beloved, what desirest thou? For if you shall ask what you will, it shall be granted unto you.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.7
- type: DcVerse
  data:
    ref: dc.7.2
    scripture: doctrine-and-covenants
    name: D&C 7:2
    chapter: 7
    verse: 2
    ordinal: 143
    text: 'And I said unto him: Lord, give unto me power over death, that I may live and bring souls unto thee.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.7
- type: DcVerse
  data:
    ref: dc.7.3
    scripture: doctrine-and-covenants
    name: D&C 7:3
    chapter: 7
    verse: 3
    ordinal: 144
    text: 'And the Lord said unto me: Verily, verily, I say unto thee, because thou desirest this thou shalt tarry until I come in my glory, and shalt prophesy before nations, kindreds, tongues and people.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.7
- type: DcVerse
  data:
    ref: dc.7.4
    scripture: doctrine-and-covenants
    name: D&C 7:4
    chapter: 7
    verse: 4
    ordinal: 145
    text: 'And for this cause the Lord said unto Peter: If I will that he tarry till I come, what is that to thee? For he desired of me that he might bring souls unto me, but thou desiredst that thou mightest speedily come unto me in my kingdom.'
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - John 21:22
    kjvAllusionOsis:
    - John.21.22
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.7
- type: DcVerse
  data:
    ref: dc.7.5
    scripture: doctrine-and-covenants
    name: D&C 7:5
    chapter: 7
    verse: 5
    ordinal: 146
    text: I say unto thee, Peter, this was a good desire; but my beloved has desired that he might do more, or a greater work yet among men than what he has before done.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.7
- type: DcVerse
  data:
    ref: dc.7.6
    scripture: doctrine-and-covenants
    name: D&C 7:6
    chapter: 7
    verse: 6
    ordinal: 147
    text: Yea, he has undertaken a greater work; therefore I will make him as flaming fire and a ministering angel; he shall minister for those who shall be heirs of salvation who dwell on the earth.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.7
- type: DcVerse
  data:
    ref: dc.7.7
    scripture: doctrine-and-covenants
    name: D&C 7:7
    chapter: 7
    verse: 7
    ordinal: 148
    text: And I will make thee to minister for him and for thy brother James; and unto you three I will give this power and the keys of this ministry until I come.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.7
- type: DcVerse
  data:
    ref: dc.7.8
    scripture: doctrine-and-covenants
    name: D&C 7:8
    chapter: 7
    verse: 8
    ordinal: 149
    text: Verily I say unto you, ye shall both have according to your desires, for ye both joy in that which ye have desired.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Matthew 13:17
    kjvAllusionOsis:
    - Matt.13.17
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.7
- type: DcVerse
  data:
    ref: dc.8.1
    scripture: doctrine-and-covenants
    name: D&C 8:1
    chapter: 8
    verse: 1
    ordinal: 150
    text: Oliver Cowdery, verily, verily, I say unto you, that assuredly as the Lord liveth, who is your God and your Redeemer, even so surely shall you receive a knowledge of whatsoever things you shall ask in faith, with an honest heart, believing that you shall receive a knowledge concerning the engravings of old records, which are ancient, which contain those parts of my scripture of which has been spoken by the manifestation of my Spirit.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.8
- type: DcVerse
  data:
    ref: dc.8.2
    scripture: doctrine-and-covenants
    name: D&C 8:2
    chapter: 8
    verse: 2
    ordinal: 151
    text: Yea, behold, I will tell you in your mind and in your heart, by the Holy Ghost, which shall come upon you and which shall dwell in your heart.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.8
- type: DcVerse
  data:
    ref: dc.8.3
    scripture: doctrine-and-covenants
    name: D&C 8:3
    chapter: 8
    verse: 3
    ordinal: 152
    text: Now, behold, this is the spirit of revelation; behold, this is the spirit by which Moses brought the children of Israel through the Red Sea on dry ground.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.8
- type: DcVerse
  data:
    ref: dc.8.4
    scripture: doctrine-and-covenants
    name: D&C 8:4
    chapter: 8
    verse: 4
    ordinal: 153
    text: Therefore this is thy gift; apply unto it, and blessed art thou, for it shall deliver you out of the hands of your enemies, when, if it were not so, they would slay you and bring your soul to destruction.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.8
- type: DcVerse
  data:
    ref: dc.8.5
    scripture: doctrine-and-covenants
    name: D&C 8:5
    chapter: 8
    verse: 5
    ordinal: 154
    text: Oh, remember these words, and keep my commandments. Remember, this is your gift.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.8
- type: DcVerse
  data:
    ref: dc.8.6
    scripture: doctrine-and-covenants
    name: D&C 8:6
    chapter: 8
    verse: 6
    ordinal: 155
    text: Now this is not all thy gift; for you have another gift, which is the gift of Aaron; behold, it has told you many things;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.8
- type: DcVerse
  data:
    ref: dc.8.7
    scripture: doctrine-and-covenants
    name: D&C 8:7
    chapter: 8
    verse: 7
    ordinal: 156
    text: Behold, there is no other power, save the power of God, that can cause this gift of Aaron to be with you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.8
- type: DcVerse
  data:
    ref: dc.8.8
    scripture: doctrine-and-covenants
    name: D&C 8:8
    chapter: 8
    verse: 8
    ordinal: 157
    text: Therefore, doubt not, for it is the gift of God; and you shall hold it in your hands, and do marvelous works; and no power shall be able to take it away out of your hands, for it is the work of God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.8
- type: DcVerse
  data:
    ref: dc.8.9
    scripture: doctrine-and-covenants
    name: D&C 8:9
    chapter: 8
    verse: 9
    ordinal: 158
    text: And, therefore, whatsoever you shall ask me to tell you by that means, that will I grant unto you, and you shall have knowledge concerning it.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.8
- type: DcVerse
  data:
    ref: dc.8.10
    scripture: doctrine-and-covenants
    name: D&C 8:10
    chapter: 8
    verse: 10
    ordinal: 159
    text: Remember that without faith you can do nothing; therefore ask in faith. Trifle not with these things; do not ask for that which you ought not.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.8
- type: DcVerse
  data:
    ref: dc.8.11
    scripture: doctrine-and-covenants
    name: D&C 8:11
    chapter: 8
    verse: 11
    ordinal: 160
    text: Ask that you may know the mysteries of God, and that you may translate and receive knowledge from all those ancient records which have been hid up, that are sacred; and according to your faith shall it be done unto you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.8
- type: DcVerse
  data:
    ref: dc.8.12
    scripture: doctrine-and-covenants
    name: D&C 8:12
    chapter: 8
    verse: 12
    ordinal: 161
    text: Behold, it is I that have spoken it; and I am the same that spake unto you from the beginning. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.8
- type: DcVerse
  data:
    ref: dc.9.1
    scripture: doctrine-and-covenants
    name: D&C 9:1
    chapter: 9
    verse: 1
    ordinal: 162
    text: Behold, I say unto you, my son, that because you did not translate according to that which you desired of me, and did commence again to write for my servant, Joseph Smith, Jun., even so I would that ye should continue until you have finished this record, which I have entrusted unto him.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.9
- type: DcVerse
  data:
    ref: dc.9.2
    scripture: doctrine-and-covenants
    name: D&C 9:2
    chapter: 9
    verse: 2
    ordinal: 163
    text: And then, behold, other records have I, that I will give unto you power that you may assist to translate.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.9
- type: DcVerse
  data:
    ref: dc.9.3
    scripture: doctrine-and-covenants
    name: D&C 9:3
    chapter: 9
    verse: 3
    ordinal: 164
    text: Be patient, my son, for it is wisdom in me, and it is not expedient that you should translate at this present time.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.9
- type: DcVerse
  data:
    ref: dc.9.4
    scripture: doctrine-and-covenants
    name: D&C 9:4
    chapter: 9
    verse: 4
    ordinal: 165
    text: Behold, the work which you are called to do is to write for my servant Joseph.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.9
- type: DcVerse
  data:
    ref: dc.9.5
    scripture: doctrine-and-covenants
    name: D&C 9:5
    chapter: 9
    verse: 5
    ordinal: 166
    text: And, behold, it is because that you did not continue as you commenced, when you began to translate, that I have taken away this privilege from you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.9
- type: DcVerse
  data:
    ref: dc.9.6
    scripture: doctrine-and-covenants
    name: D&C 9:6
    chapter: 9
    verse: 6
    ordinal: 167
    text: Do not murmur, my son, for it is wisdom in me that I have dealt with you after this manner.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.9
- type: DcVerse
  data:
    ref: dc.9.7
    scripture: doctrine-and-covenants
    name: D&C 9:7
    chapter: 9
    verse: 7
    ordinal: 168
    text: Behold, you have not understood; you have supposed that I would give it unto you, when you took no thought save it was to ask me.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.9
- type: DcVerse
  data:
    ref: dc.9.8
    scripture: doctrine-and-covenants
    name: D&C 9:8
    chapter: 9
    verse: 8
    ordinal: 169
    text: But, behold, I say unto you, that you must study it out in your mind; then you must ask me if it be right, and if it is right I will cause that your bosom shall burn within you; therefore, you shall feel that it is right.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.9
- type: DcVerse
  data:
    ref: dc.9.9
    scripture: doctrine-and-covenants
    name: D&C 9:9
    chapter: 9
    verse: 9
    ordinal: 170
    text: But if it be not right you shall have no such feelings, but you shall have a stupor of thought that shall cause you to forget the thing which is wrong; therefore, you cannot write that which is sacred save it be given you from me.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.9
- type: DcVerse
  data:
    ref: dc.9.10
    scripture: doctrine-and-covenants
    name: D&C 9:10
    chapter: 9
    verse: 10
    ordinal: 171
    text: Now, if you had known this you could have translated; nevertheless, it is not expedient that you should translate now.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.9
- type: DcVerse
  data:
    ref: dc.9.11
    scripture: doctrine-and-covenants
    name: D&C 9:11
    chapter: 9
    verse: 11
    ordinal: 172
    text: Behold, it was expedient when you commenced; but you feared, and the time is past, and it is not expedient now;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.9
- type: DcVerse
  data:
    ref: dc.9.12
    scripture: doctrine-and-covenants
    name: D&C 9:12
    chapter: 9
    verse: 12
    ordinal: 173
    text: For, do you not behold that I have given unto my servant Joseph sufficient strength, whereby it is made up? And neither of you have I condemned.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.9
- type: DcVerse
  data:
    ref: dc.9.13
    scripture: doctrine-and-covenants
    name: D&C 9:13
    chapter: 9
    verse: 13
    ordinal: 174
    text: Do this thing which I have commanded you, and you shall prosper. Be faithful, and yield to no temptation.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.9
- type: DcVerse
  data:
    ref: dc.9.14
    scripture: doctrine-and-covenants
    name: D&C 9:14
    chapter: 9
    verse: 14
    ordinal: 175
    text: Stand fast in the work wherewith I have called you, and a hair of your head shall not be lost, and you shall be lifted up at the last day. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.9
- type: DcVerse
  data:
    ref: dc.10.1
    scripture: doctrine-and-covenants
    name: D&C 10:1
    chapter: 10
    verse: 1
    ordinal: 176
    text: Now, behold, I say unto you, that because you delivered up those writings which you had power given unto you to translate by the means of the Urim and Thummim, into the hands of a wicked man, you have lost them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.10
- type: DcVerse
  data:
    ref: dc.10.2
    scripture: doctrine-and-covenants
    name: D&C 10:2
    chapter: 10
    verse: 2
    ordinal: 177
    text: And you also lost your gift at the same time, and your mind became darkened.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.10
- type: DcVerse
  data:
    ref: dc.10.3
    scripture: doctrine-and-covenants
    name: D&C 10:3
    chapter: 10
    verse: 3
    ordinal: 178
    text: Nevertheless, it is now restored unto you again; therefore see that you are faithful and continue on unto the finishing of the remainder of the work of translation as you have begun.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.10
- type: DcVerse
  data:
    ref: dc.10.4
    scripture: doctrine-and-covenants
    name: D&C 10:4
    chapter: 10
    verse: 4
    ordinal: 179
    text: Do not run faster or labor more than you have strength and means provided to enable you to translate; but be diligent unto the end.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.10
- type: DcVerse
  data:
    ref: dc.10.5
    scripture: doctrine-and-covenants
    name: D&C 10:5
    chapter: 10
    verse: 5
    ordinal: 180
    text: Pray always, that you may come off conqueror; yea, that you may conquer Satan, and that you may escape the hands of the servants of Satan that do uphold his work.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.10
- type: DcVerse
  data:
    ref: dc.10.6
    scripture: doctrine-and-covenants
    name: D&C 10:6
    chapter: 10
    verse: 6
    ordinal: 181
    text: Behold, they have sought to destroy you; yea, even the man in whom you have trusted has sought to destroy you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.10
- type: DcVerse
  data:
    ref: dc.10.7
    scripture: doctrine-and-covenants
    name: D&C 10:7
    chapter: 10
    verse: 7
    ordinal: 182
    text: And for this cause I said that he is a wicked man, for he has sought to take away the things wherewith you have been entrusted; and he has also sought to destroy your gift.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.10
- type: DcVerse
  data:
    ref: dc.10.8
    scripture: doctrine-and-covenants
    name: D&C 10:8
    chapter: 10
    verse: 8
    ordinal: 183
    text: And because you have delivered the writings into his hands, behold, wicked men have taken them from you.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.10
- type: DcVerse
  data:
    ref: dc.10.9
    scripture: doctrine-and-covenants
    name: D&C 10:9
    chapter: 10
    verse: 9
    ordinal: 184
    text: Therefore, you have delivered them up, yea, that which was sacred, unto wickedness.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.10
- type: DcVerse
  data:
    ref: dc.10.10
    scripture: doctrine-and-covenants
    name: D&C 10:10
    chapter: 10
    verse: 10
    ordinal: 185
    text: And, behold, Satan hath put it into their hearts to alter the words which you have caused to be written, or which you have translated, which have gone out of your hands.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.10
- type: DcVerse
  data:
    ref: dc.10.11
    scripture: doctrine-and-covenants
    name: D&C 10:11
    chapter: 10
    verse: 11
    ordinal: 186
    text: And behold, I say unto you, that because they have altered the words, they read contrary from that which you translated and caused to be written;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.10
- type: DcVerse
  data:
    ref: dc.10.12
    scripture: doctrine-and-covenants
    name: D&C 10:12
    chapter: 10
    verse: 12
    ordinal: 187
    text: And, on this wise, the devil has sought to lay a cunning plan, that he may destroy this work;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.10
- type: DcVerse
  data:
    ref: dc.10.13
    scripture: doctrine-and-covenants
    name: D&C 10:13
    chapter: 10
    verse: 13
    ordinal: 188
    text: For he hath put into their hearts to do this, that by lying they may say they have caught you in the words which you have pretended to translate.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.10
- type: DcVerse
  data:
    ref: dc.10.14
    scripture: doctrine-and-covenants
    name: D&C 10:14
    chapter: 10
    verse: 14
    ordinal: 189
    text: Verily, I say unto you, that I will not suffer that Satan shall accomplish his evil design in this thing.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.10
- type: DcVerse
  data:
    ref: dc.10.15
    scripture: doctrine-and-covenants
    name: D&C 10:15
    chapter: 10
    verse: 15
    ordinal: 190
    text: For behold, he has put it into their hearts to get thee to tempt the Lord thy God, in asking to translate it over again.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.10
- type: DcVerse
  data:
    ref: dc.10.16
    scripture: doctrine-and-covenants
    name: D&C 10:16
    chapter: 10
    verse: 16
    ordinal: 191
    text: And then, behold, they say and think in their hearts—We will see if God has given him power to translate; if so, he will also give him power again;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.10
- type: DcVerse
  data:
    ref: dc.10.17
    scripture: doctrine-and-covenants
    name: D&C 10:17
    chapter: 10
    verse: 17
    ordinal: 192
    text: And if God giveth him power again, or if he translates again, or, in other words, if he bringeth forth the same words, behold, we have the same with us, and we have altered them;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.10
- type: DcVerse
  data:
    ref: dc.10.18
    scripture: doctrine-and-covenants
    name: D&C 10:18
    chapter: 10
    verse: 18
    ordinal: 193
    text: Therefore they will not agree, and we will say that he has lied in his words, and that he has no gift, and that he has no power;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.10
- type: DcVerse
  data:
    ref: dc.10.19
    scripture: doctrine-and-covenants
    name: D&C 10:19
    chapter: 10
    verse: 19
    ordinal: 194
    text: Therefore we will destroy him, and also the work; and we will do this that we may not be ashamed in the end, and that we may get glory of the world.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.10
- type: DcVerse
  data:
    ref: dc.10.20
    scripture: doctrine-and-covenants
    name: D&C 10:20
    chapter: 10
    verse: 20
    ordinal: 195
    text: Verily, verily, I say unto you, that Satan has great hold upon their hearts; he stirreth them up to iniquity against that which is good;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.10
- type: DcVerse
  data:
    ref: dc.10.21
    scripture: doctrine-and-covenants
    name: D&C 10:21
    chapter: 10
    verse: 21
    ordinal: 196
    text: And their hearts are corrupt, and full of wickedness and abominations; and they love darkness rather than light, because their deeds are evil; therefore they will not ask of me.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.10
- type: DcVerse
  data:
    ref: dc.10.22
    scripture: doctrine-and-covenants
    name: D&C 10:22
    chapter: 10
    verse: 22
    ordinal: 197
    text: Satan stirreth them up, that he may lead their souls to destruction.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.10
- type: DcVerse
  data:
    ref: dc.10.23
    scripture: doctrine-and-covenants
    name: D&C 10:23
    chapter: 10
    verse: 23
    ordinal: 198
    text: And thus he has laid a cunning plan, thinking to destroy the work of God; but I will require this at their hands, and it shall turn to their shame and condemnation in the day of judgment.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.10
- type: DcVerse
  data:
    ref: dc.10.24
    scripture: doctrine-and-covenants
    name: D&C 10:24
    chapter: 10
    verse: 24
    ordinal: 199
    text: Yea, he stirreth up their hearts to anger against this work.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.10
- type: DcVerse
  data:
    ref: dc.10.25
    scripture: doctrine-and-covenants
    name: D&C 10:25
    chapter: 10
    verse: 25
    ordinal: 200
    text: 'Yea, he saith unto them: Deceive and lie in wait to catch, that ye may destroy; behold, this is no harm. And thus he flattereth them, and telleth them that it is no sin to lie that they may catch a man in a lie, that they may destroy him.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.10
- type: DcVerse
  data:
    ref: dc.10.26
    scripture: doctrine-and-covenants
    name: D&C 10:26
    chapter: 10
    verse: 26
    ordinal: 201
    text: And thus he flattereth them, and leadeth them along until he draggeth their souls down to hell; and thus he causeth them to catch themselves in their own snare.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.10
- type: DcVerse
  data:
    ref: dc.10.27
    scripture: doctrine-and-covenants
    name: D&C 10:27
    chapter: 10
    verse: 27
    ordinal: 202
    text: And thus he goeth up and down, to and fro in the earth, seeking to destroy the souls of men.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.10
- type: DcVerse
  data:
    ref: dc.10.28
    scripture: doctrine-and-covenants
    name: D&C 10:28
    chapter: 10
    verse: 28
    ordinal: 203
    text: Verily, verily, I say unto you, wo be unto him that lieth to deceive because he supposeth that another lieth to deceive, for such are not exempt from the justice of God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.10
- type: DcVerse
  data:
    ref: dc.10.29
    scripture: doctrine-and-covenants
    name: D&C 10:29
    chapter: 10
    verse: 29
    ordinal: 204
    text: 'Now, behold, they have altered these words, because Satan saith unto them: He hath deceived you—and thus he flattereth them away to do iniquity, to get thee to tempt the Lord thy God.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.10
- type: DcVerse
  data:
    ref: dc.10.30
    scripture: doctrine-and-covenants
    name: D&C 10:30
    chapter: 10
    verse: 30
    ordinal: 205
    text: Behold, I say unto you, that you shall not translate again those words which have gone forth out of your hands;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.10
- type: DcVerse
  data:
    ref: dc.10.31
    scripture: doctrine-and-covenants
    name: D&C 10:31
    chapter: 10
    verse: 31
    ordinal: 206
    text: For, behold, they shall not accomplish their evil designs in lying against those words. For, behold, if you should bring forth the same words they will say that you have lied and that you have pretended to translate, but that you have contradicted yourself.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.10
- type: DcVerse
  data:
    ref: dc.10.32
    scripture: doctrine-and-covenants
    name: D&C 10:32
    chapter: 10
    verse: 32
    ordinal: 207
    text: And, behold, they will publish this, and Satan will harden the hearts of the people to stir them up to anger against you, that they will not believe my words.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.10
- type: DcVerse
  data:
    ref: dc.10.33
    scripture: doctrine-and-covenants
    name: D&C 10:33
    chapter: 10
    verse: 33
    ordinal: 208
    text: Thus Satan thinketh to overpower your testimony in this generation, that the work may not come forth in this generation.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.10
- type: DcVerse
  data:
    ref: dc.10.34
    scripture: doctrine-and-covenants
    name: D&C 10:34
    chapter: 10
    verse: 34
    ordinal: 209
    text: But behold, here is wisdom, and because I show unto you wisdom, and give you commandments concerning these things, what you shall do, show it not unto the world until you have accomplished the work of translation.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.10
- type: DcVerse
  data:
    ref: dc.10.35
    scripture: doctrine-and-covenants
    name: D&C 10:35
    chapter: 10
    verse: 35
    ordinal: 210
    text: 'Marvel not that I said unto you: Here is wisdom, show it not unto the world—for I said, show it not unto the world, that you may be preserved.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.10
- type: DcVerse
  data:
    ref: dc.10.36
    scripture: doctrine-and-covenants
    name: D&C 10:36
    chapter: 10
    verse: 36
    ordinal: 211
    text: Behold, I do not say that you shall not show it unto the righteous;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.10
- type: DcVerse
  data:
    ref: dc.10.37
    scripture: doctrine-and-covenants
    name: D&C 10:37
    chapter: 10
    verse: 37
    ordinal: 212
    text: But as you cannot always judge the righteous, or as you cannot always tell the wicked from the righteous, therefore I say unto you, hold your peace until I shall see fit to make all things known unto the world concerning the matter.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.10
- type: DcVerse
  data:
    ref: dc.10.38
    scripture: doctrine-and-covenants
    name: D&C 10:38
    chapter: 10
    verse: 38
    ordinal: 213
    text: And now, verily I say unto you, that an account of those things that you have written, which have gone out of your hands, is engraven upon the plates of Nephi;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.10
- type: DcVerse
  data:
    ref: dc.10.39
    scripture: doctrine-and-covenants
    name: D&C 10:39
    chapter: 10
    verse: 39
    ordinal: 214
    text: Yea, and you remember it was said in those writings that a more particular account was given of these things upon the plates of Nephi.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.10
- type: DcVerse
  data:
    ref: dc.10.40
    scripture: doctrine-and-covenants
    name: D&C 10:40
    chapter: 10
    verse: 40
    ordinal: 215
    text: And now, because the account which is engraven upon the plates of Nephi is more particular concerning the things which, in my wisdom, I would bring to the knowledge of the people in this account—
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.10
- type: DcVerse
  data:
    ref: dc.10.41
    scripture: doctrine-and-covenants
    name: D&C 10:41
    chapter: 10
    verse: 41
    ordinal: 216
    text: Therefore, you shall translate the engravings which are on the plates of Nephi, down even till you come to the reign of king Benjamin, or until you come to that which you have translated, which you have retained;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.10
- type: DcVerse
  data:
    ref: dc.10.42
    scripture: doctrine-and-covenants
    name: D&C 10:42
    chapter: 10
    verse: 42
    ordinal: 217
    text: And behold, you shall publish it as the record of Nephi; and thus I will confound those who have altered my words.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.10
- type: DcVerse
  data:
    ref: dc.10.43
    scripture: doctrine-and-covenants
    name: D&C 10:43
    chapter: 10
    verse: 43
    ordinal: 218
    text: I will not suffer that they shall destroy my work; yea, I will show unto them that my wisdom is greater than the cunning of the devil.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.10
- type: DcVerse
  data:
    ref: dc.10.44
    scripture: doctrine-and-covenants
    name: D&C 10:44
    chapter: 10
    verse: 44
    ordinal: 219
    text: Behold, they have only got a part, or an abridgment of the account of Nephi.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.10
- type: DcVerse
  data:
    ref: dc.10.45
    scripture: doctrine-and-covenants
    name: D&C 10:45
    chapter: 10
    verse: 45
    ordinal: 220
    text: Behold, there are many things engraven upon the plates of Nephi which do throw greater views upon my gospel; therefore, it is wisdom in me that you should translate this first part of the engravings of Nephi, and send forth in this work.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.10
- type: DcVerse
  data:
    ref: dc.10.46
    scripture: doctrine-and-covenants
    name: D&C 10:46
    chapter: 10
    verse: 46
    ordinal: 221
    text: And, behold, all the remainder of this work does contain all those parts of my gospel which my holy prophets, yea, and also my disciples, desired in their prayers should come forth unto this people.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.10
- type: DcVerse
  data:
    ref: dc.10.47
    scripture: doctrine-and-covenants
    name: D&C 10:47
    chapter: 10
    verse: 47
    ordinal: 222
    text: And I said unto them, that it should be granted unto them according to their faith in their prayers;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.10
- type: DcVerse
  data:
    ref: dc.10.48
    scripture: doctrine-and-covenants
    name: D&C 10:48
    chapter: 10
    verse: 48
    ordinal: 223
    text: Yea, and this was their faith—that my gospel, which I gave unto them that they might preach in their days, might come unto their brethren the Lamanites, and also all that had become Lamanites because of their dissensions.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.10
- type: DcVerse
  data:
    ref: dc.10.49
    scripture: doctrine-and-covenants
    name: D&C 10:49
    chapter: 10
    verse: 49
    ordinal: 224
    text: Now, this is not all—their faith in their prayers was that this gospel should be made known also, if it were possible that other nations should possess this land;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.10
- type: DcVerse
  data:
    ref: dc.10.50
    scripture: doctrine-and-covenants
    name: D&C 10:50
    chapter: 10
    verse: 50
    ordinal: 225
    text: And thus they did leave a blessing upon this land in their prayers, that whosoever should believe in this gospel in this land might have eternal life;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.10
- type: DcVerse
  data:
    ref: dc.10.51
    scripture: doctrine-and-covenants
    name: D&C 10:51
    chapter: 10
    verse: 51
    ordinal: 226
    text: Yea, that it might be free unto all of whatsoever nation, kindred, tongue, or people they may be.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.10
- type: DcVerse
  data:
    ref: dc.10.52
    scripture: doctrine-and-covenants
    name: D&C 10:52
    chapter: 10
    verse: 52
    ordinal: 227
    text: And now, behold, according to their faith in their prayers will I bring this part of my gospel to the knowledge of my people. Behold, I do not bring it to destroy that which they have received, but to build it up.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.10
- type: DcVerse
  data:
    ref: dc.10.53
    scripture: doctrine-and-covenants
    name: D&C 10:53
    chapter: 10
    verse: 53
    ordinal: 228
    text: 'And for this cause have I said: If this generation harden not their hearts, I will establish my church among them.'
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.10
- type: DcVerse
  data:
    ref: dc.10.54
    scripture: doctrine-and-covenants
    name: D&C 10:54
    chapter: 10
    verse: 54
    ordinal: 229
    text: Now I do not say this to destroy my church, but I say this to build up my church;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.10
- type: DcVerse
  data:
    ref: dc.10.55
    scripture: doctrine-and-covenants
    name: D&C 10:55
    chapter: 10
    verse: 55
    ordinal: 230
    text: Therefore, whosoever belongeth to my church need not fear, for such shall inherit the kingdom of heaven.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.10
- type: DcVerse
  data:
    ref: dc.10.56
    scripture: doctrine-and-covenants
    name: D&C 10:56
    chapter: 10
    verse: 56
    ordinal: 231
    text: But it is they who do not fear me, neither keep my commandments but build up churches unto themselves to get gain, yea, and all those that do wickedly and build up the kingdom of the devil—yea, verily, verily, I say unto you, that it is they that I will disturb, and cause to tremble and shake to the center.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.10
- type: DcVerse
  data:
    ref: dc.10.57
    scripture: doctrine-and-covenants
    name: D&C 10:57
    chapter: 10
    verse: 57
    ordinal: 232
    text: Behold, I am Jesus Christ, the Son of God. I came unto mine own, and mine own received me not.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.10
- type: DcVerse
  data:
    ref: dc.10.58
    scripture: doctrine-and-covenants
    name: D&C 10:58
    chapter: 10
    verse: 58
    ordinal: 233
    text: I am the light which shineth in darkness, and the darkness comprehendeth it not.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - John 1:5
    kjvAllusionOsis:
    - John.1.5
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.10
- type: DcVerse
  data:
    ref: dc.10.59
    scripture: doctrine-and-covenants
    name: D&C 10:59
    chapter: 10
    verse: 59
    ordinal: 234
    text: I am he who said—Other sheep have I which are not of this fold—unto my disciples, and many there were that understood me not.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - John 10:16
    kjvAllusionOsis:
    - John.10.16
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.10
- type: DcVerse
  data:
    ref: dc.10.60
    scripture: doctrine-and-covenants
    name: D&C 10:60
    chapter: 10
    verse: 60
    ordinal: 235
    text: And I will show unto this people that I had other sheep, and that they were a branch of the house of Jacob;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.10
- type: DcVerse
  data:
    ref: dc.10.61
    scripture: doctrine-and-covenants
    name: D&C 10:61
    chapter: 10
    verse: 61
    ordinal: 236
    text: And I will bring to light their marvelous works, which they did in my name;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.10
- type: DcVerse
  data:
    ref: dc.10.62
    scripture: doctrine-and-covenants
    name: D&C 10:62
    chapter: 10
    verse: 62
    ordinal: 237
    text: Yea, and I will also bring to light my gospel which was ministered unto them, and, behold, they shall not deny that which you have received, but they shall build it up, and shall bring to light the true points of my doctrine, yea, and the only doctrine which is in me.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.10
- type: DcVerse
  data:
    ref: dc.10.63
    scripture: doctrine-and-covenants
    name: D&C 10:63
    chapter: 10
    verse: 63
    ordinal: 238
    text: And this I do that I may establish my gospel, that there may not be so much contention; yea, Satan doth stir up the hearts of the people to contention concerning the points of my doctrine; and in these things they do err, for they do wrest the scriptures and do not understand them.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.10
- type: DcVerse
  data:
    ref: dc.10.64
    scripture: doctrine-and-covenants
    name: D&C 10:64
    chapter: 10
    verse: 64
    ordinal: 239
    text: Therefore, I will unfold unto them this great mystery;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.10
- type: DcVerse
  data:
    ref: dc.10.65
    scripture: doctrine-and-covenants
    name: D&C 10:65
    chapter: 10
    verse: 65
    ordinal: 240
    text: For, behold, I will gather them as a hen gathereth her chickens under her wings, if they will not harden their hearts;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.10
- type: DcVerse
  data:
    ref: dc.10.66
    scripture: doctrine-and-covenants
    name: D&C 10:66
    chapter: 10
    verse: 66
    ordinal: 241
    text: Yea, if they will come, they may, and partake of the waters of life freely.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.10
- type: DcVerse
  data:
    ref: dc.10.67
    scripture: doctrine-and-covenants
    name: D&C 10:67
    chapter: 10
    verse: 67
    ordinal: 242
    text: Behold, this is my doctrine—whosoever repenteth and cometh unto me, the same is my church.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.10
- type: DcVerse
  data:
    ref: dc.10.68
    scripture: doctrine-and-covenants
    name: D&C 10:68
    chapter: 10
    verse: 68
    ordinal: 243
    text: Whosoever declareth more or less than this, the same is not of me, but is against me; therefore he is not of my church.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.10
- type: DcVerse
  data:
    ref: dc.10.69
    scripture: doctrine-and-covenants
    name: D&C 10:69
    chapter: 10
    verse: 69
    ordinal: 244
    text: And now, behold, whosoever is of my church, and endureth of my church to the end, him will I establish upon my rock, and the gates of hell shall not prevail against them.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Matthew 16:18
    kjvAllusionOsis:
    - Matt.16.18
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.10
- type: DcVerse
  data:
    ref: dc.10.70
    scripture: doctrine-and-covenants
    name: D&C 10:70
    chapter: 10
    verse: 70
    ordinal: 245
    text: And now, remember the words of him who is the life and light of the world, your Redeemer, your Lord and your God. Amen.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.10
- type: DcVerse
  data:
    ref: dc.11.1
    scripture: doctrine-and-covenants
    name: D&C 11:1
    chapter: 11
    verse: 1
    ordinal: 246
    text: A great and marvelous work is about to come forth among the children of men.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.11
- type: DcVerse
  data:
    ref: dc.11.2
    scripture: doctrine-and-covenants
    name: D&C 11:2
    chapter: 11
    verse: 2
    ordinal: 247
    text: Behold, I am God; give heed to my word, which is quick and powerful, sharper than a two-edged sword, to the dividing asunder of both joints and marrow; therefore give heed unto my word.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Hebrews 4:12
    kjvAllusionOsis:
    - Heb.4.12
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.11
- type: DcVerse
  data:
    ref: dc.11.3
    scripture: doctrine-and-covenants
    name: D&C 11:3
    chapter: 11
    verse: 3
    ordinal: 248
    text: Behold, the field is white already to harvest; therefore, whoso desireth to reap let him thrust in his sickle with his might, and reap while the day lasts, that he may treasure up for his soul everlasting salvation in the kingdom of God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.11
- type: DcVerse
  data:
    ref: dc.11.4
    scripture: doctrine-and-covenants
    name: D&C 11:4
    chapter: 11
    verse: 4
    ordinal: 249
    text: Yea, whosoever will thrust in his sickle and reap, the same is called of God.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.11
- type: DcVerse
  data:
    ref: dc.11.5
    scripture: doctrine-and-covenants
    name: D&C 11:5
    chapter: 11
    verse: 5
    ordinal: 250
    text: Therefore, if you will ask of me you shall receive; if you will knock it shall be opened unto you.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Matthew 7:7
    kjvAllusionOsis:
    - Matt.7.7
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.11
- type: DcVerse
  data:
    ref: dc.11.6
    scripture: doctrine-and-covenants
    name: D&C 11:6
    chapter: 11
    verse: 6
    ordinal: 251
    text: Now, as you have asked, behold, I say unto you, keep my commandments, and seek to bring forth and establish the cause of Zion.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.11
- type: DcVerse
  data:
    ref: dc.11.7
    scripture: doctrine-and-covenants
    name: D&C 11:7
    chapter: 11
    verse: 7
    ordinal: 252
    text: Seek not for riches but for wisdom; and, behold, the mysteries of God shall be unfolded unto you, and then shall you be made rich. Behold, he that hath eternal life is rich.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.11
- type: DcVerse
  data:
    ref: dc.11.8
    scripture: doctrine-and-covenants
    name: D&C 11:8
    chapter: 11
    verse: 8
    ordinal: 253
    text: Verily, verily, I say unto you, even as you desire of me so it shall be done unto you; and, if you desire, you shall be the means of doing much good in this generation.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Mark 13:30
    kjvAllusionOsis:
    - Mark.13.30
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.11
- type: DcVerse
  data:
    ref: dc.11.9
    scripture: doctrine-and-covenants
    name: D&C 11:9
    chapter: 11
    verse: 9
    ordinal: 254
    text: Say nothing but repentance unto this generation. Keep my commandments, and assist to bring forth my work, according to my commandments, and you shall be blessed.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.11
- type: DcVerse
  data:
    ref: dc.11.10
    scripture: doctrine-and-covenants
    name: D&C 11:10
    chapter: 11
    verse: 10
    ordinal: 255
    text: Behold, thou hast a gift, or thou shalt have a gift if thou wilt desire of me in faith, with an honest heart, believing in the power of Jesus Christ, or in my power which speaketh unto thee;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.11
- type: DcVerse
  data:
    ref: dc.11.11
    scripture: doctrine-and-covenants
    name: D&C 11:11
    chapter: 11
    verse: 11
    ordinal: 256
    text: For, behold, it is I that speak; behold, I am the light which shineth in darkness, and by my power I give these words unto thee.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.11
- type: DcVerse
  data:
    ref: dc.11.12
    scripture: doctrine-and-covenants
    name: D&C 11:12
    chapter: 11
    verse: 12
    ordinal: 257
    text: And now, verily, verily, I say unto thee, put your trust in that Spirit which leadeth to do good—yea, to do justly, to walk humbly, to judge righteously; and this is my Spirit.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.11
- type: DcVerse
  data:
    ref: dc.11.13
    scripture: doctrine-and-covenants
    name: D&C 11:13
    chapter: 11
    verse: 13
    ordinal: 258
    text: Verily, verily, I say unto you, I will impart unto you of my Spirit, which shall enlighten your mind, which shall fill your soul with joy;
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.11
- type: DcVerse
  data:
    ref: dc.11.14
    scripture: doctrine-and-covenants
    name: D&C 11:14
    chapter: 11
    verse: 14
    ordinal: 259
    text: And then shall ye know, or by this shall you know, all things whatsoever you desire of me, which are pertaining unto things of righteousness, in faith believing in me that you shall receive.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Matthew 21:22
    kjvAllusionOsis:
    - Matt.21.22
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.11
- type: DcVerse
  data:
    ref: dc.11.15
    scripture: doctrine-and-covenants
    name: D&C 11:15
    chapter: 11
    verse: 15
    ordinal: 260
    text: Behold, I command you that you need not suppose that you are called to preach until you are called.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.11
- type: DcVerse
  data:
    ref: dc.11.16
    scripture: doctrine-and-covenants
    name: D&C 11:16
    chapter: 11
    verse: 16
    ordinal: 261
    text: Wait a little longer, until you shall have my word, my rock, my church, and my gospel, that you may know of a surety my doctrine.
    translation: 2013 edition
    original: ''
  relations:
  - predicate: IN
    to:
      type: DcSection
