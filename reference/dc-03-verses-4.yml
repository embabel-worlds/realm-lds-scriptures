    scripture: doctrine-and-covenants
    name: D&C 133:31
    chapter: 133
    verse: 31
    ordinal: 3480
    text: And the boundaries of the everlasting hills shall tremble at their presence.
    translation: 2013 edition
    original: ''
    kjvAllusions:
    - Psalms 114:7
    kjvAllusionOsis:
    - Ps.114.7
  relations:
  - predicate: IN
    to:
      type: DcSection
      ref: dc.133
